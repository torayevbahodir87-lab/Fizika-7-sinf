<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>7-sinf Fizika</title>
<style>
:root{--bg:#0b1226;--nav:#111b3a;--nav2:#18254d;--ink:#e8eeff;--soft:#9fb0d6;--acc:#ffc93c;--acc-ink:#14213d;--line:#263666;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Telefon uchun yuqori panel */
#top{display:none;flex:none;align-items:center;justify-content:space-between;background:var(--nav);border-bottom:3px solid var(--acc);
padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;z-index:20}
#brand{border:0;background:none;font-weight:800;font-size:1.05rem;padding:6px 4px}
#burger{border:1px solid var(--line);background:var(--nav2);border-radius:10px;width:42px;height:40px;font-size:1.3rem;line-height:1}

#app{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
iframe,#home{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
iframe.on{display:block}
#home{background:var(--bg);overflow-y:auto;padding:28px 22px 40px}
#home.on{display:block}
.wrap{max-width:900px;margin:0 auto}
#home h1{font-size:clamp(1.5rem,4vw,2.3rem);margin:8px 0;line-height:1.2}
#home p.lead{color:var(--soft);margin:0 0 24px;max-width:60ch;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{text-align:left;background:var(--nav);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .e{font-size:1.9rem}
.card b{font-size:.98rem;line-height:1.3}
.card span{color:var(--soft);font-size:.82rem}

/* O'ng tomondagi menyu */
#side{flex:none;width:310px;background:var(--nav);border-left:3px solid var(--acc);display:flex;flex-direction:column;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#side header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px;font-weight:800;font-size:1.05rem}
#side header small{display:block;font-weight:500;color:var(--soft);font-size:.78rem;margin-top:3px}
#close{display:none;border:0;background:none;font-size:1.3rem;padding:6px 10px}
#list{display:flex;flex-direction:column;gap:3px;padding:4px 10px 16px;overflow-y:auto}
#list button{border:0;background:none;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:10px;font-size:.92rem;line-height:1.3;color:var(--ink)}
#list button .n{flex:none;width:1.7rem;text-align:center;font-size:1.2rem}
#list button:hover{background:var(--nav2)}
#list button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
#shade{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#shade.open{opacity:1;pointer-events:auto}

@media (max-width:820px){
 #top{display:flex}
 #close{display:block}
 #side{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);z-index:31;border-left:3px solid var(--acc);
  transform:translateX(100%);transition:transform .22s}
 #side.open{transform:none}
}
@media (prefers-reduced-motion:reduce){#side,#shade,.card{transition:none}}
</style>
</head>
<body>
<header id="top">
  <button id="brand">⚛️ 7-sinf Fizika</button>
  <button id="burger" aria-label="Mavzular ro'yxatini ochish" aria-expanded="false">☰</button>
</header>
<div id="shade"></div>
<div id="app">
  <main id="stage">
    <section id="home">
      <div class="wrap">
        <h1>7-sinf Fizika: interaktiv darslar</h1>
        <p class="lead">Kerakli mavzuni o'ng tomondagi ro'yxatdan (telefonda ☰ tugmasi orqali) yoki quyidagi kartochkalardan tanlang.</p>
        <div class="grid" id="cards"></div>
      </div>
    </section>
  </main>
  <aside id="side" aria-label="Mavzular ro'yxati">
    <header><div>Mavzular<small>Bosib tezda o'ting</small></div><button id="close" aria-label="Yopish">✕</button></header>
    <nav id="list"></nav>
  </aside>
</div>

gba(6,167,125,.25), transparent 45%),\n      var(--ink);\n    color:#FFF9EF;\n    padding:56px 0 64px;\n    position:relative;\n    overflow:hidden;\n  }\n  .hero .wrap{position:relative; z-index:2;}\n  .hero .kicker{\n    font-family:'Baloo 2';\n    font-size:.95rem;\n    color:var(--yellow);\n    font-weight:600;\n    margin-bottom:10px;\n  }\n  .hero h1{\n    color:#fff;\n    font-size:clamp(1.9rem, 6vw, 2.7rem);\n    line-height:1.15;\n    max-width:11ch;\n  }\n  .hero p{\n    color:#D8D6E8;\n    max-width:46ch;\n    font-size:1.05rem;\n  }\n  #heroCanvas{\n    display:block;\n    width:100%;\n    height:150px;\n    margin-top:24px;\n    border-radius:14px;\n    background:rgba(255,255,255,0.04);\n  }\n\n  /* ---------- SECTION SHELL ---------- */\n  section.topic{\n    padding:52px 0 40px;\n    border-bottom:1px solid var(--line);\n  }\n  .topic-head{\n    display:flex;\n    align-items:flex-start;\n    gap:14px;\n    margin-bottom:6px;\n  }\n  .topic-badge{\n    flex:0 0 auto;\n    width:46px; height:46px;\n    border-radius:12px;\n    display:flex; align-items:center; justify-content:center;\n    font-size:1.4rem;\n    color:#fff;\n  }\n  .mech .topic-badge{background:var(--mech);}\n  .mol .topic-badge{background:var(--mol);}\n  .therm .topic-badge{background:var(--hot);}\n\n  .topic h2{font-size:1.5rem;}\n\n  .question-bubble{\n    display:inline-block;\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:1.05rem;\n    padding:10px 16px;\n    border-radius:14px 14px 14px 2px;\n    margin:14px 0 18px;\n  }\n  .mech .question-bubble{background:var(--mech-bg); color:var(--mech-dark);}\n  .mol .question-bubble{background:var(--mol-bg); color:var(--mol-dark);}\n  .therm .question-bubble{background:var(--therm-bg); color:var(--hot);}\n\n  .theory{color:var(--ink-soft); margin-bottom:22px;}\n  .theory b{color:var(--ink); font-weight:800;}\n\n  /* ---------- SIM CARD ---------- */\n  .sim-card{\n    border-radius:20px;\n    padding:18px 18px 22px;\n    box-shadow:var(--card-shadow);\n    border:2px solid var(--ink);\n    margin-bottom:22px;\n  }\n  .mech .sim-card{background:var(--mech-bg); box-shadow:6px 6px 0 var(--mech-dark);}\n  .mol .sim-card{background:var(--mol-bg); box-shadow:6px 6px 0 var(--mol-dark);}\n  .therm .sim-card{background:var(--therm-bg); box-shadow:6px 6px 0 var(--hot);}\n\n  .sim-card canvas{\n    width:100%;\n    display:block;\n    border-radius:12px;\n    background:#FFFFFF;\n    touch-action:none;\n  }\n  .sim-controls{\n    display:flex;\n    flex-wrap:wrap;\n    align-items:center;\n    gap:10px 16px;\n    margin-top:14px;\n  }\n  .sim-controls label{\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:.92rem;\n    display:flex;\n    align-items:center;\n    gap:8px;\n  }\n  input[type=range]{\n    -webkit-appearance:none;\n    width:140px;\n    height:6px;\n    border-radius:4px;\n    background:rgba(27,27,47,.18);\n    outline:none;\n  }\n  input[type=range]::-webkit-slider-thumb{\n    -webkit-appearance:none;\n    width:20px; height:20px;\n    border-radius:50%;\n    background:var(--ink);\n    border:3px solid #fff;\n    cursor:pointer;\n  }\n  input[type=range]::-moz-range-thumb{\n    width:20px; height:20px;\n    border-radius:50%;\n    background:var(--ink);\n    border:3px solid #fff;\n    cursor:pointer;\n  }\n  .btn{\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:.92rem;\n    border:2px solid var(--ink);\n    background:#fff;\n    color:var(--ink);\n    padding:8px 16px;\n    border-radius:10px;\n    cursor:pointer;\n    transition:transform .08s ease;\n  }\n  .btn:active{transform:translateY(2px);}\n  .btn.primary{background:var(--ink); color:#FFF9EF;}\n  .btn.on{background:var(--yellow); border-color:var(--ink);}\n  .readout{\n    font-family:'Baloo 2';\n    font-weight:700;\n    font-size:.92rem;\n    margin-left:auto;\n    background:#fff;\n    padding:6px 12px;\n    border-radius:8px;\n    border:2px solid var(--ink);\n  }\n\n  /* ---------- EXAMPLES ---------- */\n  .examples{\n    display:grid;\n    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));\n    gap:12px;\n  }\n  .example{\n    background:var(--paper-2);\n    border-radius:14px;\n    padding:14px 16px;\n    border:1.5px solid var(--line);\n    font-size:.95rem;\n  }\n  .example .em{font-size:1.4rem; display:block; margin-bottom:6px;}\n\n  /* ---------- QUIZ ---------- */\n  .quiz{\n    padding:52px 0 70px;\n    background:var(--ink);\n    color:#FFF9EF;\n  }\n  .quiz .wrap > .qhead{margin-bottom:26px;}\n  .quiz h2{color:#fff; font-size:1.6rem;}\n  .quiz p.sub{color:#C9C7DA; margin-top:6px;}\n  .qcard{\n    background:#26263C;\n    border-radius:16px;\n    padding:18px 18px 16px;\n    margin-bottom:16px;\n  }\n  .qcard .qtext{\n    font-family:'Baloo 2';\n    font-weight:600;\n    font-size:1.02rem;\n    margin-bottom:12px;\n    color:#FFF9EF;\n  }\n  .opts{display:flex; flex-direction:column; gap:8px;}\n  .opt{\n    text-align:left;\n    background:#33334F;\n    color:#EDEBF7;\n    border:2px solid transparent;\n    border-radius:10px;\n    padding:10px 14px;\n    font-family:'Nunito';\n    font-size:.96rem;\n    font-weight:600;\n    cursor:pointer;\n  }\n  .opt:hover:not(:disabled){border-color:var(--yellow);}\n  .opt.correct{background:#0F5C43; border-color:#3ED598; color:#fff;}\n  .opt.wrong{background:#6E2436; border-color:#FF6B7E; color:#fff;}\n  .opt:disabled{cursor:default; opacity:.85;}\n  .score{\n    text-align:center;\n    font-family:'Baloo 2';\n    font-size:1.1rem;\n    margin-top:22px;\n    color:var(--yellow);\n  }\n\n  footer{\n    text-align:center;\n    padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));\n    color:var(--ink-soft);\n    font-size:.85rem;\n    background:var(--paper);\n  }\n\n  @media (prefers-reduced-motion: reduce){\n    * { animation-duration: 0.001ms !important; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader class=\"hero\">\n  \u003cdiv class=\"wrap\">\n    \u003cdiv class=\"kicker\">7-SINF · FIZIKA\u003c/div>\n    \u003ch1>Fizika fani nimani o'rganadi?\u003c/h1>\n    \u003cp>Atrofimizda har kuni sodir bo'ladigan voqealarning sirini ochamiz: nega to'p sakraydi, nega choy soviydi, nega hid xonaga tarqaladi. Har bir bo'limni o'zing boshqarib ko'r!\u003c/p>\n    \u003ccanvas id=\"heroCanvas\">\u003c/canvas>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain>\n\n  \u003c!-- ============ BO'LIM 1: MEXANIKA ============ -->\n  \u003csection class=\"topic mech\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"topic-head\">\n        \u003cdiv class=\"topic-badge\">🏎️\u003c/div>\n        \u003ch2>Mexanik hodisalar\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"question-bubble\">Nega mashina tezlashadi yoki to'xtaydi?\u003c/div>\n      \u003cp class=\"theory\">Jismning vaqt o'tishi bilan o'rnini o'zgartirishi \u003cb>mexanik harakat\u003c/b> deyiladi. Harakat qanchalik tez borayotganini \u003cb>tezlik\u003c/b> ko'rsatadi. Jismni tezlatish, sekinlatish yoki yo'nalishini o'zgartirish uchun unga \u003cb>kuch\u003c/b> ta'sir etishi kerak — kuch bo'lmasa, harakat ham o'zgarmaydi.\u003c/p>\n\n      \u003cdiv class=\"sim-card\">\n        \u003ccanvas id=\"mechCanvas\" width=\"640\" height=\"200\">\u003c/canvas>\n        \u003cdiv class=\"sim-controls\">\n          \u003clabel>🚗 Tezlik\n            \u003cinput type=\"range\" id=\"mechSpeed\" min=\"1\" max=\"10\" value=\"4\" step=\"1\">\n          \u003c/label>\n          \u003cbutton class=\"btn primary\" id=\"mechPush\">⚡ Kuch bilan itarish\u003c/button>\n          \u003cspan class=\"readout\" id=\"mechReadout\">4 birlik/s\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🚙\u003c/span>Mashina yo'lda tezlashganda va tormoz bosilganda kuch ta'sirini his qilasiz.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">⚽\u003c/span>To'pni tepganingizda u kuch ta'sirida tezlanadi va havoda uchadi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🚲\u003c/span>Velosipedni tez haydash uchun oyoq bilan ko'proq kuch berishingiz kerak.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ BO'LIM 2: MOLEKULYAR ============ -->\n  \u003csection class=\"topic mol\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"topic-head\">\n        \u003cdiv class=\"topic-badge\">💧\u003c/div>\n        \u003ch2>Molekulyar fizik hodisalar\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"question-bubble\">Nega muz qattiq-yu, suv oquvchan, bug' esa tarqaladi?\u003c/div>\n      \u003cp class=\"theory\">Har qanday modda ko'zga ko'rinmas mayda zarrachalar — \u003cb>molekulalardan\u003c/b> tuzilgan. Qattiq jismda molekulalar bir-biriga zich yopishib, faqat titraydi. Suyuqlikda ular erkinroq siljiydi. Gazda esa juda tez va tartibsiz harakatlanadi. Harorat oshganda molekulalar tezroq harakatlanadi!\u003c/p>\n\n      \u003cdiv class=\"sim-card\">\n        \u003ccanvas id=\"molCanvas\" width=\"640\" height=\"220\">\u003c/canvas>\n        \u003cdiv class=\"sim-controls\">\n          \u003cbutton class=\"btn on\" id=\"stateSolid\" data-state=\"solid\">🧊 Qattiq\u003c/button>\n          \u003cbutton class=\"btn\" id=\"stateLiquid\" data-state=\"liquid\">💧 Suyuq\u003c/button>\n          \u003cbutton class=\"btn\" id=\"stateGas\" data-state=\"gas\">💨 Gaz\u003c/button>\n          \u003clabel>🌡️ Harorat\n            \u003cinput type=\"range\" id=\"molTemp\" min=\"1\" max=\"10\" value=\"3\">\n          \u003c/label>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🌸\u003c/span>Gul hidi butun xonaga tarqaladi — bu hid molekulalarining havoda diffuziyasi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🍵\u003c/span>Choyga solingan shakar asta-sekin erib, butun stakanga tarqaladi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">👃\u003c/span>Ovqat pishayotganda hidi butun uyga tarqalib, boshqa xonadan ham sezasiz.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ BO'LIM 3: TERMODINAMIK ============ -->\n  \u003csection class=\"topic therm\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"topic-head\">\n        \u003cdiv class=\"topic-badge\">🔥\u003c/div>\n        \u003ch2>Termodinamik hodisalar\u003c/h2>\n      \u003c/div>\n      \u003cdiv class=\"question-bubble\">Nega issiq choy stakanini ushlasangiz, qo'lingiz isiydi?\u003c/div>\n      \u003cp class=\"theory\">Jismning qanchalik issiq yoki sovuqligini \u003cb>harorat\u003c/b> ko'rsatadi. Issiq jism sovuq jismga tegib tursa, \u003cb>issiqlik\u003c/b> har doim issiqdan sovuqqa o'tadi — ular haroratlari tenglashguncha. Bu jarayonda energiya bir joydan ikkinchisiga almashadi.\u003c/p>\n\n      \u003cdiv class=\"sim-card\">\n        \u003ccanvas id=\"thermCanvas\" width=\"640\" height=\"220\">\u003c/canvas>\n        \u003cdiv class=\"sim-controls\">\n          \u003cbutton class=\"btn primary\" id=\"thermStart\">🔗 Bir-biriga tekkizish\u003c/button>\n          \u003cbutton class=\"btn\" id=\"thermReset\">↺ Qaytadan boshlash\u003c/button>\n          \u003cspan class=\"readout\" id=\"thermReadout\">Issiq: 90° · Sovuq: 10°\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"examples\">\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">☕\u003c/span>Stoldagi issiq choy asta-sekin sovuq havoga issiqlik berib, soviydi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🧊\u003c/span>Muz stakandagi suyuqlikdan issiqlik olib, erib ketadi.\u003c/div>\n        \u003cdiv class=\"example\">\u003cspan class=\"em\">🥶\u003c/span>Sovuq qo'lni issiq suvga tiqsangiz, issiqlik suvdan qo'lga o'tib, isiydi.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ TEST ============ -->\n  \u003csection class=\"quiz\" id=\"quiz\">\n    \u003cdiv class=\"wrap\">\n      \u003cdiv class=\"qhead\">\n        \u003ch2>Bilimingni tekshir! 🧠\u003c/h2>\n        \u003cp class=\"sub\">Har bir savolga javob tanla — natija darhol ko'rinadi.\u003c/p>\n      \u003c/div>\n      \u003cdiv id=\"quizList\">\u003c/div>\n      \u003cdiv class=\"score\" id=\"scoreBox\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n\u003c/main>\n\n\u003cfooter>7-sinf fizika · Interaktiv dars sahifasi\u003c/footer>\n\n\u003cscript>\n/* =====================================================\n   UMUMIY YORDAMCHI\n===================================================== */\nfunction fitCanvas(canvas){\n  const ratio = canvas.height / canvas.width;\n  function resize(){\n    const w = canvas.clientWidth || canvas.parentElement.clientWidth;\n    canvas.style.height = (w*ratio) + 'px';\n  }\n  window.addEventListener('resize', resize);\n  resize();\n}\n\n/* =====================================================\n   HERO — sodda zarralar animatsiyasi\n===================================================== */\n(function(){\n  const c = document.getElementById('heroCanvas');\n  const ctx = c.getContext('2d');\n  function setup(){\n    c.width = c.clientWidth * (window.devicePixelRatio||1);\n    c.height = c.clientHeight * (window.devicePixelRatio||1);\n  }\n  setup();\n  window.addEventListener('resize', setup);\n  const colors = ['#FF6B35','#06A77D','#FFC145','#E63950','#3E7FD9'];\n  let pts = Array.from({length:26}, ()=>({\n    x: Math.random(), y: Math.random(),\n    vx:(Math.random()-.5)*0.0025, vy:(Math.random()-.5)*0.0025,\n    r: 2+Math.random()*3.2,\n    col: colors[Math.floor(Math.random()*colors.length)]\n  }));\n  function tick(){\n    const W=c.width,H=c.height;\n    ctx.clearRect(0,0,W,H);\n    pts.forEach(p=>{\n      p.x+=p.vx; p.y+=p.vy;\n      if(p.x\u003c0||p.x>1) p.vx*=-1;\n      if(p.y\u003c0||p.y>1) p.vy*=-1;\n      ctx.beginPath();\n      ctx.arc(p.x*W,p.y*H,p.r*(window.devicePixelRatio||1),0,7);\n      ctx.fillStyle=p.col;\n      ctx.globalAlpha=0.85;\n      ctx.fill();\n    });\n    requestAnimationFrame(tick);\n  }\n  tick();\n})();\n\n/* =====================================================\n   BO'LIM 1 — MEXANIKA: sirpanuvchi mashina\n===================================================== */\n(function(){\n  const canvas = document.getElementById('mechCanvas');\n  fitCanvas(canvas);\n  const ctx = canvas.getContext('2d');\n  const speedSlider = document.getElementById('mechSpeed');\n  const readout = document.getElementById('mechReadout');\n  const pushBtn = document.getElementById('mechPush');\n\n  let x = 40, dir = 1, boost = 0;\n\n  function baseSpeed(){ return parseInt(speedSlider.value,10); }\n  speedSlider.addEventListener('input', ()=>{\n    readout.textContent = baseSpeed() + ' birlik/s';\n  });\n  pushBtn.addEventListener('click', ()=>{ boost = 14; });\n\n  function draw(){\n    const W = canvas.width, H = canvas.height;\n    ctx.clearRect(0,0,W,H);\n\n    // yo'l\n    ctx.fillStyle = '#F3E7D6';\n    ctx.fillRect(0, H-46, W, 46);\n    ctx.strokeStyle = '#fff';\n    ctx.setLineDash([16,14]);\n    ctx.lineWidth = 3;\n    ctx.beginPath();\n    ctx.moveTo(0, H-23); ctx.lineTo(W, H-23);\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    // harakat\n    let v = (baseSpeed()*1.1) + boost;\n    x += dir*v*0.6;\n    if(boost>0) boost -= 0.35;\n    if(boost\u003c0) boost = 0;\n    if(x > W-70){ x = W-70; dir=-1; }\n    if(x \u003c 20){ x = 20; dir=1; }\n\n    // mashina\n    ctx.save();\n    ctx.translate(x, H-70);\n    if(dir\u003c0){ ctx.scale(-1,1); }\n    ctx.fillStyle = '#FF6B35';\n    roundRect(ctx, 0, 10, 60, 26, 8); ctx.fill();\n    ctx.fillStyle = '#C4491B';\n    roundRect(ctx, 12, -6, 34, 22, 8); ctx.fill();\n    ctx.fillStyle = '#DFF3FF';\n    roundRect(ctx, 16, -2, 26, 14, 4); ctx.fill();\n    ctx.fillStyle = '#1B1B2F';\n    ctx.beginPath(); ctx.arc(12,38,8,0,7); ctx.fill();\n    ctx.beginPath(); ctx.arc(48,38,8,0,7); ctx.fill();\n    ctx.restore();\n\n    // kuch effekti\n    if(boost>0.5){\n      ctx.fillStyle = 'rgba(255,193,69,'+(boost/14)+')';\n      ctx.beginPath();\n      ctx.moveTo(x - dir*8, H-58);\n      ctx.lineTo(x - dir*28, H-64);\n      ctx.lineTo(x - dir*28, H-52);\n      ctx.fill();\n    }\n\n    requestAnimationFrame(draw);\n  }\n  draw();\n})();\n\nfunction roundRect(ctx,x,y,w,h,r){\n  ctx.beginPath();\n  ctx.moveTo(x+r,y);\n  ctx.arcTo(x+w,y,x+w,y+h,r);\n  ctx.arcTo(x+w,y+h,x,y+h,r);\n  ctx.arcTo(x,y+h,x,y,r);\n  ctx.arcTo(x,y,x+w,y,r);\n  ctx.closePath();\n}\n\n/* =====================================================\n   BO'LIM 2 — MOLEKULYAR HOLATLAR\n===================================================== */\n(function(){\n  const canvas = document.getElementById('molCanvas');\n  fitCanvas(canvas);\n  const ctx = canvas.getContext('2d');\n  const tempSlider = document.getElementById('molTemp');\n  const btns = {\n    solid: document.getElementById('stateSolid'),\n    liquid: document.getElementById('stateLiquid'),\n    gas: document.getElementById('stateGas')\n  };\n  let state = 'solid';\n  const N = 42;\n  let particles = [];\n\n  function setState(s){\n    state = s;\n    Object.entries(btns).forEach(([k,b])=> b.classList.toggle('on', k===s));\n    initParticles();\n  }\n  Object.entries(btns).forEach(([k,b])=> b.addEventListener('click', ()=>setState(k)));\n\n  function initParticles(){\n    particles = [];\n    const cols = 7, rows = 6;\n    for(let i=0;i\u003cN;i++){\n      let baseX, baseY;\n      if(state==='gas'){\n        baseX = Math.random(); baseY = Math.random();\n      } else {\n        const c = i % cols, r = Math.floor(i/cols)%rows;\n        baseX = 0.09 + c*(0.82/(cols-1));\n        baseY = 0.12 + r*(0.78/(rows-1));\n      }\n      particles.push({\n        bx: baseX, by: baseY,\n        x: baseX, y: baseY,\n        vx: (Math.random()-.5)*0.002,\n        vy: (Math.random()-.5)*0.002,\n        phase: Math.random()*Math.PI*2\n      });\n    }\n  }\n  initParticles();\n\n  function temp(){ return parseInt(tempSlider.value,10); }\n\n  function step(){\n    const W = canvas.width, H = canvas.height;\n    ctx.clearRect(0,0,W,H);\n\n    // konteyner\n    ctx.strokeStyle = '#B9D9CC';\n    ctx.lineWidth = 3;\n    roundRect(ctx, 8,8, W-16, H-16, 14);\n    ctx.stroke();\n\n    const t = temp();\n    const speedFactor = 0.5 + t*0.55;\n\n    particles.forEach(p=>{\n      if(state==='solid'){\n        p.phase += 0.15*speedFactor;\n        p.x = p.bx + Math.sin(p.phase)*0.004*speedFactor;\n        p.y = p.by + Math.cos(p.phase*1.3)*0.004*speedFactor;\n      } else if(state==='liquid'){\n        p.x += p.vx*speedFactor;\n        p.y += p.vy*speedFactor;\n        p.vx += (Math.random()-.5)*0.0015*speedFactor;\n        p.vy += (Math.random()-.5)*0.0015*speedFactor;\n        p.vx = Math.max(-0.004,Math.min(0.004,p.vx));\n        p.vy = Math.max(-0.004,Math.min(0.004,p.vy));\n        // konteyner ichida saqlash\n        if(p.x\u003c0.06){p.x=0.06; p.vx*=-1;}\n        if(p.x>0.94){p.x=0.94; p.vx*=-1;}\n        if(p.y\u003c0.08){p.y=0.08; p.vy*=-1;}\n        if(p.y>0.92){p.y=0.92; p.vy*=-1;}\n      } else { // gas\n        p.x += p.vx*speedFactor*2.2;\n        p.y += p.vy*speedFactor*2.2;\n        if(p.vx===0) p.vx = (Math.random()-.5)*0.004;\n        if(p.vy===0) p.vy = (Math.random()-.5)*0.004;\n        if(p.x\u003c0.03||p.x>0.97) p.vx*=-1;\n        if(p.y\u003c0.05||p.y>0.95) p.vy*=-1;\n        p.x = Math.max(0.03,Math.min(0.97,p.x));\n        p.y = Math.max(0.05,Math.min(0.95,p.y));\n      }\n\n      ctx.beginPath();\n      ctx.arc(p.x*W, p.y*H, 6.2, 0, 7);\n      ctx.fillStyle = state==='gas' ? '#06A77D' : (state==='liquid' ? '#0E8F72' : '#04735A');\n      ctx.globalAlpha = 0.9;\n      ctx.fill();\n    });\n\n    // gas uchun tezlik ta'minlash (vx/vy random.init bo'lmagani uchun)\n    requestAnimationFrame(step);\n  }\n  // gaz zarralariga boshlang'ich tezlik berish\n  particles.forEach(p=>{ if(p.vx===0) p.vx=0.002; if(p.vy===0) p.vy=0.002; });\n  step();\n})();\n\n/* =====================================================\n   BO'LIM 3 — TERMODINAMIKA: issiqlik almashinuvi\n===================================================== */\n(function(){\n  const canvas = document.getElementById('thermCanvas');\n  fitCanvas(canvas);\n  const ctx = canvas.getContext('2d');\n  const startBtn = document.getElementById('thermStart');\n  const resetBtn = document.getElementById('thermReset');\n  const readout = document.getElementById('thermReadout');\n\n  let hotT = 90, coldT = 10;\n  let touching = false;\n  let done = false;\n\n  function reset(){\n    hotT = 90; coldT = 10; touching = false; done = false;\n    startBtn.disabled = false;\n    updateReadout();\n  }\n  function updateReadout(){\n    readout.textContent = 'Issiq: '+Math.round(hotT)+'° · Sovuq: '+Math.round(coldT)+'°';\n  }\n  startBtn.addEventListener('click', ()=>{ touching = true; startBtn.disabled = true; });\n  resetBtn.addEventListener('click', reset);\n\n  function tempColor(t){\n    // 10 (ko'k) -> 90 (qizil)\n    const ratio = (t-10)/80;\n    const r = Math.round(62 + ratio*(230-62));\n    const g = Math.round(127 + ratio*(57-127));\n    const b = Math.round(217 + ratio*(80-217));\n    return `rgb(${r},${g},${b})`;\n  }\n\n  let particlesHot = Array.from({length:16}, ()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.01,vy:(Math.random()-.5)*.01}));\n  let particlesCold = Array.from({length:16}, ()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.01,vy:(Math.random()-.5)*.01}));\n\n  function moveGroup(list, t){\n    const f = 0.3 + (t/90)*1.6;\n    list.forEach(p=>{\n      p.x += p.vx*f; p.y += p.vy*f;\n      if(p.x\u003c0.05||p.x>0.95) p.vx*=-1;\n      if(p.y\u003c0.08||p.y>0.92) p.vy*=-1;\n      p.x = Math.max(0.05,Math.min(0.95,p.x));\n      p.y = Math.max(0.08,Math.min(0.92,p.y));\n    });\n  }\n\n  function draw(){\n    const W = canvas.width, H = canvas.height;\n    ctx.clearRect(0,0,W,H);\n\n    if(touching && !done){\n      const diff = hotT - coldT;\n      if(diff > 0.5){\n        const flow = diff*0.01;\n        hotT -= flow;\n        coldT += flow;\n      } else {\n        done = true;\n      }\n      updateReadout();\n    }\n\n    const blockW = W*0.36, blockH = H*0.62, gap = touching ? 4 : 26;\n    const y0 = H*0.16;\n    const hotX = W/2 - blockW - gap/2;\n    const coldX = W/2 + gap/2;\n\n    // issiq blok\n    ctx.fillStyle = tempColor(hotT);\n    roundRect(ctx, hotX, y0, blockW, blockH, 16); ctx.fill();\n    moveGroup(particlesHot, hotT);\n    particlesHot.forEach(p=>{\n      ctx.beginPath();\n      ctx.arc(hotX + p.x*blockW, y0 + p.y*blockH, 4, 0, 7);\n      ctx.fillStyle = 'rgba(255,255,255,0.75)';\n      ctx.fill();\n    });\n\n    // sovuq blok\n    ctx.fillStyle = tempColor(coldT);\n    roundRect(ctx, coldX, y0, blockW, blockH, 16); ctx.fill();\n    moveGroup(particlesCold, coldT);\n    particlesCold.forEach(p=>{\n      ctx.beginPath();\n      ctx.arc(coldX + p.x*blockW, y0 + p.y*blockH, 4, 0, 7);\n      ctx.fillStyle = 'rgba(255,255,255,0.75)';\n      ctx.fill();\n    });\n\n    // issiqlik oqimi strelkalari\n    if(touching && !done){\n      const midY = y0 + blockH/2;\n      for(let i=0;i\u003c3;i++){\n        const ox = (Date.now()/300 + i*0.9)%3;\n        const ax = hotX + blockW + 4 + ox*6;\n        ctx.fillStyle = 'rgba(230,57,80,0.7)';\n        ctx.beginPath();\n        ctx.moveTo(ax, midY-8+i*10);\n        ctx.lineTo(ax+10, midY-3+i*10);\n        ctx.lineTo(ax, midY+2+i*10);\n        ctx.fill();\n      }\n    }\n\n    // labels\n    ctx.fillStyle = '#fff';\n    ctx.font = '600 13px Nunito, sans-serif';\n    ctx.textAlign = 'center';\n    ctx.fillText('ISSIQ', hotX+blockW/2, y0+18);\n    ctx.fillText('SOVUQ', coldX+blockW/2, y0+18);\n\n    requestAnimationFrame(draw);\n  }\n  updateReadout();\n  draw();\n})();\n\n/* =====================================================\n   TEST BO'LIMI\n===================================================== */\nconst quizData = [\n  {\n    q: \"1. Jismning vaqt o'tishi bilan boshqa jismlarga nisbatan o'rnini o'zgartirishi qanday ataladi?\",\n    opts: [\"Mexanik harakat\", \"Diffuziya\", \"Issiqlik almashinuvi\", \"Bug'lanish\"],\n    correct: 0\n  },\n  {\n    q: \"2. Jismni tezlatish yoki sekinlatish uchun nima kerak?\",\n    opts: [\"Rang\", \"Hajm\", \"Kuch\", \"Hid\"],\n    correct: 2\n  },\n  {\n    q: \"3. Gaz holatidagi molekulalar qanday harakatlanadi?\",\n    opts: [\"Umuman harakatlanmaydi\", \"Faqat titraydi\", \"Tez va tartibsiz harakatlanadi\", \"Bir joyda aylanadi\"],\n    correct: 2\n  },\n  {\n    q: \"4. Xonaga sepilgan atir hidining tarqalishiga nima misol bo'ladi?\",\n    opts: [\"Diffuziya\", \"Tortishish kuchi\", \"Issiqlik o'tkazuvchanlik\", \"Tezlanish\"],\n    correct: 0\n  },\n  {\n    q: \"5. Issiq choy stakani sovuq havoda qoldirilsa, issiqlik qaysi tomonga o'tadi?\",\n    opts: [\"Sovuqdan issiqqa\", \"Issiqdan sovuqqa\", \"Issiqlik umuman o'tmaydi\", \"Ikkala tomonga teng\"],\n    correct: 1\n  }\n];\n\nconst quizList = document.getElementById('quizList');\nconst scoreBox = document.getElementById('scoreBox');\nlet answered = 0, correctCount = 0;\n\nquizData.forEach((item, qi)=>{\n  const card = document.createElement('div');\n  card.className = 'qcard';\n  const qtext = document.createElement('div');\n  qtext.className = 'qtext';\n  qtext.textContent = item.q;\n  card.appendChild(qtext);\n\n  const optsWrap = document.createElement('div');\n  optsWrap.className = 'opts';\n\n  item.opts.forEach((optText, oi)=>{\n    const btn = document.createElement('button');\n    btn.className = 'opt';\n    btn.textContent = optText;\n    btn.addEventListener('click', ()=>{\n      const allOpts = optsWrap.querySelectorAll('.opt');\n      allOpts.forEach(o=> o.disabled = true);\n      if(oi === item.correct){\n        btn.classList.add('correct');\n        correctCount++;\n      } else {\n        btn.classList.add('wrong');\n        allOpts[item.correct].classList.add('correct');\n      }\n      answered++;\n      updateScore();\n    });\n    optsWrap.appendChild(btn);\n  });\n\n  card.appendChild(optsWrap);\n  quizList.appendChild(card);\n});\n\nfunction updateScore(){\n  if(answered === quizData.length){\n    scoreBox.textContent = `Natija: ${correctCount} / ${quizData.length} to'g'ri javob 🎉`;\n  } else {\n    scoreBox.textContent = `Javob berilgan savollar: ${answered} / ${quizData.length}`;\n  }\n}\nupdateScore();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Fizik hodisalar (simulyatsiyalar)", "icon": "🌡️", "html": "\u003c!doctype html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>7-sinf Fizika — Interaktiv simulyatsiyalar\u003c/title>\n\u003cstyle>\nbody{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#18212f}\nmain{max-width:850px;margin:auto;padding:20px}\nh1{text-align:center}.sim{background:white;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 3px 12px #0001}\n.stage{height:190px;border:1px solid #d5dce5;border-radius:12px;background:#f9fbfd;position:relative;overflow:hidden;margin:12px 0}\nbutton{padding:11px 15px;margin:4px;border:0;border-radius:9px;background:#2867d8;color:white;font-weight:bold;cursor:pointer}\nbutton.secondary{background:#64748b}.info{color:#536274;margin-top:10px}\n.car{position:absolute;left:15px;bottom:30px;font-size:42px}\n.ice,.lamp,.magnet{font-size:58px;position:absolute;left:45px;top:55px}.iron{font-size:42px;position:absolute;right:45px;top:65px}\n.ray{position:absolute;height:3px;background:#e9a400;transform-origin:left center}\n.wave{position:absolute;left:20px;right:20px;top:65px;font-size:58px;text-align:center}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003ch1>🔬 7-sinf Fizika\u003c/h1>\n\u003cp style=\"text-align:center\">\u003cb>“Fizika fani nimani o‘rganadi? Fizik hodisalar”\u003c/b>\u003cbr>Interaktiv animatsiya va simulyatsiyalar\u003c/p>\n\n\u003csection class=\"sim\">\n\u003ch2>1. Mexanik hodisa — harakat\u003c/h2>\n\u003cp>Jismning vaqt davomida o‘z o‘rnini o‘zgartirishi mexanik hodisadir.\u003c/p>\n\u003cdiv class=\"stage\">\u003cdiv class=\"car\" id=\"car\">🚗\u003c/div>\u003c/div>\n\u003cbutton onclick=\"startCar()\">▶ Harakatni boshlash\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"resetCar()\">↻ Qaytarish\u003c/button>\n\u003cdiv class=\"info\">Kuzating: mashina joyini o‘zgartirmoqda.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sim\">\n\u003ch2>2. Issiqlik hodisasi — muzning erishi\u003c/h2>\n\u003cp>Muz qizdirilganda erib, suyuq suvga aylanadi.\u003c/p>\n\u003cdiv class=\"stage\">\n\u003cdiv class=\"ice\" id=\"ice\">🧊\u003c/div>\u003cdiv id=\"water\" style=\"display:none;position:absolute;left:48px;top:65px;font-size:55px\">💧\u003c/div>\n\u003c/div>\n\u003cbutton onclick=\"melt()\">🔥 Qizdirish\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"resetIce()\">↻ Qaytarish\u003c/button>\n\u003cdiv class=\"info\" id=\"iceInfo\">Qizdirishni boshlang.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sim\">\n\u003ch2>3. Elektr hodisasi — elektr zanjiri\u003c/h2>\n\u003cp>Zanjir yopilganda elektr toki o‘tadi va lampochka yonadi.\u003c/p>\n\u003cdiv class=\"stage\">\n\u003cdiv class=\"lamp\" id=\"lamp\" style=\"filter:grayscale(1)\">💡\u003c/div>\n\u003cdiv style=\"position:absolute;left:150px;top:82px;font-size:34px\">🔋 ─────────\u003c/div>\n\u003c/div>\n\u003cbutton onclick=\"onLamp()\">⚡ Zanjirni ulash\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"offLamp()\">↻ Uzish\u003c/button>\n\u003cdiv class=\"info\" id=\"lampInfo\">Zanjir hozir uzilgan.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sim\">\n\u003ch2>4. Magnit hodisasi\u003c/h2>\n\u003cp>Magnit ayrim temir buyumlarni o‘ziga tortadi.\u003c/p>\n\u003cdiv class=\"stage\">\u003cdiv class=\"magnet\" id=\"magnet\">🧲\u003c/div>\u003cdiv class=\"iron\" id=\"iron\">🔩\u003c/div>\u003c/div>\n\u003cbutton onclick=\"pullMagnet()\">🧲 Magnitni yaqinlashtirish\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"resetMagnet()\">↻ Qaytarish\u003c/button>\n\u003cdiv class=\"info\">Magnit va temir buyum o‘rtasidagi tortishishni kuzating.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sim\">\n\u003ch2>5. Yorug‘lik hodisasi — aks etish\u003c/h2>\n\u003cp>Yorug‘lik sirtga tushib, undan qaytishi mumkin.\u003c/p>\n\u003cdiv class=\"stage\">\n\u003cdiv style=\"font-size:48px;position:absolute;left:20px;top:55px\">☀️\u003c/div>\n\u003cdiv class=\"ray\" id=\"ray1\" style=\"left:100px;top:85px;width:125px;transform:rotate(25deg);opacity:0\">\u003c/div>\n\u003cdiv style=\"position:absolute;right:35px;top:20px;height:150px;border-left:5px solid #64748b\">\u003c/div>\n\u003cdiv class=\"ray\" id=\"ray2\" style=\"left:220px;top:138px;width:115px;transform:rotate(-25deg);opacity:0\">\u003c/div>\n\u003c/div>\n\u003cbutton onclick=\"lightOn()\">☀️ Yorug‘likni yuborish\u003c/button>\n\u003cdiv class=\"info\">Tushgan va qaytgan nurlarni kuzating.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sim\">\n\u003ch2>6. Tovush hodisasi — tebranish\u003c/h2>\n\u003cp>Tebranayotgan jism tovush hosil qilishi mumkin.\u003c/p>\n\u003cdiv class=\"stage\">\u003cdiv class=\"wave\" id=\"wave\">〰️〰️〰️\u003c/div>\u003c/div>\n\u003cbutton onclick=\"soundOn()\">🔊 Tebranishni boshlash\u003c/button>\n\u003cbutton class=\"secondary\" onclick=\"soundOff()\">↻ To‘xtatish\u003c/button>\n\u003cdiv class=\"info\">Tebranish natijasida tovush to‘lqinlari hosil bo‘ladi.\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sim\">\n\u003ch2>🎯 Tezkor tekshiruv\u003c/h2>\n\u003cp>Qaysi hodisalar fizik hodisalarga kiradi?\u003c/p>\n\u003cbutton onclick=\"answer()\">Muzning erishi\u003c/button>\n\u003cbutton onclick=\"answer()\">Lampochkaning yonishi\u003c/button>\n\u003cbutton onclick=\"answer()\">Mashinaning harakatlanishi\u003c/button>\n\u003cdiv class=\"info\" id=\"answer\">\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\nfunction startCar(){let c=document.getElementById('car');c.getAnimations().forEach(a=>a.cancel());c.animate([{transform:'translateX(0)'},{transform:'translateX(700px)'}],{duration:2200,iterations:Infinity,direction:'alternate'})}\nfunction resetCar(){let c=document.getElementById('car');c.getAnimations().forEach(a=>a.cancel());c.style.transform='translateX(0)'}\nfunction melt(){document.getElementById('ice').style.display='none';document.getElementById('water').style.display='block';document.getElementById('iceInfo').textContent='Muz eridi: qattiq holatdan suyuq holatga o‘tdi.'}\nfunction resetIce(){document.getElementById('ice').style.display='block';document.getElementById('water').style.display='none';document.getElementById('iceInfo').textContent='Qizdirishni boshlang.'}\nfunction onLamp(){document.getElementById('lamp').style.filter='brightness(1.8)';document.getElementById('lampInfo').textContent='Zanjir yopildi. Elektr toki o‘tdi va lampochka yondi.'}\nfunction offLamp(){document.getElementById('lamp').style.filter='grayscale(1)';document.getElementById('lampInfo').textContent='Zanjir uzildi. Tok o‘tmayapti.'}\nfunction pullMagnet(){document.getElementById('iron').animate([{transform:'translateX(0)'},{transform:'translateX(-180px)'}],{duration:1000,fill:'forwards'})}\nfunction resetMagnet(){let x=document.getElementById('iron');x.getAnimations().forEach(a=>a.cancel());x.style.transform='translateX(0)'}\nfunction lightOn(){document.getElementById('ray1').animate([{opacity:0},{opacity:1}],{duration:700,fill:'forwards'});document.getElementById('ray2').animate([{opacity:0},{opacity:1}],{duration:700,fill:'forwards'})}\nfunction soundOn(){document.getElementById('wave').animate([{transform:'scaleX(1)'},{transform:'scaleX(1.35)'},{transform:'scaleX(1)'}],{duration:500,iterations:Infinity})}\nfunction soundOff(){document.getElementById('wave').getAnimations().forEach(a=>a.cancel())}\nfunction answer(){document.getElementById('answer').textContent='✅ To‘g‘ri! Muzning erishi, lampochkaning yonishi va mashinaning harakatlanishi — fizik hodisalardir.'}\n\u003c/script>\n\u003c/body>\n\u003c/html>"}, {"title": "Fizikani o'rganishdagi muhim tamoyillar", "icon": "🧠", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Fizika o'rganish tamoyillari\u003c/title>\n\u003cstyle>\n:root{--bg:#fff8ec;--card:#fff;--tx:#2b2540;--mut:#6b6485;--c1:#ff7a59;--c2:#2bb0a0;--c3:#8b5cf6;--ok:#22a55b;--bad:#e5484d;--ln:#eadfcb;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1c1830;--card:#2a2444;--tx:#f3efff;--mut:#b8b0d6;--ln:#433b66}}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n.wrap{max-width:820px;margin:0 auto;padding:14px}\nh1{font-size:1.7rem;text-align:center;margin:8px 0 12px}\nh2{margin:0 0 6px;font-size:1.35rem}h3{margin:16px 0 6px;font-size:1.1rem}\n.tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}\n.tab{flex:1;border:0;border-radius:14px;padding:10px 4px;font:inherit;font-weight:700;font-size:.85rem;color:#fff;opacity:.55;cursor:pointer}\n.tab.on{opacity:1;box-shadow:0 3px 0 rgba(0,0,0,.25)}\n.t0{background:var(--c1)}.t1{background:var(--c2)}.t2{background:var(--c3)}\n.card{background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}\n.sec{display:none}.sec.on{display:block}\ncanvas{width:100%;height:auto;background:#eaf6ff;border-radius:14px;display:block}\nlabel{display:block;margin:6px 0;font-weight:600}\ninput[type=range]{width:100%;height:28px}\nbutton.b{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;color:#fff;background:var(--c1);cursor:pointer;margin:4px 4px 4px 0}\nbutton.g{background:var(--c2)}button.p{background:var(--c3)}\n.steps{display:flex;gap:6px;flex-wrap:wrap}.st{flex:1;min-width:95px;padding:8px;border-radius:12px;background:var(--bg);border:2px dashed var(--ln);text-align:center;font-size:.85rem;font-weight:700}\n.st.on{border:2px solid var(--c1);background:#fff1e8;color:#2b2540}\n.tblw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--ln);padding:5px;text-align:center}\n.bub{padding:10px 12px;border-radius:16px;margin:8px 0;max-width:88%}\n.az{background:#dbeafe;color:#1e3a5f}.ma{background:#fce7f3;color:#5f1e40;margin-left:auto}\n.opt{display:block;width:100%;text-align:left;border:2px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;margin:6px 0;font:inherit;cursor:pointer}\n.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}\n.note{color:var(--mut);font-size:.9rem}.hl{background:#fff4c2;color:#3b3200;border-radius:12px;padding:10px;margin:8px 0}\n.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.fz{border:0;border-radius:16px;padding:14px 8px;font:inherit;font-weight:700;color:#fff;cursor:pointer}\n@media(max-width:420px){body{font-size:17px}.cards{grid-template-columns:1fr}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003ch1>🔬 Fizikani o'rganish tamoyillari\u003c/h1>\n\u003cdiv class=\"tabs\">\n\u003cbutton class=\"tab t0 on\" data-t=\"0\">🧪 Tadqiqot\u003c/button>\n\u003cbutton class=\"tab t1\" data-t=\"1\">🤝 Hamkorlik\u003c/button>\n\u003cbutton class=\"tab t2\" data-t=\"2\">🎯 Fazilatlar\u003c/button>\n\u003c/div>\n\n\u003c!-- ============ 1-BO'LIM ============ -->\n\u003csection class=\"sec on\" id=\"s0\">\n\u003cdiv class=\"card\">\u003ch2>🧪 Tadqiqotchi va ijodiy yondashuv\u003c/h2>\n\u003cp>Olim savol beradi, \u003cb>gipoteza\u003c/b> (taxmin) qo'yadi, \u003cb>tajriba\u003c/b> qiladi va \u003cb>xulosa\u003c/b> chiqaradi. Yangi fikrlar ijodkorlikdan boshlanadi!\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"steps\">\u003cdiv class=\"st on\" id=\"st0\">1️⃣ Gipoteza\u003c/div>\u003cdiv class=\"st\" id=\"st1\">2️⃣ Tajriba\u003c/div>\u003cdiv class=\"st\" id=\"st2\">3️⃣ Xulosa\u003c/div>\u003c/div>\n\u003ch3>Savol: massa mayatnik davriga ta'sir qiladimi?\u003c/h3>\n\u003cbutton class=\"b p\" onclick=\"hyp('ha')\">Ha, ta'sir qiladi\u003c/button>\u003cbutton class=\"b p\" onclick=\"hyp('yoq')\">Yo'q, ta'sir qilmaydi\u003c/button>\n\u003cdiv id=\"hypTx\" class=\"note\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ccanvas id=\"cv0\" width=\"360\" height=\"250\">\u003c/canvas>\n\u003clabel>Ip uzunligi: \u003cspan id=\"vL\">1.0\u003c/span> m\u003cinput type=\"range\" id=\"rL\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\">\u003c/label>\n\u003clabel>Yuk massasi: \u003cspan id=\"vM\">1.0\u003c/span> kg\u003cinput type=\"range\" id=\"rM\" min=\"0.1\" max=\"2\" step=\"0.1\" value=\"1\">\u003c/label>\n\u003clabel>Boshlang'ich burchak: \u003cspan id=\"vA\">30\u003c/span>°\u003cinput type=\"range\" id=\"rA\" min=\"5\" max=\"60\" step=\"1\" value=\"30\">\u003c/label>\n\u003cp>⏱ Davr T = \u003cb id=\"tT\">-\u003c/b> s &nbsp; (o'lchangan: \u003cb id=\"tM\">-\u003c/b> s)\u003c/p>\n\u003cbutton class=\"b g\" onclick=\"addRow()\">➕ Jadvalga qo'shish\u003c/button>\u003cbutton class=\"b\" onclick=\"concl()\">📝 Xulosa chiqarish\u003c/button>\n\u003cdiv class=\"tblw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>L (m)\u003c/th>\u003cth>m (kg)\u003c/th>\u003cth>Burchak\u003c/th>\u003cth>T (s)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"tb\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv id=\"conc\" class=\"hl\" style=\"display:none\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>💭 O'ylab ko'r\u003c/h3>\u003cul>\u003cli>Faqat massani o'zgartirsang, T o'zgaradimi?\u003c/li>\u003cli>Ipni 4 marta uzunroq qilsang, T necha marta ortadi?\u003c/li>\u003cli>Nega bitta o'lchovga ishonib bo'lmaydi?\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>✅ Mustahkamlash\u003c/h3>\u003cdiv id=\"q0\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 2-BO'LIM ============ -->\n\u003csection class=\"sec\" id=\"s1\">\n\u003cdiv class=\"card\">\u003ch2>🤝 Hamkorlik, erkin fikrlash va skeptik qarash\u003c/h2>\n\u003cp>\u003cb>Skeptik\u003c/b> — hamma narsaga darhol ishonmay, \"Isboti bormi?\" deb so'raydigan odam. Do'stlar bilan muhokama qilsak, haqiqatga tezroq yetamiz.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv id=\"dlg\">\u003c/div>\u003cbutton class=\"b g\" id=\"dnx\" onclick=\"nextD()\">Keyingi ▶\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003ccanvas id=\"cv1\" width=\"360\" height=\"260\">\u003c/canvas>\n\u003cbutton class=\"b\" onclick=\"drop()\">⬇️ Tushirish\u003c/button>\u003cbutton class=\"b p\" id=\"airB\" onclick=\"toggleAir()\">💨 Havo qarshiligi: O'CHIQ\u003c/button>\n\u003cdiv id=\"res\" class=\"hl\">Natija: tajriba boshlanmagan.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>💭 O'ylab ko'r\u003c/h3>\u003cul>\u003cli>Havo bo'lmasa, tosh va qog'oz nega birga tushdi?\u003c/li>\u003cli>Aziz noto'g'ri edimi? Nega u ham foydali fikr aytdi?\u003c/li>\u003cli>Do'stingning fikriga qo'shilmasang, qanday muloyim so'raysan?\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>✅ Mustahkamlash\u003c/h3>\u003cdiv id=\"q1\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 3-BO'LIM ============ -->\n\u003csection class=\"sec\" id=\"s2\">\n\u003cdiv class=\"card\">\u003ch2>🎯 Qat'iyat, kamtarlik, rostgo'ylik, mas'uliyat\u003c/h2>\n\u003cp>Har bir o'lchov ozgina xato bilan chiqadi. Shuning uchun ko'p marta o'lchab, \u003cb>o'rtacha qiymat\u003c/b> olamiz.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>📏 Aniq o'lchash o'yini\u003c/h3>\n\u003cbutton class=\"b\" onclick=\"meas('L')\">📏 Qalam uzunligini o'lcha\u003c/button>\u003cbutton class=\"b g\" onclick=\"meas('T')\">⏱ Sekundomer bilan o'lcha\u003c/button>\n\u003cdiv id=\"mres\" class=\"hl\">O'lchovlar hali yo'q.\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>🃏 Fazilat kartochkalari (bos!)\u003c/h3>\n\u003cdiv class=\"cards\">\n\u003cbutton class=\"fz\" style=\"background:#ef6c4d\" onclick=\"scen(0)\">💪 Qat'iyat\u003c/button>\n\u003cbutton class=\"fz\" style=\"background:#2bb0a0\" onclick=\"scen(1)\">🙏 Kamtarlik\u003c/button>\n\u003cbutton class=\"fz\" style=\"background:#8b5cf6\" onclick=\"scen(2)\">🗣 Rostgo'ylik\u003c/button>\n\u003cbutton class=\"fz\" style=\"background:#e6a100\" onclick=\"scen(3)\">🦺 Mas'uliyatlilik\u003c/button>\u003c/div>\n\u003cdiv id=\"scn\" class=\"card\" style=\"display:none\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>💭 O'ylab ko'r\u003c/h3>\u003cul>\u003cli>Nega o'rtacha qiymat bitta o'lchovdan ishonchliroq?\u003c/li>\u003cli>Natijang kutilganidan farq qilsa, nima qilasan?\u003c/li>\u003cli>Laboratoriyada qanday xavfsizlik qoidalari bor?\u003c/li>\u003c/ul>\u003c/div>\n\u003cdiv class=\"card\">\u003ch3>✅ Mustahkamlash\u003c/h3>\u003cdiv id=\"q2\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ XULOSA ============ -->\n\u003cdiv class=\"card\" style=\"border-color:var(--c2)\">\u003ch2>🌟 Umumiy xulosa\u003c/h2>\n\u003cp>1) Taxmin qil, tajriba qil, xulosa chiqar. 2) Ishonishdan oldin tekshir, birgalikda muhokama qil. 3) Qat'iyatli, kamtar, rostgo'y va mas'uliyatli bo'l.\u003c/p>\n\u003cbutton class=\"b p\" onclick=\"resetAll()\">🔄 Qayta boshlash\u003c/button>\u003c/div>\n\u003c/div>\n\n\u003cscript>\n// ---------- Yordamchi ----------\nconst $=id=>document.getElementById(id);\nconst g=9.8;\n// Tablar\ndocument.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');\n  document.querySelectorAll('.sec').forEach((s,i)=>s.classList.toggle('on',i==b.dataset.t));\n});\n// ---------- Testlar (javob bergach darhol tekshiriladi) ----------\nconst QZ=[\n [[\"Mayatnik davri qaysi kattalikka bog'liq?\",[\"Ip uzunligiga\",\"Yuk massasiga\",\"Rangiga\"],0],\n  [\"Tajribadan keyingi oxirgi bosqich qaysi?\",[\"Gipoteza\",\"Xulosa chiqarish\",\"Savol berish\"],1]],\n [[\"Skeptik odam nima qiladi?\",[\"Hammasiga ishonadi\",\"Tekshirib ko'radi\",\"Bahslashmaydi\"],1],\n  [\"Havosiz joyda tosh va patning tushishi qanday?\",[\"Birga tushadi\",\"Tosh oldin\",\"Pat oldin\"],0]],\n [[\"Bir necha o'lchovdan nima olamiz?\",[\"Eng kattasini\",\"O'rtacha qiymatni\",\"Eng kichigini\"],1],\n  [\"Natija kutilganidan farq qilsa nima qilamiz?\",[\"O'zgartirib yozamiz\",\"Rostini yozamiz\",\"Yozmaymiz\"],1]]];\nfunction quiz(i){\n  const box=$('q'+i);box.innerHTML='';\n  QZ[i].forEach(([q,o,a])=>{\n    const d=document.createElement('div');d.innerHTML='\u003cb>'+q+'\u003c/b>';\n    const fb=document.createElement('div');fb.className='note';\n    o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;\n      b.onclick=()=>{ if(d.dataset.done)return;d.dataset.done=1;\n        b.classList.add(k==a?'ok':'no');if(k!=a)d.querySelectorAll('.opt')[a].classList.add('ok');\n        fb.textContent=k==a?'✅ To\\'g\\'ri!':'❌ Noto\\'g\\'ri. To\\'g\\'ri javob belgilandi.';};\n      d.appendChild(b);});\n    d.appendChild(fb);box.appendChild(d);});\n}\n// ---------- 1-BO'LIM: Mayatnik ----------\nconst c0=$('cv0').getContext('2d');\nlet hypo=null,rows=[],t0=0,lastCross=null,measT=null,prevTh=1;\nconst Lv=()=>+$('rL').value,Mv=()=>+$('rM').value,Av=()=>+$('rA').value;\nconst Tcalc=()=>2*Math.PI*Math.sqrt(Lv()/g); // T = 2π√(L/g)\nfunction setStep(n){for(let i=0;i\u003c3;i++)$('st'+i).classList.toggle('on',i==n)}\nfunction hyp(h){hypo=h;setStep(1);$('hypTx').textContent='Gipoteza qabul qilindi: massa '+(h=='ha'?'ta\\'sir qiladi':'ta\\'sir qilmaydi')+'. Endi tajriba qil — kamida 3 o\\'lchov qo\\'sh.';}\n['rL','rM','rA'].forEach(id=>$(id).oninput=()=>{$('vL').textContent=Lv().toFixed(1);$('vM').textContent=Mv().toFixed(1);$('vA').textContent=Av();t0=performance.now();lastCross=null;measT=null;prevTh=1;});\nfunction addRow(){\n  const T=(measT||Tcalc()).toFixed(2);\n  rows.push([Lv(),Mv(),Av(),T]);\n  $('tb').innerHTML+='\u003ctr>\u003ctd>'+Lv().toFixed(1)+'\u003c/td>\u003ctd>'+Mv().toFixed(1)+'\u003c/td>\u003ctd>'+Av()+'°\u003c/td>\u003ctd>'+T+'\u003c/td>\u003c/tr>';\n  if(hypo)setStep(1);\n}\nfunction concl(){\n  const d=$('conc');d.style.display='block';\n  if(rows.length\u003c3){d.textContent='Avval kamida 3 ta o\\'lchov qo\\'sh. Massani va uzunlikni alohida o\\'zgartirib ko\\'r!';return;}\n  setStep(2);\n  d.innerHTML='\u003cb>Xulosa:\u003c/b> massa o\\'zgarganda T deyarli o\\'zgarmaydi, ip uzunligi ortsa T ortadi. '+\n   (hypo=='yoq'?'🎉 Sening gipotezang to\\'g\\'ri chiqdi!':hypo=='ha'?'Gipotezang tasdiqlanmadi — bu ham ilmiy natija!':'Keyingi safar gipoteza ham qo\\'y.');\n}\nfunction drawPend(now){\n  const t=(now-t0)/1000,T=Tcalc(),th0=Av()*Math.PI/180,th=th0*Math.cos(2*Math.PI*t/T);\n  // o'lchangan davr: teskari yo'nalishdan o'tish momentlari\n  if(prevTh\u003c0&&th>=0){if(lastCross!==null)measT=(now-lastCross)/1000;lastCross=now;}\n  prevTh=th;\n  $('tT').textContent=T.toFixed(2);$('tM').textContent=measT?measT.toFixed(2):'...';\n  const W=360,px=110,x0=180,y0=20,bx=x0+Lv()*px*Math.sin(th),by=y0+Lv()*px*Math.cos(th);\n  c0.clearRect(0,0,W,250);c0.fillStyle='#8b5cf6';c0.fillRect(120,10,120,10);\n  c0.strokeStyle='#444';c0.lineWidth=2;c0.beginPath();c0.moveTo(x0,y0);c0.lineTo(bx,by);c0.stroke();\n  c0.fillStyle='#ff7a59';c0.beginPath();c0.arc(bx,by,8+Mv()*6,0,7);c0.fill();\n}\n// ---------- 2-BO'LIM: Dialog va tushish ----------\nconst DL=[[\"az\",\"🧒 Aziz: Og'ir jism tezroq tushadi, bu aniq!\"],[\"ma\",\"👧 Malika: Aniqmi? Buni qayerdan bilasan? Tekshirib ko'raylikmi?\"],[\"az\",\"🧒 Aziz: Yaxshi, tosh va qog'oz to'pini tashlaymiz!\"],[\"ma\",\"👧 Malika: Ajoyib! Havo qarshiligini yoqib ham, o'chirib ham ko'ramiz.\"]];\nlet di=0;\nfunction nextD(){if(di\u003cDL.length){const b=document.createElement('div');b.className='bub '+DL[di][0];b.textContent=DL[di][1];$('dlg').appendChild(b);di++;}\n  if(di>=DL.length)$('dnx').style.display='none';}\nconst c1=$('cv1').getContext('2d');\nlet air=false,fall=null; // fall: {t, o:[{y,v,t}]}\nconst K={rock:0.1,paper:1.2}; // qarshilik koeffitsiyenti\nconst H=20; // balandlik, m\nfunction toggleAir(){air=!air;$('airB').textContent=\"💨 Havo qarshiligi: \"+(air?\"YOQIQ\":\"O'CHIQ\");}\nfunction drop(){fall={o:[{y:0,v:0,t:null,k:K.rock},{y:0,v:0,t:null,k:K.paper}],t:0,air:air,last:performance.now()};$('res').textContent='Tushmoqda...';}\nfunction drawFall(now){\n  if(fall){const dt=Math.min((now-fall.last)/1000,.05);fall.last=now;\n    if(!fall.done){fall.t+=dt;\n      fall.o.forEach(o=>{if(o.t===null){const k=fall.air?o.k:0;o.v+=(g-k*o.v)*dt;o.y+=o.v*dt;if(o.y>=H){o.y=H;o.t=fall.t;}}});\n      if(fall.o.every(o=>o.t!==null)){fall.done=1;const[a,b]=fall.o;\n        $('res').innerHTML='Havo qarshiligi '+(fall.air?'yoqiq':'o\\'chiq')+': tosh \u003cb>'+a.t.toFixed(2)+' s\u003c/b>, qog\\'oz to\\'pi \u003cb>'+b.t.toFixed(2)+' s\u003c/b>. '+\n        (fall.air?'Havo qarshiligi yengil jismni sekinlatdi!':'Ikkalasi bir vaqtda tushdi — massa ahamiyatsiz!');}}}\n  c1.clearRect(0,0,360,260);c1.fillStyle='#b7e4a5';c1.fillRect(0,245,360,15);\n  c1.fillStyle='#555';c1.font='14px sans-serif';c1.fillText('Tosh',100,16);c1.fillText('Qog\\'oz',215,16);\n  [[120,'#777',12],[240,'#f7a8c4',12]].forEach(([x,col,r],i)=>{\n    const y=25+(fall?fall.o[i].y:0)*10.5;c1.fillStyle=col;c1.beginPath();c1.arc(x,y,r,0,7);c1.fill();});\n}\n// ---------- 3-BO'LIM: O'lchash ----------\nconst M={L:[],T:[]},TR={L:15,T:2},SP={L:.5,T:.3};\nfunction meas(k){\n  M[k].push(TR[k]+(Math.random()*2-1)*SP[k]);draw3();}\nfunction draw3(){\n  let h='';[['L','📏 Uzunlik','sm'],['T','⏱ Vaqt','s']].forEach(([k,n,u])=>{\n    const a=M[k];if(!a.length)return;u=k=='L'?'sm':'s';\n    h+='\u003cp>\u003cb>'+n+':\u003c/b> '+a.map(v=>v.toFixed(2)).join('; ')+' '+u+'\u003cbr>O\\'rtacha: \u003cb>'+(a.reduce((s,v)=>s+v,0)/a.length).toFixed(2)+' '+u+'\u003c/b> ('+a.length+' ta o\\'lchov)\u003c/p>';});\n  $('mres').innerHTML=h||\"O'lchovlar hali yo'q.\";\n}\nconst SC=[\n [\"💪 Qat'iyat\",\"Birinchi o'lchoving boshqalardan ancha farq qildi. Sen nima qilarding?\",[[\"Tashlab qo'yardim\",0],[\"Yana bir necha marta o'lchardim\",1],[\"Eng chiroyli natijani tanlardim\",0]],\"Takroriy o'lchash ishonchli natija beradi.\"],\n [\"🙏 Kamtarlik\",\"Chizg'ichni noto'g'ri qo'yganingni payqading. Sen nima qilarding?\",[[\"Hech kimga aytmasdim\",0],[\"Xatoni tan olib, qayta o'lchardim\",1],[\"Do'stimni ayblardim\",0]],\"Xatoni tan olish olimni kuchli qiladi.\"],\n [\"🗣 Rostgo'ylik\",\"Natija kutganingdek chiqmadi. Sen nima qilarding?\",[[\"O'zgartirib yozardim\",0],[\"Qanday bo'lsa, shunday yozardim\",1],[\"Do'stimdan ko'chirardim\",0]],\"Kutilmagan natija ko'pincha yangi kashfiyotga olib boradi.\"],\n [\"🦺 Mas'uliyatlilik\",\"Laboratoriyada shisha asbob sindi. Sen nima qilarding?\",[[\"Yashirardim\",0],[\"O'qituvchiga darhol aytardim\",1],[\"Qo'lim bilan yig'ardim\",0]],\"Xavfsizlik birinchi o'rinda: darhol xabar ber.\"]];\nfunction scen(i){\n  const s=SC[i],d=$('scn');d.style.display='block';\n  d.innerHTML='\u003ch3>'+s[0]+'\u003c/h3>\u003cp>'+s[1]+'\u003c/p>\u003cb>Sen nima qilarding?\u003c/b>';\n  const fb=document.createElement('div');\n  s[2].forEach(([t,ok])=>{const b=document.createElement('button');b.className='opt';b.textContent=t;\n    b.onclick=()=>{b.classList.add(ok?'ok':'no');fb.innerHTML=ok?'✅ To\\'g\\'ri! '+s[3]:'❌ Yana o\\'ylab ko\\'r. To\\'g\\'ri yo\\'l boshqa.';};d.appendChild(b);});\n  d.appendChild(fb);\n}\n// ---------- Qayta boshlash ----------\nfunction resetAll(){\n  hypo=null;rows=[];$('tb').innerHTML='';$('conc').style.display='none';$('hypTx').textContent='';setStep(0);\n  $('rL').value=1;$('rM').value=1;$('rA').value=30;$('rL').oninput();\n  di=0;$('dlg').innerHTML='';$('dnx').style.display='';air=false;$('airB').textContent=\"💨 Havo qarshiligi: O'CHIQ\";fall=null;$('res').textContent='Natija: tajriba boshlanmagan.';\n  M.L=[];M.T=[];draw3();$('scn').style.display='none';\n  [0,1,2].forEach(quiz);\n  document.querySelector('.tab.t0').click();scrollTo(0,0);\n}\n// ---------- Asosiy sikl ----------\nfunction loop(now){drawPend(now);drawFall(now);requestAnimationFrame(loop);}\n[0,1,2].forEach(quiz);nextD();requestAnimationFrame(loop);\n/* O'QITUVCHI UCHUN TAVSIYA:\n   1) 1-bo'limda o'quvchilar juft bo'lib ishlasin: avval gipoteza yozdirib, keyin faqat BITTA parametrni o'zgartirib jadval to'ldirtiring.\n   2) 2-bo'limda dialogni sinfda rollarga bo'lib o'qitib, havo qarshiligi yoqilishidan oldin natijani taxmin qildiring.\n   3) 3-bo'limda har bir o'quvchi 5 ta o'lchov olib o'rtachani daftariga yozsin; kartochkalarni guruhlarda muhokama qildiring.\n   4) Dars oxirida \"Qayta boshlash\" tugmasi bilan navbatdagi guruhga sahifani tayyorlang. */\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Fizikani o'rganishda qanday ko'nikmalar kerak?", "icon": "🎯", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Fizika: o'rganish ko'nikmalari (7-sinf)\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --paper:#F2F7FF;--grid:#D9E7FB;--ink:#14213D;--soft:#465272;--card:#FFFFFF;--edge:#14213D;--shadow:#14213D;\n  --stage:#F8FBFF;--note:#E6F0FF;--sun:#FFC93C;--on-sun:#14213D;--sun-bg:#FFF3C4;\n  --ok:#17703F;--ok-bg:#D9F4E3;--bad:#B3202F;--bad-bg:#FDE1E4;--on-c:#FFFFFF;\n  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme:dark){\n  :root:not([data-theme=\"light\"]){\n    --paper:#0E1630;--grid:#1A2650;--ink:#EDF2FF;--soft:#B5C0E0;--card:#172248;--edge:#8DA2E0;--shadow:#050A1C;\n    --stage:#0B1228;--note:#1F2C5A;--sun-bg:#3B3210;--ok:#6EE0A0;--ok-bg:#12382A;--bad:#FF8C99;--bad-bg:#421A22;--on-c:#0E1630;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --paper:#0E1630;--grid:#1A2650;--ink:#EDF2FF;--soft:#B5C0E0;--card:#172248;--edge:#8DA2E0;--shadow:#050A1C;\n  --stage:#0B1228;--note:#1F2C5A;--sun-bg:#3B3210;--ok:#6EE0A0;--ok-bg:#12382A;--bad:#FF8C99;--bad-bg:#421A22;--on-c:#0E1630;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml{font-size:18px;-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 74px)}\nbody{margin:0;background-color:var(--paper);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:28px 28px;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;line-height:1.55}\nh1,h2,h3,h4{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.15;margin:0}\np{margin:.4em 0}\n.lesson,.tab{--c:var(--cl)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) .lesson,:root:not([data-theme=\"light\"]) .tab{--c:var(--cd)}}\n:root[data-theme=\"dark\"] .lesson,:root[data-theme=\"dark\"] .tab{--c:var(--cd)}\n.wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}\n\n/* hero */\n.hero{position:relative;padding:22px 0 12px}\n.hero h1{font-size:clamp(1.65rem,6vw,2.6rem);font-weight:800;padding-right:92px;max-width:18em}\n.hero-pend{position:absolute;right:0;top:14px;width:84px;height:auto}\n.hp{transform-origin:60px 8px;animation:sw 2s ease-in-out infinite alternate}\n@keyframes sw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}\n@media (prefers-reduced-motion:reduce){.hp{animation:none}}\n.goal{font-size:1.05rem;max-width:36em;margin-top:10px}\n.prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:800;flex-wrap:wrap}\n.pbar{display:flex;gap:5px}\n.pbar i{width:26px;height:12px;border:2.5px solid var(--edge);border-radius:6px;background:var(--card)}\n.pbar i.on{background:var(--sun)}\n\n/* tabs */\n.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 4px;\n  background:var(--paper);border-bottom:3px solid var(--edge);scrollbar-width:thin}\n.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:46px;padding:5px 14px 5px 6px;border:2.5px solid var(--edge);\n  border-radius:999px;background:var(--card);color:var(--ink);font:800 .9rem 'Nunito',sans-serif;cursor:pointer}\n.tab .tn{width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-size:.85rem}\n.tab[aria-current=\"true\"]{background:var(--c);color:var(--on-c);box-shadow:3px 3px 0 var(--shadow)}\n.tab[aria-current=\"true\"] .tn{background:var(--on-c);color:var(--c)}\n.tab.done::after{content:\"✓\";font-weight:800}\n\n/* lesson */\n.lesson{scroll-margin-top:74px}\n.lhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}\n.num{flex:0 0 auto;width:54px;height:54px;border-radius:14px;background:var(--c);color:var(--on-c);display:grid;place-items:center;\n  font:800 1.8rem 'Baloo 2',sans-serif;border:3px solid var(--edge);transform:rotate(-4deg)}\n.lhead h2{font-size:1.55rem;font-weight:800}\n.sub{font-size:.9rem;color:var(--soft);margin:2px 0 0}\n.card{background:var(--card);border:3px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);padding:16px;margin:16px 0}\n.card>h3{font-size:1.3rem;margin-bottom:8px;color:var(--c)}\n.card h4{font-size:1.05rem;margin:14px 0 6px}\n.life{border-style:dashed}\n.remember{background:var(--sun-bg);border:3px solid var(--edge);border-radius:20px;padding:14px 18px;margin:16px 0;color:var(--ink)}\n.remember h3{font-size:1.25rem;margin-bottom:4px}\n.remember ul{margin:6px 0 0;padding-left:1.2em}\n.remember li{margin:4px 0}\n.pager{display:flex;justify-content:space-between;gap:10px;margin:18px 0 6px;flex-wrap:wrap}\n\n/* controls */\n.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.btn{min-height:50px;padding:8px 18px;border:3px solid var(--edge);border-radius:999px;background:var(--sun);color:var(--on-sun);\n  font:800 1rem 'Nunito',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}\n.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}\n.btn.alt{background:var(--c);color:var(--on-c)}\n.btn.ghost{background:var(--card);color:var(--ink)}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n.chip{min-height:44px;padding:6px 14px;border:2.5px solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink);\n  font:800 .95rem 'Nunito',sans-serif;cursor:pointer}\n.chip.on,.chip[aria-pressed=\"true\"]{background:var(--c);color:var(--on-c)}\n.chip.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}\n.chip.no{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}\nbutton:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--c);outline-offset:3px}\ninput[type=text],input[type=number],select,textarea{min-height:46px;padding:8px 12px;border:2.5px solid var(--edge);border-radius:12px;\n  background:var(--card);color:var(--ink);font:700 1rem 'Nunito',sans-serif;max-width:100%}\ntextarea{width:100%;min-height:110px}\ninput[type=range]{width:100%;accent-color:var(--c);height:34px}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}\n.row input[type=text]{flex:1 1 180px}\n.lbl{font-weight:800;margin:12px 0 4px}\n.stage{border:3px solid var(--edge);border-radius:16px;background:var(--stage);overflow:hidden}\n.stage svg,.stage canvas{display:block;width:100%;height:auto}\n.say{margin:10px 0;padding:10px 14px;background:var(--note);border-left:6px solid var(--c);border-radius:8px}\n.read{font:800 1.3rem 'Baloo 2',sans-serif}\n.scroll{overflow-x:auto}\n.two{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}\n.two>*{flex:1 1 250px;min-width:0}\ntable.dt{width:100%;border-collapse:collapse;font-size:.95rem}\n.dt th,.dt td{border:2px solid var(--edge);padding:6px 8px;text-align:center}\n.dt th{background:var(--sun);color:var(--on-sun)}\n.msg{margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--note)}\n.msg.good{background:var(--ok-bg);color:var(--ok)}\n.msg.bad{background:var(--bad-bg);color:var(--bad)}\n\n/* quiz */\n.opt{display:block;width:100%;text-align:left;margin:8px 0;min-height:48px;padding:10px 14px;border:2.5px solid var(--edge);border-radius:14px;\n  background:var(--card);color:var(--ink);font:700 1rem 'Nunito',sans-serif;cursor:pointer}\n.opt input{width:20px;height:20px;margin:0 8px 0 0;vertical-align:middle;accent-color:var(--c)}\n.opt.sel{background:var(--note);border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}\n.opt.right{background:var(--ok-bg);border-color:var(--ok)}\n.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}\n.opt:disabled{cursor:default;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}\n.qt{font-weight:800;margin-top:14px}\n.why{margin:6px 0 12px;padding:8px 12px;border-radius:12px;font-size:.95rem}\n.why.good{background:var(--ok-bg);color:var(--ok)}\n.why.bad{background:var(--bad-bg);color:var(--bad)}\n.qscore{font:800 1.1rem 'Baloo 2',sans-serif;margin-top:10px}\n.stm{border:2.5px solid var(--edge);border-radius:14px;padding:8px 12px;margin:10px 0;background:var(--card)}\n.stm p{margin:2px 0}\n\n/* svg text */\n.svgt{fill:var(--ink);font:700 14px 'Nunito',sans-serif}\n.ct{fill:var(--soft);font:700 12px 'Nunito',sans-serif}\n.ct.b{fill:var(--ink)}\n.gl{stroke:var(--grid);stroke-width:1}\n.ax{stroke:var(--edge);stroke-width:2}\n.chart{max-width:520px;margin:0 auto}\n.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 12px;flex-wrap:wrap}\n.stepper li{flex:1 1 90px;text-align:center;padding:6px 4px;border:2.5px solid var(--edge);border-radius:10px;font-size:.85rem;font-weight:800;background:var(--card)}\n.stepper li.act{background:var(--c);color:var(--on-c)}\n.stepper li.dn{background:var(--ok-bg);color:var(--ok)}\n.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border:2.5px solid var(--edge);border-radius:12px;padding:8px 10px;margin:8px 0;background:var(--card)}\n.vrow.ok{background:var(--ok-bg);border-color:var(--ok)}\n.vrow.no{background:var(--bad-bg);border-color:var(--bad)}\n.vrow span.t{flex:1 1 180px}\n.locked{opacity:.4;pointer-events:none;filter:grayscale(.6)}\n.ring{display:block;margin:10px auto;width:150px;height:150px}\nfooter{margin:26px 0 10px;text-align:center;color:var(--soft);font-size:.85rem}\n@media (max-width:480px){html{font-size:17px}.card{padding:14px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader class=\"hero\">\n    \u003csvg class=\"hero-pend\" viewBox=\"0 0 120 130\" aria-hidden=\"true\">\n      \u003cline x1=\"20\" y1=\"8\" x2=\"100\" y2=\"8\" stroke=\"var(--edge)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n      \u003cg class=\"hp\">\u003cline x1=\"60\" y1=\"8\" x2=\"60\" y2=\"96\" stroke=\"var(--edge)\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"108\" r=\"16\" fill=\"#FFC93C\" stroke=\"var(--edge)\" stroke-width=\"3\"/>\u003c/g>\n    \u003c/svg>\n    \u003ch1>Fizika fanini o'rganishda qanday ko'nikmalarga ega bo'lish kerak?\u003c/h1>\n    \u003cp class=\"goal\">\u003cb>Dars maqsadi:\u003c/b> fizik olimlar kabi kuzatish, o'lchash, taxmin qilish va tajriba o'tkazishni o'z qo'ling bilan sinab ko'rasan. Har bir bandda o'zing bos, surib ko'r va tekshir!\u003c/p>\n    \u003cdiv class=\"prog\">\u003cspan>Bajarilgan bandlar:\u003c/span>\u003cb>\u003cspan id=\"progN\">0\u003c/span> / 7\u003c/b>\u003cdiv class=\"pbar\" id=\"progBar\" aria-hidden=\"true\">\u003c/div>\u003c/div>\n  \u003c/header>\n  \u003cnav class=\"tabs\" id=\"tabs\" aria-label=\"Dars bandlari\">\u003c/nav>\n  \u003cmain id=\"main\">\u003c/main>\n  \u003cfooter>7-sinf fizika: o'rganish ko'nikmalari\u003c/footer>\n\u003c/div>\n\n\u003cscript>\n(function(){\n'use strict';\n/* ---------- yordamchi funksiyalar ---------- */\nconst $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};\nfunction canvasSetup(cv,w,h){const d=Math.min(window.devicePixelRatio||1,2);cv.width=w*d;cv.height=h*d;const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return c}\nfunction loop(fn){let raf=0,last=0,run=false;\n  const tick=t=>{if(!run)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);if(run)raf=requestAnimationFrame(tick)};\n  return{start(){if(run)return;run=true;last=performance.now();raf=requestAnimationFrame(tick)},stop(){run=false;cancelAnimationFrame(raf)},get running(){return run}}}\nfunction tween(from,to,ms,cb,end){const t0=performance.now();const f=n=>{const p=Math.min(1,(n-t0)/ms);cb(from+(to-from)*(1-Math.pow(1-p,3)));if(p\u003c1)requestAnimationFrame(f);else if(end)end()};requestAnimationFrame(f)}\nconst pausers=[];\nconst done=new Set();\nfunction mark(i){done.add(i);const t=$(`.tab[data-i=\"${i}\"]`);if(t)t.classList.add('done');$('#progN').textContent=done.size;$$('#progBar i').forEach((x,k)=>x.classList.toggle('on',k\u003cdone.size))}\n\nfunction lineChart(o){\n  const w=o.w||360,h=o.h||250,ml=48,mr=16,mt=18,mb=46,pw=w-ml-mr,ph=h-mt-mb,ymin=o.ymin||0;\n  const X=v=>ml+pw*v/o.xmax,Y=v=>mt+ph*(1-(v-ymin)/(o.ymax-ymin));\n  let s=`\u003csvg viewBox=\"0 0 ${w} ${h}\" class=\"chart\" role=\"img\" aria-label=\"Grafik\">`;\n  for(let v=ymin;v\u003c=o.ymax;v+=o.ystep)s+=`\u003cline x1=\"${ml}\" x2=\"${w-mr}\" y1=\"${Y(v)}\" y2=\"${Y(v)}\" class=\"gl\"/>\u003ctext x=\"${ml-6}\" y=\"${Y(v)+4}\" text-anchor=\"end\" class=\"ct\">${v}\u003c/text>`;\n  for(let v=0;v\u003c=o.xmax;v+=1)s+=`\u003cline x1=\"${X(v)}\" x2=\"${X(v)}\" y1=\"${mt}\" y2=\"${mt+ph}\" class=\"gl\"/>\u003ctext x=\"${X(v)}\" y=\"${mt+ph+16}\" text-anchor=\"middle\" class=\"ct\">${v}\u003c/text>`;\n  s+=`\u003cline x1=\"${ml}\" x2=\"${ml}\" y1=\"${mt}\" y2=\"${mt+ph}\" class=\"ax\"/>\u003cline x1=\"${ml}\" x2=\"${w-mr}\" y1=\"${mt+ph}\" y2=\"${mt+ph}\" class=\"ax\"/>`;\n  s+=`\u003ctext x=\"${ml+pw/2}\" y=\"${h-6}\" text-anchor=\"middle\" class=\"ct b\">${o.xl}\u003c/text>\u003ctext transform=\"translate(12 ${mt+ph/2}) rotate(-90)\" text-anchor=\"middle\" class=\"ct b\">${o.yl}\u003c/text>`;\n  o.series.forEach(se=>{if(!se.pts.length)return;\n    s+=`\u003cpolyline fill=\"none\" style=\"stroke:${se.color}\" stroke-width=\"3.5\" stroke-linejoin=\"round\" points=\"${se.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}\"/>`;\n    se.pts.forEach(p=>{s+=`\u003ccircle cx=\"${X(p[0])}\" cy=\"${Y(p[1])}\" r=\"4.5\" style=\"fill:${se.color};stroke:var(--card)\" stroke-width=\"1.5\"/>`;\n      if(o.labels)s+=`\u003ctext x=\"${X(p[0])}\" y=\"${Y(p[1])-9}\" text-anchor=\"middle\" class=\"ct b\">${p[1]}\u003c/text>`})});\n  return s+'\u003c/svg>'}\n\nfunction quiz(mount,idx,items,silent){\n  const data=items.map(it=>({...it,opts:shuffle([{t:it.ok,c:1},...it.no.map(t=>({t,c:0}))])}));\n  mount.innerHTML=data.map((it,qi)=>`\u003cdiv class=\"q\" data-q=\"${qi}\">\u003cp class=\"qt\">${qi+1}. ${it.q}\u003c/p>\u003cdiv class=\"opts\">${it.opts.map((o,oi)=>`\u003cbutton type=\"button\" class=\"opt\" data-o=\"${oi}\">${o.t}\u003c/button>`).join('')}\u003c/div>\u003cp class=\"why\" hidden>\u003c/p>\u003c/div>`).join('')+`\u003cp class=\"qscore\" aria-live=\"polite\">\u003c/p>`;\n  let n=0,r=0;\n  mount.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const q=b.closest('.q');if(q.dataset.done)return;q.dataset.done=1;\n    const it=data[+q.dataset.q],o=it.opts[+b.dataset.o];\n    $$('.opt',q).forEach((x,k)=>{x.disabled=true;if(it.opts[k].c)x.classList.add('right')});\n    if(o.c)r++;else b.classList.add('wrong');\n    const w=$('.why',q);w.hidden=false;w.className='why '+(o.c?'good':'bad');w.textContent=(o.c?\"✔ To'g'ri! \":\"✘ Bu javob emas. \")+it.why;\n    n++;if(n===data.length){$('.qscore',mount).textContent=`Natija: ${r} / ${data.length}`;if(!silent)mark(idx)}}}\n\n/* ---------- dars ma'lumotlari ---------- */\nconst LESSONS=[\n{cl:'#0B7F8A',cd:'#4CD0DB',tab:'Kuzatish',title:\"Kuzatish ko'nikmasi\",sub:\"Fizik hodisalarni kuzatish; sezgi organlari va asboblar; natijalarni qayd etish\",\n explain:\"Kuzatish — hodisani ko'z, quloq, teri kabi sezgi organlari yoki asboblar yordamida diqqat bilan o'rganish. Fizik avval kuzatadi, keyin savol beradi. Sezgi organlari ba'zan adashadi: bir xil iliq suv birovga issiq, boshqasiga sovuq tuyulishi mumkin. Shuning uchun lupa, termometr, chizg'ich kabi asboblardan foydalanamiz. Ko'rganingni darhol yozib bor, chunki xotira aldashi mumkin.\",\n life:\"Onang qozondagi suv qaynayotganini ko'zi bilan (pufakchalar) va qulog'i bilan (shovqin) sezadi. Lekin suv aniq necha gradusligini faqat termometr aytadi.\",\n simTitle:\"Muz erishi va mayatnikni kuzat\",\n rem:[\"Kuzatish — sezgi organlari va asboblar yordamida ma'lumot to'plash.\",\"Yozuvda ko'rganingni yoz, taxminingni emas.\",\"Aniq son kerak bo'lsa, asbobdan foydalan.\"]},\n{cl:'#B85000',cd:'#FF9F4A',tab:'Muloqot',title:\"Muloqot qilish va axborotni ifodalash\",sub:\"Ma'lumotni tushunarli yetkazish; jadval, grafik, gistogramma, rasm; og'zaki va yozma tushuntirish\",\n explain:\"Fizikada topilgan natijani boshqalarga tushunarli yetkazish muhim. Ma'lumotni jadval, grafik, gistogramma yoki rasm ko'rinishida ko'rsatish mumkin. Jadval aniq sonlarni beradi, grafik o'zgarishni ko'rsatadi, gistogramma qiymatlarni solishtirishga yordam beradi, rasm esa tez tasavvur beradi. Tushuntirganda avval nima o'lchanganini, keyin nima o'zgarganini, oxirida xulosani ayt.\",\n life:\"Ob-havo dasturi kun bo'yi harorat o'zgarishini chiziq (grafik) bilan, hafta kunlarini esa ustunlar bilan ko'rsatadi. Ma'lumot bir xil, ko'rinishi esa turlicha.\",\n simTitle:\"Bir xil ma'lumot, to'rt xil ko'rinish\",\n rem:[\"Bitta ma'lumotni jadval, grafik, gistogramma va rasm bilan ko'rsatish mumkin.\",\"Tushuntirish tartibi: nima o'lchandi, qanday o'zgardi, xulosa.\",\"Sonlar yoniga birlikni (°C, s, g) yozishni unutma.\"]},\n{cl:'#6B3FE0',cd:'#A58BFF',tab:'Xulosa',title:\"Xulosa chiqarish ko'nikmasi\",sub:\"Kuzatish va tajriba natijalarini tahlil qilish; mantiqiy xulosa; turlicha xulosalar\",\n explain:\"Xulosa chiqarish — kuzatish va tajriba natijalariga tayanib mantiqiy fikr aytish. Yaxshi xulosa faqat kuzatilgan faktlardan kelib chiqadi. Bitta kuzatuvdan «hamma jismlar shunday» deb umumlashtirish xato bo'lishi mumkin. Ba'zan bir hodisadan bir nechta to'g'ri taxmin chiqadi, ularni tekshirish uchun yangi tajriba kerak bo'ladi.\",\n life:\"Ko'chada yer ho'l ekanini ko'rib, «yomg'ir yog'gan» deysan. Lekin ko'chani suv mashinasi ham yuvgan bo'lishi mumkin. To'g'ri xulosa uchun yana dalil kerak.\",\n simTitle:\"Jismni suvga tashla va xulosalarni baholа\",\n rem:[\"Xulosa kuzatilgan faktlarga tayanadi.\",\"Bitta kuzatuvdan hamma narsa haqida xulosa chiqarma.\",\"Bir hodisadan bir nechta xulosa chiqishi mumkin, ularni tajriba bilan tekshiramiz.\"]},\n{cl:'#D62839',cd:'#FF7B87',tab:'Gipoteza',title:\"Gipoteza ilgari surish va tekshirish\",sub:\"Gipoteza taklif qilish; tajriba bilan tekshirish; qabul qilish yoki yangi gipoteza\",\n explain:\"Gipoteza — hodisa haqida tekshirib ko'riladigan taxmin. U «agar ... bo'lsa, ... bo'ladi» ko'rinishida aytiladi. Gipotezani faqat tajriba tekshiradi. Natija mos kelsa gipoteza qabul qilinadi, mos kelmasa rad etilib, yangisi ilgari suriladi. Gipotezaning rad etilishi xato emas, yangi bilimdir!\",\n life:\"Qorong'i xonada chiroq yonmadi. Gipoteza: «lampochka kuygan». Boshqa lampochka o'rnatib tekshirasan: yana yonmadi. Demak, boshqa sabab bor (masalan, elektr o'chgan).\",\n simTitle:\"Mayatnik laboratoriyasi\",\n rem:[\"Gipoteza — tekshiriladigan taxmin.\",\"Tajriba gipotezani tasdiqlaydi yoki rad etadi.\",\"Rad etilgan gipoteza o'rniga yangisini ilgari surish — ilmiy usul.\"]},\n{cl:'#2456D6',cd:'#7FA6FF',tab:'Rejalashtirish',title:\"Tadqiqotni rejalashtirish ko'nikmasi\",sub:\"Muammo va maqsad; o'zgaruvchilar; usullar; jihozlar; bosqichlar\",\n explain:\"Tadqiqotni rejalashtirish — tajribani boshlashdan oldin nima qilishni o'ylab chiqish. Avval muammo va maqsad aniqlanadi. Keyin o'zgaruvchilar belgilanadi: nimani o'zgartiramiz, nimani o'zgarmas tutamiz, nimani o'lchaymiz. So'ng asboblar tanlanib, tajriba bosqichlari tartibga solinadi.\",\n life:\"Non yopishdan oldin un, suv va xamirturush miqdorini aniqlab, ishni tartib bilan boshlaysan. Aks holda natija har safar boshqacha chiqadi.\",\n simTitle:\"Tajriba rejasini tuz\",\n rem:[\"Reja: maqsad, o'zgaruvchilar, asboblar, bosqichlar.\",\"Adolatli tajribada faqat bitta kattalik o'zgaradi, qolganlari o'zgarmas.\",\"Yaxshi reja tajribani takrorlash imkonini beradi.\"]},\n{cl:'#1E8449',cd:'#5FD69A',tab:\"O'lchash\",title:\"O'lchash va asboblardan foydalanish\",sub:\"Termometr, sekundomer, tarozi; to'g'ri o'lchash; jadval va grafik\",\n explain:\"Termometr haroratni (°C), sekundomer vaqtni (s), tarozi massani (g) o'lchaydi. To'g'ri o'lchash uchun avval bo'linma qiymatini aniqla: shkalaning bir bo'lagi nechaga ten
