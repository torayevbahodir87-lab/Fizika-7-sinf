.elementFromPoint(ev.clientX,ev.clientY);\n    e.style.pointerEvents=\"\";e.style.transform=\"\";\n    if(moved&&t&&t.closest(\".tool\"))place(i,t.closest(\".tool\").dataset.k);\n    else if(!moved){sel=(sel===i)?null:i;document.querySelectorAll(\".item\").forEach(n=>n.classList.toggle(\"sel\",+n.dataset.i===sel));\n      $(\"gm\").textContent=sel===null?\"\":\"Endi mos asbobni bos 👆\"}\n  };\n});\nfunction place(i,k){\n  const it=I[i],m=$(\"gm\"),el=document.querySelector('.item[data-i=\"'+i+'\"]');\n  sel=null;document.querySelectorAll(\".item\").forEach(n=>n.classList.remove(\"sel\"));\n  if(it[1]===k){\n    m.innerHTML='\u003cspan class=\"good\">✅ Toʻgʻri! '+it[0]+\" — \"+T[k][0]+\" bilan.\u003c/span>\";\n    el.remove();const t=document.querySelector('.tool[data-k=\"'+k+'\"]');\n    t.classList.add(\"hit\");t.querySelector(\".pl\").textContent=it[0];\n    if(++done===I.length)m.innerHTML='\u003cspan class=\"good\">🏆 Barakalla! Hammasini topding!\u003c/span>';\n  }else m.innerHTML='\u003cspan class=\"soft\">💡 '+it[2]+\" Yana urinib koʻr!\u003c/span>\";\n}\n/* virtual chizgʻich */\nlet L=0;\n(function(){ // boʻlinmalar chizish: 0..16 sm\n  const r=$(\"rl\");\n  for(let i=0;i\u003c=16;i++){\n    const t=document.createElement(\"div\");t.className=\"t\";t.style.left=\"calc(\"+(i/16*100)+\"% - 1px)\";t.style.height=i%5?\"22px\":\"34px\";r.appendChild(t);\n    const n=document.createElement(\"div\");n.className=\"n\";n.style.left=(i/16*100)+\"%\";n.style.marginLeft=i?\"0\":\"8px\";n.textContent=i;r.appendChild(n)}\n  const o=document.createElement(\"div\");o.className=\"obj\";o.id=\"ob\";r.appendChild(o);\n})();\nfunction newRuler(){L=3+Math.floor(Math.random()*12);$(\"ob\").style.width=(L/16*100)+\"%\";$(\"ans\").value=\"\";$(\"rm\").textContent=\"\"}\n$(\"chk\").onclick=()=>{\n  const v=+$(\"ans\").value;if(!$(\"ans\").value)return;\n  $(\"rm\").innerHTML=v===L?'\u003cspan class=\"good\">⭐ Toʻgʻri! '+L+' sm\u003c/span>':'\u003cspan class=\"soft\">Yana qara: buyumning oxiri qaysi raqamga toʻgʻri keladi?\u003c/span>'};\n$(\"nx\").onclick=newRuler;newRuler();\n\n/* ===== 3-boʻlim ===== */\n[[\"1 sm = 10 mm\",\"mm\"],[\"1 dm = 10 sm\",\"sm\"],[\"1 m = 100 sm (10 dm)\",\"dm\"],[\"1 km = 1000 m\",\"100 m\"]].forEach(([t,p])=>{\n  const h=document.createElement(\"div\");h.innerHTML=\"\u003cb>\"+t+\"\u003c/b>\u003cdiv class='join'>\"+\"\u003cspan>\u003c/span>\".repeat(10)+\"\u003c/div>\";$(\"joins\").appendChild(h)});\n$(\"jb\").onclick=()=>{\n  const g=document.querySelectorAll(\".join\"),on=!g[0].classList.contains(\"go\");\n  g.forEach((j,i)=>setTimeout(()=>j.classList.toggle(\"go\",on),i*300));\n  $(\"jb\").textContent=on?\"↔ Ajratish\":\"🧲 Yigʻish\"};\n/* oʻzgartirgich */\nconst F=[1,10,100,1000,1e6],UN=[\"mm\",\"sm\",\"dm\",\"m\",\"km\"];\nlet shown=[0,0,0,0,0];\nfunction conv(){\n  const v=+$(\"cn\").value||0,u=+$(\"cu\").value,mm=v*F[u];\n  $(\"cv\").innerHTML=UN.map((n,i)=>\"\u003cdiv>\u003cspan>\"+n+\"\u003c/span>\u003cspan id='c\"+i+\"'>\"+shown[i]+\"\u003c/span>\u003c/div>\").join(\"\");\n  const t0=performance.now(),from=shown.slice(),to=F.map(f=>mm/f);\n  (function step(t){\n    const p=Math.min((t-t0)/500,1);\n    to.forEach((x,i)=>{shown[i]=+(from[i]+(x-from[i])*p).toFixed(6);const e=$(\"c\"+i);if(e)e.textContent=p\u003c1?shown[i]:+x.toFixed(6)});\n    if(p\u003c1)requestAnimationFrame(step);\n  })(t0);\n}\n$(\"cn\").oninput=$(\"cu\").onchange=conv;conv();\n/* mini-test: 8 mashq, oddiydan murakkabga */\nconst Q=[[\"3 m = ? sm\",300],[\"40 mm = ? sm\",4],[\"5 dm = ? sm\",50],[\"2 sm = ? mm\",20],[\"400 sm = ? m\",4],[\"3 km = ? m\",3000],[\"2000 m = ? km\",2],[\"2 m 30 sm = ? sm\",230]];\nlet qi=0,sc=0;\nfunction stars(){$(\"st\").textContent=\"⭐\".repeat(sc)+\"☆\".repeat(Q.length-sc)}\nfunction ask(){\n  stars();\n  if(qi>=Q.length){$(\"qz\").innerHTML=\"\u003ch3>Natija: \"+sc+\" / \"+Q.length+\" ball \"+(sc>6?\"🏆\":sc>3?\"👍\":\"💪\")+\"\u003c/h3>\u003cbutton class='warm' id='ag'>Qaytadan\u003c/button>\";\n    $(\"ag\").onclick=()=>{qi=0;sc=0;ask()};return}\n  $(\"qz\").innerHTML=\"\u003ch3>\"+(qi+1)+\"/\"+Q.length+\": \"+Q[qi][0]+\"\u003c/h3>\u003cdiv class='row'>\u003cinput type='number' id='qa' inputmode='numeric'>\u003cbutton class='alt' id='qb'>Tekshirish\u003c/button>\u003c/div>\u003cdiv class='msg' id='qm'>\u003c/div>\";\n  $(\"qb\").onclick=()=>{\n    if(!$(\"qa\").value)return;\n    const ok=+$(\"qa\").value===Q[qi][1];\n    if(ok)sc++;\n    $(\"qm\").innerHTML=ok?'\u003cspan class=\"good\">⭐ Toʻgʻri!\u003c/span>':'\u003cspan class=\"soft\">Toʻgʻri javob: '+Q[qi][1]+'\u003c/span>';\n    stars();$(\"qb\").disabled=true;qi++;setTimeout(ask,1300)};\n}\nask();show(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Yuzani qanday o'lchaymiz?", "icon": "🟦", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Yuzani qanday o'lchaymiz?\u003c/title>\n\u003cstyle>\n/* ===== Ranglar (rejalashtirilgan palitra) ===== */\n:root{--bg:#fff8e7;--card:#fff;--ink:#1d2b53;--blue:#2d6cdf;--green:#1f9d55;--orange:#f08a00;--pink:#e0447c;--cell:#ffd23f;--line:#1d2b53;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121a33;--card:#1c2748;--ink:#fff6d6;--blue:#6ea0ff;--green:#4fd18b;--orange:#ffb23d;--pink:#ff7fae;--line:#fff6d6}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:20px/1.5 \"Trebuchet MS\",\"Segoe UI\",Arial,sans-serif}\nheader{padding:16px;text-align:center}\nh1{font-size:1.7rem;margin:0}\nh2{font-size:1.35rem;margin:.2em 0 .5em}\nnav{display:flex;gap:8px;padding:0 12px;flex-wrap:wrap;justify-content:center}\nnav button{flex:1 1 140px}\nmain{max-width:760px;margin:0 auto;padding:12px}\nsection{display:none;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;margin-bottom:24px}\nsection.on{display:block}\nbutton,select,input{font:inherit;color:var(--ink)}\nbutton{min-height:54px;padding:8px 18px;border:3px solid var(--line);border-radius:16px;background:var(--cell);font-weight:700;cursor:pointer}\nbutton:active{transform:scale(.96)}\nbutton.tab{background:var(--card)}\nbutton.tab.on{background:var(--blue);color:#fff}\nbutton.go{background:var(--green);color:#fff}\nbutton.re{background:var(--card)}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--orange);outline-offset:2px}\n.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}\nlabel{display:block;font-weight:700}\ninput[type=range]{width:100%;height:36px;accent-color:var(--blue)}\ninput[type=number],select{min-height:54px;border:3px solid var(--line);border-radius:14px;padding:4px 12px;background:var(--card);width:100%}\n.box{background:rgba(45,108,223,.12);border-radius:14px;padding:10px 14px;margin:10px 0}\n.big{font-size:1.5rem;font-weight:800;color:var(--pink)}\n.hid{opacity:0;transform:translateY(8px);transition:.5s}\n.hid.show{opacity:1;transform:none}\n/* Katakli maydon */\n.grid{display:grid;margin:12px auto;border:3px solid var(--line);background:var(--card)}\n.grid i{aspect-ratio:1;border:1px solid var(--line);background:var(--card);transition:background .15s}\n.grid i.f{background:var(--cell)}\nsvg{width:100%;max-width:420px;display:block;margin:auto}\n/* Zoom */\n.zoomwrap{width:min(100%,360px);aspect-ratio:1;margin:12px auto;border:4px solid var(--pink);overflow:hidden;background:var(--card)}\n#zg{display:grid;grid-template-columns:repeat(10,1fr);width:100%;height:100%;transform-origin:center;transition:transform 1s ease}\n#zg i{border:1px solid var(--blue);background:var(--cell);opacity:0}\n#zg.in i{animation:pop .4s forwards}\n@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.cards div{border:3px solid var(--line);border-radius:14px;padding:10px;font-size:1rem}\ntable{width:100%;border-collapse:collapse;font-size:1rem}\ntd,th{border:2px solid var(--line);padding:8px;text-align:center}\nth{background:var(--cell)}\n.ok{background:var(--green)!important;color:#fff;animation:jump .5s}\n.bad{background:var(--pink)!important;color:#fff;animation:shake .4s}\n@keyframes jump{50%{transform:scale(1.12)}}\n@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}\n.opts{display:grid;gap:10px}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>📐 Yuzani qanday o'lchaymiz?\u003c/h1>\u003cdiv>Birgalikda o'rganamiz. Sen eplaysan! 💪\u003c/div>\u003c/header>\n\u003cnav>\n\u003cbutton class=\"tab on\" data-t=\"s1\">1. To'rtburchak\u003c/button>\n\u003cbutton class=\"tab\" data-t=\"s2\">2. Uchburchak\u003c/button>\n\u003cbutton class=\"tab\" data-t=\"s3\">3. Birliklar\u003c/button>\n\u003c/nav>\n\u003cmain>\n\n\u003c!-- ===== 1-BO'LIM ===== -->\n\u003csection id=\"s1\" class=\"on\">\n\u003ch2>To'g'ri to'rtburchak va kvadrat\u003c/h2>\n\u003cdiv>Har bir katak — \u003cb>1 sm²\u003c/b>. Yuza — kataklar soni.\u003c/div>\n\u003clabel>Uzunlik (ustunlar): \u003cspan id=\"Lv\">5\u003c/span> sm\u003c/label>\n\u003cinput type=\"range\" id=\"L\" min=\"1\" max=\"12\" value=\"5\">\n\u003clabel>Kenglik (qatorlar): \u003cspan id=\"Wv\">3\u003c/span> sm\u003c/label>\n\u003cinput type=\"range\" id=\"W\" min=\"1\" max=\"12\" value=\"3\">\n\u003cdiv class=\"row\">\n\u003cbutton class=\"go\" id=\"start1\">▶ Boshlash\u003c/button>\n\u003cbutton id=\"sqBtn\">⬛ Kvadrat rejimi: o'chiq\u003c/button>\n\u003cbutton class=\"re\" id=\"re1\">↺ Qayta boshlash\u003c/button>\n\u003c/div>\n\u003cdiv id=\"g1\" class=\"grid\">\u003c/div>\n\u003cdiv class=\"box\">To'lgan kataklar: \u003cspan class=\"big\" id=\"cnt\">0\u003c/span> sm²\u003c/div>\n\u003cdiv class=\"box\" id=\"f1\">\u003c/div>\n\u003ch2>🎯 Sinab ko'r!\u003c/h2>\n\u003cdiv id=\"q1t\">\u003c/div>\n\u003cdiv class=\"row\">\u003cinput type=\"number\" id=\"a1\" placeholder=\"Javob (sm²)\" style=\"max-width:200px\">\u003cbutton class=\"go\" id=\"c1\">Tekshir\u003c/button>\u003cbutton id=\"n1\">Yangi savol\u003c/button>\u003c/div>\n\u003cdiv id=\"r1\" class=\"big\">\u003c/div>\n\u003c/section>\n\n\u003c!-- ===== 2-BO'LIM ===== -->\n\u003csection id=\"s2\">\n\u003ch2>Uchburchak yuzasi\u003c/h2>\n\u003clabel>Uzunlik a: \u003cspan id=\"av\">8\u003c/span> sm\u003c/label>\n\u003cinput type=\"range\" id=\"A\" min=\"2\" max=\"12\" value=\"8\">\n\u003clabel>Kenglik b: \u003cspan id=\"bv\">5\u003c/span> sm\u003c/label>\n\u003cinput type=\"range\" id=\"B\" min=\"2\" max=\"12\" value=\"5\">\n\u003csvg id=\"svg\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"To'g'ri to'rtburchak va uchburchaklar\">\n\u003cpolygon id=\"t1\" fill=\"#f08a00\" stroke=\"#1d2b53\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n\u003cpolygon id=\"t2\" fill=\"#2d6cdf\" fill-opacity=\".85\" stroke=\"#1d2b53\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n\u003cline id=\"dg\" stroke=\"#e0447c\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n\u003c/svg>\n\u003cdiv class=\"row\">\n\u003cbutton class=\"go\" id=\"cut\">✂️ Diagonal bo'yicha kes\u003c/button>\n\u003cbutton class=\"go\" id=\"rot\" disabled>🔄 Aylantir va qo'y\u003c/button>\n\u003cbutton class=\"re\" id=\"re2\">↺ Qayta boshlash\u003c/button>\n\u003c/div>\n\u003cdiv class=\"box\" id=\"m2\">To'g'ri to'rtburchak yuzasi: a × b. Diagonal bo'yicha kesib ko'ramizmi?\u003c/div>\n\u003cdiv class=\"box hid\" id=\"x2\">\u003c/div>\n\u003ch2>🎯 Mustaqil mashq\u003c/h2>\n\u003cdiv id=\"q2t\">\u003c/div>\n\u003cdiv class=\"row\">\u003cinput type=\"number\" id=\"a2\" placeholder=\"Javob (sm²)\" style=\"max-width:200px\">\u003cbutton class=\"go\" id=\"c2\">Tekshir\u003c/button>\u003cbutton id=\"n2\">Yangi savol\u003c/button>\u003c/div>\n\u003cdiv id=\"r2\" class=\"big\">\u003c/div>\n\u003c/section>\n\n\u003c!-- ===== 3-BO'LIM ===== -->\n\u003csection id=\"s3\">\n\u003ch2>Yuza birliklari\u003c/h2>\n\u003cdiv class=\"row\">\n\u003cbutton id=\"u0\">sm² → mm²\u003c/button>\u003cbutton id=\"u1\">dm² → sm²\u003c/button>\u003cbutton id=\"u2\">m² → dm²\u003c/button>\n\u003c/div>\n\u003cdiv class=\"box\" id=\"zt\">\u003c/div>\n\u003cdiv class=\"zoomwrap\">\u003cdiv id=\"zg\">\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"go\" id=\"zoom\">🔍 Kattalashtir\u003c/button>\u003cbutton class=\"re\" id=\"re3\">↺ Qayta boshlash\u003c/button>\u003c/div>\n\u003ch2>Hayotdan misollar\u003c/h2>\n\u003cdiv class=\"cards\">\n\u003cdiv>🔹 \u003cb>mm²\u003c/b>\u003cbr>Qalam uchining izi\u003c/div>\n\u003cdiv>💅 \u003cb>sm²\u003c/b>\u003cbr>Tirnog'ing taxminan 1 sm²\u003c/div>\n\u003cdiv>📓 \u003cb>dm²\u003c/b>\u003cbr>Daftar varag'i taxminan 3 dm²\u003c/div>\n\u003cdiv>🪑 \u003cb>m²\u003c/b>\u003cbr>Stol usti taxminan 1 m². Sinf polini m² da o'lchaymiz!\u003c/div>\n\u003c/div>\n\u003ch2>Konvertor\u003c/h2>\n\u003cdiv class=\"row\">\n\u003cinput type=\"number\" id=\"cv\" value=\"1\" min=\"0\">\n\u003cselect id=\"cf\">\u003coption value=\"0\">mm²\u003c/option>\u003coption value=\"1\" selected>sm²\u003c/option>\u003coption value=\"2\">dm²\u003c/option>\u003coption value=\"3\">m²\u003c/option>\u003c/select>\n\u003cselect id=\"ct\">\u003coption value=\"0\" selected>mm²\u003c/option>\u003coption value=\"1\">sm²\u003c/option>\u003coption value=\"2\">dm²\u003c/option>\u003coption value=\"3\">m²\u003c/option>\u003c/select>\n\u003c/div>\n\u003cdiv class=\"box big\" id=\"cr\">\u003c/div>\n\u003ctable>\u003ctr>\u003cth>Birlik\u003c/th>\u003cth>Nechta kichik birlik\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>1 sm²\u003c/td>\u003ctd>100 mm²\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 dm²\u003c/td>\u003ctd>100 sm²\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1 m²\u003c/td>\u003ctd>100 dm²\u003c/td>\u003c/tr>\u003c/table>\n\u003ch2>📝 Mini-test\u003c/h2>\n\u003cdiv id=\"qz\">\u003c/div>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\n/* ===== Yordamchi funksiyalar ===== */\nconst $=id=>document.getElementById(id);\nconst rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\n\n/* Tablar */\ndocument.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));\n  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));\n});\n\n/* Raqam javobini tekshirish (umumiy) */\nfunction check(inp,out,ans){\n  const v=Number($(inp).value);\n  const ok=$(inp).value!==''&&v===ans;\n  $(out).textContent=ok?'🎉 Barakalla! To\\'g\\'ri!':'🤔 Yana urinib ko\\'r!';\n  $(out).style.color=ok?'var(--green)':'var(--pink)';\n}\n\n/* ===== 1-BO'LIM ===== */\nlet L=5,W=3,sq=false,timer=null,q1;\nfunction build1(){\n  clearInterval(timer);\n  const g=$('g1');\n  g.style.gridTemplateColumns=`repeat(${L},1fr)`;\n  g.style.width=`min(100%,${L*44}px)`;\n  g.innerHTML='\u003ci>\u003c/i>'.repeat(L*W);\n  $('cnt').textContent=0;\n  $('f1').innerHTML=`1-qadam: qatorlar soni = \u003cb>${W}\u003c/b>\u003cbr>2-qadam: ustunlar soni = \u003cb>${L}\u003c/b>`;\n}\nfunction setLW(l,w){L=l;W=w;$('L').value=l;$('W').value=w;$('Lv').textContent=l;$('Wv').textContent=w;build1();}\n$('L').oninput=e=>setLW(+e.target.value,sq?+e.target.value:W);\n$('W').oninput=e=>setLW(sq?+e.target.value:L,+e.target.value);\n$('sqBtn').onclick=()=>{sq=!sq;$('sqBtn').textContent='⬛ Kvadrat rejimi: '+(sq?'yoqiq':'o\\'chiq');if(sq)setLW(L,L);};\n$('start1').onclick=()=>{\n  build1();\n  const cells=$('g1').children;let i=0;\n  timer=setInterval(()=>{\n    if(i>=cells.length){clearInterval(timer);\n      $('f1').innerHTML+=sq?`\u003cbr>Kvadrat: tomonlar teng. \u003cspan class=\"big\">S = a × a = ${L} × ${L} = ${L*L} sm²\u003c/span>`\n        :`\u003cbr>3-qadam: \u003cspan class=\"big\">S = ${W} × ${L} = ${L*W} sm²\u003c/span>`;return;}\n    cells[i].classList.add('f');i++;$('cnt').textContent=i;\n  },Math.max(40,600/L));\n};\n$('re1').onclick=()=>{setLW(5,3);sq=false;$('sqBtn').textContent='⬛ Kvadrat rejimi: o\\'chiq';};\nfunction newQ1(){q1=[rnd(2,9),rnd(2,9)];$('q1t').textContent=`Shakl uzunligi ${q1[0]} sm, kengligi ${q1[1]} sm. Yuzasi necha sm²?`;$('a1').value='';$('r1').textContent='';}\n$('c1').onclick=()=>check('a1','r1',q1[0]*q1[1]);$('n1').onclick=newQ1;\n\n/* ===== 2-BO'LIM ===== */\nconst U=20,P=10;let a=8,b=5,stage=0,q2;\nconst pts=(arr)=>arr.map(p=>p.join(',')).join(' ');\nfunction anim(ms,fn,done){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);fn(k);k\u003c1?requestAnimationFrame(f):done&&done();})(t0);}\nfunction draw2(){\n  stage=0;const w=a*U,h=b*U;\n  // t1: yuqori o'ng, t2: pastki chap\n  $('t1').setAttribute('points',pts([[P,P],[P+w,P],[P+w,P+h]]));\n  $('t2').setAttribute('points',pts([[P,P],[P,P+h],[P+w,P+h]]));\n  $('t1').setAttribute('fill-opacity','.25');$('t2').setAttribute('fill-opacity','.25');\n  $('t1').removeAttribute('transform');$('t2').removeAttribute('transform');\n  $('t1').setAttribute('fill','#ffd23f');$('t2').setAttribute('fill','#ffd23f');\n  const d=$('dg');d.setAttribute('x1',P);d.setAttribute('y1',P);d.setAttribute('x2',P+w);d.setAttribute('y2',P+h);d.style.opacity=0;\n  $('rot').disabled=true;$('cut').disabled=false;\n  $('av').textContent=a;$('bv').textContent=b;\n  $('m2').textContent=`To'g'ri to'rtburchak: ${a} × ${b} = ${a*b} sm². Diagonal bo'yicha kesamiz!`;\n  $('x2').classList.remove('show');\n}\n$('A').oninput=e=>{a=+e.target.value;draw2();};\n$('B').oninput=e=>{b=+e.target.value;draw2();};\n$('cut').onclick=()=>{\n  $('cut').disabled=true;const d=$('dg'),w=a*U,h=b*U,len=Math.hypot(w,h);\n  d.style.opacity=1;d.style.strokeDasharray=len;\n  anim(900,k=>d.style.strokeDashoffset=len*(1-k),()=>{\n    $('t1').setAttribute('fill','#f08a00');$('t2').setAttribute('fill','#2d6cdf');\n    $('t1').setAttribute('fill-opacity','.9');$('t2').setAttribute('fill-opacity','.9');\n    anim(500,k=>{$('t1').setAttribute('transform',`translate(${6*k} ${-6*k})`);$('t2').setAttribute('transform',`translate(${-6*k} ${6*k})`);},\n    ()=>{stage=1;$('rot').disabled=false;$('m2').textContent='Ikkita uchburchak bo\\'ldi. Ular bir xilmi? Aylantirib ko\\'ramiz!';});\n  });\n};\n$('rot').onclick=()=>{\n  $('rot').disabled=true;const cx=P+a*U/2,cy=P+b*U/2;\n  anim(1600,k=>{\n    const e=k*k*(3-2*k);\n    $('t1').setAttribute('transform',`translate(${6*(1-e)} ${-6*(1-e)})`);\n    $('t2').setAttribute('transform',`translate(${-6*(1-e)} ${6*(1-e)}) rotate(${180*e} ${cx} ${cy})`);\n  },()=>{\n    $('t2').setAttribute('fill-opacity','.55');\n    $('m2').textContent='Ikkinchi uchburchak birinchisining ustiga to\\'liq tushdi. Ular teng! ✅';\n    const x=$('x2');x.innerHTML=`Bitta uchburchak = to'rtburchakning yarmi.\u003cbr>\u003cspan class=\"big\">S = (a × b) : 2\u003c/span>\u003cbr>Misol: (${a} × ${b}) : 2 = ${a*b} : 2 = \u003cb>${a*b/2} sm²\u003c/b>`;\n    x.classList.add('show');\n  });\n};\n$('re2').onclick=()=>{a=8;b=5;$('A').value=8;$('B').value=5;draw2();};\nfunction newQ2(){q2=[rnd(2,12),2*rnd(1,6)];$('q2t').textContent=`To'g'ri burchakli uchburchakning tomonlari ${q2[0]} sm va ${q2[1]} sm. Yuzasi necha sm²?`;$('a2').value='';$('r2').textContent='';}\n$('c2').onclick=()=>check('a2','r2',q2[0]*q2[1]/2);$('n2').onclick=newQ2;\n\n/* ===== 3-BO'LIM ===== */\nconst lv=[['1 sm²','mm²'],['1 dm²','sm²'],['1 m²','dm²']];let cur=0;\nfunction z(i){\n  cur=i;const g=$('zg');g.classList.remove('in');g.innerHTML='\u003ci>\u003c/i>'.repeat(100);\n  g.style.transition='none';g.style.transform='scale(.12)';\n  $('zt').innerHTML=`Kvadrat: \u003cb>${lv[i][0]}\u003c/b>. Uni 10 × 10 bo'laklarga bo'lamiz. Har bir bo'lak — \u003cb>1 ${lv[i][1]}\u003c/b>.`;\n}\nfor(let i=0;i\u003c3;i++)$('u'+i).onclick=()=>z(i);\n$('zoom').onclick=()=>{\n  z(cur);const g=$('zg');void g.offsetWidth;\n  g.style.transition='transform 1s ease';g.style.transform='scale(1)';\n  [...g.children].forEach((c,k)=>c.style.animationDelay=(1+k*0.015)+'s');\n  g.classList.add('in');\n  setTimeout(()=>$('zt').innerHTML=`${lv[cur][0]} = 10 × 10 = \u003cspan class=\"big\">100 ${lv[cur][1]}\u003c/span>`,2600);\n};\n$('re3').onclick=()=>z(0);\n/* Konvertor (hammasi mm² orqali) */\nconst F=[1,100,10000,1000000];\nfunction conv(){const v=+$('cv').value||0;let r=v*F[$('cf').value]/F[$('ct').value];\n  r=Math.round(r*1e6)/1e6;$('cr').textContent=`${v} ${$('cf').selectedOptions[0].text} = ${r} ${$('ct').selectedOptions[0].text}`;}\n['cv','cf','ct'].forEach(i=>$(i).oninput=conv);\n/* Mini-test */\nconst Q=[\n ['1 sm² da necha mm² bor?',['10','100','1000'],1],\n ['4 dm² necha sm² bo\\'ladi?',['40','400','4000'],1],\n ['5 sm × 4 sm to\\'rtburchakning yuzasi?',['9 sm²','20 sm²','18 sm²'],1],\n ['6 sm × 4 sm to\\'rtburchakni diagonal bo\\'yicha kestik. Bitta uchburchak yuzasi?',['12 sm²','24 sm²','10 sm²'],0],\n ['Sinf polining yuzasini qaysi birlikda o\\'lchaymiz?',['mm²','sm²','m²'],2]];\nlet qi=0,sc=0;\nfunction showQ(){\n  const box=$('qz');\n  if(qi>=Q.length){box.innerHTML=`\u003cdiv class=\"big\">Natija: ${sc} / ${Q.length} ${'⭐'.repeat(sc)}\u003c/div>\u003cbutton class=\"go\" id=\"again\">↺ Qayta boshlash\u003c/button>`;\n    $('again').onclick=()=>{qi=0;sc=0;showQ();};return;}\n  const q=Q[qi];\n  box.innerHTML=`\u003cdiv>Savol ${qi+1}/${Q.length}: \u003cb>${q[0]}\u003c/b>\u003c/div>\u003cdiv class=\"opts\">\u003c/div>\u003cdiv id=\"fb\" class=\"big\">\u003c/div>`;\n  const o=box.querySelector('.opts');\n  q[1].forEach((t,i)=>{const bt=document.createElement('button');bt.textContent=t;\n    bt.onclick=()=>{\n      o.querySelectorAll('button').forEach(x=>x.disabled=true);\n      if(i===q[2]){bt.classList.add('ok');sc++;$('fb').textContent='🎉 To\\'g\\'ri!';}\n      else{bt.classList.add('bad');o.children[q[2]].classList.add('ok');$('fb').textContent='😊 Hechqisi yo\\'q! To\\'g\\'ri javob yashil.';}\n      const nx=document.createElement('button');nx.className='go';nx.textContent=qi===Q.length-1?'Natijani ko\\'r':'Keyingisi';\n      nx.onclick=()=>{qi++;showQ();};box.appendChild(nx);};\n    o.appendChild(bt);});\n}\n\n/* Boshlash */\nbuild1();newQ1();draw2();newQ2();z(0);conv();showQ();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Tana qismlarining o'lchami va bo'yga bog'liqligi", "icon": "🧍", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Tana qismlarining o'lchami va bo'yga bog'liqligi\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n--bg:#f3f8fb;--card:#fff;--tx:#1d2b36;--mut:#587083;--pri:#2f7fc1;--line:#d5e2ec;--foot:#e8833a;--palm:#2fa56a;--arm:#3b82c4;--body:#9fc3d8;--bad:#d9534f}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#13202a;--card:#1c2e3b;--tx:#e8f1f7;--mut:#9db6c7;--pri:#5aa7e6;--line:#34495a;--body:#4f7a94}}\n:root[data-theme=\"dark\"]{--bg:#13202a;--card:#1c2e3b;--tx:#e8f1f7;--mut:#9db6c7;--pri:#5aa7e6;--line:#34495a;--body:#4f7a94}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:16px 16px 4px;text-align:center}\nh1{font-size:1.35rem;margin:0}\nnav{display:flex;gap:6px;padding:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;overflow-x:auto}\nnav button{flex:1;min-width:64px;padding:10px 6px;font-size:1rem;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;cursor:pointer;font-weight:600}\nnav button.on{background:var(--pri);border-color:var(--pri);color:#fff}\nmain{max-width:860px;margin:0 auto;padding:8px 12px 32px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}\nh2{font-size:1.2rem;margin:0 0 8px;color:var(--pri)}\n.ans{border-left:5px solid var(--palm)}\n.ans p{margin:0}\nsvg{width:100%;height:auto;display:block}\n.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 300px}\nlabel{display:block;font-weight:600;margin:8px 0 2px}\ninput[type=range]{width:100%;height:32px;accent-color:var(--pri)}\n.btn{font-size:1rem;padding:10px 16px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}\n.btn.g{background:var(--mut)}\n.pill{display:inline-block;padding:3px 10px;border-radius:20px;color:#fff;font-weight:600;font-size:.95rem;margin:2px}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}\n.cause{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;font-size:1rem;font-weight:600;cursor:pointer;text-align:left}\n.cause.on{border-color:var(--palm);background:color-mix(in srgb,var(--palm) 14%,var(--card))}\n#why{min-height:3.2em;margin-top:8px;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--pri) 10%,var(--card))}\n.big{font-size:1.5rem;font-weight:700}\n.bad{color:var(--bad)}.ok{color:var(--palm)}\n.fade{opacity:0;animation:f .6s forwards}\n@keyframes f{to{opacity:1}}\n.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:d 1s forwards}\n@keyframes d{to{stroke-dashoffset:0}}\ntext{fill:var(--tx);font-family:inherit}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>Tana qismlarining o'lchami va bo'yga bog'liqligi\u003c/h1>\u003c/header>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\n\u003csection id=\"s0\">\n\u003cdiv class=\"card\">\u003ch2>1-savol. Tana qismlari uzunligi bo'yga bog'liqmi?\u003c/h2>\u003c/div>\n\u003cdiv class=\"card ans\">\u003cp>\u003cb>Javob:\u003c/b> Ha, bog'liq. Bo'y 150 cm dan 165 cm gacha oshganda oyoq panjasi 23 dan 25 cm gacha, kaft 16 dan 18 cm gacha, bilak 22 dan 25 cm gacha oshgan. Bo'y katta bo'lsa, tana qismlari ham uzun, ya'ni bog'liqlik to'g'ri proporsional.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\n\u003clabel>Bo'y: \u003cspan class=\"big\" id=\"hv\">150\u003c/span> cm\u003c/label>\n\u003cinput type=\"range\" id=\"h\" min=\"150\" max=\"165\" step=\"0.5\" value=\"150\">\n\u003cdiv class=\"row\">\u003cdiv>\u003csvg id=\"sil1\" viewBox=\"0 0 220 300\">\u003c/svg>\u003c/div>\u003cdiv>\u003csvg id=\"chart\" viewBox=\"0 0 320 260\">\u003c/svg>\u003c/div>\u003c/div>\n\u003cdiv id=\"vals\">\u003c/div>\n\u003cbutton class=\"btn g\" id=\"r0\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s1\">\n\u003cdiv class=\"card\">\u003ch2>2-savol. O'quvchilar orasidagi farq va sabablari\u003c/h2>\u003c/div>\n\u003cdiv class=\"card ans\">\u003cp>\u003cb>Javob:\u003c/b> Bo'y farqi 15 cm (150 va 165), oyoq panjasi farqi 2 cm (23 va 25). Sabablari: irsiyat (ota-onaning bo'yi), yosh va o'sish tezligi, to'g'ri ovqatlanish va uyqu, jins, sport bilan shug'ullanish.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\n\u003csvg id=\"two\" viewBox=\"0 0 360 320\">\u003c/svg>\n\u003cp style=\"margin:6px 0\">\u003cb>Sabablardan birini tanlang:\u003c/b>\u003c/p>\n\u003cdiv class=\"cards\" id=\"causes\">\u003c/div>\n\u003cdiv id=\"why\">Kartochkani bosing — tushuntirish shu yerda ochiladi.\u003c/div>\n\u003cbutton class=\"btn g\" id=\"r1\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s2\">\n\u003cdiv class=\"card\">\u003ch2>3-savol. O'lchashdagi mumkin bo'lgan xatoliklar\u003c/h2>\u003c/div>\n\u003cdiv class=\"card ans\">\u003cp>\u003cb>Javob:\u003c/b> Chizg'ich qiyshiq qo'yilishi yoki boshlang'ich nuqta (nol) noto'g'ri tanlanishi mumkin. Shuningdek, o'lchovchi shkalaga qiya qarab noto'g'ri o'qishi yoki o'quvchi egilib turishi ham xato beradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\n\u003cp style=\"margin:0 0 4px\">Kaftning haqiqiy uzunligi: \u003cb>16 cm\u003c/b> (1-o'quvchi).\u003c/p>\n\u003csvg id=\"rul\" viewBox=\"0 0 400 190\">\u003c/svg>\n\u003clabel>Chizg'ich qiyshiqligi: \u003cspan id=\"tv\">0\u003c/span>°\u003c/label>\n\u003cinput type=\"range\" id=\"tilt\" min=\"-25\" max=\"25\" step=\"1\" value=\"0\">\n\u003clabel>Nol nuqtasi siljishi: \u003cspan id=\"zv\">0\u003c/span> cm\u003c/label>\n\u003cinput type=\"range\" id=\"zero\" min=\"-1.5\" max=\"1.5\" step=\"0.1\" value=\"0\">\n\u003clabel>Qarash burchagi (qiya qarash): \u003cspan id=\"vv\">0\u003c/span>°\u003c/label>\n\u003cinput type=\"range\" id=\"view\" min=\"-35\" max=\"35\" step=\"1\" value=\"0\">\n\u003cdiv id=\"out\" class=\"big\">\u003c/div>\n\u003cbutton class=\"btn g\" id=\"r2\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"s3\">\n\u003cdiv class=\"card\">\u003ch2>4-savol. Natijalar ishonchliligini oshirish yo'llari\u003c/h2>\u003c/div>\n\u003cdiv class=\"card ans\">\u003cp>\u003cb>Javob:\u003c/b> (1) Har bir o'lchovni 3 marta takrorlab o'rtacha olish; (2) ko'proq sinfdoshni o'lchash (3 ta o'rniga 10 ta); (3) hamma o'lchovni bir xil asbob, bir xil usul va bitta kishi bilan bajarish.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\n\u003cp style=\"margin:0 0 4px\">Haqiqiy kaft uzunligi 16 cm. Har bir o'lchovda tasodifiy xato bor.\u003c/p>\n\u003cbutton class=\"btn\" data-n=\"1\">Tasodifiy xatoli o'lchash: 1 marta\u003c/button>\n\u003cbutton class=\"btn\" data-n=\"3\">3 marta\u003c/button>\n\u003cbutton class=\"btn\" data-n=\"10\">10 marta\u003c/button>\n\u003csvg id=\"rel\" viewBox=\"0 0 360 230\">\u003c/svg>\n\u003cdiv id=\"relt\">\u003c/div>\n\u003cbutton class=\"btn g\" id=\"r3\">Qayta boshlash\u003c/button>\n\u003c/div>\n\u003c/section>\n\n\u003c/main>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst titles=[\"1-savol\",\"2-savol\",\"3-savol\",\"4-savol\"];\ntitles.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\nfunction show(i){document.querySelectorAll(\"section\").forEach((s,j)=>s.classList.toggle(\"on\",i===j));\ndocument.querySelectorAll(\"nav button\").forEach((b,j)=>b.classList.toggle(\"on\",i===j));\nif(i===1)anim2();window.scrollTo(0,0)}\n\n/* silueta */\nfunction fig(cx,gy,h,f,p,b,name){\nconst S=1.6,H=h*S,r=H*.065,tw=H*.1,tb=gy-H*.53,tt=gy-H*.82,sh=tt+4;\nconst F=f*S,Pm=p*S,B=b*S,ua=H*.19,ax=cx+tw+2;\nreturn `\u003cg>\n\u003ccircle cx=\"${cx}\" cy=\"${gy-H+r}\" r=\"${r}\" fill=\"var(--body)\"/>\n\u003crect x=\"${cx-tw}\" y=\"${tt}\" width=\"${tw*2}\" height=\"${tb-tt}\" rx=\"8\" fill=\"var(--body)\"/>\n\u003crect x=\"${cx-H*.085}\" y=\"${tb}\" width=\"${H*.07}\" height=\"${gy-6-tb}\" fill=\"var(--body)\"/>\n\u003crect x=\"${cx+H*.015}\" y=\"${tb}\" width=\"${H*.07}\" height=\"${gy-6-tb}\" fill=\"var(--body)\"/>\n\u003crect x=\"${cx-H*.085}\" y=\"${gy-7}\" width=\"${F}\" height=\"7\" rx=\"3\" fill=\"var(--foot)\"/>\n\u003crect x=\"${ax}\" y=\"${sh}\" width=\"9\" height=\"${ua}\" rx=\"4\" fill=\"var(--body)\"/>\n\u003crect x=\"${ax}\" y=\"${sh+ua}\" width=\"9\" height=\"${B}\" rx=\"4\" fill=\"var(--arm)\"/>\n\u003crect x=\"${ax}\" y=\"${sh+ua+B}\" width=\"9\" height=\"${Pm}\" rx=\"4\" fill=\"var(--palm)\"/>\n${name?`\u003ctext x=\"${cx}\" y=\"${gy+16}\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\">${name}\u003c/text>`:\"\"}\u003c/g>`}\n\n/* 1-savol */\nconst lerp=h=>({f:23+(h-150)*2/15,p:16+(h-150)*2/15,b:22+(h-150)*3/15});\nfunction draw1(){\nconst h=+$(\"h\").value,v=lerp(h);$(\"hv\").textContent=h;\n$(\"sil1\").innerHTML=`\u003cline x1=\"10\" y1=\"291\" x2=\"210\" y2=\"291\" stroke=\"var(--line)\" stroke-width=\"3\"/>`+fig(80,290,h,v.f,v.p,v.b,\"\");\n$(\"vals\").innerHTML=`\u003cspan class=\"pill\" style=\"background:var(--foot)\">Oyoq panjasi: ${v.f.toFixed(1)} cm\u003c/span>\u003cspan class=\"pill\" style=\"background:var(--palm)\">Kaft: ${v.p.toFixed(1)} cm\u003c/span>\u003cspan class=\"pill\" style=\"background:var(--arm)\">Bilak: ${v.b.toFixed(1)} cm\u003c/span>`;\nconst X=x=>40+(x-150)/15*260,Y=y=>220-(y-14)/(27-14)*200;\nlet s=`\u003cline x1=\"40\" y1=\"220\" x2=\"305\" y2=\"220\" stroke=\"var(--mut)\"/>\u003cline x1=\"40\" y1=\"20\" x2=\"40\" y2=\"220\" stroke=\"var(--mut)\"/>`;\nfor(let x=150;x\u003c=165;x+=5)s+=`\u003ctext x=\"${X(x)}\" y=\"238\" font-size=\"12\" text-anchor=\"middle\">${x}\u003c/text>`;\nfor(let y=14;y\u003c=26;y+=4)s+=`\u003ctext x=\"34\" y=\"${Y(y)+4}\" font-size=\"12\" text-anchor=\"end\">${y}\u003c/text>\u003cline x1=\"40\" x2=\"305\" y1=\"${Y(y)}\" y2=\"${Y(y)}\" stroke=\"var(--line)\"/>`;\ns+=`\u003ctext x=\"172\" y=\"254\" font-size=\"12\" text-anchor=\"middle\">Bo'y (cm)\u003c/text>\u003ctext x=\"6\" y=\"12\" font-size=\"12\">Uzunlik (cm)\u003c/text>`;\n[[\"f\",\"--foot\"],[\"p\",\"--palm\"],[\"b\",\"--arm\"]].forEach(([k,c])=>{\ns+=`\u003cline x1=\"${X(150)}\" y1=\"${Y(lerp(150)[k])}\" x2=\"${X(165)}\" y2=\"${Y(lerp(165)[k])}\" stroke=\"var(${c})\" stroke-width=\"3\"/>\u003ccircle cx=\"${X(h)}\" cy=\"${Y(v[k])}\" r=\"6\" fill=\"var(${c})\" stroke=\"#fff\" stroke-width=\"2\"/>`});\ns+=`\u003cline x1=\"${X(h)}\" x2=\"${X(h)}\" y1=\"20\" y2=\"220\" stroke=\"var(--mut)\" stroke-dasharray=\"4\"/>`;\n$(\"chart\").innerHTML=s}\n$(\"h\").oninput=draw1;$(\"r0\").onclick=()=>{$(\"h\").value=150;draw1()};draw1();\n\n/* 2-savol */\nfunction anim2(){\nconst a=lerp(150),b=lerp(165),g=300,H1=150*1.6,H2=165*1.6;\n$(\"two\").innerHTML=`\u003cline x1=\"10\" y1=\"301\" x2=\"350\" y2=\"301\" stroke=\"var(--line)\" stroke-width=\"3\"/>`+\nfig(90,g,150,23,16,22,\"1-o'quvchi: 150 cm\")+fig(230,g,165,25,18,25,\"2-o'quvchi: 165 cm\")+\n`\u003cg class=\"draw\" style=\"animation-delay:.3s\">\u003cline x1=\"20\" y1=\"${g-H1}\" x2=\"330\" y2=\"${g-H1}\" stroke=\"var(--bad)\" stroke-dasharray=\"5\"/>\u003c/g>\n\u003cg class=\"draw\" style=\"animation-delay:.8s\">\u003cline x1=\"20\" y1=\"${g-H2}\" x2=\"330\" y2=\"${g-H2}\" stroke=\"var(--bad)\" stroke-dasharray=\"5\"/>\u003c/g>\n\u003cg class=\"fade\" style=\"animation-delay:1.4s\">\u003cline x1=\"335\" y1=\"${g-H1}\" x2=\"335\" y2=\"${g-H2}\" stroke=\"var(--bad)\" stroke-width=\"3\"/>\n\u003ctext x=\"296\" y=\"${g-H1-2}\" font-size=\"15\" font-weight=\"700\" fill=\"var(--bad)\" style=\"fill:var(--bad)\">Δ 15 cm\u003c/text>\u003c/g>\n\u003cg class=\"fade\" style=\"animation-delay:2s\">\u003cline x1=\"${90-23*.8}\" y1=\"272\" x2=\"${90+23*.8+60}\" y2=\"272\" stroke=\"var(--foot)\" stroke-width=\"2\" opacity=\"0\"/>\n\u003ctext x=\"180\" y=\"30\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"700\" style=\"fill:var(--foot)\">Oyoq panjasi farqi: 2 cm (23 va 25)\u003c/text>\u003c/g>`}\nconst why={\n\"Irsiyat\":\"Ota-onaning bo'yi farzandning bo'yiga katta ta'sir qiladi: uzun bo'yli ota-onaning bolalari ko'pincha uzun bo'yli bo'ladi.\",\n\"Yosh va o'sish tezligi\":\"Bolalar bir xil tezlikda o'smaydi. Bir yoshdagi ikki o'quvchining o'sish davri turlicha kelishi mumkin.\",\n\"Ovqatlanish va uyqu\":\"To'g'ri ovqatlanish (oqsil, vitamin, kalsiy) va yetarli uyqu o'sish gormonini ishlab chiqarishga yordam beradi.\",\n\"Jins\":\"O'g'il va qizlarning o'sish davrlari har xil boshlanadi va tugaydi, shuning uchun bo'yi farq qilishi mumkin.\",\n\"Sport\":\"Muntazam sport suyak va mushaklarning sog'lom rivojlanishiga yordam beradi.\"};\nconst cs=$(\"causes\");\nObject.keys(why).forEach(k=>{const b=document.createElement(\"button\");b.className=\"cause\";b.textContent=k;\nb.onclick=()=>{cs.querySelectorAll(\".cause\").forEach(x=>x.classList.remove(\"on\"));b.classList.add(\"on\");$(\"why\").textContent=why[k]};cs.appendChild(b)});\n$(\"r1\").onclick=()=>{cs.querySelectorAll(\".cause\").forEach(x=>x.classList.remove(\"on\"));$(\"why\").textContent=\"Kartochkani bosing — tushuntirish shu yerda ochiladi.\";anim2()};\n\n/* 3-savol */\nconst L=16,sc=19,x0=30;\nfunction draw3(){\nconst t=+$(\"tilt\").value,z=+$(\"zero\").value,v=+$(\"view\").value;\n$(\"tv\").textContent=t;$(\"zv\").textContent=z.toFixed(1);$(\"vv\").textContent=v;\nconst rad=d=>d*Math.PI/180;\nconst read=(L-z)*Math.cos(rad(t))+0.4*Math.tan(rad(v));\nconst err=read-L;\nlet tk=\"\";for(let i=0;i\u003c=18;i++){tk+=`\u003cline x1=\"${i*sc}\" x2=\"${i*sc}\" y1=\"0\" y2=\"${i%1?8:14}\" stroke=\"#333\" stroke-width=\"1.5\"/>\u003ctext x=\"${i*sc}\" y=\"28\" font-size=\"11\" text-anchor=\"middle\" style=\"fill:#333\">${i}\u003c/text>`}\nconst mx=read*sc;\n$(\"rul\").innerHTML=`\u003crect x=\"${x0}\" y=\"40\" width=\"${L*sc}\" height=\"16\" rx=\"5\" fill=\"var(--palm)\"/>\n\u003ctext x=\"${x0+L*sc/2}\" y=\"34\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\">Kaft (16 cm)\u003c/text>\n\u003cline x1=\"${x0+L*sc}\" x2=\"${x0+L*sc}\" y1=\"56\" y2=\"120\" stroke=\"var(--mut)\" stroke-dasharray=\"4\"/>\n\u003cg transform=\"translate(${x0+z*sc},110) rotate(${t})\">\u003crect x=\"-8\" y=\"0\" width=\"${18*sc+16}\" height=\"38\" rx=\"4\" fill=\"#f5deaa\" stroke=\"#b9954a\"/>${tk}\n\u003cline x1=\"${mx}\" x2=\"${mx}\" y1=\"-6\" y2=\"38\" stroke=\"var(--bad)\" stroke-width=\"3\"/>\u003c/g>\n\u003ctext x=\"${x0}\" y=\"175\" font-size=\"12\" style=\"fill:var(--bad)\">Qizil chiziq — siz o'qigan qiymat\u003c/text>`;\nconst ok=Math.abs(err)\u003c0.15;\n$(\"out\").innerHTML=`Ko'rsatdi: ${read.toFixed(2)} cm\u003cbr>\u003cspan class=\"${ok?\"ok\":\"bad\"}\">Xato: ${err>=0?\"+\":\"\"}${err.toFixed(2)} cm ${ok?\"✓ deyarli aniq\":\"\"}\u003c/span>`}\n[\"tilt\",\"zero\",\"view\"].forEach(i=>$(i).oninput=draw3);\n$(\"r2\").onclick=()=>{$(\"tilt\").value=0;$(\"zero\").value=0;$(\"view\").value=0;draw3()};draw3();\n\n/* 4-savol */\nlet data={1:[],3:[],10:[]};\nconst gauss=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random());\nfunction draw4(){\nconst X=x=>20+(x-12.5)/7*320;let s=\"\";\nfor(let x=13;x\u003c=19;x++)s+=`\u003cline x1=\"${X(x)}\" x2=\"${X(x)}\" y1=\"20\" y2=\"205\" stroke=\"var(--line)\"/>\u003ctext x=\"${X(x)}\" y=\"222\" font-size=\"12\" text-anchor=\"middle\">${x}\u003c/text>`;\ns+=`\u003cline x1=\"${X(16)}\" x2=\"${X(16)}\" y1=\"20\" y2=\"205\" stroke=\"var(--palm)\" stroke-width=\"3\"/>\u003ctext x=\"${X(16)}\" y=\"14\" font-size=\"12\" text-anchor=\"middle\" style=\"fill:var(--palm)\">haqiqiy 16\u003c/text>`;\nlet t=\"\";\n[1,3,10].forEach((n,i)=>{const y=55+i*60,d=data[n];\ns+=`\u003ctext x=\"22\" y=\"${y-28}\" font-size=\"12\" font-weight=\"700\">${n} marta o'lchash\u003c/text>`;\nif(d.length){d.forEach((m,j)=>s+=`\u003ccircle cx=\"${X(Math.min(19.4,Math.max(12.6,m)))}\" cy=\"${y-6+(j%5)*4}\" r=\"4\" fill=\"var(--mut)\" opacity=\".6\"/>`);\nconst a=d.reduce((p,c)=>p+c,0)/d.length;\ns+=`\u003ccircle cx=\"${X(a)}\" cy=\"${y+8}\" r=\"9\" fill=\"var(--pri)\" stroke=\"#fff\" stroke-width=\"2\"/>`;\nt+=`\u003cspan class=\"pill\" style=\"background:var(--pri)\">${n} marta: o'rtacha ${a.toFixed(2)} cm, xato ${Math.abs(a-16).toFixed(2)}\u003c/span> `}});\n$(\"rel\").innerHTML=s;\n$(\"relt\").innerHTML=(t||\"Tugmani bosing.\")+`\u003cp style=\"margin:6px 0 0;color:var(--mut)\">Kulrang nuqtalar — alohida o'lchovlar, ko'k doira — o'rtacha. Bir necha marta bosib ko'ring: ko'proq o'lchov — o'rtacha haqiqiy qiymatga yaqinroq.\u003c/p>`}\ndocument.querySelectorAll(\"[data-n]\").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;data[n]=Array.from({length:n},()=>16+gauss()*1.3);draw4()});\n$(\"r3\").onclick=()=>{data={1:[],3:[],10:[]};draw4()};draw4();\nshow(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "1-ChSB (40 ball)", "icon": "📝", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>7-sinf Fizika — 1-chorak CHSB\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f8fb;--card:#fff;--tx:#1d2b36;--mut:#587083;--pri:#2f7fc1;--line:#d5e2ec;--ok:#2fa56a}\n@media (prefers-color-scheme:dark){:root{--bg:#13202a;--card:#1c2e3b;--tx:#e8f1f7;--mut:#9db6c7;--pri:#5aa7e6;--line:#34495a}}\n*{box-sizing:border-box}\nbody{margin:0;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);background:var(--bg);color:var(--tx);font:18px/1.6 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:800px;margin:0 auto;padding:16px 14px 40px}\nheader{text-align:center;margin-bottom:14px}\nh1{font-size:1.4rem;margin:0 0 4px;color:var(--pri)}\n.meta{color:var(--mut);margin:0}\n.info{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}\n.info span{flex:1 1 200px;border-bottom:2px solid var(--line);padding:4px 2px;color:var(--mut)}\nh2{font-size:1.15rem;margin:22px 0 8px;padding:8px 12px;background:var(--pri);color:#fff;border-radius:10px}\n.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}\n.q p{margin:0 0 6px}\nol.opts{list-style:upper-alpha;margin:0;padding-left:1.6em}\n.pt{float:right;color:var(--mut);font-size:.9rem;margin-left:8px}\n.line{border-bottom:1px solid var(--line);height:1.8em}\nbutton{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:12px;background:var(--pri);color:#fff;cursor:pointer;margin:4px 6px 4px 0}\nbutton.g{background:var(--mut)}\n#key{display:none}\n#key.on{display:block}\n#key li,#key p{margin:4px 0}\ntable{border-collapse:collapse;width:100%;max-width:320px}\ntd,th{border:1px solid var(--line);padding:6px 10px;text-align:center}\n@media print{body{background:#fff;color:#000}.noprint{display:none}h2{background:#eee;color:#000}.q{break-inside:avoid}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\n\u003ch1>7-sinf Fizika — 1-chorak yakuniy summativ baholash (CHSB)\u003c/h1>\n\u003cp class=\"meta\">Vaqt: 40 daqiqa · Jami: 20 ball · Variant 1\u003c/p>\n\u003c/header>\n\u003cdiv class=\"info\">\u003cspan>F.I.Sh.:\u003c/span>\u003cspan>Sinf: 7-\u003c/span>\u003cspan>Sana:\u003c/span>\u003c/div>\n\n\u003cdiv class=\"noprint\">\n\u003cbutton onclick=\"document.getElementById('key').classList.toggle('on')\">Javoblar kalitini ko'rsatish / yashirish\u003c/button>\n\u003cbutton class=\"g\" onclick=\"window.print()\">Chop etish\u003c/button>\n\u003c/div>\n\n\u003ch2>A qism. Test savollari (har biri — 1 ball)\u003c/h2>\n\u003cdiv class=\"q\">\u003cp>\u003cb>1.\u003c/b> Fizika nimani o'rganadi?\u003c/p>\u003col class=\"opts\">\u003cli>Tirik organizmlar tuzilishini\u003c/li>\u003cli>Tabiat hodisalari va qonunlarini\u003c/li>\u003cli>Kimyoviy reaksiyalarni\u003c/li>\u003cli>O'simliklar o'sishini\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>2.\u003c/b> Uzunlikning xalqaro birliklar sistemasidagi (SI) birligi qaysi?\u003c/p>\u003col class=\"opts\">\u003cli>kilogramm\u003c/li>\u003cli>sekund\u003c/li>\u003cli>metr\u003c/li>\u003cli>litr\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>3.\u003c/b> Quyidagilardan qaysi biri fizik jism?\u003c/p>\u003col class=\"opts\">\u003cli>Suv\u003c/li>\u003cli>Qalam\u003c/li>\u003cli>Temir\u003c/li>\u003cli>Havo\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>4.\u003c/b> 1 km necha metrga teng?\u003c/p>\u003col class=\"opts\">\u003cli>10 m\u003c/li>\u003cli>100 m\u003c/li>\u003cli>1000 m\u003c/li>\u003cli>10 000 m\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>5.\u003c/b> Termometr qaysi fizik kattalikni o'lchaydi?\u003c/p>\u003col class=\"opts\">\u003cli>Massani\u003c/li>\u003cli>Vaqtni\u003c/li>\u003cli>Uzunlikni\u003c/li>\u003cli>Temperaturani\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>6.\u003c/b> Chizg'ichda 0 va 10 cm belgilari orasida 5 ta bo'lim bor. Bo'lim qiymati qancha?\u003c/p>\u003col class=\"opts\">\u003cli>1 cm\u003c/li>\u003cli>2 cm\u003c/li>\u003cli>5 cm\u003c/li>\u003cli>10 cm\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>7.\u003c/b> Diffuziya nima?\u003c/p>\u003col class=\"opts\">\u003cli>Moddaning qizishi\u003c/li>\u003cli>Jismning harakatlanishi\u003c/li>\u003cli>Bir modda molekulalarining ikkinchi modda molekulalari orasiga o'z-o'zidan kirib aralashishi\u003c/li>\u003cli>Moddaning muzlashi\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>8.\u003c/b> Diffuziya qaysi holatda tezroq sodir bo'ladi?\u003c/p>\u003col class=\"opts\">\u003cli>Sovuq suvda\u003c/li>\u003cli>Issiq suvda\u003c/li>\u003cli>Muzda\u003c/li>\u003cli>Vakuumda hech qachon\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>9.\u003c/b> Modda molekulalari haqida qaysi fikr to'g'ri?\u003c/p>\u003col class=\"opts\">\u003cli>Qimirlamaydi\u003c/li>\u003cli>Faqat qizdirilganda harakatlanadi\u003c/li>\u003cli>Doimo uzluksiz harakatda bo'ladi\u003c/li>\u003cli>Faqat gazlarda harakatlanadi\u003c/li>\u003c/ol>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cb>10.\u003c/b> Tekis harakatda tezlik formulasi qaysi?\u003c/p>\u003col class=\"opts\">\u003cli>v = s · t\u003c/li>\u003cli>v = s / t\u003c/li>\u003cli>v = t / s\u003c/li>\u003cli>v = s + t\u003c/li>\u003c/ol>\u003c/div>\n\n\u003ch2>B qism. Qisqa javobli savollar (har biri — 2 ball)\u003c/h2>\n\u003cdiv class=\"q\">\u003cp>\u003cspan class=\"pt\">2 ball\u003c/span>\u003cb>11.\u003c/b> Chizg'ich bilan o'lchashda xatolikka olib keladigan ikkita sababni ayting.\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cspan class=\"pt\">2 ball\u003c/span>\u003cb>12.\u003c/b> Ikki o'quvchining bo'yi 150 cm va 165 cm, kaftlari mos ravishda 16 cm va 18 cm. Bo'y farqini va kaft uzunligi farqini toping.\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cspan class=\"pt\">2 ball\u003c/span>\u003cb>13.\u003c/b> O'lchash natijalarining ishonchliligini oshirishning ikkita yo'lini yozing.\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\n\u003ch2>C qism. Masala va misollar (har biri — 2 ball)\u003c/h2>\n\u003cdiv class=\"q\">\u003cp>\u003cspan class=\"pt\">2 ball\u003c/span>\u003cb>14.\u003c/b> Velosipedchi 20 s da 100 m yo'l bosdi. Uning tezligini toping (m/s).\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\u003cdiv class=\"q\">\u003cp>\u003cspan class=\"pt\">2 ball\u003c/span>\u003cb>15.\u003c/b> Kundalik hayotdan diffuziyaga oid ikkita misol keltiring.\u003c/p>\u003cdiv class=\"line\">\u003c/div>\u003cdiv class=\"line\">\u003c/div>\u003c/div>\n\n\u003csection id=\"key\">\n\u003ch2>Javoblar kaliti\u003c/h2>\n\u003cdiv class=\"q\">\n\u003cp>\u003cb>A qism:\u003c/b> 1-B, 2-C, 3-B, 4-C, 5-D, 6-B, 7-C, 8-B, 9-C, 10-B.\u003c/p>\n\u003cp>\u003cb>11.\u003c/b> Masalan: chizg'ich qiyshiq qo'yilishi; boshlang'ich nuqta (nol) noto'g'ri tanlanishi; shkalaga qiya qarab o'qish; o'lchanayotgan jismning egilib turishi. (Har bir sabab — 1 ball.)\u003c/p>\n\u003cp>\u003cb>12.\u003c/b> Bo'y farqi: 165 − 150 = 15 cm (1 ball). Kaft farqi: 18 − 16 = 2 cm (1 ball).\u003c/p>\n\u003cp>\u003cb>13.\u003c/b> Masalan: o'lchovni 3 marta takrorlab o'rtacha olish; ko'proq jismni (sinfdoshni) o'lchash; hamma o'lchovni bir xil asbob, usul va bitta kishi bilan bajarish. (Har bir yo'l — 1 ball.)\u003c/p>\n\u003cp>\u003cb>14.\u003c/b> v = s / t = 100 m / 20 s = 5 m/s. (Formula — 1 ball, hisob va birlik — 1 ball.)\u003c/p>\n\u003cp>\u003cb>15.\u003c/b> Masalan: choyda shakarning erib tarqalishi; xonada atir hidining tarqalishi; ovqat hidining uzoqqa yetishi. (Har bir misol — 1 ball.)\u003c/p>\n\u003c/div>\n\u003ch2>Baholash mezoni (taxminiy)\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Ball\u003c/th>\u003cth>Baho\u003c/th>\u003c/tr>\u003ctr>\u003ctd>18–20\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14–17\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10–13\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0–9\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003c/table>\n\u003c/section>\n\u003c/main>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Xatolar ustida ishlash", "icon": "🔧", "html": "\u003c!DOCTYPE html>\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003ctitle>Fizika 7: Xatolar ustida ishlash\u003c/title>\n\u003cstyle>\n:root{--bg:#f4f8ff;--c:#fff;--t:#1b2a41;--p:#3b7ddd;--ok:#1e8e4e;--okb:#dff5e6;--bad:#c62f3a;--badb:#fde4e6;--m:#5b6b82;--br:#d3deee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root{--bg:#10192b;--c:#1a2740;--t:#e8eefb;--p:#6aa6ff;--ok:#5fd68a;--okb:#14382a;--bad:#ff7b84;--badb:#44212a;--m:#9fb0cc;--br:#2f4166}}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;font:18px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}\nh1{font-size:22px;margin:0;padding:12px 14px 4px}h3,h4{margin:12px 0 6px}\nnav{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\n.b{font:inherit;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--p);background:var(--c);color:var(--t);cursor:pointer;white-space:nowrap}\n.b.on{background:var(--p);color:var(--bg);font-weight:700}\n.opt{display:block;width:100%;margin:8px 0;white-space:normal;text-align:left}\nmain{padding:8px 12px 40px;max-width:720px;margin:auto}\n.card{background:var(--c);border:2px solid var(--br);border-radius:14px;padding:12px;margin:12px 0}\n.ok{color:var(--ok)}.bad{color:var(--bad)}\n.why{background:var(--okb);border-radius:10px;padding:8px 10px}\n.step{background:var(--c);border-left:5px solid var(--p);padding:6px 10px;margin:6px 0;animation:in .6s both}\n@keyframes in{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}\n.bar{height:14px;background:var(--br);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--p);transition:width .5s}\ninput[type=range]{width:100%;height:36px}\n.in{font:inherit;width:120px;padding:8px;border-radius:10px;border:2px solid var(--br);background:var(--c);color:var(--t)}\nsvg,canvas{width:100%;height:auto;display:block;background:var(--c);border-radius:12px}\nsvg text{fill:var(--t)}\n.track{position:relative;height:56px;background:var(--br);border-radius:12px;overflow:hidden}.track span{position:absolute;top:4px;font-size:36px;left:0}\n.chk{display:block;padding:6px 0}.chk input{width:24px;height:24px;vertical-align:middle;margin-right:8px}\n.tag{font-size:18px;color:var(--m)}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ch1>⚛️ Fizika 7: Xatolar ustida ishlash\u003c/h1>\n\u003cp class=\"tag\" style=\"margin:0 14px\">Xato — o‘rganish imkoniyati. Birga tuzatamiz! 💪\u003c/p>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain>\n\u003csection class=\"sec\" id=\"s0\">\u003cdiv id=\"test\">\u003c/div>\u003c/section>\n\u003csection class=\"sec\" id=\"s1\" hidden>\n\u003ch3>📏 Virtual chizg‘ich\u003c/h3>\u003cp>Jism uzunligini o‘lchang. Slayderlarni siljitib, xato qanday paydo bo‘lishini ko‘ring.\u003c/p>\n\u003csvg id=\"rs\" viewBox=\"-30 0 400 150\">\u003c/svg>\n\u003clabel>Nolni siljitish: \u003cb id=\"v1\">0\u003c/b> cm\u003c/label>\u003cinput type=\"range\" id=\"r1\" min=\"0\" max=\"2\" step=\"0.1\" value=\"0\">\n\u003clabel>Chizg‘ichni burish: \u003cb id=\"v2\">0\u003c/b>°\u003c/label>\u003cinput type=\"range\" id=\"r2\" min=\"0\" max=\"20\" step=\"1\" value=\"0\">\n\u003clabel>Shkalaga qiya qarash: \u003cb id=\"v3\">0\u003c/b>\u003c/label>\u003cinput type=\"range\" id=\"r3\" min=\"0\" max=\"5\" step=\"1\" value=\"0\">\n\u003cdiv class=\"card\" id=\"ro\">\u003c/div>\u003cbutton class=\"b\" onclick=\"rNew()\">🔄 Qayta boshlash\u003c/button>\n\u003ch3>🧮 Bo‘lim qiymatini toping\u003c/h3>\u003cdiv class=\"card\">\u003cdiv id=\"bx\">\u003c/div>\u003c/div>\u003cbutton class=\"b\" onclick=\"bNew()\">🔄 Yangi shkala\u003c/button>\n\u003cp class=\"tag\">Termometr ham xuddi shunday o‘qiladi: ikki raqam farqini bo‘limlar soniga bo‘ling.\u003c/p>\u003c/section>\n\u003csection class=\"sec\" id=\"s2\" hidden>\n\u003ch3>🧪 Diffuziya\u003c/h3>\u003cp>Pushti zarralar — bo‘yoq. Ular suv molekulalari orasiga tarqaladi.\u003c/p>\n\u003cb>❄️ Sovuq suv: 10 °C\u003c/b> — tarqalish: \u003cb id=\"dc\">0%\u003c/b>\u003ccanvas id=\"c0\" width=\"320\" height=\"160\">\u003c/canvas>\n\u003cb>🔥 Issiq suv: \u003cspan id=\"dt\">60\u003c/span> °C\u003c/b> — tarqalish: \u003cb id=\"dh\">0%\u003c/b>\u003ccanvas id=\"c1\" width=\"320\" height=\"160\">\u003c/canvas>\n\u003cinput type=\"range\" id=\"dr\" min=\"20\" max=\"90\" value=\"60\">\n\u003cp class=\"why\" id=\"dm\">Harorat oshsa, molekulalar tezroq harakatlanadi, diffuziya tezlashadi.\u003c/p>\n\u003cbutton class=\"b\" onclick=\"dInit()\">🔄 Qayta boshlash\u003c/button>\u003c/section>\n\u003csection class=\"sec\" id=\"s3\" hidden>\n\u003ch3>🏃 Tekis harakat tezligi\u003c/h3>\n\u003clabel>Yo‘l s = \u003cb id=\"sv\">100\u003c/b> m\u003c/label>\u003cinput type=\"range\" id=\"sr\" min=\"10\" max=\"500\" step=\"10\" value=\"100\">\n\u003clabel>Vaqt t = \u003cb id=\"tv\">20\u003c/b> s\u003c/label>\u003cinput type=\"range\" id=\"tr\" min=\"1\" max=\"60\" value=\"20\">\n\u003cdiv class=\"track\">\u003cspan id=\"obj\">🏃\u003c/span>\u003c/div>\u003cp id=\"live\" class=\"tag\">&nbsp;\u003c/p>\n\u003cbutton class=\"b\" onclick=\"go2()\">▶ Harakat\u003c/button> \u003cbutton class=\"b\" onclick=\"vStep()\">Keyingi qadam ▶\u003c/button> \u003cbutton class=\"b\" onclick=\"vReset()\">🔄 Qayta boshlash\u003c/button>\n\u003cdiv id=\"vs\">\u003c/div>\n\u003ch3>⚠️ Birlikni adashtirmang (cm, m, km)\u003c/h3>\u003cdiv class=\"card\">\u003cdiv id=\"ux\">\u003c/div>\u003c/div>\u003cbutton class=\"b\" onclick=\"uNew()\">🔄 Yangi mashq\u003c/button>\u003c/section>\n\u003csection class=\"sec\" id=\"s4\" hidden>\u003cdiv id=\"pl\">\u003c/div>\u003c/section>\n\u003c/main>\u003ccanvas id=\"cf\" style=\"position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;background:none\" hidden>\u003c/canvas>\n\u003cscript>\nconst T=[\"E'tiborsizlik\",\"Formulani bilmaslik\",\"Birlikni adashtirish\",\"Hisoblashdagi xato\",\"Tushunmaslik\"],TC=[\"#e6a100\",\"#3b7ddd\",\"#c62f3a\",\"#8e44ad\",\"#1e8e4e\",\"#888\"];\nconst Q=[\n{t:\"1 km necha metr?\",o:[\"10 m\",\"100 m\",\"1000 m\",\"10 000 m\"],a:2,k:'u',y:2,w:\"“kilo” old qo‘shimchasi 1000 ni bildiradi. Birliklarni almashtirishda 1000 ga ko‘paytiriladi.\",s:[\"“kilo” = 1000\",\"1 km = 1 · 1000 m\",\"Javob: 1000 m\"]},\n{t:\"Qaysi biri fizik jism?\",o:[\"Suv\",\"Temir\",\"Stol\",\"Kislorod\"],a:2,k:'j',y:4,w:\"Jism — shakli bor narsa (stol). Modda — jism nimadan yasalgani (temir, suv, kislorod).\",s:[\"Suv, temir, kislorod — moddalar\",\"Stol — shakli bor, ya'ni jism\",\"Javob: Stol\"]},\n{t:\"Shkalada 0 va 10 raqamlari orasida 5 ta bo‘lim bor. Bo‘lim qiymati qancha?\",o:[\"1\",\"2\",\"5\",\"10\"],a:1,k:'b',y:1,w:\"Bo‘lim qiymati = (katta raqam − kichik raqam) : bo‘limlar soni.\",s:[\"(10 − 0) : 5\",\"= 10 : 5\",\"Javob: 2\"]},\n{t:\"Jism chizg‘ichning 3 cm belgisidan 8 cm belgisigacha turibdi. Uzunligi qancha?\",o:[\"3 cm\",\"5 cm\",\"8 cm\",\"11 cm\"],a:1,k:'z',y:0,w:\"Jism 0 dan boshlanmagan. Boshlanish belgisini oxirgi belgidan ayirish kerak.\",s:[\"Oxiri: 8 cm, boshi: 3 cm\",\"8 − 3 = 5\",\"Javob: 5 cm\"]},\n{t:\"Chizg‘ich qiyshiq qo‘yilsa, natija qanday bo‘ladi?\",o:[\"Noto‘g‘ri (kattaroq) chiqadi\",\"Aniq chiqadi\",\"O‘zgarmaydi\",\"Nol bo‘ladi\"],a:0,k:'x',y:4,w:\"Qiya chizg‘ichda jism oxiri uzoqroq belgiga to‘g‘ri keladi. Chizg‘ichni jismga parallel qo‘ying.\",s:[\"Chizg‘ich jismga parallel emas\",\"Oxirgi belgi uzoqroq ko‘rinadi\",\"Javob: noto‘g‘ri, kattaroq natija\"]},\n{t:\"O‘lchash ishonchliligini oshirish uchun nima qilinadi?\",o:[\"Bir marta o‘lchash\",\"3 marta o‘lchab, o‘rtachasini olish\",\"Har safar boshqa asbob olish\",\"Asbobga qiya qarash\"],a:1,k:'x',y:4,w:\"Takroriy o‘lchash tasodifiy xatoni kamaytiradi. Bir xil asbob va usuldan foydalaning.\",s:[\"3 marta o‘lchaymiz\",\"Natijalarni qo‘shib 3 ga bo‘lamiz\",\"Javob: o‘rtacha qiymat\"]},\n{t:\"Molekulalar haqida qaysi gap to‘g‘ri?\",o:[\"Tinch turadi\",\"Doimo harakatda bo‘ladi\",\"Faqat suvda harakatlanadi\",\"Faqat qizdirilganda harakatlanadi\"],a:1,k:'m',y:4,w:\"Hamma moddaning molekulalari doimo va tartibsiz harakatlanadi.\",s:[\"Molekulalar hech qachon to‘xtamaydi\",\"Harorat faqat tezligini o‘zgartiradi\",\"Javob: doimo harakatda\"]},\n{t:\"Diffuziya qaysi suvda tezroq kechadi?\",o:[\"Sovuq suvda\",\"Issiq suvda\",\"Bir xil tezlikda\",\"Suvda kechmaydi\"],a:1,k:'m',y:4,w:\"Issiq suvda molekulalar tezroq harakatlanadi, shuning uchun moddalar tezroq aralashadi.\",s:[\"Harorat ↑ → molekula tezligi ↑\",\"Tezroq harakat → tezroq aralashish\",\"Javob: issiq suvda\"]},\n{t:\"Jism 100 m yo‘lni 20 s da bosib o‘tdi. Tezligi qancha?\",o:[\"2000 m/s\",\"5 m/s\",\"0,2 m/s\",\"80 m/s\"],a:1,k:'v',y:1,w:\"Tezlik = yo‘l : vaqt, ya'ni v = s / t.\",s:[\"v = s / t\",\"v = 100 / 20\",\"Javob: 5 m/s\"]},\n{t:\"Jism 2 km yo‘lni 400 s da bosib o‘tdi. Tezligi necha m/s?\",o:[\"0,005 m/s\",\"5 m/s\",\"200 m/s\",\"800 m/s\"],a:1,k:'v',y:2,w:\"Avval km ni m ga o‘tkazing: 1 km = 1000 m. Keyin bo‘ling.\",s:[\"2 km = 2000 m\",\"v = 2000 / 400\",\"Javob: 5 m/s\"]}];\nconst $=s=>document.querySelector(s),r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>a.sort(()=>Math.random()-.5),pick=a=>a[r(0,a.length-1)];\nconst mk=(t,c,w)=>{const o=sh([c,...w]);return{t,o,a:o.indexOf(c)}};\nconst stp=a=>a.map((s,k)=>`\u003cdiv class=\"step\" style=\"animation-delay:${k*.7}s\">${s}\u003c/div>`).join('');\nconst bank=b=>{const e=pick(b);return mk(e[0],e[1],e[2])};\nconst GEN={u:()=>{const n=r(2,9);return mk(`${n} km necha metr?`,n*1000+' m',[n*100+' m',n*10+' m',n+' m'])},\nj:()=>bank([[\"Qaysi biri fizik jism?\",\"Stol\",[\"Suv\",\"Temir\",\"Kislorod\"]],[\"Qaysi biri modda?\",\"Temir\",[\"Qalam\",\"Stol\",\"Kitob\"]]]),\nb:()=>{const d=pick([0.5,2,5,10]),n=pick([4,5,10]);return mk(`Shkalada ${n*d} va 0 orasida ${n} ta bo‘lim bor. Bo‘lim qiymati?`,d+'',[d*2+'',d/2+'',d*n+''])},\nz:()=>{const a=r(2,4),L=r(5,9);return mk(`Jism chizg‘ichning ${a} cm belgisidan ${a+L} cm belgisigacha turibdi. Uzunligi?`,L+' cm',[(a+L)+' cm',(2*a+L)+' cm',a+' cm'])},\nx:()=>bank([[\"Termometrga qiya qarasak, natija qanday bo‘ladi?\",\"Noto‘g‘ri chiqadi\",[\"Aniqroq chiqadi\",\"O‘zgarmaydi\",\"Nol bo‘ladi\"]],[\"Ishonchlilikni oshirish uchun nima qilinadi?\",\"Bir necha marta o‘lchab o‘rtacha olinadi\",[\"Bir marta o‘lchanadi\",\"Har safar boshqa usul olinadi\",\"Qiya qaraladi\"]]]),\nm:()=>bank([[\"Issiq suvda diffuziya qanday kechadi?\",\"Tezroq\",[\"Sekinroq\",\"O‘zgarmaydi\",\"To‘xtaydi\"]],[\"Molekulalar qanday holatda?\",\"Doimo harakatda\",[\"Tinch turadi\",\"Faqat qattiq jismda harakatlanadi\",\"Faqat sovuqda harakatlanadi\"]]]),\nv:()=>{const v=r(2,9),t=r(2,9)*5,s=v*t;return mk(`${s} m yo‘l ${t} s da bosib o‘tildi. Tezlik?`,v+' m/s',[s*t+' m/s',(s+t)+' m/s',(s-t)+' m/s'])}};\nlet S,i,cur=0;\nfunction init(){S={ans:[],ty:{},st:{},chk:{},ex:{},cel:0};i=0;renderTest()}\nfunction renderTest(){if(i>=10)return results();const q=Q[i];$('#test').innerHTML=`\u003ch3>🔍 1-qadam. Xatoni toping\u003c/h3>\u003cdiv class=\"bar\">\u003ci style=\"width:${i*10}%\">\u003c/i>\u003c/div>\u003ch3>${i+1}/10. ${q.t}\u003c/h3>`+q.o.map((o,j)=>`\u003cbutton class=\"b opt\" onclick=\"pk(${j})\">${o}\u003c/button>`).join('')}\nfunction pk(j){S.ans[i]=j;i++;renderTest()}\nfunction results(){const w=Q.map((q,k)=>k).filter(k=>S.ans[k]!==Q[k].a),sc=10-w.length;\n$('#test').innerHTML=`\u003ch3>Natija: ${sc}/10 ${sc>=8?'🌟':'💪'}\u003c/h3>\u003cp>${sc==10?'✓ Hammasi to‘g‘ri! Ajoyib!':'Har bir xato — o‘sish uchun yo‘l ko‘rsatkich. Keling, ularni birga tuzatamiz.'}\u003c/p>`+(w.length?`\u003ch4>Xato turlari diagrammasi\u003c/h4>\u003cdiv id=\"ch\">\u003c/div>\u003ch4>Xatolar ro‘yxati\u003c/h4>`+w.map(card).join(''):'')+`\u003cbutton class=\"b\" onclick=\"init()\">🔄 Qayta boshlash\u003c/button>`;chart()}\nfunction card(k){const q=Q[k];return `\u003cdiv class=\"card\" id=\"c${k}\">\u003cb>${k+1}-savol\u003c/b>\u003cp>${q.t}\u003c/p>\u003cp class=\"bad\">✗ Sizning javobingiz: ${q.o[S.ans[k]]}\u003c/p>\u003cp class=\"ok\">✓ To‘g‘ri javob: ${q.o[q.a]}\u003c/p>\u003ch4>2-qadam. Xato turini tanlang\u003c/h4>\u003cdiv id=\"ch${k}\">${T.map((x,j)=>`\u003cbutton class=\"b opt\" onclick=\"ty(${k},${j})\">${x}\u003c/button>`).join('')}\u003c/div>\u003cdiv id=\"ex${k}\">\u003c/div>\u003c/div>`}\nfunction ty(k,j){S.ty[k]=j;const q=Q[k];[...$('#ch'+k).children].forEach((b,x)=>b.classList.toggle('on',x==j));chart();\n$('#ex'+k).innerHTML=`\u003cp>${j==q.y?'✓ Aniq aniqladingiz!':'Fikringiz ham o‘rinli. Ko‘pchilik buni “'+T[q.y]+'” deb hisoblaydi.'}\u003c/p>\u003ch4>3-qadam. Sababini tushuning\u003c/h4>\u003cdiv class=\"why\">💡 ${q.w}\u003c/div>\u003ch4>4-qadam. To‘g‘ri yechim\u003c/h4>\u003cdiv id=\"sol${k}\">\u003c/div>\u003cbutton class=\"b\" onclick=\"ns(${k})\">Keyingi qadam ▶\u003c/button>\u003ch4>5-qadam. Yangi mashq\u003c/h4>\u003cdiv id=\"nx${k}\">\u003c/div>\u003cbutton class=\"b\" onclick=\"ne(${k})\">🔄 Yangi mashq\u003c/button>`}\nfunction ns(k){const n=S.st[k]||0;if(n\u003cQ[k].s.length){$('#sol'+k).insertAdjacentHTML('beforeend',`\u003cdiv class=\"step\">${Q[k].s[n]}\u003c/div>`);S.st[k]=n+1}}\nfunction ne(k){const e=GEN[Q[k].k]();S.ex[k]=e;$('#nx'+k).innerHTML=`\u003cp>${e.t}\u003c/p>`+e.o.map((o,j)=>`\u003cbutton class=\"b opt\" onclick=\"ae(${k},${j})\">${o}\u003c/button>`).join('')+`\u003cdiv id=\"fb${k}\">\u003c/div>`}\nfunction ae(k,j){const e=S.ex[k];$('#fb'+k).innerHTML=j==e.a?`\u003cp class=\"ok\">✓ To‘g‘ri! Xatoni o‘zingiz tuzatdingiz, barakalla!\u003c/p>`:`\u003cp class=\"bad\">✗ Hali emas, bu normal. Yechimga qarab, yana urinib ko‘ring.\u003c/p>`}\nfunction chart(){const w=Q.map((q,k)=>k).filter(k=>S.ans[k]!==Q[k].a),L=[...T,\"Tanlanmagan\"],c=L.map(()=>0);w.forEach(k=>c[S.ty[k]===undefined?5:S.ty[k]]++);const m=Math.max(1,...c);\n$('#ch').innerHTML=`\u003csvg viewBox=\"0 0 340 276\">`+L.map((l,j)=>`\u003ctext x=\"4\" y=\"${j*46+18}\" font-size=\"18\">${l}\u003c/text>\u003crect x=\"4\" y=\"${j*46+24}\" width=\"${Math.max(4,c[j]/m*290)}\" height=\"16\" rx=\"6\" fill=\"${TC[j]}\"/>\u003ctext x=\"${Math.max(4,c[j]/m*290)+10}\" y=\"${j*46+38}\" font-size=\"18\">${c[j]}\u003c/text>`).join('')+`\u003c/svg>`}\n/* Chizg'ich */\nconst R={L:5,s:0,th:0,p:0};\nfunction rNew(){R.L=r(30,90)/10;['r1','r2','r3'].forEach(x=>$('#'+x).value=0);rUpd()}\nfunction rUpd(){R.s=+$('#r1').value;R.th=+$('#r2').value;R.p=+$('#r3').value;$('#v1').textContent=R.s;$('#v2').textContent=R.th;$('#v3').textContent=R.p;\nlet t='';for(let k=0;k\u003c=100;k++){const x=30+3*k,l=k%10==0?18:k%5==0?13:8;t+=`\u003cline x1=\"${x}\" x2=\"${x}\" y1=\"60\" y2=\"${60+l}\" stroke=\"currentColor\" stroke-width=\"1\"/>`;if(k%10==0)t+=`\u003ctext x=\"${x-5}\" y=\"102\" font-size=\"18\">${k/10}\u003c/text>`}\n$('#rs').innerHTML=`\u003crect x=\"30\" y=\"20\" width=\"${R.L*30}\" height=\"24\" rx=\"4\" fill=\"#e6a100\"/>\u003ctext x=\"35\" y=\"38\" font-size=\"16\" fill=\"#000\" style=\"fill:#000\">jism\u003c/text>\u003cg style=\"color:var(--t)\" transform=\"rotate(${R.th} 30 60) translate(${-30*R.s} 0)\">\u003crect x=\"0\" y=\"60\" width=\"340\" height=\"48\" rx=\"4\" fill=\"#9ad0ff\" opacity=\".6\"/>${t}\u003c/g>\u003ctext x=\"${30+R.L*30-8}\" y=\"130\" font-size=\"22\" transform=\"rotate(${R.p*6} ${30+R.L*30} 125)\">👁️\u003c/text>`;\nconst m=R.L/Math.cos(R.th*Math.PI/180)+R.s+R.p*.1,e=m-R.L,ok=Math.abs(e)\u003c.05;\n$('#ro').innerHTML=`Haqiqiy uzunlik: \u003cb>${R.L.toFixed(1)} cm\u003c/b>\u003cbr>Siz o‘qigan qiymat: \u003cb>${m.toFixed(2)} cm\u003c/b>\u003cbr>${ok?'\u003cb class=\"ok\">✓ Xato: 0 — aniq o‘lchadingiz!\u003c/b>':`\u003cb class=\"bad\">✗ Xato: +${e.toFixed(2)} cm\u003c/b>\u003cbr>Sabablari: ${R.s>0?'nol noto‘g‘ri tanlangan; ':''}${R.th>0?'chizg‘ich qiyshiq; ':''}${R.p>0?'shkalaga qiya qaralgan; ':''}\u003cbr>\u003cspan class=\"tag\">Xato — o‘rganish imkoniyati. Nolni 0
