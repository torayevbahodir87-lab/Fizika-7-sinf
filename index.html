.disabled = false; } }\n};\n$('#s3-in').addEventListener('keydown', e => { if (e.key === 'Enter') $('#s3-chk').click(); });\n$('#s3-restart').onclick = s3Setup;\n$('#s3-next').onclick = async () => {\n  const cur = S3.steps[S3.step]; if (!cur || S3.busy) return;\n  const my = S3.run; S3.busy = true; $('#s3-next').disabled = true;\n  if (cur.k === 'dip') await s3Dip(cur.w);\n  else if (cur.k === 'fill') await s3Fill2();\n  else if (cur.k === 'dip2') await s3Dip2();\n  else if (cur.k === 'move') await s3Move2();\n  else if (cur.k === 'calc') await s3Calc();\n  if (my !== S3.run) return;\n  S3.busy = false; S3.step++; S3.readOk = false; S3.tries = 0; s3Render();\n};\n\n/* ---------- 1-usul sahnasi ---------- */\nconst TBL = { O: [305, TABLE_Y - 20], S: [352, TABLE_Y - 11] };\nfunction setPos(g, x, y) { g.setAttribute('transform', `translate(${x},${y})`); }\nfunction s3Build1() {\n  const svg = $('#s3-svg'); svg.innerHTML = ''; svg.setAttribute('viewBox', '0 0 380 360');\n  const c = buildCyl(svg, { x0: 165, w: 60, y0: 335, ppm: 2.4 }); c.setLevel(S3.level);\n  el('line', { x1: 235, x2: 378, y1: TABLE_Y, y2: TABLE_Y, stroke: 'var(--line)', 'stroke-width': 3 }, svg);\n  el('circle', { cx: 195, cy: 10, r: 4, fill: 'var(--muted)' }, svg);\n  const thread = el('line', { x1: 195, y1: 10, x2: 195, y2: 10, stroke: 'var(--fg)', 'stroke-width': 1.4, visibility: 'hidden' }, svg);\n  const gS = el('g', {}, svg), gO = el('g', {}, svg), gB = el('g', { visibility: 'hidden' }, svg);\n  gO.innerHTML = glyph(S3.obj); gS.innerHTML = glyph('sinker'); gS.setAttribute('visibility', s3Float() ? 'visible' : 'hidden');\n  [[-12, -4, 3], [10, -10, 2.6], [14, 6, 3.2], [-6, 12, 2.4], [3, -15, 2.2]].forEach(b => el('circle', { cx: b[0], cy: b[1], r: b[2], fill: 'rgba(255,255,255,.85)', stroke: 'var(--water-edge)', 'stroke-width': 1 }, gB));\n  setPos(gO, ...TBL.O); setPos(gS, ...TBL.S);\n  const t1 = el('text', { x: TBL.O[0], y: TABLE_Y + 16, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)' }, svg); t1.textContent = OBJ[S3.obj].n;\n  if (s3Float()) { const t2 = el('text', { x: TBL.S[0] - 6, y: TABLE_Y + 30, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)' }, svg); t2.textContent = 'cho\\'ktirgich'; }\n  S3.sv = { svg, c, thread, gS, gO, gB };\n}\nasync function s3Dip(which) {\n  const my = S3.run, v = S3.sv, c = v.c, g = which === 'S' ? v.gS : v.gO, from = TBL[which];\n  const L0 = S3.level, add = which === 'S' ? SINK_V : s3Add(), L1 = L0 + add, half = which === 'O' ? 17 : 12;\n  let rest = which === 'S' ? c.y0 - 11 : (S3.items.S ? c.y0 - 38 : c.y0 - 20);\n  if (which === 'O' && s3Partial()) rest = c.yOf(L1);                         // to'liq botmaydi: yarmi suv ustida\n  const hang = [195, 44];\n  v.thread.setAttribute('visibility', 'visible');\n  const follow = (x, y) => { setPos(g, x, y); v.thread.setAttribute('x2', x); v.thread.setAttribute('y2', y - half); if (x !== 195) v.thread.setAttribute('x1', lerp(195, x, .0)); };\n  await tween(800, e => { if (my === S3.run) follow(lerp(from[0], hang[0], e), lerp(from[1], hang[1], e)); });\n  if (my !== S3.run) return;\n  await tween(1500, e => {\n    if (my !== S3.run) return;\n    follow(195, lerp(hang[1], rest, e));\n    S3.level = L0 + add * clamp((e - .4) / .6, 0, 1); c.setLevel(S3.level);\n  });\n  if (my !== S3.run) return;\n  S3.level = L1; c.setLevel(L1); S3.items[which] = true;\n  if (which === 'O' && s3Bubbles()) { setPos(v.gB, 195, rest); v.gB.setAttribute('visibility', 'visible'); }\n}\n\n/* ---------- Hisoblash (ikkala usul uchun) ---------- */\nasync function s3Calc() {\n  const my = S3.run, box = $('#s3-result'); box.className = 'msg info';\n  const trueV = S3.vol, line = (h, w = 700) => wait(w).then(() => { if (my === S3.run) box.innerHTML = h; });\n  if (S3.method === 1) {\n    const V1 = S3.reads.V1, V2 = S3.reads.V2, V = V2 - V1;\n    box.innerHTML = '\u003cspan class=\"num\" style=\"font-size:1.3rem\">V = V₂ − V₁\u003c/span>';\n    await line(`\u003cspan class=\"num\" style=\"font-size:1.3rem\">V = V₂ − V₁\u003c/span>\u003cbr>\u003cspan class=\"num\" style=\"font-size:1.3rem\">V = ${fmt(V2, 0)} − ${fmt(V1, 0)}\u003c/span>`);\n    if (my !== S3.run) return;\n    await line(`\u003cspan class=\"num\" style=\"font-size:1.3rem\">V = V₂ − V₁ = ${fmt(V2, 0)} − ${fmt(V1, 0)}\u003c/span>\u003cbr>\u003cspan class=\"bigv\">${fmt(V, 0)} ml = ${fmt(V, 0)} sm³\u003c/span>`);\n    if (my !== S3.run) return;\n    const ok = Math.abs(V - trueV) \u003c .6;\n    let why = '';\n    if (!ok) why = s3Partial() && !s3Bubbles() ? 'Jism to\\'liq botmadi, shuning uchun suv kam siqib chiqarildi va hajm kichik chiqdi.'\n      : s3Bubbles() && !s3Partial() ? 'Jismda havo pufakchalari qoldi, ular ham joy egalladi va hajm katta chiqdi.'\n      : 'Xatolar bir-birini qisman bartaraf etdi, lekin natija baribir noto\\'g\\'ri.';\n    box.className = 'msg ' + (ok ? 'ok' : 'no');\n    box.innerHTML += `\u003cbr>Jismning haqiqiy hajmi: \u003cb>${fmt(trueV, 0)} sm³\u003c/b>. ` + (ok ? 'Natija to\\'g\\'ri!' : 'Sening natijang farq qiladi (' + (V > trueV ? '+' : '−') + fmt(Math.abs(V - trueV), 0) + ' sm³). ' + why);\n  } else {\n    box.className = 'msg ok';\n    box.innerHTML = `Siqib chiqarilgan suv: \u003cspan class=\"bigv\">${fmt(S3.reads.V, 0)} ml\u003c/span>\u003cbr>1 ml = 1 sm³, demak ${OBJ[S3.obj].n.toLowerCase()}ning hajmi \u003cb>${fmt(S3.reads.V, 0)} sm³\u003c/b>. Haqiqiy: ${fmt(trueV, 0)} sm³.`;\n  }\n}\n/* ---------- 2-usul: quyilish idishi (otliv idishi) ---------- */\nconst BK_H = 64, BK_PPM = 1.7;                // stakan balandligi (px) va 1 ml necha px\nconst BK_HOME = [181, 271], OBJ2_TBL = [228, 313];\nfunction s3Build2() {\n  const svg = $('#s3-svg'); svg.innerHTML = ''; svg.setAttribute('viewBox', '0 0 380 360');\n  S3.level = 0;\n  // stol chizig'i\n  el('line', { x1: 8, x2: 372, y1: 336, y2: 336, stroke: 'var(--line)', 'stroke-width': 3 }, svg);\n  // quyilish idishi\n  const water = el('path', { d: '', fill: 'var(--water)', 'fill-opacity': .85 }, svg);\n  el('path', { d: 'M20,195 L20,335 L120,335 L120,214 L146,214 L154,225 L161,221 L151,206 L120,206 L120,195', fill: 'var(--glass)', stroke: 'var(--glass-edge)', 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, svg);\n  const lab = el('text', { x: 70, y: 354, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)' }, svg); lab.textContent = 'quyilish idishi';\n  const faucet = el('line', { x1: 40, x2: 40, y1: 150, y2: 214, stroke: 'var(--water)', 'stroke-width': 4, 'stroke-linecap': 'round', visibility: 'hidden' }, svg);\n  const setWater = y => water.setAttribute('d', `M21,${y} L119,${y} L119,334 L21,334Z`);\n  setWater(275);\n  // menzurka\n  const mc = buildCyl(svg, { x0: 285, w: 60, y0: 335, ppm: 2.0, div: 2, label: 10 }); mc.setLevel(0);\n  // jism (stol ustida)\n  const gO = el('g', {}, svg); gO.innerHTML = glyph(S3.obj); setPos(gO, ...OBJ2_TBL);\n  const t1 = el('text', { x: OBJ2_TBL[0], y: 354, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--muted)' }, svg); t1.textContent = OBJ[S3.obj].n;\n  const thread = el('line', { stroke: 'var(--fg)', 'stroke-width': 1.4, visibility: 'hidden' }, svg);\n  // tomchilar\n  const drops = []; for (let i = 0; i \u003c 4; i++) drops.push(el('circle', { r: 3, fill: 'var(--water)', visibility: 'hidden' }, svg));\n  // stakan\n  const gBk = el('g', { visibility: 'hidden' }, svg);\n  const bkLiq = el('path', { d: '', fill: 'var(--water)', 'fill-opacity': .9 }, gBk);\n  el('path', { d: `M-48,0 L-48,${BK_H} L0,${BK_H} L0,0`, fill: 'var(--glass)', stroke: 'var(--glass-edge)', 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, gBk);\n  const stream = el('line', { stroke: 'var(--water)', 'stroke-width': 4, 'stroke-linecap': 'round', visibility: 'hidden' }, svg);\n  const bkSet = (px, py, th, hpx) => {\n    gBk.setAttribute('transform', `translate(${px},${py}) rotate(${th})`);\n    bkLiq.setAttribute('d', hpx > .5 ? `M-46,${BK_H - hpx} L-2,${BK_H - hpx} L-2,${BK_H - 2} L-46,${BK_H - 2}Z` : '');\n  };\n  bkSet(BK_HOME[0], BK_HOME[1], 0, 0);\n  S3.sv = { svg, mc, gO, thread, drops, gBk, bkSet, stream, faucet, setWater, bkPos: [...BK_HOME], bkH: 0 };\n}\nfunction dripAt(sv, phase, visible, surfY) {\n  const tip = [156, 224];\n  sv.drops.forEach((d, i) => {\n    const p = (phase + i / sv.drops.length) % 1;\n    d.setAttribute('visibility', visible ? 'visible' : 'hidden');\n    d.setAttribute('cx', tip[0] + 1); d.setAttribute('cy', tip[1] + p * (surfY - tip[1]));\n  });\n}\nasync function s3Fill2() {\n  const my = S3.run, sv = S3.sv;\n  sv.faucet.setAttribute('visibility', 'visible');\n  await tween(1500, e => { if (my !== S3.run) return; const y = lerp(275, 214, e); sv.setWater(y); sv.faucet.setAttribute('y2', y); });\n  if (my !== S3.run) return;\n  sv.faucet.setAttribute('visibility', 'hidden');\n  await tween(900, (e, t) => { if (my === S3.run) dripAt(sv, t * 2, true, 330); }, t => t);   // ortiqcha suv oqib ketadi\n  if (my !== S3.run) return;\n  dripAt(sv, 0, false, 330);\n  sv.gBk.setAttribute('visibility', 'visible');                                              // stakan tumshuq tagiga qo'yiladi\n  await tween(700, e => { if (my === S3.run) sv.bkSet(lerp(BK_HOME[0] + 90, BK_HOME[0], e), BK_HOME[1], 0, 0); });\n}\nasync function s3Dip2() {\n  const my = S3.run, sv = S3.sv, g = sv.gO, half = 17, V = S3.vol;\n  sv.thread.setAttribute('visibility', 'visible');\n  const follow = (x, y) => { setPos(g, x, y); sv.thread.setAttribute('x1', x); sv.thread.setAttribute('x2', x); sv.thread.setAttribute('y1', 8); sv.thread.setAttribute('y2', y - half); };\n  await tween(800, e => { if (my === S3.run) follow(OBJ2_TBL[0], lerp(OBJ2_TBL[1], 110, e)); });\n  if (my !== S3.run) return;\n  await tween(800, e => { if (my === S3.run) follow(lerp(OBJ2_TBL[0], 70, e), 110); });\n  if (my !== S3.run) return;\n  const rest = 335 - 22;\n  await tween(2400, (e, t) => {\n    if (my !== S3.run) return;\n    follow(70, lerp(110, rest, e));\n    const sp = V * clamp((e - .25) / .75, 0, 1), h = sp * BK_PPM;\n    sv.bkSet(BK_HOME[0], BK_HOME[1], 0, h); sv.bkH = h;\n    dripAt(sv, t * 5, e > .25 && e \u003c .98, BK_HOME[1] + BK_H - h);\n  });\n  if (my !== S3.run) return;\n  dripAt(sv, 0, false, 330); sv.bkSet(BK_HOME[0], BK_HOME[1], 0, V * BK_PPM); sv.bkH = V * BK_PPM;\n}\nasync function s3Move2() {\n  const my = S3.run, sv = S3.sv, V = S3.vol, mc = sv.mc, P = [315, 70];\n  await tween(1000, e => { if (my === S3.run) sv.bkSet(lerp(BK_HOME[0], P[0], e), lerp(BK_HOME[1], P[1], e), 0, V * BK_PPM); });\n  if (my !== S3.run) return;\n  sv.stream.setAttribute('x1', P[0]); sv.stream.setAttribute('x2', P[0]); sv.stream.setAttribute('y1', P[1] + 2);\n  await tween(2400, (e, t) => {\n    if (my !== S3.run) return;\n    const th = 62 * Math.min(1, t * 3), lv = V * e;\n    sv.bkSet(P[0], P[1], th, V * BK_PPM * (1 - e)); mc.setLevel(lv); S3.level = lv;\n    sv.stream.setAttribute('visibility', th > 30 && e \u003c .985 ? 'visible' : 'hidden'); sv.stream.setAttribute('y2', mc.yOf(lv) - 3);\n  }, t => t);\n  if (my !== S3.run) return;\n  sv.stream.setAttribute('visibility', 'hidden'); S3.level = V; mc.setLevel(V);\n  await tween(900, e => { if (my === S3.run) sv.bkSet(lerp(P[0], BK_HOME[0], e), lerp(P[1], BK_HOME[1], e), 62 * (1 - e), 0); });\n}\n\n/* ---------- Mustaqil sinash ---------- */\nlet T3 = null;\nfunction s3NewTask() {\n  const k = rnd(1, 3);\n  if (k === 1) { const v1 = rnd(30, 60), d = rnd(5, 40); T3 = { t: `Menzurkada ${v1} ml suv bor. Jism botirilgach, suv sathi ${v1 + d} ml ni ko'rsatdi. Jismning hajmi necha sm³?`, ans: d, w: `V = V₂ − V₁ = ${v1 + d} − ${v1} = ${d} ml = ${d} sm³.` }; }\n  else if (k === 2) { const v1 = rnd(40, 60), d = rnd(6, 30); T3 = { t: `Po'kak hajmi o'lchanmoqda. Cho'ktirgich botirilganda menzurka ${v1} ml ni, po'kak cho'ktirgich bilan botirilganda ${v1 + d} ml ni ko'rsatdi. Po'kakning hajmi necha sm³?`, ans: d, w: `V = V₂ − V₁ = ${v1 + d} − ${v1} = ${d} ml = ${d} sm³. Cho'ktirgich ikkala o'lchovda ham bor, shuning uchun u ayirib tashlanadi.` }; }\n  else { const d = rnd(8, 45); T3 = { t: `Jism quyilish idishiga botirilganda stakanga ${d} ml suv oqib tushdi. Jismning hajmi necha sm³?`, ans: d, w: `Siqib chiqarilgan suv hajmi jism hajmiga teng: ${d} ml = ${d} sm³.` }; }\n  $('#s3-task').textContent = T3.t; $('#s3-ans').value = ''; const m = $('#s3-tmsg'); m.textContent = ''; m.className = 'msg';\n}\n$('#s3-tnew').onclick = s3NewTask;\n$('#s3-tchk').onclick = () => {\n  const v = parseNum($('#s3-ans').value), m = $('#s3-tmsg');\n  if (!isFinite(v)) { m.className = 'msg info'; m.textContent = 'Avval javobni son bilan yozing.'; return; }\n  if (Math.abs(v - T3.ans) \u003c .01) { m.className = 'msg ok'; m.textContent = 'To\\'g\\'ri! ' + T3.w; } else { m.className = 'msg no'; m.textContent = 'Hali emas. Yechim: ' + T3.w; }\n};\n$('#s3-ans').addEventListener('keydown', e => { if (e.key === 'Enter') $('#s3-tchk').click(); });\n\n/* ---------- 3-bo'lim testi ---------- */\nconst Q3 = [\n  { q: 'Menzurkada V₁ = 40 ml suv bor. Jism botirilgach V₂ = 64 ml bo\\'ldi. Jismning hajmi qancha?', o: ['104 sm³', '24 sm³', '64 sm³', '40 sm³'], a: 1, w: 'V = V₂ − V₁ = 64 − 40 = 24 ml = 24 sm³.' },\n  { q: 'Po\\'kak suvda suzadi. Uning hajmini o\\'lchash uchun nima kerak?', o: ['Cho\\'ktirgich', 'Issiq suv', 'Tuz', 'Katta menzurka'], a: 0, w: 'Cho\\'ktirgich po\\'kakni suvga to\\'liq botiradi. Avval cho\\'ktirgichning o\\'zi, keyin po\\'kak bilan birga o\\'lchanadi.' },\n  { q: 'Jism suvga to\\'liq botmasa, o\\'lchangan hajm qanday chiqadi?', o: ['Haqiqiydan kichik', 'Haqiqiydan katta', 'Aniq to\\'g\\'ri', 'Nolga teng'], a: 0, w: 'Jismning faqat bir qismi suvni siqib chiqaradi, shuning uchun sath kam ko\\'tariladi va hajm kichik chiqadi.' }\n];\n\n/* ============================================================\n   YAKUNIY TEST (10 ball). section — xato bo'lsa qaysi bo'limni qayta ko'rish kerak\n   ============================================================ */\nconst QF = [\n  { q: 'To\\'g\\'ri burchakli parallelepipedning o\\'lchamlari 4 sm, 3 sm va 2 sm. Hajmi qancha?', o: ['9 sm³', '14 sm³', '24 sm³', '48 sm³'], a: 2, w: 'V = a·b·c = 4·3·2 = 24 sm³.', s: 1 },\n  { q: '1 dm³ nimaga teng?', o: ['1 ml', '1 l', '10 l', '100 l'], a: 1, w: '1 dm³ = 1 l, 1 sm³ = 1 ml.', s: 1 },\n  { q: '1 m³ necha litr?', o: ['10 l', '100 l', '1000 l', '10 000 l'], a: 2, w: '1 m³ = 1000 dm³ = 1000 l.', s: 1 },\n  { q: 'Qirrasi 3 sm bo\\'lgan kubning hajmi qancha?', o: ['9 sm³', '27 sm³', '12 sm³', '6 sm³'], a: 1, w: 'V = a³ = 3·3·3 = 27 sm³.', s: 1 },\n  { q: 'Menzurkada bo\\'linma bahosi 5 ml. Suv sathi 30 ml belgisidan keyin 3 ta bo\\'linma yuqorida. Suv hajmi qancha?', o: ['33 ml', '35 ml', '45 ml', '60 ml'], a: 2, w: '30 + 3·5 = 45 ml.', s: 2 },\n  { q: 'Menzurkada suv sathi egri (menisk). Qaysi nuqta bo\\'yicha o\\'qiladi?', o: ['Meniskning pastki nuqtasi', 'Meniskning yuqori chekkasi', 'Menzurkaning tepasi', 'Istalgan nuqta'], a: 0, w: 'Suv uchun menisk pastki nuqtasi bo\\'yicha o\\'qiladi, ko\\'z esa sath bilan bir balandlikda bo\\'ladi.', s: 2 },\n  { q: 'Qum hajmini o\\'lchashda nima uchun sathni tekislash kerak?', o: ['Uyum cho\\'qqisi hajmni katta ko\\'rsatadi', 'Qum tez qurisin deb', 'Qum issiq bo\\'lmasin deb', 'Hech qanday sababi yo\\'q'], a: 0, w: 'Qum uyum bo\\'lib tushadi. Cho\\'qqisi bo\\'yicha o\\'qisak, hajm haqiqiydan katta chiqadi.', s: 2 },\n  { q: 'Tosh botirilganda suv sathi 50 ml dan 75 ml gacha ko\\'tarildi. Toshning hajmi qancha?', o: ['125 sm³', '50 sm³', '25 sm³', '75 sm³'], a: 2, w: 'V = 75 − 50 = 25 ml = 25 sm³.', s: 3 },\n  { q: 'Quyilish idishidan stakanga oqib tushgan suv hajmi nimaga teng?', o: ['Idish hajmiga', 'Jism hajmiga', 'Stakan hajmiga', 'Jism og\\'irligiga'], a: 1, w: 'Jism o\\'z hajmiga teng suvni siqib chiqaradi.', s: 3 },\n  { q: 'Jismda havo pufakchalari qolsa, o\\'lchangan hajm qanday bo\\'ladi?', o: ['Haqiqiydan kichik', 'Haqiqiydan katta', 'To\\'g\\'ri chiqadi', 'Nolga teng'], a: 1, w: 'Pufakchalar ham joy egallaydi, sath ko\\'proq ko\\'tariladi va hajm katta chiqadi.', s: 3 }\n];\nconst SEC_NAME = { 1: '1-bo\\'lim (to\\'g\\'ri shaklli jismlar)', 2: '2-bo\\'lim (suyuqlik va sochiluvchan moddalar)', 3: '3-bo\\'lim (noto\\'g\\'ri shaklli jismlar)' };\nlet qfWrong = new Set();\nfunction renderFinal() {\n  qfWrong = new Set(); $('#qf-res').innerHTML = '';\n  renderQuiz($('#qf'), QF, (score, answered, total, i, ok) => {\n    if (!ok) qfWrong.add(QF[i].s);\n    if (answered \u003c total) return;\n    const msg = score >= 9 ? 'A\\'lo! Hajmni o\\'lchashni yaxshi bilasan.' : score >= 7 ? 'Yaxshi natija.' : score >= 5 ? 'Qoniqarli. Yana bir bor mashq qilib ko\\'r.' : 'Nazariya va simulyatsiyalarni qayta ko\\'rib chiq.';\n    const rev = qfWrong.size ? '\u003cp>Qayta ko\\'rib chiq: ' + [...qfWrong].sort().map(s => SEC_NAME[s]).join('; ') + '.\u003c/p>' : '';\n    $('#qf-res').innerHTML = `\u003cdiv class=\"readout\">\u003csmall>Natija\u003c/small>\u003cspan class=\"score\">${score} / ${total}\u003c/span>\u003cp style=\"margin:6px 0 0\">${msg}\u003c/p>${rev}\u003cbutton class=\"btn\" id=\"qf-again\" style=\"margin-top:6px\">Qayta urinish\u003c/button>\u003c/div>`;\n    $('#qf-again').onclick = () => { renderFinal(); $('#final').scrollIntoView({ behavior: 'smooth' }); };\n    $('#qf-res').scrollIntoView({ behavior: 'smooth', block: 'nearest' });\n  });\n}\n\n/* ---------- Ishga tushirish ---------- */\nrenderQuiz($('#q1'), Q1); renderQuiz($('#q2'), Q2); renderQuiz($('#q3'), Q3); renderFinal();\ns1BuildSliders(); s1Refresh(); ucUpdate(); s1NewTask(); s3NewTask(); s3Setup();\n\u003c/script>\n\n\u003c/body>\u003c/html>"}, {"title": "Massani o'lchaymiz", "icon": "⚖️", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cstyle>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}\u003c/style>\n\u003ctitle>Massani o'lchaymiz\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nunito+Sans:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap\">\n\u003cstyle>\n/* Layout: one-column lab notebook. Sticky 3-step tabs; each section = short text + live \"stations\" (cards) */\n:root{\n  --bg:#EDF2F7; --surface:#FFFFFF; --surface2:#E3EBF4; --ink:#10233A; --muted:#51647A; --line:#C7D4E2;\n  --accent:#1060C9; --accent-ink:#FFFFFF; --brass:#E8A317; --brass-soft:#FFF0C7; --on-brass:#1B1400;\n  --good:#17824F; --good-soft:#DAF2E5; --bad:#C93A3A; --bad-soft:#FBE2E2; --metal:#7F93A8;\n  --font-display:'Unbounded','Trebuchet MS',sans-serif;\n  --font-body:'Nunito Sans','Segoe UI',system-ui,sans-serif;\n  --font-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#0C1622; --surface:#142234; --surface2:#1C2E44; --ink:#E6EEF7; --muted:#97AABF; --line:#2B405A;\n    --accent:#5AA2FF; --accent-ink:#07121F; --brass:#F2B631; --brass-soft:#3A2E0E; --on-brass:#1B1400;\n    --good:#4CC98A; --good-soft:#12382A; --bad:#FF7A7A; --bad-soft:#3E1A1A; --metal:#9DB1C6;\n    color-scheme:dark;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0C1622; --surface:#142234; --surface2:#1C2E44; --ink:#E6EEF7; --muted:#97AABF; --line:#2B405A;\n  --accent:#5AA2FF; --accent-ink:#07121F; --brass:#F2B631; --brass-soft:#3A2E0E; --on-brass:#1B1400;\n  --good:#4CC98A; --good-soft:#12382A; --bad:#FF7A7A; --bad-soft:#3E1A1A; --metal:#9DB1C6;\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.55;padding-inline:16px;padding-block:0 56px}\n.wrap{max-width:920px;margin-inline:auto}\n:focus-visible{outline:3px solid var(--accent);outline-offset:2px}\n\n.top{padding-block:24px 8px}\n.eyebrow{font:700 .78rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}\nh1{font:700 clamp(1.5rem,5.2vw,2.5rem)/1.15 var(--font-display);margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}\n.lead{margin:0;color:var(--muted);max-width:60ch}\n\n.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:8px;background:var(--bg);padding-block:10px;margin-block:10px 20px;border-bottom:1px solid var(--line)}\n.tabs button{flex:1 1 0;min-width:0;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 .92rem/1.2 var(--font-body);cursor:pointer;text-align:left}\n.tabs button[aria-selected=\"true\"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}\n.tn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brass);color:var(--on-brass);font:700 .85rem var(--font-mono)}\n@media (max-width:520px){.tabs button{font-size:.8rem;padding:6px}.tn{width:22px;height:22px;font-size:.75rem}}\n\n.panel{display:flex;flex-direction:column;gap:20px}\nh2{font:700 clamp(1.2rem,3.6vw,1.65rem)/1.2 var(--font-display);margin:0;text-wrap:balance}\nh3{font:800 1.1rem/1.3 var(--font-body);margin:0 0 6px}\nh4{font:800 1rem var(--font-body);margin:0 0 4px}\np{margin:0}\n.panel>p,.panel .txt{max-width:68ch}\n.hint{color:var(--muted);font-size:.95rem}\n.err{color:var(--bad);font-weight:700}\n\n.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}\n.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}\n.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font:700 .95rem var(--font-body);cursor:pointer}\n.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}\n.btn:disabled{opacity:.5;cursor:default}\n.inp{min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 1rem var(--font-mono);width:9.5rem;max-width:100%}\nselect.inp{width:auto;font-family:var(--font-body);font-weight:700}\ninput[type=range]{width:100%;accent-color:var(--accent);min-height:32px}\n.seg{display:flex;flex-wrap:wrap;gap:6px}\n.seg button{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 .92rem var(--font-body);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg);border-color:transparent}\n\n/* SVG token classes */\nsvg text{fill:var(--ink)}\n.f-ink{fill:var(--ink)}.f-surface{fill:var(--surface)}.f-surface2{fill:var(--surface2)}.f-brass{fill:var(--brass)}\n.f-accent{fill:var(--accent)}.f-metal{fill:var(--metal)}.f-good{fill:var(--good)}.f-bad{fill:var(--bad)}.f-muted{fill:var(--muted)}.f-none{fill:none}\n.s-ink{stroke:var(--ink)}.s-brass{stroke:var(--brass)}.s-accent{stroke:var(--accent)}.s-metal{stroke:var(--metal)}\n.s-muted{stroke:var(--muted)}.s-line{stroke:var(--line)}.s-good{stroke:var(--good)}.s-bad{stroke:var(--bad)}\nsvg line,svg polyline,svg path{stroke-linecap:round;stroke-linejoin:round}\n.tm{font:700 13px var(--font-mono)}.ts{font:700 10px var(--font-mono)}.tb{font:700 12px var(--font-body)}\n.stage{width:100%;height:auto;display:block;max-width:640px;margin-inline:auto;background:var(--surface2);border-radius:12px}\n.tsvg{width:100%;height:auto;display:block;max-width:460px;margin-inline:auto;background:var(--surface2);border-radius:12px}\n\n.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}\n.readouts>div{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}\n.readouts span{display:block;color:var(--muted);font-size:.85rem}\n.readouts b{font:700 1.25rem var(--font-mono);overflow-wrap:anywhere}\n.out{font-weight:700;min-height:3em}\n\n/* units */\n.rel{display:flex;flex-wrap:wrap;gap:4px 16px;font:600 .88rem var(--font-mono);color:var(--muted)}\n.ladder{display:grid;gap:4px}\n.lrow{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;min-width:0}\n.lrow.src{background:var(--brass-soft)}\n.lu{font:700 1rem var(--font-mono);color:var(--accent)}\n.ln{color:var(--muted);font-size:.9rem}\n.lv{font:700 1.05rem var(--font-mono);text-align:right;overflow-wrap:anywhere;animation:pop .35s ease-out}\n@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}\n\n/* compare */\n.cmp{display:grid;gap:8px}\n.crow{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 5.8rem;gap:10px;align-items:center;font-size:.95rem}\n.crow .nm{font-weight:700}\n.crow .lb{font:700 .85rem var(--font-mono);text-align:right}\n.trk{height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}\n.fil{height:100%;width:0;background:var(--accent);border-radius:7px;transition:width .9s cubic-bezier(.2,.8,.2,1)}\n@media (max-width:520px){.crow{grid-template-columns:5.4rem minmax(0,1fr) 4.8rem;gap:6px;font-size:.82rem}.crow .lb{font-size:.74rem}}\n\n/* quiz */\n.quiz-q{padding-block:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}\n.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}\n.opt{min-height:46px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 .98rem var(--font-body);cursor:pointer}\n.opt.ok{background:var(--good-soft);border-color:var(--good)}\n.opt.no{background:var(--bad-soft);border-color:var(--bad)}\n.qfb{font-weight:700;min-height:1.5em}\n.qfb.good{color:var(--good)}.qfb.bad{color:var(--bad)}\n.qsum{font-weight:800}\n\n/* scale type animations */\n.typedesc{display:grid;gap:8px}\n.a-tilt{transform-origin:160px 62px;animation:tilt 3.2s ease-in-out infinite alternate}\n@keyframes tilt{0%{transform:rotate(-9deg)}100%{transform:rotate(9deg)}}\n.a-pl{animation:pl 3.2s ease-in-out infinite alternate}\n.a-pr{animation:pl 3.2s ease-in-out infinite alternate-reverse}\n@keyframes pl{0%{transform:translateY(15.6px)}100%{transform:translateY(-15.6px)}}\n.a-drop{animation:drop 4.2s ease-in infinite}\n@keyframes drop{0%{transform:translateY(-80px);opacity:0}8%{opacity:1}20%,88%{transform:none;opacity:1}100%{transform:none;opacity:0}}\n.a-e0{animation:e0 4.2s linear infinite}.a-e1{animation:e1 4.2s linear infinite}\n@keyframes e0{0%,19%{opacity:1}21%,100%{opacity:0}}\n@keyframes e1{0%,19%{opacity:0}21%,88%{opacity:1}100%{opacity:0}}\n.a-sp{transform-origin:160px 40px;animation:stretch 4.6s ease-in-out infinite}\n@keyframes stretch{0%{transform:scaleY(1)}22%{transform:scaleY(1.7)}34%{transform:scaleY(1.52)}46%{transform:scaleY(1.66)}58%,90%{transform:scaleY(1.6)}100%{transform:scaleY(1)}}\n.a-wt{animation:wt 4.6s ease-in-out infinite}\n@keyframes wt{0%{transform:translateY(0)}22%{transform:translateY(42px)}34%{transform:translateY(31px)}46%{transform:translateY(40px)}58%,90%{transform:translateY(36px)}100%{transform:translateY(0)}}\n.a-bz{transform-origin:110px 70px;animation:bz 5.4s ease-in-out infinite}\n@keyframes bz{0%{transform:rotate(-7deg)}55%,92%{transform:rotate(0)}100%{transform:rotate(-7deg)}}\n.a-pz{animation:pz 5.4s ease-in-out infinite}\n@keyframes pz{0%{transform:translateX(0)}55%,92%{transform:translateX(100px)}100%{transform:translateX(0)}}\n.a-rs{animation:rs 5.4s linear infinite}\n@keyframes rs{0%,52%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}\n.a-tr{animation:tr 5.6s ease-out infinite}\n@keyframes tr{0%{transform:translateX(-330px)}38%,88%{transform:none}100%{transform:translateX(200px)}}\n.a-i0{animation:i0 5.6s linear infinite}.a-i1{animation:i1 5.6s linear infinite}\n@keyframes i0{0%,40%{opacity:1}44%,100%{opacity:0}}\n@keyframes i1{0%,40%{opacity:0}46%,84%{opacity:1}90%,100%{opacity:0}}\n\n/* balance simulator */\n.bal{display:flex;flex-direction:column;gap:10px}\n.bal-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n.bal-svg{width:100%;height:auto;display:block;max-width:560px;margin-inline:auto;background:var(--surface2);border-radius:12px;touch-action:pan-y}\n.bal-read{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}\n.bal-read>div{background:var(--surface2);border-radius:10px;padding:8px 12px;min-width:0}\n.bal-read span{display:block;color:var(--muted);font-size:.82rem}\n.bal-read b{font:700 1.05rem var(--font-mono);overflow-wrap:anywhere}\n.bal-msg{font-weight:800;min-height:3.1em}\n.bal-msg.good{color:var(--good)}.bal-msg.warn{color:var(--accent)}\n.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-block:4px}\n.wchip{touch-action:none;user-select:none;-webkit-user-select:none;min-width:58px;min-height:48px;padding:0 10px;border-radius:12px;background:var(--brass);color:var(--on-brass);border:2px solid var(--ink);font:700 1rem var(--font-mono);cursor:grab}\n.wchip.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.35)}\n.wt{cursor:pointer}\n.wtxt{font:700 8px var(--font-mono);fill:var(--on-brass)}\n.hit{fill:var(--accent);opacity:0;transition:opacity .15s}\n.hit.on{opacity:.16}\n\n.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;list-style:none;margin:0;padding:0}\n.checks li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}\n.checks li::before{content:\"\";flex:none;width:18px;height:18px;margin-top:3px;border-radius:5px;background:var(--good);clip-path:polygon(14% 52%,0 66%,38% 100%,100% 22%,86% 8%,38% 72%)}\n.steps{margin:0;padding-left:1.3rem;display:grid;gap:6px}\n.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}\nul.plain{margin:0;padding-left:1.2rem;display:grid;gap:4px}\n\n.tbl-wrap{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;min-width:500px}\nth,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}\nth{font:700 .8rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\ntd .inp{width:7rem}\n.st-ok{color:var(--good);font-weight:800}.st-no{color:var(--bad);font-weight:800}\ntextarea.inp{width:100%;min-height:90px;padding:10px 12px;font:600 1rem var(--font-body)}\n.note{background:var(--brass-soft);border-radius:12px;padding:12px 14px}\n\n.prob{display:flex;flex-direction:column;gap:10px}\n.lvl{font:700 .75rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n.fb{font-weight:800;min-height:1.4em}\n.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}\n.sol{margin:0;padding:10px 12px 10px 2rem;background:var(--surface2);border-radius:12px;display:grid;gap:4px}\n.sol li{animation:pop .4s ease-out}\n.score{display:flex;flex-direction:column;gap:10px}\n.score big{font:700 2rem var(--font-display)}\n.bar{height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}\n.bar>i{display:block;height:100%;width:0;background:var(--good);transition:width .6s ease}\ndetails{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}\nsummary{font-weight:800;cursor:pointer;min-height:32px}\ndetails[open] summary{margin-bottom:8px}\n.nav-next{display:flex;justify-content:flex-end}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003cheader class=\"top\">\n  \u003cp class=\"eyebrow\">7-sinf · Fizika\u003c/p>\n  \u003ch1>Massani qanday o'lchaymiz?\u003c/h1>\n  \u003cp class=\"lead\">Aravachalarni itaring, jismlarni tortib ko'ring, pallali tarozida o'zingiz o'lchang va masalalar yeching.\u003c/p>\n\u003c/header>\n\n\u003cnav class=\"tabs\" role=\"tablist\" aria-label=\"Dars bo'limlari\">\n  \u003cbutton type=\"button\" role=\"tab\" id=\"tab1\" aria-controls=\"sec1\" aria-selected=\"true\">\u003cspan class=\"tn\">1\u003c/span>\u003cspan>Massa va birliklar\u003c/span>\u003c/button>\n  \u003cbutton type=\"button\" role=\"tab\" id=\"tab2\" aria-controls=\"sec2\" aria-selected=\"false\" tabindex=\"-1\">\u003cspan class=\"tn\">2\u003c/span>\u003cspan>Tarozilar\u003c/span>\u003c/button>\n  \u003cbutton type=\"button\" role=\"tab\" id=\"tab3\" aria-controls=\"sec3\" aria-selected=\"false\" tabindex=\"-1\">\u003cspan class=\"tn\">3\u003c/span>\u003cspan>Amaliy ish, masalalar\u003c/span>\u003c/button>\n\u003c/nav>\n\n\u003c!-- ============ 1-bo'lim ============ -->\n\u003csection class=\"panel\" id=\"sec1\" role=\"tabpanel\" aria-labelledby=\"tab1\">\n  \u003ch2>Massa tushunchasi va birliklari\u003c/h2>\n  \u003cp class=\"txt\">\u003cb>Massa\u003c/b> jismda qancha modda borligini ko'rsatadi va jism harakat holatini o'zgartirishga qanchalik qarshilik qilishini belgilaydi. Massa \u003cb>m\u003c/b> harfi bilan belgilanadi, SI da birligi \u003cb>kilogramm (kg)\u003c/b>. Bir litr suvning massasi taxminan 1 kg.\u003c/p>\n\n  \u003cdiv class=\"card\" id=\"inertiaSt\">\n    \u003ch3>Inersiya: massasi katta jism qiyin qo'zg'aladi\u003c/h3>\n    \u003cp class=\"hint\">Ikkala aravachaga bir xil kuch ta'sir qiladi. Qaysi biri tezroq ketadi?\u003c/p>\n    \u003csvg class=\"stage\" viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Ikki aravacha poygasi: 1 kg va 4 kg\">\n      \u003cline class=\"s-metal\" x1=\"20\" y1=\"80\" x2=\"580\" y2=\"80\" stroke-width=\"3\"/>\n      \u003cline class=\"s-metal\" x1=\"20\" y1=\"170\" x2=\"580\" y2=\"170\" stroke-width=\"3\"/>\n      \u003cline class=\"s-bad\" x1=\"520\" y1=\"20\" x2=\"520\" y2=\"200\" stroke-width=\"3\" stroke-dasharray=\"6 6\"/>\n      \u003ctext class=\"tb\" x=\"526\" y=\"34\">marra\u003c/text>\n      \u003cpath class=\"f-none s-accent\" d=\"M6 59H34M27 52L34 59L27 66\" stroke-width=\"3\"/>\u003ctext class=\"tm\" x=\"8\" y=\"46\">F\u003c/text>\n      \u003cpath class=\"f-none s-accent\" d=\"M6 140H34M27 133L34 140L27 147\" stroke-width=\"3\"/>\u003ctext class=\"tm\" x=\"8\" y=\"127\">F\u003c/text>\n      \u003cg id=\"cart1\" transform=\"translate(40 80)\">\n        \u003crect class=\"f-accent\" x=\"0\" y=\"-34\" width=\"64\" height=\"26\" rx=\"5\"/>\n        \u003ccircle class=\"f-ink\" cx=\"14\" cy=\"-6\" r=\"7\"/>\u003ccircle class=\"f-ink\" cx=\"50\" cy=\"-6\" r=\"7\"/>\n        \u003ctext class=\"tm\" x=\"32\" y=\"-16\" text-anchor=\"middle\" style=\"fill:var(--accent-ink)\">1 kg\u003c/text>\n      \u003c/g>\n      \u003cg id=\"cart2\" transform=\"translate(40 170)\">\n        \u003crect class=\"f-brass\" x=\"0\" y=\"-52\" width=\"88\" height=\"44\" rx=\"6\"/>\n        \u003ccircle class=\"f-ink\" cx=\"18\" cy=\"-8\" r=\"8\"/>\u003ccircle class=\"f-ink\" cx=\"70\" cy=\"-8\" r=\"8\"/>\n        \u003ctext class=\"tm\" x=\"44\" y=\"-26\" text-anchor=\"middle\" style=\"fill:var(--on-brass)\">4 kg\u003c/text>\n      \u003c/g>\n    \u003c/svg>\n    \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn primary\" id=\"pushBtn\">Itarish\u003c/button>\u003cbutton type=\"button\" class=\"btn\" id=\"pushReset\">Qaytarish\u003c/button>\u003c/div>\n    \u003cp class=\"out\" id=\"inertiaOut\" aria-live=\"polite\">\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" id=\"weightSt\">\n    \u003ch3>Massa va og'irlik bir narsa emas\u003c/h3>\n    \u003cp class=\"hint\">Prujinali tarozi (dinamometr) jismning og'irligini ko'rsatadi. Sayyorani almashtiring va massani o'zgartirib ko'ring.\u003c/p>\n    \u003cdiv class=\"seg\" id=\"planetSeg\" role=\"group\" aria-label=\"Sayyora\">\n      \u003cbutton type=\"button\" data-g=\"9.8\" data-n=\"Yer\" data-c=\"#2F7BD9\" aria-pressed=\"true\">Yer\u003c/button>\n      \u003cbutton type=\"button\" data-g=\"1.6\" data-n=\"Oy\" data-c=\"#A9A9A0\" aria-pressed=\"false\">Oy\u003c/button>\n      \u003cbutton type=\"button\" data-g=\"3.7\" data-n=\"Mars\" data-c=\"#C4562F\" aria-pressed=\"false\">Mars\u003c/button>\n    \u003c/div>\n    \u003clabel for=\"massSl\">Jism massasi: \u003cb id=\"massV\">5\u003c/b> kg\u003c/label>\n    \u003cinput type=\"range\" id=\"massSl\" min=\"1\" max=\"10\" step=\"1\" value=\"5\">\n    \u003csvg class=\"stage\" viewBox=\"0 0 320 290\" role=\"img\" aria-label=\"Dinamometrga osilgan jism\">\n      \u003ccircle id=\"planet\" cx=\"262\" cy=\"70\" r=\"32\" fill=\"#2F7BD9\"/>\n      \u003ctext id=\"pname\" class=\"tb\" x=\"262\" y=\"122\" text-anchor=\"middle\">Yer\u003c/text>\n      \u003ctext class=\"ts\" x=\"100\" y=\"46\" text-anchor=\"end\">N\u003c/text>\n      \u003cg id=\"ticks\">\u003c/g>\n      \u003crect class=\"f-surface2 s-metal\" x=\"146\" y=\"12\" width=\"28\" height=\"28\" rx=\"6\" stroke-width=\"2\"/>\n      \u003cpolyline id=\"spring\" class=\"f-none s-metal\" stroke-width=\"3\" points=\"160,40 160,100\"/>\n      \u003cline id=\"ptrL\" class=\"s-accent\" x1=\"112\" x2=\"148\" y1=\"56\" y2=\"56\" stroke-width=\"2.5\"/>\n      \u003cline id=\"hookL\" class=\"s-metal\" x1=\"160\" x2=\"160\" y1=\"56\" y2=\"68\" stroke-width=\"3\"/>\n      \u003crect id=\"blk\" class=\"f-brass s-ink\" x=\"135\" y=\"68\" width=\"50\" height=\"40\" rx=\"6\" stroke-width=\"2\"/>\n      \u003ctext id=\"blkT\" class=\"tm\" x=\"160\" y=\"92\" text-anchor=\"middle\" style=\"fill:var(--on-brass)\">5 kg\u003c/text>\n    \u003c/svg>\n    \u003cdiv class=\"readouts\">\n      \u003cdiv>\u003cspan>Massa m\u003c/span>\u003cb id=\"rM\">5 kg\u003c/b>\u003c/div>\n      \u003cdiv>\u003cspan>Og'irlik P = m · g\u003c/span>\u003cb id=\"rW\">49 N\u003c/b>\u003c/div>\n      \u003cdiv>\u003cspan>Erkin tushish tezlanishi g\u003c/span>\u003cb id=\"rG\">9,8 N/kg\u003c/b>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"out\" aria-live=\"polite\">Massa hamma joyda bir xil. Og'irlik esa sayyoraning tortishiga bog'liq.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" id=\"unitSt\">\n    \u003ch3>Massa birliklarini o'tkazish\u003c/h3>\n    \u003cdiv class=\"rel\">\u003cspan>1 t = 1000 kg\u003c/span>\u003cspan>1 s = 100 kg\u003c/span>\u003cspan>1 kg = 1000 g\u003c/span>\u003cspan>1 g = 1000 mg\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\n      \u003clabel for=\"uVal\" class=\"hint\">Qiymat:\u003c/label>\n      \u003cinput class=\"inp\" id=\"uVal\" type=\"text\" inputmode=\"decimal\" value=\"2,5\" autocomplete=\"off\">\n      \u003clabel for=\"uFrom\" class=\"hint\">birlik:\u003c/label>\n      \u003cselect class=\"inp\" id=\"uFrom\" aria-label=\"Birlik\">\n        \u003coption value=\"t\">t (tonna)\u003c/option>\u003coption value=\"s\">s (sentner)\u003c/option>\u003coption value=\"kg\" selected>kg (kilogramm)\u003c/option>\u003coption value=\"g\">g (gramm)\u003c/option>\u003coption value=\"mg\">mg (milligramm)\u003c/option>\n      \u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"seg\" id=\"uQuick\" role=\"group\" aria-label=\"Tayyor misollar\">\n      \u003cbutton type=\"button\" data-v=\"2,5\" data-u=\"kg\" aria-pressed=\"false\">2,5 kg\u003c/button>\n      \u003cbutton type=\"button\" data-v=\"450\" data-u=\"g\" aria-pressed=\"false\">450 g\u003c/button>\n      \u003cbutton type=\"button\" data-v=\"3\" data-u=\"t\" aria-pressed=\"false\">3 t\u003c/button>\n      \u003cbutton type=\"button\" data-v=\"120\" data-u=\"mg\" aria-pressed=\"false\">120 mg\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"ladder\" id=\"uLadder\" aria-live=\"polite\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" id=\"cmpSt\">\n    \u003ch3>Turli jismlarning massasi\u003c/h3>\n    \u003cp class=\"hint\">Shkala logarifmik: har bir katak massani 10 baravar oshiradi, shuning uchun qum donasi ham, kema ham bitta chizmaga sig'adi.\u003c/p>\n    \u003cdiv class=\"cmp\" id=\"cmp\">\u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"cmpReplay\">Qayta ijro\u003c/button>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" id=\"quiz1\">\n    \u003ch3>Bilimingizni tekshiring\u003c/h3>\n  \u003c/div>\n  \u003cdiv class=\"nav-next\">\u003cbutton type=\"button\" class=\"btn primary\" data-go=\"1\">2-bo'lim: Tarozilar →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 2-bo'lim ============ -->\n\u003csection class=\"panel\" id=\"sec2\" role=\"tabpanel\" aria-labelledby=\"tab2\" hidden>\n  \u003ch2>Tarozilar va o'lchash usullari\u003c/h2>\n  \u003cp class=\"txt\">Massani tarozi bilan o'lchaymiz. Tarozining turi o'lchanadigan jismga va kerakli aniqlikka qarab tanlanadi: zargar bir necha milligrammni, port esa yuzlab tonnani o'lchaydi.\u003c/p>\n\n  \u003cdiv class=\"card\" id=\"typeSt\">\n    \u003ch3>Tarozi turlari va ishlash prinsipi\u003c/h3>\n    \u003cdiv class=\"seg\" id=\"typeSeg\" role=\"group\" aria-label=\"Tarozi turi\">\u003c/div>\n    \u003cdiv id=\"typeStage\">\u003c/div>\n    \u003cdiv class=\"typedesc\" id=\"typeDesc\" aria-live=\"polite\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" id=\"balSt1\">\n    \u003ch3>Pallali tarozi simulyatsiyasi\u003c/h3>\n    \u003cp class=\"hint\">Jism chap pallada. Toshlarni o'ng pallaga sudrab keling (yoki ustiga bosing). Shayin o'rtada to'xtaganda massa topiladi.\u003c/p>\n    \u003cdiv id=\"bal1\">\u003c/div>\n  \u003c/div>\n\n  \u003ch3 style=\"margin-top:4px\">Tarozida to'g'ri o'lchash qoidalari\u003c/h3>\n  \u003cul class=\"checks\">\n    \u003cli>Tarozini tekis va qattiq joyga qo'ying.\u003c/li>\n    \u003cli>O'lchashdan oldin shayin o'rtada turganini (nolni) tekshiring.\u003c/li>\n    \u003cli>Jismni chap pallaga, toshlarni o'ng pallaga qo'ying.\u003c/li>\n    \u003cli>Toshlarni faqat pinset bilan oling. Qo'l terlari va kir toshning massasini o'zgartiradi.\u003c/li>\n    \u003cli>Avval kattaroq toshni qo'ying. Ko'p kelsa, olib, kichikrog'ini sinang.\u003c/li>\n    \u003cli>Jismni va toshlarni pallaga ehtiyotkorlik bilan qo'ying, tarozining eng katta chegarasidan oshirmang.\u003c/li>\n    \u003cli>Nam yoki ifloslangan jismni to'g'ridan-to'g'ri pallaga qo'ymang, ostiga toza qog'oz yozing.\u003c/li>\n    \u003cli>Natijani yozishdan oldin toshlar massasini qo'shib, birligini yozishni unutmang.\u003c/li>\n  \u003c/ul>\n\n  \u003cdiv class=\"card\" id=\"divSt\">\n    \u003ch3>Bo'linma qiymati va o'lchash xatoligi\u003c/h3>\n    \u003cp class=\"txt\">Shkalaning ikki yaqin raqami orasidagi farqni ular orasidagi bo'linmalar soniga bo'lsak, bo'linma qiymati chiqadi. Masalan, 200 g va 210 g orasida 10 ta chiziqcha bo'lsa: (210 − 200) ÷ 10 = 1 g. Tarozi massani faqat bo'linma aniqligida ko'rsatadi, shuning uchun o'lchash xatoligi taxminan bo'linmaning yarmiga teng.\u003c/p>\n    \u003cdiv class=\"seg\" id=\"divSeg\" role=\"group\" aria-label=\"Bo'linma qiymati\">\u003c/div>\n    \u003clabel for=\"trueM\">Jismning haqiqiy massasi: \u003cb id=\"trueV\">237\u003c/b> g\u003c/label>\n    \u003cinput type=\"range\" id=\"trueM\" min=\"200\" max=\"280\" step=\"1\" value=\"237\">\n    \u003csvg id=\"divSvg\" class=\"stage\" viewBox=\"0 0 440 120\" role=\"img\" aria-label=\"Tarozi shkalasi\">\u003c/svg>\n    \u003cdiv class=\"readouts\">\n      \u003cdiv>\u003cspan>Bo'linma qiymati\u003c/span>\u003cb id=\"dvD\">10 g\u003c/b>\u003c/div>\n      \u003cdiv>\u003cspan>Tarozi ko'rsatadi\u003c/span>\u003cb id=\"dvR\">240 g\u003c/b>\u003c/div>\n      \u003cdiv>\u003cspan>Haqiqiydan farqi\u003c/span>\u003cb id=\"dvE\">3 g\u003c/b>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"nav-next\">\u003cbutton type=\"button\" class=\"btn primary\" data-go=\"2\">3-bo'lim: Amaliy ish →\u003c/button>\u003c/div>\n\u003c/section>\n\n\u003c!-- ============ 3-bo'lim ============ -->\n\u003csection class=\"panel\" id=\"sec3\" role=\"tabpanel\" aria-labelledby=\"tab3\" hidden>\n  \u003ch2>Amaliy ish va masalalar\u003c/h2>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>Amaliy ish: pallali tarozi yordamida jism massasini o'lchash\u003c/h3>\n    \u003cdiv class=\"two\">\n      \u003cdiv>\u003ch4>Maqsad\u003c/h4>\u003cp>Pallali tarozida jism massasini o'lchashni o'rganish va natijani gramm hamda kilogrammda yozish.\u003c/p>\u003c/div>\n      \u003cdiv>\u003ch4>Kerakli jihozlar\u003c/h4>\n        \u003cul class=\"plain\">\u003cli>Pallali tarozi\u003c/li>\u003cli>Tarozi toshlari (1 g dan 100 g gacha) va pinset\u003c/li>\u003cli>Jismlar: tanga, kalit, qalam, olma\u003c/li>\u003c/ul>\u003c/div>\n    \u003c/div>\n    \u003ch4>Ish tartibi\u003c/h4>\n    \u003col class=\"steps\">\n      \u003cli>Tarozini tekis stolga qo'ying va shayin o'rtada turganini tekshiring.\u003c/li>\n      \u003cli>O'lchanadigan jismni chap pallaga qo'ying.\u003c/li>\n      \u003cli>O'ng pallaga eng katta toshdan boshlab qo'ying. Shayin teskari tomonga og'sa, toshni olib, kichikrog'ini qo'ying.\u003c/li>\n      \u003cli>Shayin o'rtada to'xtaguncha toshlarni qo'shing yoki almashtiring.\u003c/li>\n      \u003cli>Pallada turgan toshlarning massalarini qo'shib, jism massasini toping.\u003c/li>\n      \u003cli>Natijani gramm va kilogrammda jadvalga yozing.\u003c/li>\n      \u003cli>Boshqa jismlar uchun o'lchashni takrorlang va xulosa yozing.\u003c/li>\n    \u003c/ol>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" id=\"labSt\">\n    \u003ch3>Virtual laboratoriya\u003c/h3>\n    \u003cp class=\"hint\">Jismni tanlang, tarozida o'lchang, toshlar massalarini o'zingiz qo'shing va natijani jadvalga yozing.\u003c/p>\n    \u003cdiv class=\"seg\" id=\"labSeg\" role=\"group\" aria-label=\"Jismni tanlang\">\u003c/div>\n    \u003cdiv id=\"bal2\">\u003c/div>\n    \u003cdiv class=\"tbl-wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Jism\u003c/th>\u003cth>Massa (g)\u003c/th>\u003cth>Massa (kg)\u003c/th>\u003cth>Tekshiruv\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody id=\"labRows\">\u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cdiv class=\"row\">\n      \u003cbutton type=\"button\" class=\"btn primary\" id=\"labCheck\">Natijalarni tekshirish\u003c/button>\n      \u003cbutton type=\"button\" class=\"btn\" id=\"labNew\">Yangi jismlar\u003c/button>\n    \u003c/div>\n    \u003cp class=\"out\" id=\"labOut\" aria-live=\"polite\">\u003c/p>\n    \u003clabel for=\"labXul\">\u003cb>Xulosa\u003c/b>\u003c/label>\n    \u003ctextarea class=\"inp\" id=\"labXul\" placeholder=\"Masalan: Pallali tarozi yordamida tanga, kalit, qalam va olmaning massasini o'lchadim. Eng og'ir jism ... bo'ldi.\">\u003c/textarea>\n    \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"xulShow\">Namunaviy xulosa\u003c/button>\u003c/div>\n    \u003cp class=\"note\" id=\"xulNote\" hidden>Pallali tarozi yordamida jismlarning massasini o'lchadim. Jism massasi o'ng pallaga qo'yilgan toshlar massalari yig'indisiga teng bo'lganda shayin o'rtada to'xtadi. Olma eng og'ir, tanga eng yengil jism bo'ldi. O'lchash xatoligi eng kichik tosh massasi (1 g) bilan chegaralanadi.\u003c/p>\n  \u003c/div>\n\n  \u003ch3 style=\"margin-top:4px\">Masalalar\u003c/h3>\n  \u003cdiv id=\"probs\" style=\"display:grid;gap:16px\">\u003c/div>\n  \u003cdiv class=\"card score\" id=\"scoreCard\">\n    \u003ch3>Natija\u003c/h3>\n    \u003cbig id=\"scoreBig\">0 / 7\u003c/big>\n    \u003cdiv class=\"bar\" aria-hidden=\"true\">\u003ci id=\"scoreBar\">\u003c/i>\u003c/div>\n    \u003cp class=\"out\" id=\"scoreMsg\" aria-live=\"polite\">Masalalarni yeching, ball shu yerda ko'rinadi. Yechimni ko'rmasdan topilgan to'g'ri javob 1 ball beradi.\u003c/p>\n    \u003cdiv class=\"row\">\u003cbutton type=\"button\" class=\"btn\" id=\"probReset\">Qaytadan boshlash\u003c/button>\u003c/div>\n  \u003c/div>\n\n  \u003cdetails>\n    \u003csummary>O'qituvchi uchun metodik tavsiya (45 daqiqa)\u003c/summary>\n    \u003cul class=\"plain\">\n      \u003cli>\u003cb>3 daqiqa.\u003c/b> Motivatsiya: «Itarish» animatsiyasi, savol: nega og'ir aravacha sekin tezlanadi?\u003c/li>\n      \u003cli>\u003cb>10 daqiqa.\u003c/b> Massa tushunchasi, birliklar va o'tkazgich. Massa va og'irlik farqi (Yer, Oy, Mars).\u003c/li>\n      \u003cli>\u003cb>10 daqiqa.\u003c/b> Tarozi turlari animatsiyasi, pallali tarozi simulyatsiyasi, qoidalar.\u003c/li>\n      \u003cli>\u003cb>12 daqiqa.\u003c/b> Amaliy ish juftlikda: virtual laboratoriya, jadval va xulosa. Imkon bo'lsa, haqiqiy tarozida takrorlang.\u003c/li>\n      \u003cli>\u003cb>7 daqiqa.\u003c/b> Masalalar: oson va o'rta darajalar sinfda, qiyini uyga vazifa.\u003c/li>\n      \u003cli>\u003cb>3 daqiqa.\u003c/b> Xulosa va baholash: o'quvchilar to'plagan ball bo'yicha.\u003c/li>\n    \u003c/ul>\n    \u003cp class=\"hint\" style=\"margin-top:8px\">Maslahat: bo'linma qiymati simulyatsiyasida o'quvchilardan «tarozi nima uchun aniq massani ko'rsata olmaydi?» savoliga javob so'rang.\u003c/p>\n  \u003c/details>\n\u003c/section>\n\u003c/div>\n\u003cscript>\n/* ---------- Yordamchi funksiyalar ---------- */\nconst $ = (s, r) => (r || document).querySelector(s);\nconst $$ = (s, r) => Array.from((r || document).querySelectorAll(s));\nconst reduce = !!(window.matchMedia && matchMedia(\"(prefers-reduced-motion: reduce)\").matches);\nconst randint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));\n\nfunction parseNum(s) {\n  const t = String(s).trim().replace(/\\s/g, \"\").replace(\",\", \".\");\n  if (t === \"\") return NaN;\n  const v = Number(t);\n  return isFinite(v) ? v : NaN;\n}\nfunction fmt(v, d) {\n  d = d === undefined ? 9 : d;\n  return Number(v.toPrecision(12)).toLocaleString(\"ru-RU\", { maximumFractionDigits: d });\n}\nfunction tween(from, to, ms, fn, done) {\n  if (reduce) { fn(to); if (done) done(); return; }\n  const t0 = performance.now();\n  (function f(t) {\n    const k = Math.min(1, (t - t0) / ms);\n    const e = 1 - Math.pow(1 - k, 3);\n    fn(from + (to - from) * e);\n    if (k \u003c 1) requestAnimationFrame(f); else if (done) done();\n  })(t0);\n}\n\n/* ---------- Bo'limlar (tablar) ---------- */\nconst tabBtns = $$(\".tabs button\");\nconst panels = $$(\"section.panel\");\nfunction showTab(i, focus) {\n  tabBtns.forEach((b, k) => { b.setAttribute(\"aria-selected\", String(k === i)); b.tabIndex = k === i ? 0 : -1; });\n  panels.forEach((p, k) => { p.hidden = k !== i; });\n  if (i === 0) playCompare();\n  if (focus) tabBtns[i].focus();\n  window.scrollTo(0, 0);\n}\ntabBtns.forEach((b, i) => {\n  b.addEventListener(\"click\", () => showTab(i));\n  b.addEventListener(\"keydown\", e => {\n    if (e.key === \"ArrowRight\") showTab((i + 1) % 3, true);\n    if (e.key === \"ArrowLeft\") showTab((i + 2) % 3, true);\n  });\n});\n$$(\"[data-go]\").forEach(b => b.addEventListener(\"click\", () => showTab(Number(b.dataset.go))));\n\n/* ---------- 1. Inersiya animatsiyasi ---------- */\n(function () {\n  const c1 = $(\"#cart1\"), c2 = $(\"#cart2\"), out = $(\"#inertiaOut\"), push = $(\"#pushBtn\");\n  const A1 = 120, A2 = A1 / 4, T = 2.6;\n  let raf = 0;\n  function place(x1, x2) {\n    c1.setAttribute(\"transform\", \"translate(\" + (40 + x1) + \" 80)\");\n    c2.setAttribute(\"transform\", \"translate(\" + (40 + x2) + \" 170)\");\n  }\n  function finish() {\n    const x1 = 0.5 * A1 * T * T, x2 = 0.5 * A2 * T * T;\n    place(x1, x2);\n    out.textContent = \"Bir xil kuch ta'sirida 1 kg li aravacha \" + Math.round(x1 / x2) + \" marta uzoqroq yurdi. Massa katta bo'lsa, inersiya ham katta: tezlikni o'zgartirish qiyinroq.\";\n    push.disabled = false;\n  }\n  function reset() {\n    cancelAnimationFrame(raf);\n    place(0, 0);\n    out.textContent = \"Aravachalarni itarish uchun tugmani bosing.\";\n    push.disabled = false;\n  }\n  push.addEventListener(\"click\", () => {\n    push.disabled = true;\n    out.textContent = \"\";\n    if (reduce) { finish(); return; }\n    const t0 = performance.now();\n    (function f(now) {\n      const t = Math.min(T, (now - t0) / 1000);\n      place(0.5 * A1 * t * t, 0.5 * A2 * t * t);\n      if (t \u003c T) raf = requestAnimationFrame(f); else finish();\n    })(t0);\n  });\n  $(\"#pushReset\").addEventListener(\"click\", reset);\n  reset();\n})();\n\n/* ---------- 1. Massa va og'irlik (dinamometr) ---------- */\n(function () {\n  const sp = $(\"#spring\"), blk = $(\"#blk\"), blkT = $(\"#blkT\"), hookL = $(\"#hookL\"), ptr = $(\"#ptrL\");\n  let g = 9.8, m = 5, L = 16 + m * g * 1.4;\n  const ticks = $(\"#ticks\");\n  let tk = \"\";\n  for (let P = 0; P \u003c= 100; P += 20) {\n    const y = 56 + P * 1.4;\n    tk += '\u003cline class=\"s-muted\" x1=\"100\" x2=\"112\" y1=\"' + y + '\" y2=\"' + y + '\" stroke-width=\"2\"/>\u003ctext class=\"ts\" x=\"94\" y=\"' + (y + 3.5) + '\" text-anchor=\"end\">' + P + \"\u003c/text>\";\n  }\n  ticks.innerHTML = tk;\n\n  function draw(len) {\n    const n = 14, top = 40, pts = [];\n    for (let i = 0; i \u003c= n; i++) {\n      const y = top + len * i / n;\n      const x = 160 + (i === 0 || i === n ? 0 : (i % 2 ? -12 : 12));\n      pts.push(x.toFixed(1) + \",\" + y.toFixed(1));\n    }\n    sp.setAttribute(\"points\", pts.join(\" \"));\n    const end = top + len, w = 44 + m * 3, h = 30 + m * 2;\n    ptr.setAttribute(\"y1\", end); ptr.setAttribute(\"y2\", end);\n    hookL.setAttribute(\"y1\", end); hookL.setAttribute(\"y2\", end + 12);\n    blk.setAttribute(\"x\", 160 - w / 2); blk.setAttribute(\"y\", end + 12);\n    blk.setAttribute(\"width\", w); blk.setAttribute(\"height\", h);\n    blkT.setAttribute(\"x\", 160); blkT.setAttribute(\"y\", end + 12 + h / 2 + 5);\n    blkT.textContent = m + \" kg\";\n  }\n  function update(animate) {\n    const P = m * g;\n    $(\"#massV\").textContent = m;\n    $(\"#rM\").textContent = m + \" kg\";\n    $(\"#rW\").textContent = fmt(P, 1) + \" N\";\n    $(\"#rG\").textContent = fmt(g, 1) + \" N/kg\";\n    const target = 16 + P * 1.4;\n    if (animate) tween(L, target, 700, v => { L = v; draw(v); });\n    else { L = target; draw(L); }\n  }\n  $$(\"#planetSeg button\").forEach(b => b.addEventListener(\"click\", () => {\n    $$(\"#planetSeg button\").forEach(x => x.setAttribute(\"aria-pressed\", String(x === b)));\n    g = Number(b.dataset.g);\n    $(\"#planet\").setAttribute(\"fill\", b.dataset.c);\n    $(\"#pname\").textContent = b.dataset.n;\n    update(true);\n  }));\n  $(\"#massSl\").addEventListener(\"input\", e => { m = Number(e.target.value); update(false); });\n  update(false);\n})();\n\n/* ---------- 1. Birliklarni o'tkazish ---------- */\n(function () {\n  const U = { t: 1000, s: 100, kg: 1, g: 1e-3, mg: 1e-6 };\n  const ORDER = [\"t\", \"s\", \"kg\", \"g\", \"mg\"];\n  const NAMES = { t: \"tonna\", s: \"sentner\", kg: \"kilogramm\", g: \"gramm\", mg: \"milligramm\" };\n  const box = $(\"#uLadder\");\n  function render() {\n    const v = parseNum($(\"#uVal\").value), from = $(\"#uFrom\").value;\n    box.innerHTML = \"\";\n    if (isNaN(v) || v \u003c 0) { box.innerHTML = '\u003cp class=\"err\">Musbat son kiriting, masalan 2,5\u003c/p>'; return; }\n    const kg = v * U[from];\n    ORDER.forEach(u => {\n      const row = document.createElement(\"div\");\n      row.className = \"lrow\" + (u === from ? \" src\" : \"\");\n      row.innerHTML = '\u003cspan class=\"lu\">' + u + '\u003c/span>\u003cspan class=\"ln\">' + NAMES[u] + '\u003c/span>\u003cb class=\"lv\">' + fmt(kg / U[u], 12) + \"\u003c/b>\";\n      box.appendChild(row);\n    });\n  }\n  $(\"#uVal\").addEventListener(\"input\", render);\n  $(\"#uFrom\").addEventListener(\"change\", render);\n  $$(\"#uQuick button\").forEach(b => b.addEventListener(\"click\", () => {\n    $(\"#uVal\").value = b.dataset.v; $(\"#uFrom\").value = b.dataset.u;\n    $$(\"#uQuick button\").forEach(x => x.setAttribute(\"aria-pressed\", String(x === b)));\n    render();\n  }));\n  render();\n})();\n\n/* ---------- 1. Jismlar massasini taqqoslash ---------- */\nconst OBJ = [\n  [\"Qum donasi\", 1e-6], [\"Yomg'ir tomchisi\", 5e-5], [\"Tanga\", 5e-3], [\"Qalam\", 0.01], [\"Olma\", 0.15],\n  [\"Kitob\", 0.4], [\"O'quvchi\", 40], [\"Avtomobil\", 1500], [\"Fil\", 5000], [\"Yuk kemasi\", 5e7]\n];\nfunction massLabel(kg) {\n  if (kg >= 1000) return fmt(kg / 1000, 3) + \" t\";\n  if (kg >= 1) return fmt(kg, 3) + \" kg\";\n  if (kg >= 1e-3) return fmt(kg * 1000, 3) + \" g\";\n  return fmt(kg * 1e6, 3) + \" mg\";\n}\n(function () {\n  const box = $(\"#cmp\");\n  OBJ.forEach(o => {\n    const r = document.createElement(\"div\");\n    r.className = \"crow\";\n    r.innerHTML = '\u003cspan class=\"nm\">' + o[0] + '\u003c/span>\u003cdiv class=\"trk\">\u003cdiv class=\"fil\">\u003c/div>\u003c/div>\u003cspan class=\"lb\">' + massLabel(o[1]) + \"\u003c/span>\";\n    box.appendChild(r);\n  });\n  $(\"#cmpReplay\").addEventListener(\"click\", () => playCompare());\n})();\nlet cmpTimers = [];\nfunction playCompare() {\n  cmpTimers.forEach(clearTimeout); cmpTimers = [];\n  const fills = $$(\"#cmp .fil\");\n  fills.forEach(f => { f.style.transition = \"none\"; f.style.width = \"0\"; });\n  void document.body.offsetWidth;\n  fills.forEach((f, i) => {\n    const pct = (Math.log10(OBJ[i][1]) + 6.5) / 14.2 * 100;\n    const go = () => { f.style.transition = \"\"; f.style.width = pct.toFixed(1) + \"%\"; };\n    if (reduce) go(); else cmpTimers.push(setTimeout(go, 120 + i * 110));\n  });\n}\n\n/* ---------- Test (umumiy) ---------- */\nfunction makeQuiz(root, items) {\n  const holder = document.createElement(\"div\");\n  root.appendChild(holder);\n  function render() {\n    holder.innerHTML = \"\";\n    let score = 0, answered = 0;\n    const sum = document.createElement(\"p\");\n    sum.className = \"qsum\"; sum.setAttribute(\"aria-live\", \"polite\");\n    items.forEach((it, qi) => {\n      const q = document.createElement(\"div\");\n      q.className = \"quiz-q\";\n      q.innerHTML = '\u003cp>\u003cb>' + (qi + 1) + \".\u003c/b> \" + it.q + '\u003c/p>\u003cdiv class=\"opts\">\u003c/div>\u003cp class=\"qfb\" aria-live=\"polite\">\u003c/p>';\n      const opts = $(\".opts\", q), fb = $(\".
