"14\" y=\"14\" width=\"136\" height=\"44\" rx=\"8\"/>' +\n      '\u003ctext class=\"tm a-i0\" x=\"82\" y=\"42\" text-anchor=\"middle\" style=\"fill:var(--bg)\">0 kg\u003c/text>\u003ctext class=\"tm a-i1\" x=\"82\" y=\"42\" text-anchor=\"middle\" style=\"fill:var(--bg)\">18 740 kg\u003c/text>' +\n      '\u003cg transform=\"translate(290 0)\">\u003cg class=\"a-tr\">\u003crect class=\"f-accent\" x=\"-110\" y=\"84\" width=\"84\" height=\"46\" rx=\"4\"/>\u003crect class=\"f-metal\" x=\"-24\" y=\"96\" width=\"32\" height=\"34\" rx=\"4\"/>' +\n      '\u003ccircle class=\"f-ink\" cx=\"-96\" cy=\"137\" r=\"9\"/>\u003ccircle class=\"f-ink\" cx=\"-60\" cy=\"137\" r=\"9\"/>\u003ccircle class=\"f-ink\" cx=\"-6\" cy=\"137\" r=\"9\"/>\u003c/g>\u003c/g>\u003c/svg>'\n  }\n];\n(function () {\n  const seg = $(\"#typeSeg\"), stage = $(\"#typeStage\"), desc = $(\"#typeDesc\");\n  function show(i) {\n    $$(\"button\", seg).forEach((b, k) => b.setAttribute(\"aria-pressed\", String(k === i)));\n    const t = TYPES[i];\n    stage.innerHTML = t.svg();\n    desc.innerHTML = \"\u003ch4>\" + t.name + \"\u003c/h4>\u003cp>\u003cb>Ishlash prinsipi:\u003c/b> \" + t.how + \"\u003c/p>\u003cp>\u003cb>Qayerda ishlatiladi:\u003c/b> \" + t.where + \"\u003c/p>\";\n  }\n  TYPES.forEach((t, i) => {\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.textContent = t.name; b.setAttribute(\"aria-pressed\", \"false\");\n    b.addEventListener(\"click\", () => show(i));\n    seg.appendChild(b);\n  });\n  show(0);\n})();\n\n/* ---------- 2. Pallali tarozi simulyatsiyasi ---------- */\nconst POOL = { \"Tanga\": [3, 9], \"Kalit\": [8, 20], \"Qalam\": [5, 14], \"Olma\": [110, 190] };\nconst POOL_NAMES = Object.keys(POOL);\n(function () {\n  let lastName = \"\";\n  const bal = createBalance($(\"#bal1\"), { showResult: true, newBtn: nextObj });\n  function nextObj() {\n    let name;\n    do { name = POOL_NAMES[randint(0, POOL_NAMES.length - 1)]; } while (name === lastName);\n    lastName = name;\n    bal.setObject(name, randint(POOL[name][0], POOL[name][1]));\n  }\n  nextObj();\n})();\n\n/* ---------- 2. Bo'linma qiymati ---------- */\n(function () {\n  const svg = $(\"#divSvg\"), seg = $(\"#divSeg\"), range = $(\"#trueM\");\n  let d = 10;\n  function draw() {\n    const m = Number(range.value), x0 = 20, lo = 200, hi = 280, sc = 5;\n    let s = '\u003crect class=\"f-surface s-metal\" x=\"10\" y=\"38\" width=\"420\" height=\"46\" rx=\"6\" stroke-width=\"2\"/>';\n    for (let v = lo; v \u003c= hi; v += d) {\n      const x = x0 + (v - lo) * sc, major = v % 10 === 0;\n      s += '\u003cline class=\"s-ink\" x1=\"' + x + '\" x2=\"' + x + '\" y1=\"38\" y2=\"' + (major ? 60 : 50) + '\" stroke-width=\"' + (major ? 2 : 1.2) + '\"/>';\n      if (major) s += '\u003ctext class=\"ts\" x=\"' + x + '\" y=\"76\" text-anchor=\"middle\">' + v + \"\u003c/text>\";\n    }\n    const r = Math.round(m / d) * d, xm = x0 + (m - lo) * sc, xr = x0 + (r - lo) * sc;\n    s += '\u003cpolygon class=\"f-accent\" points=\"' + xm + \",36 \" + (xm - 7) + \",20 \" + (xm + 7) + ',20\"/>';\n    s += '\u003ccircle class=\"f-brass s-ink\" cx=\"' + xr + '\" cy=\"52\" r=\"5\" stroke-width=\"2\"/>';\n    s += '\u003cpolygon class=\"f-accent\" points=\"14,106 20,96 26,106\"/>\u003ctext class=\"tb\" x=\"32\" y=\"106\">haqiqiy massa\u003c/text>';\n    s += '\u003ccircle class=\"f-brass s-ink\" cx=\"170\" cy=\"101\" r=\"5\" stroke-width=\"2\"/>\u003ctext class=\"tb\" x=\"181\" y=\"106\">tarozi ko\\'rsatadi\u003c/text>';\n    svg.innerHTML = s;\n    $(\"#trueV\").textContent = m;\n    $(\"#dvD\").textContent = d + \" g\";\n    $(\"#dvR\").textContent = r + \" g\";\n    $(\"#dvE\").textContent = fmt(Math.abs(m - r), 1) + \" g\";\n  }\n  [10, 5, 1].forEach(v => {\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.textContent = v + \" g\"; b.setAttribute(\"aria-pressed\", String(v === d));\n    b.addEventListener(\"click\", () => {\n      d = v; $$(\"button\", seg).forEach(x => x.setAttribute(\"aria-pressed\", String(x === b))); draw();\n    });\n    seg.appendChild(b);\n  });\n  range.addEventListener(\"input\", draw);\n  draw();\n})();\n/* ---------- 3. Virtual laboratoriya ---------- */\n(function () {\n  const NAMES = [\"Tanga\", \"Kalit\", \"Qalam\", \"Olma\"];\n  const rows = $(\"#labRows\"), seg = $(\"#labSeg\"), out = $(\"#labOut\");\n  const bal = createBalance($(\"#bal2\"), { hideSum: true });\n  let items = [];\n\n  function select(i) {\n    $$(\"button\", seg).forEach((b, k) => b.setAttribute(\"aria-pressed\", String(k === i)));\n    bal.setObject(items[i].name, items[i].mass);\n  }\n  function renderRows() {\n    rows.innerHTML = \"\";\n    items.forEach((it, i) => {\n      const tr = document.createElement(\"tr\");\n      tr.innerHTML = \"\u003ctd>\u003cb>\" + it.name + '\u003c/b>\u003c/td>\u003ctd>\u003cinput class=\"inp\" id=\"lab-g-' + i + '\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" aria-label=\"' + it.name + ' massasi, gramm\">\u003c/td>\u003ctd id=\"lab-kg-' + i + '\">-\u003c/td>\u003ctd id=\"lab-st-' + i + '\">-\u003c/td>';\n      rows.appendChild(tr);\n      $(\"#lab-g-\" + i).addEventListener(\"input\", e => {\n        const v = parseNum(e.target.value);\n        $(\"#lab-kg-\" + i).textContent = isNaN(v) ? \"-\" : fmt(v / 1000, 6);\n        $(\"#lab-st-\" + i).textContent = \"-\"; $(\"#lab-st-\" + i).className = \"\";\n      });\n    });\n  }\n  function newSet() {\n    items = NAMES.map(n => ({ name: n, mass: randint(POOL[n][0], POOL[n][1]) }));\n    renderRows();\n    out.textContent = \"\";\n    select(0);\n  }\n  NAMES.forEach((n, i) => {\n    const b = document.createElement(\"button\");\n    b.type = \"button\"; b.textContent = n; b.setAttribute(\"aria-pressed\", \"false\");\n    b.addEventListener(\"click\", () => select(i));\n    seg.appendChild(b);\n  });\n  $(\"#labNew\").addEventListener(\"click\", newSet);\n  $(\"#labCheck\").addEventListener(\"click\", () => {\n    let ok = 0, filled = 0;\n    items.forEach((it, i) => {\n      const v = parseNum($(\"#lab-g-\" + i).value), st = $(\"#lab-st-\" + i);\n      if (isNaN(v)) { st.textContent = \"Yozilmagan\"; st.className = \"\"; return; }\n      filled++;\n      if (v === it.mass) { ok++; st.textContent = \"To'g'ri\"; st.className = \"st-ok\"; }\n      else { st.textContent = \"Qayta o'lchang\"; st.className = \"st-no\"; }\n    });\n    out.textContent = filled === 0 ? \"Avval o'lchang va natijani jadvalga yozing.\"\n      : ok + \" / \" + items.length + \" natija to'g'ri.\" + (ok === items.length ? \" Barakalla! Endi xulosani yozing.\" : \" Xato chiqqan jismni qayta o'lchang.\");\n  });\n  $(\"#xulShow\").addEventListener(\"click\", () => { const n = $(\"#xulNote\"); n.hidden = !n.hidden; });\n  newSet();\n})();\n\n/* ---------- 3. Masalalar ---------- */\nconst PROBS = [\n  { lvl: \"Oson\", q: \"3,5 kg necha gramm bo'ladi?\", unit: \"g\", ans: 3500,\n    sol: [\"1 kg = 1000 g.\", \"3,5 kg = 3,5 · 1000 g = 3500 g.\"] },\n  { lvl: \"Oson\", q: \"450 g necha kilogramm bo'ladi?\", unit: \"kg\", ans: 0.45,\n    sol: [\"1 g = 1/1000 kg, ya'ni gramm kilogrammdan 1000 marta kichik.\", \"450 g = 450 ÷ 1000 kg = 0,45 kg.\"] },\n  { lvl: \"O'rta\", q: \"Savatda 2 kg olma, 750 g nok va 1,25 kg uzum bor. Mevalarning umumiy massasi necha kg?\", unit: \"kg\", ans: 4,\n    sol: [\"Hammasini bir xil birlikka o'tkazamiz: 750 g = 0,75 kg.\", \"Massalarni qo'shamiz: 2 + 0,75 + 1,25 = 4.\", \"Javob: 4 kg.\"] },\n  { lvl: \"O'rta\", q: \"3 t 500 kg massa necha sentner (s)?\", unit: \"s\", ans: 35,\n    sol: [\"1 t = 10 s, demak 3 t = 30 s.\", \"1 s = 100 kg, demak 500 kg = 5 s.\", \"30 s + 5 s = 35 s.\"] },\n  { lvl: \"O'rta\", q: \"Pallali tarozining chap pallasida jism, o'ng pallasida 100 g, 50 g, 20 g va 5 g toshlar turibdi. Tarozi muvozanatda. Jismning massasi necha gramm?\", unit: \"g\", ans: 175,\n    sol: [\"Muvozanatda chap pallaning massasi o'ng pallanikiga teng.\", \"Toshlarni qo'shamiz: 100 + 50 + 20 + 5 = 175.\", \"Javob: 175 g.\"] },\n  { lvl: \"Qiyin\", q: \"Chap pallada olma va 20 g tosh, o'ng pallada 200 g va 50 g toshlar turibdi. Tarozi muvozanatda. Olmaning massasi necha gramm?\", unit: \"g\", ans: 230,\n    sol: [\"O'ng pallaning massasi: 200 + 50 = 250 g.\", \"Muvozanatda chap pallaning massasi ham 250 g: olma + 20 g = 250 g.\", \"Olma = 250 − 20 = 230 g.\"] },\n  { lvl: \"Qiyin\", q: \"Bo'sh idishning massasi 300 g. Suv quyilgach idish bilan suvning massasi 1,3 kg bo'ldi. Suvning massasi necha gramm?\", unit: \"g\", ans: 1000,\n    sol: [\"Birliklarni tenglashtiramiz: 1,3 kg = 1300 g.\", \"Suvning massasi = umumiy massa − idish massasi.\", \"1300 − 300 = 1000 g (bu 1 kg).\"] }\n];\n(function () {\n  const box = $(\"#probs\");\n  let state = [];\n  function updateScore() {\n    const sc = state.filter(s => s.point).length, solved = state.filter(s => s.ok).length, n = PROBS.length;\n    $(\"#scoreBig\").textContent = sc + \" / \" + n;\n    $(\"#scoreBar\").style.width = (sc / n * 100) + \"%\";\n    let m;\n    if (solved === 0) m = \"Masalalarni yeching, ball shu yerda ko'rinadi. Yechimni ko'rmasdan topilgan to'g'ri javob 1 ball beradi.\";\n    else if (solved \u003c n) m = \"Davom eting: yana \" + (n - solved) + \" ta masala qoldi.\";\n    else if (sc >= 6) m = \"Ajoyib natija! Massa va birliklarni yaxshi o'zlashtirdingiz.\";\n    else if (sc >= 4) m = \"Yaxshi! Yechimini ko'rgan masalalaringizni yana bir bor o'zingiz yechib ko'ring.\";\n    else m = \"Yana mashq qiling: 1-bo'limdagi birlik o'tkazgichi va 2-bo'limdagi tarozi simulyatsiyasi yordam beradi.\";\n    $(\"#scoreMsg\").textContent = m;\n  }\n  function render() {\n    box.innerHTML = \"\";\n    state = PROBS.map(() => ({ ok: false, peek: false, point: false, shown: false }));\n    PROBS.forEach((p, i) => {\n      const c = document.createElement(\"div\");\n      c.className = \"card prob\";\n      c.innerHTML = '\u003cspan class=\"lvl\">Masala ' + (i + 1) + \" · \" + p.lvl + \"\u003c/span>\u003cp>\" + p.q + \"\u003c/p>\" +\n        '\u003cdiv class=\"row\">\u003cinput class=\"inp\" id=\"pa-' + i + '\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" aria-label=\"Javob\">\u003cb>' + p.unit + \"\u003c/b>\" +\n        '\u003cbutton type=\"button\" class=\"btn primary pk\">Tekshirish\u003c/button>\u003cbutton type=\"button\" class=\"btn ps\">Yechimni ko\\'rish\u003c/button>\u003c/div>' +\n        '\u003cp class=\"fb\" aria-live=\"polite\">\u003c/p>\u003col class=\"sol\" hidden>\u003c/ol>';\n      const inp = $(\"input\", c), fb = $(\".fb\", c), sol = $(\".sol\", c), st = state[i];\n      $(\".pk\", c).addEventListener(\"click\", () => {\n        const v = parseNum(inp.value);\n        if (isNaN(v)) { fb.textContent = \"Javobni son bilan yozing.\"; fb.className = \"fb bad\"; return; }\n        if (Math.abs(v - p.ans) \u003c= 1e-9 * Math.max(1, Math.abs(p.ans))) {\n          if (!st.ok && !st.peek) st.point = true;\n          st.ok = true;\n          fb.textContent = st.point ? \"To'g'ri! +1 ball\" : \"To'g'ri! Yechimni ko'rgansiz, shuning uchun ball berilmaydi.\";\n          fb.className = \"fb good\";\n        } else {\n          fb.textContent = \"Noto'g'ri. Qayta urinib ko'ring yoki yechimni ko'ring.\";\n          fb.className = \"fb bad\";\n        }\n        updateScore();\n      });\n      $(\".ps\", c).addEventListener(\"click\", () => {\n        if (st.shown) return;\n        st.shown = true;\n        if (!st.ok) st.peek = true;\n        sol.hidden = false;\n        p.sol.forEach((s, k) => {\n          const add = () => { const li = document.createElement(\"li\"); li.textContent = s; sol.appendChild(li); };\n          if (reduce) add(); else setTimeout(add, k * 450);\n        });\n      });\n      box.appendChild(c);\n    });\n    updateScore();\n  }\n  $(\"#probReset\").addEventListener(\"click\", render);\n  render();\n})();\n\n/* ---------- Boshlash ---------- */\nshowTab(0);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Vaqtni o'lchash", "icon": "⏱️", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Vaqtni o'lchash\u003c/title>\n\u003cstyle>\n\n/* Ranglar: ochiq va qorong'i rejim */\n:root{--bg:#fff8ec;--c:#fff;--t:#2b2b3a;--a:#ff8a3d;--b:#4aa8ff;--g:#3cc47c;--r:#ef5b5b}\n@media(prefers-color-scheme:dark){:root{--bg:#1d2033;--c:#2a2e48;--t:#f2f2fa}}\n*{box-sizing:border-box}\nbody{margin:0;padding:12px;background:var(--bg);color:var(--t);font:20px/1.4 system-ui,sans-serif}\nh1{font-size:1.5em;text-align:center}h2{font-size:1.2em;margin:0 0 8px}\n.card{background:var(--c);border-radius:20px;padding:16px;margin:0 auto 14px;max-width:700px;box-shadow:0 3px 10px #0002}\nbutton,input,select{font:inherit;padding:12px 16px;border-radius:14px;border:2px solid var(--b);background:var(--c);color:var(--t);margin:4px}\nbutton{background:var(--b);color:#fff;border:0;cursor:pointer}\nbutton.o{background:var(--a)}\n#m1 input{width:110px}\n#dig{text-align:center;font-size:1.6em;font-weight:700}\n.cells{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0}\n.cells i{width:18px;height:18px;border-radius:4px;background:#8883;transition:.2s}\n.cells i.on{background:var(--g)}\n.ok{color:var(--g)}.no{color:var(--r)}\n\n\n:root{--bg:#fff8ec;--c:#fff;--t:#2b2b3a;--a:#ff8a3d;--b:#4aa8ff;--g:#3cc47c;--r:#ef5b5b}\n@media(prefers-color-scheme:dark){:root{--bg:#1d2033;--c:#2a2e48;--t:#f2f2fa}}\n*{box-sizing:border-box}\nbody{margin:0;padding:12px;background:var(--bg);color:var(--t);font:20px/1.4 system-ui,sans-serif}\nh1{font-size:1.5em;text-align:center}h2{font-size:1.2em;margin:0 0 8px}\n.card{background:var(--c);border-radius:20px;padding:16px;margin:0 auto 14px;max-width:700px;box-shadow:0 3px 10px #0002}\nbutton{font:inherit;padding:12px 16px;border-radius:14px;border:0;background:var(--b);color:#fff;margin:4px;cursor:pointer}\nbutton.o{background:var(--a)}\nsvg{display:block;margin:auto;max-width:300px;width:100%}\ninput[type=range]{width:100%;height:36px}\n#tl{display:flex;flex-direction:column;gap:6px}\n#info{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}\n#info div{background:var(--c);border-radius:20px;padding:20px;max-width:400px}\n.ok{color:var(--g)}.no{color:var(--r)}\n\n\n:root{--bg:#fff8ec;--c:#fff;--t:#2b2b3a;--a:#ff8a3d;--b:#4aa8ff;--g:#3cc47c;--r:#ef5b5b}\n@media(prefers-color-scheme:dark){:root{--bg:#1d2033;--c:#2a2e48;--t:#f2f2fa}}\n*{box-sizing:border-box}\nbody{margin:0;padding:12px;background:var(--bg);color:var(--t);font:20px/1.4 system-ui,sans-serif}\nh1{font-size:1.5em;text-align:center}h2{font-size:1.2em;margin:0 0 8px}\n.card{background:var(--c);border-radius:20px;padding:16px;margin:0 auto 14px;max-width:700px;box-shadow:0 3px 10px #0002}\nbutton,input{font:inherit;padding:12px 16px;border-radius:14px;border:2px solid var(--b);background:var(--c);color:var(--t);margin:4px}\nbutton{background:var(--b);color:#fff;border:0;cursor:pointer}button.o{background:var(--a)}\ninput[type=number]{width:90px}\n.big{font-size:2.2em;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}\n.bar{height:26px;background:#8883;border-radius:13px;overflow:hidden}.bar div{height:100%;width:0;background:var(--g);transition:width 1s}\n.chip{display:inline-block;padding:10px 14px;background:var(--a);color:#fff;border-radius:14px;margin:4px;cursor:grab}\n.chip.sel{outline:4px solid var(--b)}\n.slot{border:2px dashed var(--b);border-radius:14px;padding:8px;margin:6px 0;min-height:52px}\n.ok{color:var(--g)}.no{color:var(--r)}\n\n#hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;text-align:center}\n#hdr nav button{font-size:.8em;padding:10px 12px}#hdr nav button.act{background:var(--g)}\n#score{background:var(--c);padding:8px;border-radius:14px;font-weight:700;max-width:700px;margin:4px auto;box-shadow:0 2px 8px #0003}\n.mod{display:none}.mod.act{display:block}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv id=\"hdr\">\u003cnav>\u003cbutton class=\"act\" data-m=\"m1\">1. Birliklar\u003c/button>\u003cbutton data-m=\"m2\">2. Tarix\u003c/button>\u003cbutton data-m=\"m3\">3. Amaliyot\u003c/button>\u003c/nav>\n\u003cdiv id=\"score\">Ball: 0 · ☆☆☆☆☆\u003c/div>\u003c/div>\n\u003csection class=\"mod act\" id=\"m1\">\n\u003ch1>⏱️ Vaqt birliklari\u003c/h1>\n\n\u003c!-- Analog soat -->\n\u003cdiv class=\"card\">\u003ch2>Analog soat\u003c/h2>\n\u003csvg viewBox=\"0 0 200 200\">\u003ccircle cx=\"100\" cy=\"100\" r=\"95\" fill=\"var(--c)\" stroke=\"var(--a)\" stroke-width=\"6\"/>\n\u003cg id=\"ticks\">\u003c/g>\n\u003cline id=\"hs\" x1=\"100\" y1=\"100\" x2=\"100\" y2=\"55\" stroke=\"var(--t)\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n\u003cline id=\"ms\" x1=\"100\" y1=\"100\" x2=\"100\" y2=\"35\" stroke=\"var(--b)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n\u003cline id=\"ss\" x1=\"100\" y1=\"115\" x2=\"100\" y2=\"25\" stroke=\"var(--r)\" stroke-width=\"2\"/>\n\u003ccircle cx=\"100\" cy=\"100\" r=\"5\" fill=\"var(--r)\"/>\u003c/svg>\n\u003cdiv id=\"dig\">\u003c/div>\n\u003cdiv style=\"text-align:center\">\n\u003cbutton id=\"pp\" class=\"o\">⏸ To'xtatish\u003c/button>\n\u003cbutton id=\"sp\">⏩ x60 tezlatish\u003c/button>\u003c/div>\n\u003cp style=\"text-align:center\">Qizil – soniya, ko'k – daqiqa, qora – soat mili.\u003c/p>\u003c/div>\n\n\u003c!-- Birliklar munosabati -->\n\u003cdiv class=\"card\">\u003ch2>Birliklar munosabati\u003c/h2>\u003cdiv id=\"rel\">\u003c/div>\n\u003cdiv id=\"relt\">\u003cb>Birini tanlang 👆\u003c/b>\u003c/div>\u003cdiv class=\"cells\" id=\"cells\">\u003c/div>\u003c/div>\n\n\u003c!-- Konvertor -->\n\u003cdiv class=\"card\">\u003ch2>Konvertor\u003c/h2>\n\u003cinput id=\"v\" type=\"number\" value=\"2\" min=\"0\">\u003cselect id=\"u\">\u003c/select>\n\u003cdiv id=\"out\">\u003c/div>\u003c/div>\n\n\u003c!-- Mashqlar -->\n\u003cdiv class=\"card\">\u003ch2>5 ta mashq\u003c/h2>\u003cdiv id=\"ex\">\u003c/div>\u003cb id=\"sc\">\u003c/b>\u003c/div>\n\n\u003c/section>\n\u003csection class=\"mod\" id=\"m2\">\n\u003ch1>🏺 Vaqt o'lchash vositalari tarixi\u003c/h1>\n\n\u003c!-- Vaqt chizig'i -->\n\u003cdiv class=\"card\">\u003ch2>Vaqt chizig'i (bosib ko'ring)\u003c/h2>\u003cdiv id=\"tl\">\u003c/div>\u003c/div>\n\n\u003c!-- Quyosh soati -->\n\u003cdiv class=\"card\">\u003ch2>☀️ Quyosh soati\u003c/h2>\n\u003csvg viewBox=\"0 0 200 140\">\u003crect width=\"200\" height=\"140\" fill=\"var(--bg)\" rx=\"10\"/>\n\u003cpath d=\"M20 40 Q100 -20 180 40\" fill=\"none\" stroke=\"#8886\" stroke-dasharray=\"4\"/>\n\u003ccircle id=\"sun\" r=\"9\" fill=\"#ffc533\"/>\n\u003cline id=\"sh\" x1=\"100\" y1=\"95\" x2=\"100\" y2=\"95\" stroke=\"#555\" stroke-width=\"6\" stroke-linecap=\"round\" opacity=\".6\"/>\n\u003ccircle cx=\"100\" cy=\"95\" r=\"6\" fill=\"var(--a)\"/>\u003c/svg>\n\u003cinput id=\"hr\" type=\"range\" min=\"6\" max=\"18\" step=\"0.25\" value=\"12\">\n\u003cdiv id=\"hrt\" style=\"text-align:center\">\u003c/div>\u003c/div>\n\n\u003c!-- Qum va suv soati -->\n\u003cdiv class=\"card\">\u003ch2>⏳ Qum soati va 💧 suv soati\u003c/h2>\n\u003csvg viewBox=\"0 0 240 140\">\n\u003cg stroke=\"var(--t)\" fill=\"none\" stroke-width=\"3\">\u003cpath d=\"M20 10H80L50 55 80 100H20L50 55Z\"/>\u003c/g>\n\u003cpath id=\"top\" fill=\"#f0b73c\"/>\u003cpath id=\"bot\" fill=\"#f0b73c\"/>\u003cline id=\"str\" x1=\"50\" x2=\"50\" y1=\"55\" y2=\"100\" stroke=\"#f0b73c\"/>\n\u003crect x=\"140\" y=\"10\" width=\"70\" height=\"110\" rx=\"6\" fill=\"none\" stroke=\"var(--t)\" stroke-width=\"3\"/>\n\u003crect id=\"wat\" x=\"143\" width=\"64\" fill=\"var(--b)\"/>\u003c/svg>\n\u003cdiv style=\"text-align:center\">\u003cbutton id=\"go\" class=\"o\">▶ Ishga tushir\u003c/button>\u003cbutton id=\"stp\">⏸ To'xtat\u003c/button>\u003cbutton id=\"rs\">↺ Qayta\u003c/button>\u003c/div>\u003c/div>\n\n\u003c!-- Mexanik soat g'ildiraklari -->\n\u003cdiv class=\"card\">\u003ch2>⚙️ Mexanik soat g'ildiraklari\u003c/h2>\n\u003csvg viewBox=\"0 0 220 120\">\u003cg id=\"g1\" fill=\"var(--a)\">\u003c/g>\u003cg id=\"g2\" fill=\"var(--b)\">\u003c/g>\u003c/svg>\n\u003cdiv style=\"text-align:center\">\u003cbutton id=\"gp\" class=\"o\">⏸ To'xtat\u003c/button>\u003c/div>\u003c/div>\n\n\u003c!-- Test -->\n\u003cdiv class=\"card\">\u003ch2>📝 Test (5 savol)\u003c/h2>\u003cdiv id=\"q\">\u003c/div>\u003c/div>\n\n\u003cdiv id=\"info\" onclick=\"this.style.display='none'\">\u003cdiv id=\"ib\">\u003c/div>\u003c/div>\n\n\u003c/section>\n\u003csection class=\"mod\" id=\"m3\">\n\u003ch1>🛠️ Vaqtni o'lchash amaliyoti\u003c/h1>\n\n\n\u003c!-- Sekundomer va taymer -->\n\u003cdiv class=\"card\">\u003ch2>⏱ Sekundomer\u003c/h2>\u003cdiv class=\"big\" id=\"sw\">00:00.0\u003c/div>\n\u003cdiv style=\"text-align:center\">\u003cbutton id=\"s1\" class=\"o\">▶ Start\u003c/button>\u003cbutton id=\"s2\">⏹ Stop\u003c/button>\u003cbutton id=\"s3\">↺ Reset\u003c/button>\u003c/div>\n\u003ch2>⏲ Taymer\u003c/h2>\n\u003cinput id=\"tm\" type=\"number\" min=\"1\" max=\"99\" value=\"10\"> soniya\n\u003cdiv class=\"bar\">\u003cdiv id=\"tb\">\u003c/div>\u003c/div>\u003cdiv class=\"big\" id=\"td\">10\u003c/div>\n\u003cdiv style=\"text-align:center\">\u003cbutton id=\"t1\" class=\"o\">▶ Start\u003c/button>\u003cbutton id=\"t2\">⏹ Stop\u003c/button>\u003cbutton id=\"t3\">↺ Reset\u003c/button>\u003c/div>\u003c/div>\n\n\u003c!-- Soatni o'qi -->\n\u003cdiv class=\"card\">\u003ch2>🕒 Soatni o'qi\u003c/h2>\n\u003csvg viewBox=\"0 0 200 200\">\u003ccircle cx=\"100\" cy=\"100\" r=\"95\" fill=\"var(--c)\" stroke=\"var(--a)\" stroke-width=\"6\"/>\u003cg id=\"nm\" font-size=\"18\" text-anchor=\"middle\" fill=\"currentColor\">\u003c/g>\n\u003cline id=\"rh\" x1=\"100\" y1=\"100\" x2=\"100\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n\u003cline id=\"rm\" x1=\"100\" y1=\"100\" x2=\"100\" y2=\"35\" stroke=\"var(--b)\" stroke-width=\"5\" stroke-linecap=\"round\"/>\u003c/svg>\n\u003cdiv style=\"text-align:center\">\u003cinput id=\"rhI\" type=\"number\" min=\"1\" max=\"12\" placeholder=\"soat\"> : \u003cinput id=\"rmI\" type=\"number\" min=\"0\" max=\"59\" placeholder=\"daq\">\n\u003cbutton id=\"rc\" class=\"o\">Tekshir\u003c/button>\u003c/div>\u003cdiv id=\"rf\" style=\"text-align:center\">\u003c/div>\u003c/div>\n\n\u003c!-- Vaqt oralig'i -->\n\u003cdiv class=\"card\">\u003ch2>↔️ Vaqt oralig'i\u003c/h2>\nBoshlanish \u003cinput type=\"time\" id=\"ta\" value=\"08:00\"> Tugash \u003cinput type=\"time\" id=\"tz\" value=\"13:30\">\n\u003cbutton id=\"ic\" class=\"o\">Hisobla\u003c/button>\n\u003cdiv class=\"bar\" style=\"margin-top:10px\">\u003cdiv id=\"ib3\">\u003c/div>\u003c/div>\u003cdiv id=\"ir\" class=\"big\" style=\"font-size:1.4em\">\u003c/div>\u003c/div>\n\n\u003c!-- Kun rejasi -->\n\u003cdiv class=\"card\">\u003ch2>📅 Kun rejasi\u003c/h2>\u003cp>Mashg'ulotni sudrab (yoki bosib, so'ng joyni bosib) joyiga qo'ying.\u003c/p>\n\u003cdiv id=\"pool\">\u003c/div>\u003cdiv id=\"slots\">\u003c/div>\u003cbutton id=\"pc\" class=\"o\">Tekshir\u003c/button> \u003cspan id=\"pf\">\u003c/span>\u003c/div>\n\n\u003c/section>\n\u003cscript>\n(()=>{\n\nconst $=s=>document.querySelector(s);\n// --- Soat: o'z vaqtimiz (t) pauza va tezlatishni qo'llaydi\nlet t=Date.now(),last=performance.now(),speed=1,run=true;\nfor(let i=0;i\u003c60;i++){const L=document.createElementNS('http://www.w3.org/2000/svg','line');\n L.setAttribute('x1',100);L.setAttribute('x2',100);L.setAttribute('y1',i%5?10:6);L.setAttribute('y2',i%5?14:18);\n L.setAttribute('stroke','currentColor');L.setAttribute('transform',`rotate(${i*6} 100 100)`);$('#ticks').append(L)}\nconst rot=(id,a)=>$('#'+id).setAttribute('transform',`rotate(${a} 100 100)`);\nfunction tick(n){const d=n-last;last=n;if(run)t+=d*speed;\n const D=new Date(t),s=D.getSeconds()+D.getMilliseconds()/1000,m=D.getMinutes()+s/60,h=D.getHours()%12+m/60;\n rot('hs',h*30);rot('ms',m*6);rot('ss',s*6);$('#dig').textContent=D.toTimeString().slice(0,8);\n requestAnimationFrame(tick)}\nrequestAnimationFrame(tick);\n$('#pp').onclick=e=>{run=!run;e.target.textContent=run?\"⏸ To'xtatish\":\"▶ Qayta boshlash\"};\n$('#sp').onclick=e=>{speed=speed==1?60:1;e.target.textContent=speed==1?'⏩ x60 tezlatish':'🐢 Oddiy tezlik'};\n\n// --- Munosabatlar animatsiyasi\nconst R=[[\"1 daqiqa = 60 soniya\",60],[\"1 soat = 60 daqiqa\",60],[\"1 sutka = 24 soat\",24],[\"1 hafta = 7 sutka\",7],[\"1 yil = 12 oy\",12]];\nlet iv;\nR.forEach(([txt,n])=>{const b=document.createElement('button');b.textContent=txt;b.className='o';\n b.onclick=()=>{clearInterval(iv);$('#relt').innerHTML='\u003cb>'+txt+'\u003c/b>';const c=$('#cells');c.innerHTML='';\n  for(let i=0;i\u003cn;i++)c.append(document.createElement('i'));let k=0;\n  iv=setInterval(()=>{if(k>=n)return clearInterval(iv);c.children[k++].classList.add('on')},60)};\n $('#rel').append(b)});\n\n// --- Konvertor (oy = 30 kun, yil = 365 kun deb olingan)\nconst U=[[\"soniya\",1],[\"daqiqa\",60],[\"soat\",3600],[\"sutka\",86400],[\"hafta\",604800]];\nU.forEach((u,i)=>$('#u').add(new Option(u[0],i)));$('#u').value=2;\nfunction conv(){const s=(+$('#v').value||0)*U[$('#u').value][1];\n $('#out').innerHTML=U.map(u=>`\u003cdiv>= \u003cb>${+(s/u[1]).toFixed(3)}\u003c/b> ${u[0]}\u003c/div>`).join('')}\n$('#v').oninput=$('#u').onchange=conv;conv();\n\n// --- Mashqlar\nconst E=[[\"1 soat = ? daqiqa\",60],[\"2 sutka = ? soat\",48],[\"180 soniya = ? daqiqa\",3],[\"1 hafta = ? sutka\",7],[\"120 daqiqa = ? soat\",2]];\nlet score=0;\nE.forEach(([q,a],i)=>{const d=document.createElement('div');\n d.innerHTML=`${i+1}) ${q} \u003cinput type=\"number\">\u003cbutton>Tekshir\u003c/button> \u003cspan>\u003c/span>`;\n const [inp,btn,sp]=[d.children[0],d.children[1],d.children[2]];let done=false;\n btn.onclick=()=>{if(inp.value==='')return;const ok=+inp.value===a;\n  sp.className=ok?'ok':'no';sp.textContent=ok?'✅ Barakalla!':'❌ Yana urinib ko\\'r';\n  if(ok&&!done){done=true;score++;window.addPts&&addPts(4);$('#sc').textContent=`Natija: ${score}/5 `+'⭐'.repeat(score)}};\n $('#ex').append(d)});\n\n})();\n(()=>{\n\nconst $=s=>document.querySelector(s);\n// --- Vositalar ma'lumoti: nomi, davri, kim, aniqlik\nconst T=[\n[\"☀️ Quyosh soati\",\"~3500 yil avval, Misr va Bobil\",\"Qadimgi misrliklar\",\"Taxminan 15 daqiqa xato; faqat quyoshli kunda ishlaydi\"],\n[\"💧 Suv soati\",\"~1500 yil avval (Misr)\",\"Misr va Xitoy olimlari\",\"Bir necha daqiqa; tunda ham ishlaydi\"],\n[\"⏳ Qum soati\",\"~700-yillar, Yevropa\",\"Yevropalik ustalar\",\"Qisqa vaqt uchun; xatosi bir necha soniya\"],\n[\"⚙️ Mexanik soat\",\"~1300-yillar\",\"Yevropa ustalari (minora soatlari)\",\"Kuniga ~15 daqiqa xato (dastlab)\"],\n[\"🔷 Kvarts soat\",\"1927-yil\",\"Uorren Marrison (AQSh)\",\"Bir oyda ~1 soniya xato\"],\n[\"⚛️ Atom soati\",\"1955-yil\",\"Lui Essen (Angliya)\",\"Millionlab yilda ~1 soniya xato\"]];\nT.forEach(r=>{const b=document.createElement('button');b.textContent=r[0]+' — '+r[1].split(',')[0];b.className='o';\n b.onclick=()=>{$('#ib').innerHTML=`\u003ch2>${r[0]}\u003c/h2>\u003cp>\u003cb>Qachon:\u003c/b> ${r[1]}\u003c/p>\u003cp>\u003cb>Kim:\u003c/b> ${r[2]}\u003c/p>\u003cp>\u003cb>Aniqligi:\u003c/b> ${r[3]}\u003c/p>\u003csmall>Yopish uchun bosing\u003c/small>`;$('#info').style.display='flex'};\n $('#tl').append(b)});\n\n// --- Quyosh soati: soya burchagi = (soat-12)*15°, uzunligi quyosh balandligiga qarama-qarshi\nfunction sun(){const h=+$('#hr').value,p=(h-6)/12,ang=Math.sin(p*Math.PI);\n $('#sun').setAttribute('cx',20+160*p);$('#sun').setAttribute('cy',45-ang*50+ (1-ang)*0);\n const len=Math.min(80,12+60*(1-ang)+8),a=(h-12)*15*Math.PI/180;\n $('#sh').setAttribute('x2',100+Math.sin(a)*len);$('#sh').setAttribute('y2',95-Math.cos(a)*len);\n $('#hrt').textContent=`Soat ${Math.floor(h)}:${String(Math.round(h%1*60)).padStart(2,'0')} — soya burchagi ${Math.round((h-12)*15)}°`}\n$('#hr').oninput=sun;sun();\n\n// --- Qum va suv: bitta progress p (0..1), 20 soniya\nlet p=0,on=false,lt=performance.now();\nfunction draw(){const k=1-p;\n $('#top').setAttribute('d',`M${50-30*k} ${55-45*k}H${50+30*k}L50 55Z`);\n $('#bot').setAttribute('d',`M50 ${100-45*p}L${50-30*p} 100H${50+30*p}Z`);\n $('#str').style.display=on&&p\u003c1?'block':'none';\n const h=100*k;$('#wat').setAttribute('y',120-h-2);$('#wat').setAttribute('height',h)}\nfunction loop(n){const d=n-lt;lt=n;if(on){p=Math.min(1,p+d/20000);if(p>=1)on=false}draw();requestAnimationFrame(loop)}\nrequestAnimationFrame(loop);\n$('#go').onclick=()=>{if(p>=1)p=0;on=true};$('#stp').onclick=()=>on=false;$('#rs').onclick=()=>{on=false;p=0};\n\n// --- Tishli g'ildiraklar (JS bilan aylantiriladi)\nfunction gear(r,n){let d='';for(let i=0;i\u003cn*2;i++){const a=i*Math.PI/n,R=i%2?r:r+10;d+=(i?'L':'M')+(R*Math.cos(a)).toFixed(1)+' '+(R*Math.sin(a)).toFixed(1)}return d+'Z'}\n$('#g1').innerHTML=`\u003cpath d=\"${gear(40,12)}\"/>\u003ccircle r=\"10\" fill=\"var(--bg)\"/>`;\n$('#g2').innerHTML=`\u003cpath d=\"${gear(30,9)}\"/>\u003ccircle r=\"8\" fill=\"var(--bg)\"/>`;\nlet ga=0,gr=true,gl=performance.now();\nfunction gl_(n){const d=n-gl;gl=n;if(gr)ga+=d*0.03;\n $('#g1').setAttribute('transform',`translate(65 60) rotate(${ga})`);\n $('#g2').setAttribute('transform',`translate(145 60) rotate(${-ga*12/9+20})`);requestAnimationFrame(gl_)}\nrequestAnimationFrame(gl_);\n$('#gp').onclick=e=>{gr=!gr;e.target.textContent=gr?\"⏸ To'xtat\":'▶ Davom ettir'};\n\n// --- Test\nconst Q=[[\"Eng qadimgi vosita qaysi?\",[\"Quyosh soati\",\"Atom soati\",\"Kvarts soat\"],0],\n[\"Tunda qaysi vosita ishlaydi?\",[\"Quyosh soati\",\"Suv soati\",\"Hech biri\"],1],\n[\"Kvarts soat qachon yaratilgan?\",[\"1927-yil\",\"1300-yil\",\"1955-yil\"],0],\n[\"Eng aniq soat qaysi?\",[\"Qum soati\",\"Mexanik soat\",\"Atom soati\"],2],\n[\"Quyosh soatida soya nima bilan o'zgaradi?\",[\"Quyosh holati\",\"Shamol\",\"Harorat\"],0]];\nlet sc=0,qi=0;\nfunction show(){const d=$('#q');if(qi>=5){d.innerHTML=`\u003cb>Natija: ${sc}/5 ${'⭐'.repeat(sc)}\u003c/b>\u003cbr>\u003cbutton id=\"qr\">Qayta\u003c/button>`;$('#qr').onclick=()=>{qi=0;sc=0;show()};return}\n const [q,o,a]=Q[qi];d.innerHTML=`\u003cb>${qi+1}) ${q}\u003c/b>\u003cbr>`;\n o.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;\n  b.onclick=()=>{const ok=i==a;if(ok){sc++;window.addPts&&addPts(4)}d.innerHTML+=`\u003cp class=\"${ok?'ok':'no'}\">${ok?'✅ To\\'g\\'ri!':'❌ Noto\\'g\\'ri. To\\'g\\'ri javob: '+o[a]}\u003c/p>`;qi++;setTimeout(show,1200)};d.append(b)})}\nshow();\n\n})();\n(()=>{\n\nconst $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');\n// --- Ball va yulduzcha tizimi\nlet pts=0;\nfunction add(n){pts+=n;const s=Math.min(5,Math.floor(pts/20));$('#score').textContent=`Ball: ${pts} · ${'⭐'.repeat(s)}${'☆'.repeat(5-s)}`}\n\n// --- Sekundomer\nlet sw=0,swOn=false,sl=0;\n(function f(n){if(swOn)sw+=n-sl;sl=n;const s=sw/1000;$('#sw').textContent=`${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}.${Math.floor(s*10%10)}`;requestAnimationFrame(f)})(0);\n$('#s1').onclick=()=>{sl=performance.now();swOn=true};$('#s2').onclick=()=>swOn=false;$('#s3').onclick=()=>{swOn=false;sw=0};\n\n// --- Taymer\nlet tl=10,tOn=false,tt=0;\nconst tr=()=>{tl=+$('#tm').value||10;tOn=false;$('#td').textContent=tl;$('#tb').style.width='0'};\n(function f(n){if(tOn){tl-=(n-tt)/1000;tt=n;if(tl\u003c=0){tl=0;tOn=false;$('#td').textContent='⏰ Vaqt tugadi!';add(2);return requestAnimationFrame(f)}\n $('#td').textContent=Math.ceil(tl);$('#tb').style.transition='none';$('#tb').style.width=100-tl/(+$('#tm').value||10)*100+'%'}requestAnimationFrame(f)})(0);\n$('#t1').onclick=()=>{if(tl\u003c=0)tr();tt=performance.now();tOn=true};$('#t2').onclick=()=>tOn=false;$('#t3').onclick=tr;$('#tm').oninput=tr;\n\n// --- Soatni o'qi o'yini\nfor(let i=1;i\u003c=12;i++){const a=i*Math.PI/6;$('#nm').innerHTML+=`\u003ctext x=\"${100+75*Math.sin(a)}\" y=\"${107-75*Math.cos(a)}\">${i}\u003c/text>`}\nlet H,M;\nfunction newT(){H=1+Math.floor(Math.random()*12);M=5*Math.floor(Math.random()*12);\n $('#rh').setAttribute('transform',`rotate(${H%12*30+M/2} 100 100)`);$('#rm').setAttribute('transform',`rotate(${M*6} 100 100)`);$('#rhI').value=$('#rmI').value=''}\nnewT();\n$('#rc').onclick=()=>{const ok=+$('#rhI').value===H&&+$('#rmI').value===M;\n $('#rf').className=ok?'ok':'no';$('#rf').textContent=ok?'✅ To\\'g\\'ri! +10 ball':`❌ Yo'q. Javob: ${H}:${pad(M)}`;if(ok)add(10);setTimeout(newT,1500)};\n\n// --- Vaqt oralig'ini hisoblash\n$('#ic').onclick=()=>{const m=v=>{const [h,n]=v.split(':');return h*60+ +n};let d=m($('#tz').value)-m($('#ta').value);\n if(d\u003c0)d+=1440;$('#ib3').style.width=d/1440*100+'%';\n $('#ir').textContent=`${Math.floor(d/60)} soat ${d%60} daqiqa (${d} daqiqa)`;add(3)};\n\n// --- Kun rejasi (sudrab-tashlash + bosib tanlash: telefon uchun)\nconst A=[\"Uyg'onish\",\"Maktab\",\"Tushlik\",\"Uy vazifasi\",\"Sport\",\"Kechki ovqat\",\"Uxlash\"];\nconst S=[\"07:00\",\"08:00\",\"13:00\",\"15:00\",\"17:00\",\"19:00\",\"21:00\"];\nlet sel=null;\n[...A].sort(()=>Math.random()-.5).forEach(a=>{const c=document.createElement('span');c.className='chip';c.textContent=a;c.draggable=true;\n c.ondragstart=e=>{sel=c;e.dataTransfer.setData('text','x')};\n c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));sel=c;c.classList.add('sel')};$('#pool').append(c)});\nS.forEach(s=>{const d=document.createElement('div');d.className='slot';d.dataset.t=s;d.innerHTML='\u003cb>'+s+'\u003c/b> ';\n const put=()=>{if(sel){d.append(sel);sel.classList.remove('sel')}};\n d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();put()};d.onclick=e=>{if(e.target==d||e.target.tagName=='B')put()};$('#slots').append(d)});\n$('#pc').onclick=()=>{let n=0;document.querySelectorAll('.slot').forEach((d,i)=>{const c=d.querySelector('.chip');\n const ok=c&&c.textContent===A[i];if(ok)n++;d.style.borderColor=ok?'var(--g)':'var(--r)'});\n $('#pf').textContent=`${n}/7 to'g'ri`+(n==7?' 🎉':'');add(n*2)};\n\nwindow.addPts=add;\n})();\ndocument.querySelectorAll('#hdr nav button').forEach(b=>b.onclick=()=>{\n document.querySelectorAll('#hdr nav button,.mod').forEach(e=>e.classList.remove('act'));\n b.classList.add('act');document.getElementById(b.dataset.m).classList.add('act');window.scrollTo(0,0)});\n\u003c/script>\u003c/body>\u003c/html>"}, {"title": "3-BSB (50 ball)", "icon": "📋", "html": "\u003c!DOCTYPE html>\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003ctitle>7-sinf Fizika. 3-BSB (50 ball)\u003c/title>\n\u003cstyle>\n:root{--bg:#f4f8ff;--c:#fff;--t:#1b2a41;--p:#3b7ddd;--ok:#1e8e4e;--okb:#dff5e6;--bad:#c62f3a;--badb:#fde4e6;--br:#d3deee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root{--bg:#10192b;--c:#1a2740;--t:#e8eefb;--p:#6aa6ff;--ok:#5fd68a;--okb:#14382a;--bad:#ff7b84;--badb:#44212a;--br:#2f4166}}\nbody{margin:0;font:18px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}\nmain{max-width:720px;margin:auto;padding:12px}\nh1{font-size:23px;margin:8px 0}h2{font-size:20px;margin:22px 0 6px;color:var(--p)}\n.q{background:var(--c);border:2px solid var(--br);border-radius:14px;padding:12px;margin:10px 0}\n.q.ok{border-color:var(--ok);background:var(--okb)}.q.no{border-color:var(--bad);background:var(--badb)}\nlabel.o{display:block;padding:10px;margin:6px 0;border:2px solid var(--br);border-radius:10px;cursor:pointer}\nlabel.o input{width:22px;height:22px;vertical-align:middle;margin-right:8px}\ninput.n,textarea,select{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--br);background:var(--c);color:var(--t);width:100%;box-sizing:border-box;margin:6px 0}\n.b{font:inherit;min-height:52px;padding:10px 20px;border-radius:12px;border:2px solid var(--p);background:var(--p);color:var(--bg);font-weight:700;cursor:pointer;margin:8px 6px 8px 0}\n.b.s{background:var(--c);color:var(--t)}\n.fb{margin-top:6px;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.sc{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:3}\n.bar{height:14px;background:var(--br);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .8s}\n.m{color:var(--ok)}.x{color:var(--bad)}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003ch1>⚛️ 7-sinf Fizika. 3-BSB\u003c/h1>\n\u003cp>Mavzu: \u003cb>Massa, zichlik va kuch\u003c/b> · 50 ball · 40 daqiqa · g = 10 N/kg\u003cbr>\u003cspan class=\"m\">Xato — o‘rganish imkoniyati. Shoshilmasdan ishlang!\u003c/span>\u003c/p>\n\u003cdiv class=\"sc\">\u003cb id=\"sc\">0 / 50 ball\u003c/b>\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\u003c/div>\n\u003cdiv id=\"f\">\u003c/div>\n\u003cbutton class=\"b\" onclick=\"chk()\">✓ Tekshirish\u003c/button>\u003cbutton class=\"b s\" onclick=\"build()\">🔄 Qayta boshlash\u003c/button>\n\u003cdiv id=\"res\">\u003c/div>\n\u003c/main>\n\u003cscript>\nconst A=[[\"Massaning SI dagi birligi qaysi?\",[\"g\",\"kg\",\"t\",\"N\"],1],[\"Zichlik formulasi qaysi?\",[\"ρ = V / m\",\"ρ = m · V\",\"ρ = m / V\",\"ρ = m + V\"],2],[\"Zichlikning SI dagi birligi?\",[\"kg/m³\",\"g/cm³\",\"kg·m³\",\"N/kg\"],0],[\"1 t necha kilogramm?\",[\"10 kg\",\"100 kg\",\"1000 kg\",\"10 000 kg\"],2],[\"Kuchning SI dagi birligi?\",[\"kg\",\"m/s\",\"N\",\"m³\"],2],[\"Og‘irlik kuchi qanday yo‘nalgan?\",[\"Yuqoriga\",\"Vertikal pastga\",\"Gorizontal\",\"Harakat yo‘nalishida\"],1],[\"Kuchni o‘lchaydigan asbob?\",[\"Menzurka\",\"Termometr\",\"Dinamometr\",\"Chizg‘ich\"],2],[\"Ishqalanish kuchi qanday yo‘nalgan?\",[\"Harakat yo‘nalishida\",\"Harakatga qarama-qarshi\",\"Vertikal yuqoriga\",\"Yo‘nalishi yo‘q\"],1],[\"Massasi 5 kg jismning og‘irlik kuchi?\",[\"0,5 N\",\"5 N\",\"15 N\",\"50 N\"],3],[\"Suvning zichligi?\",[\"100 kg/m³\",\"800 kg/m³\",\"1000 kg/m³\",\"7800 kg/m³\"],2]];\nconst B=[[\"11. Massa va og‘irlik kuchi o‘rtasidagi bitta farqni yozing.\",\"Massa — modda miqdori (kg), hamma joyda bir xil. Og‘irlik kuchi — tayanchga ta’sir kuchi (N), Yer va Oyda har xil.\"],[\"12. Ishqalanishni kamaytirishning ikkita usulini ayting.\",\"Sirtni silliqlash, moylash, g‘ildirak yoki podshipnik qo‘llash.\"],[\"13. Moslashtiring: massa, zichlik, kuch, hajm — kg, kg/m³, N, m³ (tartib bilan).\",\"Massa — kg, zichlik — kg/m³, kuch — N, hajm — m³.\"],[\"14. Nima uchun muzlagan yo‘lga qum sepiladi?\",\"Qum ishqalanishni oshiradi, shuning uchun oyoq va g‘ildirak sirpanmaydi.\"]];\nconst N=[[\"15. (5 ball) Hajmi 0,2 m³, massasi 1560 kg jism. Zichligi (kg/m³)?\",7800,5,\"ρ = m / V = 1560 / 0,2 = 7800\"],[\"16. (5 ball) Alyuminiy zichligi 2700 kg/m³, hajmi 0,004 m³. Massasi (kg)?\",10.8,5,\"m = ρ · V = 2700 · 0,004 = 10,8\"],[\"17a. (3 ball) Massasi 40 kg bolaning og‘irlik kuchi (N)?\",400,3,\"P = m · g = 40 · 10 = 400\"],[\"17b. (3 ball) Bola va 5 kg sumkaning umumiy og‘irlik kuchi (N)?\",450,3,\"P = (40 + 5) · 10 = 450\"],[\"18a. (3 ball) 3 N va 5 N kuchlar bir yo‘nalishda. Teng ta’sir etuvchi (N)?\",8,3,\"3 + 5 = 8\"],[\"18b. (3 ball) Xuddi shu kuchlar qarama-qarshi yo‘nalishda. Teng ta’sir etuvchi (N)?\",2,3,\"5 − 3 = 2\"],[\"19a. (2 ball) Massa 78 g. Menzurka: 40 ml → 50 ml. Hajmi (cm³)?\",10,2,\"V = 50 − 40 = 10\"],[\"19b. (3 ball) Zichligi (g/cm³)?\",7.8,3,\"ρ = 78 / 10 = 7,8\"],[\"19c. (3 ball) Zichligi (kg/m³)?\",7800,3,\"7,8 · 1000 = 7800\"]];\nconst M=[\"Alyuminiy\",\"Temir\",\"Mis\"];\nlet done=false;\nfunction build(){done=false;let h='\u003ch2>A qism. Test (10 ball)\u003c/h2>'+A.map((a,k)=>`\u003cdiv class=\"q\" id=\"a${k}\">\u003cb>${k+1}. ${a[0]}\u003c/b>${a[1].map((o,j)=>`\u003clabel class=\"o\">\u003cinput type=\"radio\" name=\"a${k}\" value=\"${j}\">${o}\u003c/label>`).join('')}\u003cdiv class=\"fb\">\u003c/div>\u003c/div>`).join('');\nh+='\u003ch2>B qism. Qisqa javoblar (8 ball)\u003c/h2>'+B.map((b,k)=>`\u003cdiv class=\"q\" id=\"b${k}\">\u003cb>${b[0]} (2 ball)\u003c/b>\u003ctextarea rows=\"2\" placeholder=\"Javobingiz\">\u003c/textarea>\u003cdiv class=\"fb\">\u003c/div>\u003c/div>`).join('');\nh+='\u003ch2>C va D qism. Masalalar (32 ball)\u003c/h2>'+N.map((n,k)=>`\u003cdiv class=\"q\" id=\"n${k}\">\u003cb>${n[0]}\u003c/b>\u003cinput class=\"n\" inputmode=\"decimal\" placeholder=\"Javob\">\u003cdiv class=\"fb\">\u003c/div>\u003c/div>`).join('');\nh+=`\u003cdiv class=\"q\" id=\"d\">\u003cb>19d. (2 ball) Alyuminiy 2700, temir 7800, mis 8900 kg/m³. Bo‘lak qaysi metalldan?\u003c/b>\u003cselect>\u003coption value=\"\">Tanlang\u003c/option>${M.map(m=>`\u003coption>${m}\u003c/option>`).join('')}\u003c/select>\u003cdiv class=\"fb\">\u003c/div>\u003c/div>`;\n$('f').innerHTML=h;$('res').innerHTML='';up(0)}\nconst $=i=>document.getElementById(i);\nfunction mark(el,ok,msg){el.className='q '+(ok?'ok':'no');el.querySelector('.fb').innerHTML=(ok?'\u003cb class=\"m\">✓ To‘g‘ri!\u003c/b> ':'\u003cb class=\"x\">✗ Hali emas.\u003c/b> ')+msg}\nfunction chk(){done=true;let s=0;\nA.forEach((a,k)=>{const v=document.querySelector(`input[name=a${k}]:checked`),ok=v&&+v.value==a[2];if(ok)s++;mark($('a'+k),ok,ok?'':`To‘g‘ri javob: ${a[1][a[2]]}. Xato — o‘rganish imkoniyati!`)});\nN.forEach((n,k)=>{const el=$('n'+k),v=parseFloat(el.querySelector('input').value.replace(',','.')),ok=Math.abs(v-n[1])\u003c1e-6;if(ok)s+=n[2];mark(el,ok,ok?'':'Yechim: '+n[3])});\nconst d=$('d'),ok=d.querySelector('select').value=='Temir';if(ok)s+=2;mark(d,ok,ok?'':'Temir (7800 kg/m³ ga mos).');\nB.forEach((b,k)=>{const el=$('b'+k);el.className='q';el.querySelector('.fb').innerHTML=`\u003cp>\u003cb>Namunaviy javob:\u003c/b> ${b[1]}\u003c/p>\u003clabel class=\"o\">\u003cinput type=\"checkbox\" class=\"bc\" onchange=\"up()\">Javobim shunga mos (2 ball)\u003c/label>`});\nup();$('res').innerHTML='\u003cp class=\"m\">\u003cb>B qismni o‘zingiz baholang:\u003c/b> namunaviy javobga mos bo‘lsa katakchani belgilang. Barcha xatolarni ko‘rib chiqing — keyingi safar yaxshiroq bo‘ladi! 💪\u003c/p>'}\nfunction up(z){let s=0;if(done){A.forEach((a,k)=>{if($('a'+k).classList.contains('ok'))s++});N.forEach((n,k)=>{if($('n'+k).classList.contains('ok'))s+=n[2]});if($('d').classList.contains('ok'))s+=2;document.querySelectorAll('.bc:checked').forEach(()=>s+=2)}\n$('sc').firstChild.textContent=s+' / 50 ball'+(done?(s>=45?' — A\\'lo 🌟':s>=35?' — Yaxshi 👍':s>=25?' — Qoniqarli':' — Yana mashq qilamiz 💪'):'');$('pb').style.width=s*2+'%'}\nbuild();\n\u003c/script>\u003c/body>\u003c/html>\n"}, {"title": "Jismlarning mexanik harakati", "icon": "🚗", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Jismlarning mexanik harakati\u003c/title>\n\u003cstyle>\n:root{--bg:#eef4fa;--card:#fff;--ink:#12263a;--mut:#4d6478;--ac:#0b6f76;--ac2:#e08a00;--ok:#146c42;--okbg:#dcf4e6;--bad:#a8231b;--badbg:#fde3e1;--line:#c3d3e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d1a26;--card:#162636;--ink:#e8f1f8;--mut:#9db4c7;--ac:#4cc9cf;--ac2:#ffb938;--ok:#7be0a6;--okbg:#12392a;--bad:#ff958d;--badbg:#42201f;--line:#2b4257}}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:18px/1.5 system-ui,\"Segoe UI\",\"Noto Sans\",sans-serif}\nheader{max-width:720px;margin:auto;padding:14px 14px 4px}\nh1{font:700 25px/1.2 \"Trebuchet MS\",system-ui,sans-serif;margin:0}\n.score{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-weight:600}\n.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:720px;margin:8px auto;padding:6px 10px;background:var(--bg)}\n.tab{min-height:56px;font:600 16px/1.2 system-ui;border:2px solid var(--ac);background:var(--card);color:var(--ink);border-radius:12px;padding:4px 2px;cursor:pointer}\n.tab[aria-selected=true]{background:var(--ac);color:#fff}\nmain{max-width:720px;margin:auto;padding:0 12px 40px}\n.panel{display:none}.panel.on{display:block}\n.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}\nh2{font:700 21px \"Trebuchet MS\",system-ui;margin:0 0 8px}\np{margin:6px 0}.mut{color:var(--mut)}.big{font:700 20px/1.3 \"Trebuchet MS\",system-ui}\n.btn{min-height:52px;font:600 18px system-ui;border:0;border-radius:12px;padding:8px 16px;background:var(--ac);color:var(--bg);cursor:pointer;margin:4px 4px 4px 0}\n.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ac)}\n.btn.sel{background:var(--ac2);color:#12263a;border-color:var(--ac2)}\n.btn:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}\n.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--ac);margin:8px 0}\n.opt.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}\n.opt.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}\n.fb{margin-top:8px;padding:10px 12px;border-radius:10px;font-weight:600}\n.fb.ok{background:var(--okbg);color:var(--ok);border:2px solid var(--ok)}\n.fb.bad{background:var(--badbg);color:var(--bad);border:2px solid var(--bad)}\ninput[type=range]{width:100%;height:36px;accent-color:var(--ac)}\ncanvas{width:100%;height:200px;display:block;background:var(--bg);border-radius:10px;border:2px solid var(--line)}\n#cel .banner{text-align:center;background:var(--okbg);color:var(--ok);border:2px solid var(--ok);border-radius:14px;padding:12px;margin:8px 0;font:700 21px \"Trebuchet MS\"}\n#party{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}\n#party span{position:absolute;top:-20px;font-size:28px;animation:fall 3s linear forwards}\n@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}\n@media(prefers-reduced-motion:reduce){#party span{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cheader>\u003ch1>Jismlarning mexanik harakati\u003c/h1>\n\u003cdiv class=\"score\">\u003cspan>Ball: \u003cb id=\"sP\">0\u003c/b>\u003c/span>\u003cspan>✓ \u003cb id=\"sO\">0\u003c/b>\u003c/span>\u003cspan>✗ \u003cb id=\"sB\">0\u003c/b>\u003c/span>\u003c/div>\u003cdiv id=\"cel\">\u003c/div>\u003c/header>\n\u003cnav class=\"tabs\" role=\"tablist\">\n\u003cbutton class=\"tab\" role=\"tab\" data-p=\"1\" aria-selected=\"true\">1. Harakat\u003c/button>\n\u003cbutton class=\"tab\" role=\"tab\" data-p=\"2\" aria-selected=\"false\">2. Mexanik harakat\u003c/button>\n\u003cbutton class=\"tab\" role=\"tab\" data-p=\"3\" aria-selected=\"false\">3. Ilgarilanma\u003c/button>\n\u003cbutton class=\"tab\" role=\"tab\" data-p=\"4\" aria-selected=\"false\">4. Aylanma va tebranma\u003c/button>\u003c/nav>\n\u003cmain id=\"main\">\u003c/main>\u003cdiv id=\"party\">\u003c/div>\n\u003cscript>\nconst $=i=>document.getElementById(i),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)];\nconst shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);\nconst S={pts:0,ok:0,bad:0,done:{},wr:{}},GOOD=[\"Barakalla!\",\"Ajoyib!\",\"Zo'r ketyapsan!\",\"Aynan shunday!\"];\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);\n/* Test savollari: [savol, to'g'ri, xato1, xato2, izoh] */\nconst Q={\n1:[[\"Qaysi jism harakatda?\",\"Yo'lda ketayotgan avtobus\",\"Stolda yotgan kitob\",\"Maktab binosi\",\"Harakatda jismning joyi o'zgaradi.\"],\n[\"Harakat nima?\",\"Jism joyining vaqt o'tishi bilan o'zgarishi\",\"Jism rangining o'zgarishi\",\"Jism og'irligining o'zgarishi\",\"Joyning o'zgarishi — harakatning asosiy belgisi.\"],\n[\"Qaysi jism tinch turibdi?\",\"Deraza yonidagi gul\",\"Uchayotgan qush\",\"Yugurayotgan bola\",\"Gul joyini o'zgartirmayapti.\"],\n[\"Qaysi biri harakatlanuvchi jism emas?\",\"Yerda yotgan tosh\",\"Tushayotgan yomg'ir tomchisi\",\"Suzayotgan baliq\",\"Tosh joyini o'zgartirmayapti.\"],\n[\"Tezligi katta jism bir xil vaqtda ...\",\"ko'proq yo'l bosadi\",\"kamroq yo'l bosadi\",\"yo'l bosmaydi\",\"Tezroq harakat — ko'proq yo'l.\"],\n[\"Velosipedchi yo'lda ketyapti. Bu ...\",\"harakat\",\"tinch holat\",\"tebranish\",\"Velosipedchi joyini o'zgartiryapti.\"]],\n2:[[\"Poyezddagi yo'lovchi poyezdga nisbatan ...\",\"tinch turadi\",\"harakatlanadi\",\"tebranadi\",\"Poyezd ham, yo'lovchi ham birga ketyapti.\"],\n[\"Perrondagi odamga nisbatan o'sha yo'lovchi ...\",\"harakatlanadi\",\"tinch turadi\",\"tebranadi\",\"Perrondan qaraganda yo'lovchi uzoqlashadi.\"],\n[\"Sanoq jismi nima?\",\"Harakat qaysi jismga nisbatan o'rganilsa, o'sha jism\",\"Eng og'ir jism\",\"Eng tez jism\",\"Sanoq jismini biz o'zimiz tanlaymiz.\"],\n[\"Jism harakatida qoldirgan chiziq nima deyiladi?\",\"Trayektoriya\",\"Sanoq jismi\",\"Tezlik\",\"Trayektoriya — harakat izi.\"],\n[\"Trayektoriyaning uzunligi nima deyiladi?\",\"Bosib o'tilgan yo'l\",\"Tezlik\",\"Massa\",\"Yo'l — trayektoriya uzunligi.\"],\n[\"Harakat nisbiy, ya'ni ...\",\"sanoq jismiga bog'liq\",\"hamma uchun bir xil\",\"faqat tezlikka bog'liq\",\"Tanlangan sanoq jismi natijani o'zgartiradi.\"]],\n3:[[\"Lift tekis yuqoriga ko'tarilyapti. Bu harakat ...\",\"ilgarilanma\",\"aylanma\",\"tebranma\",\"Liftning hamma nuqtalari bir xil harakatlanadi.\"],\n[\"Ilgarilanma harakatda jismning hamma nuqtalari ...\",\"bir xil harakatlanadi\",\"turli tomonga ketadi\",\"tinch turadi\",\"Barcha nuqtalar bir xil yo'l bosadi.\"],\n[\"Qaysi biri ilgarilanma harakat?\",\"Qorda to'g'ri sirpanayotgan chana\",\"Aylanayotgan karusel\",\"Tebranayotgan mayatnik\",\"Chananing hamma nuqtasi parallel yo'l chizadi.\"],\n[\"Ilgarilanma harakat trayektoriyasi qanday bo'lishi mumkin?\",\"To'g'ri yoki egri chiziq\",\"Faqat aylana\",\"Faqat nuqta\",\"E qaysi jism tezroq?\u003c/h2>\n\u003cdiv class=\"track\">\u003cspan class=\"b\" id=\"ra\">🚗\u003c/span>\u003cspan class=\"fin\">🏁\u003c/span>\u003c/div>\n\u003cdiv class=\"track\">\u003cspan class=\"b\" id=\"rb\">🚙\u003c/span>\u003cspan class=\"fin\">🏁\u003c/span>\u003c/div>\n\u003cp>Taxmin qil, so'ng poygani ko'r:\u003c/p>\n\u003cbutton class=\"btn\" data-g=\"A\">🚗 A tezroq\u003c/button>\u003cbutton class=\"btn\" data-g=\"B\">🚙 B tezroq\u003c/button>\n\u003cdiv class=\"fb\" id=\"rfb\">\u003c/div>\u003c/div>\n\u003c/section>\n\u003c!-- 2 METODLAR -->\n\u003csection class=\"panel\" id=\"p2\">\n\u003cdiv class=\"card\">\u003ch2>1. Bosqichma-bosqich yechim\u003c/h2>\u003cp id=\"m1q\">\u003c/p>\n\u003col class=\"st\" id=\"m1s\">\u003c/ol>\n\u003cbutton class=\"btn\" id=\"m1n\">Keyingi qadam\u003c/button>\u003cbutton class=\"btn alt\" id=\"m1r\">Qayta boshlash\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>2. Formula uchburchagi\u003c/h2>\n\u003cp>Topmoqchi bo'lgan kattalikni bos — u yopiladi, formula esa o'zi chiqadi.\u003c/p>\n\u003csvg viewBox=\"0 0 300 240\" width=\"100%\" style=\"max-width:320px;display:block;margin:auto\" role=\"img\" aria-label=\"s, v, t uchburchagi\">\n\u003cpolygon points=\"150,8 12,226 288,226\" fill=\"var(--card)\" stroke=\"var(--ac)\" stroke-width=\"4\"/>\n\u003cline x1=\"70\" y1=\"132\" x2=\"230\" y2=\"132\" stroke=\"var(--ac)\" stroke-width=\"3\"/>\u003cline x1=\"150\" y1=\"132\" x2=\"150\" y2=\"226\" stroke=\"var(--ac)\" stroke-width=\"3\"/>\n\u003cg id=\"tS\" style=\"cursor:pointer\">\u003ccircle cx=\"150\" cy=\"82\" r=\"38\" fill=\"var(--bg)\"/>\u003ctext x=\"150\" y=\"94\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"700\" fill=\"var(--ink)\">s\u003c/text>\u003c/g>\n\u003cg id=\"tV\" style=\"cursor:pointer\">\u003ccircle cx=\"92\" cy=\"188\" r=\"38\" fill=\"var(--bg)\"/>\u003ctext x=\"92\" y=\"200\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"700\" fill=\"var(--ink)\">v\u003c/text>\u003c/g>\n\u003cg id=\"tT\" style=\"cursor:pointer\">\u003ccircle cx=\"208\" cy=\"188\" r=\"38\" fill=\"var(--bg)\"/>\u003ctext x=\"208\" y=\"200\" text-anchor=\"middle\" font-size=\"34\" font-weight=\"700\" fill=\"var(--ink)\">t\u003c/text>\u003c/g>\u003c/svg>\n\u003cp class=\"big\" id=\"tf\" style=\"text-align:center\">s = ?\u003c/p>\u003cp id=\"te\" class=\"mut\" style=\"text-align:center\">\u003c/p>\n\u003cbutton class=\"btn alt\" id=\"m2r\">Qayta boshlash\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>3. Birliklarni o'tkazish\u003c/h2>\u003cp class=\"big\" id=\"m3q\">\u003c/p>\n\u003cinput type=\"text\" id=\"m3i\" inputmode=\"decimal\" aria-label=\"Javob\"> \u003cspan id=\"m3u\">\u003c/span>\u003cbr>\n\u003cbutton class=\"btn\" id=\"m3c\">Tekshir\u003c/button>\u003cbutton class=\"btn alt\" id=\"m3r\">Qayta boshlash\u003c/button>\n\u003cdiv class=\"fb\" id=\"m3f\">\u003c/div>\n\u003cp class=\"mut\">Eslatma: 1 m = 100 cm, 1 km = 1000 m, 1 m/s = 3,6 km/soat.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>4. Xatolar ustida ishlash\u003c/h2>\u003cp id=\"m4q\">\u003c/p>\n\u003cinput type=\"text\" id=\"m4i\" inputmode=\"decimal\" aria-label=\"Javob\"> \u003cspan id=\"m4u\">\u003c/span>\u003cbr>\n\u003cbutton class=\"btn\" id=\"m4c\">Tekshir\u003c/button>\u003cbutton class=\"btn alt\" id=\"m4r\">Qayta boshlash\u003c/button>\n\u003cdiv class=\"fb\" id=\"m4f\">\u003c/div>\n\u003cdiv id=\"m4e\" style=\"display:none\">\u003cp>\u003cb>Xato — o'rganish imkoniyati!\u003c/b> Sening fikringcha, nima bo'ldi?\u003c/p>\u003cdiv id=\"m4b\">\u003c/div>\u003c/div>\n\u003cp id=\"m4t\" class=\"mut\">\u003c/p>\u003cbutton class=\"btn\" id=\"m4s\" style=\"display:none\">O'xshash yangi mashq\u003c/button>\u003c/div>\n\u003c/section>\n\u003c!-- 3 O'YINLAR -->\n\u003csection class=\"panel\" id=\"p3\">\n\u003cdiv class=\"card\">\u003ch2>🏎️ Poyga: tezlikni top\u003c/h2>\n\u003cp>5 ta to'g'ri javob — mashina marraga yetadi.\u003c/p>\n\u003cdiv class=\"track\">\u003cspan class=\"b\" id=\"gc\">🏎️\u003c/span>\u003cspan class=\"fin\">🏁\u003c/span>\u003c/div>\n\u003cp class=\"big\" id=\"g1q\">\u003c/p>\u003cdiv class=\"opts\" id=\"g1o\">\u003c/div>\u003cdiv class=\"fb\" id=\"g1f\">\u003c/div>\n\u003cbutton class=\"btn alt\" id=\"g1r\">Qayta boshlash\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>🎯 Tezlik ovchisi\u003c/h2>\n\u003cp>60 soniyada ko'proq masala yech. To'g'ri javob = 10 ball.\u003c/p>\n\u003cp>⏱ \u003cb id=\"hT\">60\u003c/b> s · Ball: \u003cb id=\"hS\">0\u003c/b> · Rekord: \u003cb id=\"hR\">0\u003c/b>\u003c/p>\n\u003cp id=\"h1q\" class=\"big\">\u003c/p>\n\u003cinput type=\"text\" id=\"hi\" inputmode=\"decimal\" disabled aria-label=\"Javob\"> \u003cspan id=\"hu\">\u003c/span>\u003cbr>\n\u003cbutton class=\"btn\" id=\"hgo\">Boshlash\u003c/button>\u003cbutton class=\"btn\" id=\"hc\" disabled>Tekshir\u003c/button>\u003cbutton class=\"btn alt\" id=\"hr\">Qayta boshlash\u003c/button>\n\u003cdiv class=\"fb\" id=\"hf\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>🃏 Formula juftlari\u003c/h2>\n\u003cp>Kattalik va uning birligini top. Yurishlar: \u003cb id=\"pm\">0\u003c/b>\u003c/p>\n\u003cdiv class=\"grid\" id=\"pg\">\u003c/div>\u003cdiv class=\"fb\" id=\"pf\">\u003c/div>\n\u003cbutton class=\"btn alt\" id=\"pr\">Qayta boshlash\u003c/button>\u003c/div>\n\u003c/section>\n\u003c!-- 4 NATIJAM -->\n\u003csection class=\"panel\" id=\"p4\">\n\u003cdiv class=\"card\">\u003cdiv id=\"cel\">\u003c/div>\n\u003cdiv class=\"stat\">\u003cdiv>\u003cb id=\"rP\">0\u003c/b>ball\u003c/div>\u003cdiv>\u003cb id=\"rO\">0\u003c/b>✓ to'g'ri\u003c/div>\u003cdiv>\u003cb id=\"rB\">0\u003c/b>✗ xato\u003c/div>\u003c/div>\n\u003cp>Aniqlik: \u003cb id=\"rA\">—\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Nishonlar\u003c/h2>\u003cdiv class=\"bdg\" id=\"bdg\">\u003c/div>\u003c/div>\n\u003cdiv class=\"card\">\u003ch2>Xato turlari\u003c/h2>\u003cp id=\"rE\" class=\"mut\">\u003c/p>\n\u003cp class=\"mut\">Xato qilish — normal. Eng muhimi, sababini topib, qayta urinish.\u003c/p>\n\u003cbutton class=\"btn alt\" id=\"r4\">Qayta boshlash\u003c/button>\u003c/div>\n\u003c/section>\n\u003c/main>\u003cdiv id=\"party\">\u003c/div>\n\u003cscript>\nconst $=i=>document.getElementById(i),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)];\nconst shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);\nconst S={pts:0,ok:0,bad:0,rec:0,errs:{},fl:{}};\nconst GOOD=[\"Barakalla!\",\"Ajoyib!\",\"Zo'r ketyapsan!\",\"Aynan shunday!\"];\nconst BADM=[\"Hali emas — xato o'rganish imkoniyati! Qayta urinib ko'r.\",\"Deyarli! Xato — o'rganish yo'li. Yana bir bor o'yla.\",\"Qiyin emas, shunchaki yana bir urinish kerak.\"];\nconst ERRS={\"E'tiborsizlik\":\"Savolni va sonlarni sekin qayta o'qi, nima so'ralayotganini ostiga chiz.\",\"Formulani bilmaslik\":\"Formula uchburchagiga qayt: topiladigan kattalikni yop — formula chiqadi.\",\"Birlik\":\"Birliklarni tekshir: m va s bo'lsa, tezlik m/s bo'ladi. Kerak bo'lsa o'tkaz.\",\"Hisoblash\":\"Amalni qayta bajar yoki teskari amal bilan tekshir (masalan, v · t = s).\",\"Tushunmaslik\":\"Rasm chiz: jism, yo'l, vaqt. 1-mashqdagi bosqichma-bosqich yechimni ko'r.\"};\nconst BD=[[\"🌱\",\"Birinchi qadam\",\"1 ta to'g'ri javob\",()=>S.ok>=1],[\"⚡\",\"Tezlik ustasi\",\"10 ta to'g'ri javob\",()=>S.ok>=10],[\"🏎️\",\"Poyga g'olibi\",\"Poygani yutding\",()=>S.fl.race],[\"🎯\",\"Ovchi\",\"Ovchida 50+ ball\",()=>S.rec>=50],[\"🃏\",\"Xotira chempioni\",\"Barcha juftlar topildi\",()=>S.fl.pairs],[\"🔍\",\"Xatodan o'rgandim\",\"Xato turini tanlading\",()=>S.fl.err],[\"🔭\",\"Kuzatuvchi\",\"Poygani taxmin qilding\",()=>S.fl.watch],[\"🏆\",\"Mukammal\",\"5+ javob, 100%\",()=>S.ok+S.bad>=5&&S.bad==0]];\nfunction rec(ok,p){S.ok+=ok?1:0;S.bad+=ok?0:1;S.pts+=ok?(p||10):0}\nfunction fb(e,ok,m){e.className=\"fb \"+(ok?\"ok\":\"bad\");e.textContent=(ok?\"✓ \":\"✗ \")+m}\nconst num=v=>parseFloat(String(v).replace(\",\",\".\"));\nfunction gen(k){k=k||pick([\"v\",\"s\",\"t\"]);const v=R(2,20),t=
