px}\n.sim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}\n@media (max-width:780px){.sim{grid-template-columns:minmax(0,1fr)}}\n.stage{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:0}\n.stage canvas{display:block;width:100%;height:auto}\nsvg.scene{display:block;width:100%;max-width:380px;height:auto;margin-inline:auto}\n.ctrl{display:grid;gap:8px;margin-block:10px;min-width:0}\n.ctrl label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-weight:500}\n.ctrl label b{font-family:var(--font-mono);min-width:5.5ch;text-align:right;color:var(--num)}\ninput[type=range]{width:100%;accent-color:var(--accent);min-height:28px}\n.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.btn{font:inherit;font-weight:600;padding:10px 16px;min-height:44px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer}\n.btn.alt{background:transparent;color:var(--accent)}\n.btn:disabled{opacity:.45;cursor:not-allowed}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\ninput[type=text],select{font:inherit;font-family:var(--font-mono);padding:8px 12px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;width:8.5rem;max-width:100%}\nselect{width:auto;font-family:var(--font-body)}\n.chk{display:flex;gap:8px;align-items:center;min-height:36px;font-size:.95rem}\n.chk input{width:20px;height:20px;accent-color:var(--accent)}\n.num{font-family:var(--font-mono);font-weight:600;color:var(--num)}\n.bigv{font-family:var(--font-display);font-weight:700;font-size:2.3rem;line-height:1;color:var(--num);font-variant-numeric:tabular-nums}\n.readout{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-block:8px}\n.readout small{display:block;color:var(--muted);font-size:.8rem}\n.calc{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:150px}\n.calc .ln{font-family:var(--font-mono);font-weight:600;font-size:1.3rem;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;margin-block:4px;overflow-wrap:anywhere}\n.calc .ln.show{opacity:1;transform:none}\n.calc .ln.res{font-size:1.9rem;color:var(--num)}\n.calc .ln i{font-style:normal;color:var(--num)}\n.calc .cap{font-family:var(--font-body);font-size:.85rem;font-weight:400;color:var(--muted);display:block}\n.conv{font-family:var(--font-mono);font-weight:500;font-size:.95rem;margin-top:8px;overflow-wrap:anywhere}\n.msg{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.96rem}\n.msg.ok{background:var(--good-soft);color:var(--good)}.msg.no{background:var(--bad-soft);color:var(--bad)}.msg.info{background:var(--accent-soft)}\n.msg:empty{display:none}\n.note{font-size:.9rem;color:var(--muted)}\n.steps{margin:0 0 10px;padding:0;list-style:none;display:grid;gap:4px}\n.steps li{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font-size:.93rem;color:var(--muted)}\n.steps li.cur{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}\n.steps li.done{color:var(--good);border-color:transparent}\n.objs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;min-width:68px}\n.objs svg{width:36px;height:36px}\n.objs span{font-size:.78rem}\n.errs{margin:6px 0 0;padding-left:1.2em;display:grid;gap:6px}\n.errs b{color:var(--bad)}\n.quiz .q{border-top:1px solid var(--line);padding-block:14px 4px}\n.quiz .q:first-child{border-top:0}\n.quiz .qt{font-weight:600;margin-bottom:8px}\n.quiz .opts{display:grid;gap:6px}\n.quiz .opt{font:inherit;text-align:left;padding:10px 12px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer}\n.quiz .opt:hover:not(:disabled){border-color:var(--accent)}\n.quiz .opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}\n.quiz .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}\n.quiz .why{margin:8px 0 6px;padding:8px 12px;border-radius:8px;background:var(--stage);font-size:.93rem}\n.score{font-family:var(--font-display);font-size:2.4rem;font-weight:700;color:var(--num)}\n.zoomnote{font-size:.85rem;color:var(--muted);margin-top:6px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\nfooter{max-width:1040px;margin:12px auto 0;font-size:.85rem;color:var(--muted)}\n@media (max-width:520px){.brand p{display:none}.brand h1{font-size:1.15rem}.top-in{padding-block:8px 0}.tab{padding:8px 10px;font-size:.88rem}.speed{font-size:.8rem}.seg button{padding:6px 10px;min-height:36px}}\n@media (prefers-reduced-motion:reduce){.calc .ln{transition:none}}\n\u003c/style>\n\u003cdiv class=\"top\">\u003cdiv class=\"top-in\">\n  \u003cdiv class=\"headrow\">\n    \u003cdiv class=\"brand\">\u003ch1>Hajmni qanday o'lchaymiz?\u003c/h1>\u003cp>7-sinf fizika · interaktiv simulyatsiya\u003c/p>\u003c/div>\n    \u003cdiv class=\"speed\">Tezlik \u003cdiv class=\"seg\" id=\"speed\">\u003cbutton data-s=\"0.5\">0,5×\u003c/button>\u003cbutton data-s=\"1\" class=\"on\">1×\u003c/button>\u003cbutton data-s=\"2\">2×\u003c/button>\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cnav class=\"tabs\" role=\"tablist\" aria-label=\"Bo'limlar\">\n    \u003cbutton class=\"tab on\" role=\"tab\" data-tab=\"p1\">1. To'g'ri shaklli jismlar\u003c/button>\n    \u003cbutton class=\"tab\" role=\"tab\" data-tab=\"p2\">2. Suyuqlik va sochiluvchan moddalar\u003c/button>\n    \u003cbutton class=\"tab\" role=\"tab\" data-tab=\"p3\">3. Noto'g'ri shaklli jismlar\u003c/button>\n  \u003c/nav>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"app\">\n\n\u003c!-- ================= 1-BO'LIM ================= -->\n\u003csection class=\"panel on\" id=\"p1\" role=\"tabpanel\">\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">1 · Nazariya\u003c/div>\n    \u003ch2>Hajm — jism egallagan joy\u003c/h2>\n    \u003cp>Hajm \u003cb>V\u003c/b> harfi bilan belgilanadi. Qirrasi 1 sm bo'lgan kubning hajmi \u003cb>1 sm³\u003c/b> (bir kub santimetr) ga teng. Jismning hajmi — uni nechta shunday kubcha to'ldirishi.\u003c/p>\n    \u003cdiv class=\"formulas\">\n      \u003cdiv class=\"fx\">\u003cb>Kub\u003c/b>\u003cspan>V = a³\u003c/span>\u003c/div>\n      \u003cdiv class=\"fx\">\u003cb>To'g'ri burchakli parallelepiped\u003c/b>\u003cspan>V = a·b·c\u003c/span>\u003c/div>\n      \u003cdiv class=\"fx\">\u003cb>Silindr (π ≈ 3,14)\u003c/b>\u003cspan>V = π·r²·h\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"units\">\u003cspan>1 sm³ = 1 ml\u003c/span>\u003cspan>1 dm³ = 1 l\u003c/span>\u003cspan>1 m³ = 1000 l\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">2 · Simulyatsiya\u003c/div>\n    \u003ch2>Jismni tanla va o'lchamlarini o'zgartir\u003c/h2>\n    \u003cdiv class=\"sim\">\n      \u003cdiv>\n        \u003cdiv class=\"stage\">\u003ccanvas id=\"s1-cv\" width=\"400\" height=\"300\" aria-label=\"Jismning 3D ko'rinishi\">\u003c/canvas>\u003c/div>\n        \u003cdiv class=\"readout\">\u003csmall id=\"s1-capt\">Birlik kubchalar\u003c/small>\u003cspan class=\"bigv\" id=\"s1-cnt\">0\u003c/span> \u003cspan class=\"num\" id=\"s1-cnt2\">\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"seg\" id=\"s1-shape\">\u003cbutton data-shape=\"cube\" class=\"on\">Kub\u003c/button>\u003cbutton data-shape=\"box\">Parallelepiped\u003c/button>\u003cbutton data-shape=\"cyl\">Silindr\u003c/button>\u003c/div>\n        \u003cdiv class=\"ctrl\" id=\"s1-sliders\">\u003c/div>\n        \u003cdiv class=\"row\">\n          \u003cbutton class=\"btn\" id=\"s1-calcbtn\">Qadamma-qadam hisobla\u003c/button>\n          \u003cbutton class=\"btn alt\" id=\"s1-fill\">Birlik kublar bilan to'ldir\u003c/button>\n          \u003cbutton class=\"btn alt\" id=\"s1-reset\">Qayta boshlash\u003c/button>\n        \u003c/div>\n        \u003cp class=\"note\" id=\"s1-note\" style=\"margin-top:8px\">\u003c/p>\n      \u003c/div>\n    \u003c/div>\n    \u003ch3>Hisoblash\u003c/h3>\n    \u003cdiv class=\"calc\" id=\"s1-calc\">\u003c/div>\n    \u003cdiv class=\"conv\" id=\"s1-conv\">\u003c/div>\n    \u003ch3>Birliklar o'zgartirgich\u003c/h3>\n    \u003cdiv class=\"row\">\n      \u003cinput type=\"text\" id=\"uc-val\" inputmode=\"decimal\" value=\"2500\" aria-label=\"Qiymat\">\n      \u003cselect id=\"uc-unit\" aria-label=\"Birlik\">\u003coption value=\"cm3\">sm³\u003c/option>\u003coption value=\"ml\">ml\u003c/option>\u003coption value=\"dm3\">dm³\u003c/option>\u003coption value=\"l\">l\u003c/option>\u003coption value=\"m3\">m³\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"conv\" id=\"uc-out\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">3 · Mustaqil sinash\u003c/div>\n    \u003ch2>Mashq\u003c/h2>\n    \u003cp id=\"s1-task\" style=\"font-size:1.1rem;font-weight:500\">\u003c/p>\n    \u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"s1-ans\" inputmode=\"decimal\" placeholder=\"Javob\" aria-label=\"Javob\">\u003cspan class=\"num\" id=\"s1-unit\">\u003c/span>\n      \u003cbutton class=\"btn\" id=\"s1-chk\">Tekshir\u003c/button>\u003cbutton class=\"btn alt\" id=\"s1-new\">Yangi mashq\u003c/button>\u003c/div>\n    \u003cdiv class=\"msg\" id=\"s1-msg\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\">\u003cdiv class=\"lab\">4 · Test\u003c/div>\u003cdiv id=\"q1\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 2-BO'LIM ================= -->\n\u003csection class=\"panel\" id=\"p2\" role=\"tabpanel\">\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">1 · Nazariya\u003c/div>\n    \u003ch2>Menzurka (o'lchov silindri)\u003c/h2>\n    \u003cp>Suyuqlik va sochiluvchan moddalarning hajmi \u003cb>menzurka\u003c/b> bilan o'lchanadi. Avval \u003cb>bo'linma bahosi\u003c/b> topiladi — bitta bo'linma necha millilitr ekani.\u003c/p>\n    \u003cdiv class=\"formulas\">\n      \u003cdiv class=\"fx\">\u003cb>Bo'linma bahosi\u003c/b>\u003cspan>(katta − kichik) : bo'linmalar soni\u003c/span>\u003c/div>\n      \u003cdiv class=\"fx\">\u003cb>Masalan\u003c/b>\u003cspan>(30 − 20) : 5 = 2 ml\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cp>\u003cb>To'g'ri o'qish:\u003c/b> ko'z suyuqlik sathi bilan bir balandlikda bo'ladi. Suv, sut, moy shisha devori bo'ylab biroz ko'tarilib, egri sath hosil qiladi — bu \u003cb>menisk\u003c/b>. Menisk \u003cb>pastki nuqtasi\u003c/b> bo'yicha o'qiladi.\u003c/p>\n    \u003cp>\u003cb>Sochiluvchan moddalar\u003c/b> (qum, tuz, shakar, bo'tqa) uyum bo'lib tushadi, zarrachalar orasida havo qoladi. Hajmni o'qishdan oldin \u003cb>sathni tekislash\u003c/b> kerak.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">2 · Simulyatsiya\u003c/div>\n    \u003ch2>Menzurka bilan tajribalar\u003c/h2>\n\n    \u003ch3>A. Suyuqlik quyamiz\u003c/h3>\n    \u003cdiv class=\"sim\">\n      \u003cdiv class=\"stage\">\u003csvg class=\"scene\" id=\"s2-pour\" viewBox=\"0 0 320 350\" role=\"img\" aria-label=\"Kosadan menzurkaga suyuqlik quyish\">\u003c/svg>\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"seg\" id=\"s2-liq\">\u003cbutton data-l=\"suv\" class=\"on\">Suv\u003c/button>\u003cbutton data-l=\"sut\">Sut\u003c/button>\u003cbutton data-l=\"moy\">Moy\u003c/button>\u003c/div>\n        \u003cdiv class=\"ctrl\">\u003clabel>Hajm \u003cinput type=\"range\" id=\"s2-amt\" min=\"10\" max=\"90\" step=\"2\" value=\"46\">\u003cb id=\"s2-amtv\">46 ml\u003c/b>\u003c/label>\u003c/div>\n        \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"s2-pourbtn\">Quy\u003c/button>\u003cbutton class=\"btn alt\" id=\"s2-empty\">Qayta boshlash\u003c/button>\u003c/div>\n        \u003cdiv class=\"readout\">\u003csmall>Menzurka ko'rsatishi\u003c/small>\u003cspan class=\"bigv\" id=\"s2-read\">0\u003c/span> \u003cspan class=\"num\">ml\u003c/span>\u003c/div>\n        \u003cp class=\"note\">Bo'linma bahosi: \u003cspan class=\"num\">2 ml\u003c/span>. Raqamlar har 10 ml da.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n\n    \u003ch3>B. Ko'zni qayerga qo'yamiz?\u003c/h3>\n    \u003cdiv class=\"sim\">\n      \u003cdiv class=\"stage\">\u003csvg class=\"scene\" id=\"s2-eye\" viewBox=\"0 0 320 350\" role=\"img\" aria-label=\"Menzurkaga qarash balandligi\">\u003c/svg>\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"seg\" id=\"s2-eyepos\">\u003cbutton data-p=\"up\">Yuqoridan\u003c/button>\u003cbutton data-p=\"mid\" class=\"on\">Sath bilan bir xil\u003c/button>\u003cbutton data-p=\"down\">Pastdan\u003c/button>\u003c/div>\n        \u003cdiv class=\"readout\">\u003csmall>Sen o'qigan qiymat\u003c/small>\u003cspan class=\"bigv\" id=\"s2-eyeval\">56\u003c/span> \u003cspan class=\"num\">ml\u003c/span>\u003c/div>\n        \u003cdiv class=\"msg info\" id=\"s2-eyetxt\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003ch3>C. Sochiluvchan modda to'kamiz\u003c/h3>\n    \u003cdiv class=\"sim\">\n      \u003cdiv class=\"stage\">\u003csvg class=\"scene\" id=\"s2-sand\" viewBox=\"0 0 320 350\" role=\"img\" aria-label=\"Menzurkaga sochiluvchan modda to'kish\">\u003c/svg>\u003c/div>\n      \u003cdiv>\n        \u003cdiv class=\"seg\" id=\"s2-sub\">\u003cbutton data-m=\"qum\" class=\"on\">Qum\u003c/button>\u003cbutton data-m=\"tuz\">Tuz\u003c/button>\u003cbutton data-m=\"shakar\">Shakar\u003c/button>\u003cbutton data-m=\"botqa\">Bo'tqa\u003c/button>\u003c/div>\n        \u003cdiv class=\"ctrl\">\u003clabel>Miqdor \u003cinput type=\"range\" id=\"s2-samt\" min=\"20\" max=\"90\" step=\"2\" value=\"50\">\u003cb id=\"s2-samtv\">50 ml\u003c/b>\u003c/label>\u003c/div>\n        \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"s2-spour\">To'k\u003c/button>\u003cbutton class=\"btn alt\" id=\"s2-level\">Sathni tekisla\u003c/button>\u003cbutton class=\"btn alt\" id=\"s2-sempty\">Qayta boshlash\u003c/button>\u003c/div>\n        \u003cdiv class=\"readout\">\u003csmall>Uyumning eng baland nuqtasi\u003c/small>\u003cspan class=\"num\" id=\"s2-top\">0 ml\u003c/span> · \u003csmall style=\"display:inline\">tekis sath:\u003c/small> \u003cspan class=\"bigv\" style=\"font-size:1.6rem\" id=\"s2-flat\">0\u003c/span> \u003cspan class=\"num\">ml\u003c/span>\u003c/div>\n        \u003cdiv class=\"stage\" style=\"margin-top:8px\">\u003csvg id=\"s2-zoom\" viewBox=\"0 0 220 120\" style=\"display:block;width:100%;height:auto\" role=\"img\" aria-label=\"Zarrachalar orasidagi havo bo'shliqlari\">\u003c/svg>\u003c/div>\n        \u003cp class=\"zoomnote\">Kattalashtirilgan ko'rinish: zarrachalar orasida \u003cb>havo\u003c/b> bor.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">3 · Mustaqil sinash\u003c/div>\n    \u003ch2>Menzurka ko'rsatishini o'qi\u003c/h2>\n    \u003cdiv class=\"sim\">\n      \u003cdiv class=\"stage\">\u003csvg class=\"scene\" id=\"s2-ex\" viewBox=\"0 0 320 350\" role=\"img\" aria-label=\"Mashq uchun menzurka\">\u003c/svg>\u003c/div>\n      \u003cdiv>\n        \u003cp class=\"note\" id=\"s2-extxt\">\u003c/p>\n        \u003cdiv class=\"ctrl\">\n          \u003clabel>1 bo'linma \u003cinput type=\"text\" id=\"s2-ans1\" inputmode=\"decimal\" placeholder=\"?\">\u003cb>ml\u003c/b>\u003c/label>\n          \u003clabel>Suyuqlik \u003cinput type=\"text\" id=\"s2-ans2\" inputmode=\"decimal\" placeholder=\"?\">\u003cb>ml\u003c/b>\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"s2-chk\">Tekshir\u003c/button>\u003cbutton class=\"btn alt\" id=\"s2-new\">Yangi mashq\u003c/button>\u003c/div>\n        \u003cdiv class=\"msg\" id=\"s2-msg\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\">\u003cdiv class=\"lab\">4 · Test\u003c/div>\u003cdiv id=\"q2\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= 3-BO'LIM ================= -->\n\u003csection class=\"panel\" id=\"p3\" role=\"tabpanel\">\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">1 · Nazariya\u003c/div>\n    \u003ch2>Shaklsiz jism hajmini qanday topamiz?\u003c/h2>\n    \u003cp>Tosh yoki kalitning hajmini formula bilan hisoblab bo'lmaydi. Bunda jism suvga botiriladi va suvning qancha siqib chiqarilgani o'lchanadi.\u003c/p>\n    \u003cdiv class=\"formulas\">\n      \u003cdiv class=\"fx\">\u003cb>1-usul. Suv almashtirish\u003c/b>\u003cspan>V = V₂ − V₁\u003c/span>\u003c/div>\n      \u003cdiv class=\"fx\">\u003cb>2-usul. Quyilish idishi\u003c/b>\u003cspan>V = stakandagi suv\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cp>\u003cb>Cho'ktirgich.\u003c/b> Po'kak va muz suvda cho'kmaydi. Ularni cho'kadigan yuk (cho'ktirgich) bilan bog'lab botiramiz: avval faqat cho'ktirgichning hajmi o'lchanadi (V₁), keyin jism bilan birga (V₂). Jism hajmi: V = V₂ − V₁.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">2 · Simulyatsiya\u003c/div>\n    \u003ch2>Tajriba qadamma-qadam\u003c/h2>\n    \u003cdiv class=\"row\" style=\"margin-bottom:10px\">\n      \u003cdiv class=\"seg objs\" id=\"s3-obj\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-bottom:10px\">\n      \u003cdiv class=\"seg\" id=\"s3-method\">\u003cbutton data-m=\"1\" class=\"on\">1-usul. Suv almashtirish\u003c/button>\u003cbutton data-m=\"2\">2-usul. Quyilish idishi\u003c/button>\u003c/div>\n      \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"s3-rand\"> Hajm tasodifiy bo'lsin\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"sim\">\n      \u003cdiv class=\"stage\">\u003csvg class=\"scene\" id=\"s3-svg\" viewBox=\"0 0 380 360\" style=\"max-width:420px\" role=\"img\" aria-label=\"Noto'g'ri shaklli jism hajmini o'lchash\">\u003c/svg>\u003c/div>\n      \u003cdiv>\n        \u003col class=\"steps\" id=\"s3-steps\">\u003c/ol>\n        \u003cdiv class=\"msg info\" id=\"s3-instr\" style=\"display:block\">\u003c/div>\n        \u003cdiv class=\"row\" id=\"s3-inrow\" style=\"margin-top:8px\">\u003cinput type=\"text\" id=\"s3-in\" inputmode=\"decimal\" placeholder=\"ml\" aria-label=\"Menzurka ko'rsatishi\">\u003cbutton class=\"btn alt\" id=\"s3-chk\">Tekshir\u003c/button>\u003c/div>\n        \u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"btn\" id=\"s3-next\">Keyingi qadam\u003c/button>\u003cbutton class=\"btn alt\" id=\"s3-restart\">Qayta boshlash\u003c/button>\u003c/div>\n        \u003cdiv id=\"s3-errs\" style=\"margin-top:8px\">\n          \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"s3-partial\"> Xato: jism to'liq botmasin\u003c/label>\n          \u003clabel class=\"chk\">\u003cinput type=\"checkbox\" id=\"s3-bubbles\"> Xato: havo pufakchalari qolsin\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"msg\" id=\"s3-result\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003ch3>Xatolar ro'yxati\u003c/h3>\n    \u003cul class=\"errs\">\n      \u003cli>\u003cb>Jism to'liq botmasa\u003c/b> — siqib chiqarilgan suv kam bo'ladi, hajm haqiqiydan \u003cb>kichik\u003c/b> chiqadi.\u003c/li>\n      \u003cli>\u003cb>Jismda havo pufakchalari qolsa\u003c/b> — pufakchalar ham joy egallaydi, hajm haqiqiydan \u003cb>katta\u003c/b> chiqadi.\u003c/li>\n      \u003cli>\u003cb>Ko'z sathdan baland yoki past bo'lsa\u003c/b> — menzurka noto'g'ri o'qiladi.\u003c/li>\n      \u003cli>\u003cb>Quyilish idishi to'lmagan bo'lsa\u003c/b> — avval suv tumshuqdan oqib to'xtashi kerak, aks holda hajm kam chiqadi.\u003c/li>\n      \u003cli>\u003cb>Suv sachrasa\u003c/b> yoki stakandan menzurkaga quyganda to'kilsa — natija noto'g'ri.\u003c/li>\n    \u003c/ul>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"lab\">3 · Mustaqil sinash\u003c/div>\n    \u003ch2>Mashq\u003c/h2>\n    \u003cp id=\"s3-task\" style=\"font-size:1.1rem;font-weight:500\">\u003c/p>\n    \u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"s3-ans\" inputmode=\"decimal\" placeholder=\"Javob\" aria-label=\"Javob\">\u003cspan class=\"num\">sm³\u003c/span>\n      \u003cbutton class=\"btn\" id=\"s3-tchk\">Tekshir\u003c/button>\u003cbutton class=\"btn alt\" id=\"s3-tnew\">Yangi mashq\u003c/button>\u003c/div>\n    \u003cdiv class=\"msg\" id=\"s3-tmsg\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\">\u003cdiv class=\"lab\">4 · Test\u003c/div>\u003cdiv id=\"q3\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003c!-- ================= YAKUNIY TEST ================= -->\n\u003csection class=\"card quiz\" id=\"final\">\n  \u003cdiv class=\"lab\">Yakuniy test\u003c/div>\n  \u003ch2>Bilimingni tekshir\u003c/h2>\n  \u003cp class=\"note\">10 ta savol. Har bir to'g'ri javob — 1 ball.\u003c/p>\n  \u003cdiv id=\"qf\">\u003c/div>\n  \u003cdiv id=\"qf-res\">\u003c/div>\n\u003c/section>\n\u003cfooter>Hajmni qanday o'lchaymiz? · 7-sinf fizika\u003c/footer>\n\u003c/div>\n\u003cscript>\n/* ============================================================\n   UMUMIY YORDAMCHI FUNKSIYALAR\n   ============================================================ */\nconst $ = (s, r = document) => r.querySelector(s);\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\nconst NS = 'http://www.w3.org/2000/svg';\nfunction el(tag, attrs, parent) {\n  const e = document.createElementNS(NS, tag);\n  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);\n  if (parent) parent.appendChild(e);\n  return e;\n}\nconst fmt = (n, d = 2) => String(+(+n).toFixed(d)).replace('.', ',');       // 3.5 -> \"3,5\"\nconst parseNum = s => parseFloat(String(s).replace(',', '.').replace(/\\s/g, ''));\nconst rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));            // butun tasodifiy son\nconst pick = arr => arr[Math.floor(Math.random() * arr.length)];\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst clamp = (x, a, b) => Math.max(a, Math.min(b, x));\nconst cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst PI = 3.14;                                                               // 7-sinf uchun π ≈ 3,14\n\n/* ---------- Tezlik (hamma animatsiyalar uchun) ---------- */\nlet SPEED = 1;\nconst wait = ms => new Promise(r => setTimeout(r, ms / SPEED));\nconst easeIO = t => t \u003c .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;\nfunction tween(ms, fn, ease = easeIO) {\n  return new Promise(res => {\n    const t0 = performance.now(), d = ms / SPEED;\n    (function f(now) {\n      const t = clamp((now - t0) / d, 0, 1);\n      fn(ease(t), t);\n      t \u003c 1 ? requestAnimationFrame(f) : res();\n    })(t0);\n  });\n}\n$$('#speed button').forEach(b => b.onclick = () => {\n  SPEED = parseFloat(b.dataset.s);\n  $$('#speed button').forEach(x => x.classList.toggle('on', x === b));\n});\n\n/* ---------- Mavzu o'zgarganda canvas qayta chiziladi ---------- */\nconst themeHooks = [];\nconst onTheme = fn => themeHooks.push(fn);\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => themeHooks.forEach(f => f()));\nnew MutationObserver(() => themeHooks.forEach(f => f())).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });\n\n/* ---------- Segment tugmalar guruhi ---------- */\nfunction seg(root, onPick) {\n  $$('button', root).forEach(b => b.onclick = () => { setSeg(root, b); onPick(b); });\n}\nfunction setSeg(root, btn) { $$('button', root).forEach(x => x.classList.toggle('on', x === btn)); }\n\n/* ---------- Tablar ---------- */\nconst resizeHooks = [];\nfunction showTab(id) {\n  $$('.tab').forEach(t => { const on = t.dataset.tab === id; t.classList.toggle('on', on); t.setAttribute('aria-selected', on); });\n  $$('.panel').forEach(p => p.classList.toggle('on', p.id === id));\n  resizeHooks.forEach(f => f());\n  try { history.replaceState(null, '', '#' + id); } catch (e) {}\n}\n$$('.tab').forEach(t => t.onclick = () => showTab(t.dataset.tab));\n{ const h = location.hash.slice(1); if (['p1', 'p2', 'p3'].includes(h)) showTab(h); }\naddEventListener('resize', () => resizeHooks.forEach(f => f()));\n\n/* ---------- Test savollari mexanizmi ----------\n   savol: { q: \"matn\", o: [\"variant\", ...], a: to'g'ri indeks, w: \"izoh\" }  */\nfunction renderQuiz(root, qs, onChange) {\n  root.innerHTML = '';\n  let score = 0, answered = 0;\n  qs.forEach((it, i) => {\n    const box = document.createElement('div'); box.className = 'q';\n    box.innerHTML = '\u003cdiv class=\"qt\">' + (i + 1) + '. ' + it.q + '\u003c/div>\u003cdiv class=\"opts\">\u003c/div>';\n    const opts = $('.opts', box);\n    it.o.forEach((txt, j) => {\n      const b = document.createElement('button'); b.className = 'opt'; b.textContent = txt;\n      b.onclick = () => {\n        $$('.opt', opts).forEach((x, k) => { x.disabled = true; if (k === it.a) x.classList.add('right'); });\n        const ok = j === it.a;\n        if (!ok) b.classList.add('wrong'); else score++;\n        answered++;\n        const w = document.createElement('div'); w.className = 'why';\n        w.innerHTML = (ok ? '\u003cb style=\"color:var(--good)\">To\\'g\\'ri!\u003c/b> ' : '\u003cb style=\"color:var(--bad)\">Noto\\'g\\'ri.\u003c/b> ') + it.w;\n        box.appendChild(w);\n        if (onChange) onChange(score, answered, qs.length, i, ok);\n      };\n      opts.appendChild(b);\n    });\n    root.appendChild(box);\n  });\n}\n\n/* ============================================================\n   MENZURKA (o'lchov silindri) — 2- va 3-bo'limda umumiy\n   buildCyl(svg, {...}) -> { setLevel(ml), yOf(ml), layer, x0, w, y0, ppm, liquid }\n   max — sig'im (ml), div — bo'linma bahosi, label — raqam yoziladigan qadam\n   ============================================================ */\nlet clipCounter = 0;\nfunction buildCyl(svg, o) {\n  o = Object.assign({ max: 100, div: 2, label: 10, x0: 120, w: 60, y0: 310, ppm: 2.4, color: 'var(--water)' }, o || {});\n  const { x0, w, y0, ppm } = o, top = y0 - o.max * ppm - 10;\n  const yOf = ml => y0 - ml * ppm;\n  const id = 'clip' + (++clipCounter);\n  const defs = el('defs', {}, svg);\n  const cp = el('clipPath', { id }, defs);\n  el('rect', { x: x0 + 1, y: top, width: w - 2, height: y0 - top }, cp);\n  const g = el('g', {}, svg);\n  el('rect', { x: x0 - 16, y: y0, width: w + 32, height: 12, rx: 3, fill: 'var(--line)', stroke: 'var(--glass-edge)' }, g);\n  el('rect', { x: x0, y: top, width: w, height: y0 - top, fill: 'var(--glass)' }, g);\n  const layer = el('g', { 'clip-path': 'url(#' + id + ')' }, g);        // suyuqlik / qum shu qatlamga chiziladi\n  const liquid = el('path', { d: '', fill: o.color, stroke: 'var(--water-edge)', 'stroke-width': 1 }, layer);\n  el('path', { d: `M${x0},${top} L${x0},${y0} L${x0 + w},${y0} L${x0 + w},${top}`, fill: 'none', stroke: 'var(--glass-edge)', 'stroke-width': 2 }, g);\n  el('path', { d: `M${x0 - 4},${top} L${x0 + 4},${top + 6}`, stroke: 'var(--glass-edge)', 'stroke-width': 2 }, g);\n  // shkala (chap tomonda)\n  for (let v = 0; v \u003c= o.max + 1e-9; v += o.div) {\n    const major = Math.abs(v / o.label - Math.round(v / o.label)) \u003c 1e-9;\n    const y = yOf(v);\n    el('line', { x1: x0, x2: x0 - (major ? 12 : 6), y1: y, y2: y, stroke: 'var(--fg)', 'stroke-width': major ? 1.4 : 1 }, g);\n    if (major && v > 0) {\n      const t = el('text', { x: x0 - 16, y: y + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--fg)', 'font-family': 'IBM Plex Mono, monospace' }, g);\n      t.textContent = v;\n    }\n  }\n  const t0 = el('text', { x: x0 - 16, y: y0 + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--fg)', 'font-family': 'IBM Plex Mono, monospace' }, g); t0.textContent = '0';\n  const u = el('text', { x: x0 + w / 2, y: top - 6, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }, g); u.textContent = 'ml';\n  function setLevel(ml) {\n    if (ml \u003c= 0.01) { liquid.setAttribute('d', ''); return; }\n    const y = yOf(ml);                                                 // menisk pastki nuqtasi = y\n    liquid.setAttribute('d', `M${x0},${y - 4} Q${x0 + w / 2},${y + 4} ${x0 + w},${y - 4} L${x0 + w},${y0} L${x0},${y0}Z`);\n  }\n  return { setLevel, yOf, layer, group: g, liquid, x0, w, y0, ppm, max: o.max, top };\n}\n/* ============================================================\n   1-BO'LIM. TO'G'RI SHAKLLI JISMLAR\n   ============================================================ */\nconst S1 = { shape: 'cube', a: 4, b: 3, c: 5, r: 2, h: 5, fillN: null, run: 0 };\nconst S1_DEF = { shape: 'cube', a: 4, b: 3, c: 5, r: 2, h: 5 };\nconst S1_LIM = { a: [1, 10], b: [1, 10], c: [1, 10], r: [1, 6], h: [1, 10] };\nconst S1_NAME = { a: 'a', b: 'b', c: 'c', r: 'r', h: 'h' };\nconst S1_KEYS = { cube: ['a'], box: ['a', 'b', 'c'], cyl: ['r', 'h'] };\n\nfunction s1Dims() { // kub uchun a=b=c\n  return S1.shape === 'cube' ? [S1.a, S1.a, S1.a] : [S1.a, S1.b, S1.c];\n}\nfunction s1Volume() {\n  if (S1.shape === 'cyl') return PI * S1.r * S1.r * S1.h;\n  const [a, b, c] = s1Dims(); return a * b * c;\n}\nfunction s1Total() { // nechta \"bosqich\" (kubcha yoki qatlam)\n  return S1.shape === 'cyl' ? S1.h : s1Dims().reduce((p, x) => p * x, 1);\n}\nconst fmtG = n => String(+(+n).toPrecision(10)).replace('.', ',');\n\n/* ---------- Canvas ---------- */\nconst s1cv = $('#s1-cv'), s1x = s1cv.getContext('2d');\nlet S1W = 400, S1H = 300;\nfunction s1Fit() {\n  const w = Math.max(220, Math.floor(s1cv.parentElement.clientWidth - 14));\n  if (!s1cv.parentElement.clientWidth) return false;\n  const dpr = window.devicePixelRatio || 1;\n  S1W = w; S1H = 300;\n  s1cv.width = Math.round(w * dpr); s1cv.height = Math.round(S1H * dpr);\n  s1x.setTransform(dpr, 0, 0, dpr, 0, 0);\n  return true;\n}\nfunction poly(ctx, pts, fill, stroke, lw) {\n  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();\n  if (fill) { ctx.fillStyle = fill; ctx.fill(); }\n  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }\n}\nfunction label(ctx, txt, x, y, color) {\n  ctx.font = '600 14px \"IBM Plex Mono\", monospace'; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n  const w = ctx.measureText(txt).width + 10;\n  ctx.fillStyle = cssv('--surface'); ctx.globalAlpha = .85; ctx.fillRect(x - w / 2, y - 10, w, 20); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(txt, x, y);\n}\n\nfunction s1Draw() {\n  if (!s1Fit()) return;\n  const ctx = s1x; ctx.clearRect(0, 0, S1W, S1H);\n  const top = cssv('--solid-top'), left = cssv('--solid-left'), right = cssv('--solid-right'), edge = cssv('--solid-edge'), numc = cssv('--num');\n  if (S1.shape === 'cyl') return s1DrawCyl(ctx, top, left, right, edge, numc);\n  const [A, B, C] = s1Dims(), cs = .866, sn = .5;\n  const s = Math.min(30, S1W * .66 / ((A + B) * cs), (S1H - 60) / ((A + B) * sn + C));\n  const ox = S1W / 2 + (B - A) * cs * s / 2, oy = (S1H - ((A + B) * sn + C) * s) / 2 + C * s + 4;\n  const P = (x, y, z) => [ox + (x - y) * cs * s, oy + (x + y) * sn * s - z * s];\n  const faces = (x, y, z, alpha) => {\n    ctx.globalAlpha = alpha;\n    poly(ctx, [P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], top, edge, .6);\n    poly(ctx, [P(x, y + 1, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], left, edge, .6);\n    poly(ctx, [P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], right, edge, .6);\n    ctx.globalAlpha = 1;\n  };\n  const n = S1.fillN;\n  if (n === null) {                                  // yaxlit jism\n    poly(ctx, [P(0, 0, C), P(A, 0, C), P(A, B, C), P(0, B, C)], top, edge, 1.6);\n    poly(ctx, [P(0, B, 0), P(A, B, 0), P(A, B, C), P(0, B, C)], left, edge, 1.6);\n    poly(ctx, [P(A, 0, 0), P(A, B, 0), P(A, B, C), P(A, 0, C)], right, edge, 1.6);\n  } else {                                           // birlik kublar bilan to'ldirilmoqda\n    ctx.setLineDash([4, 4]); ctx.strokeStyle = edge; ctx.globalAlpha = .45; ctx.lineWidth = 1;\n    const o = [P(0, 0, 0), P(A, 0, 0), P(A, B, 0), P(0, B, 0)], t = [P(0, 0, C), P(A, 0, C), P(A, B, C), P(0, B, C)];\n    ctx.beginPath(); [o, t].forEach(q => { q.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); });\n    for (let i = 0; i \u003c 4; i++) { ctx.moveTo(o[i][0], o[i][1]); ctx.lineTo(t[i][0], t[i][1]); }\n    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;\n    for (let i = 0; i \u003c n; i++) {                    // z -> x -> y tartibida (uzoqdan yaqinga)\n      const z = Math.floor(i / (A * B)), k = i % (A * B), x = Math.floor(k / B), y = k % B;\n      faces(x, y, z, 1);\n    }\n  }\n  // o'lcham yozuvlari\n  const m1 = P(A / 2, B, 0), m2 = P(A, B / 2, 0), m3 = P(0, B, C / 2);\n  label(ctx, S1.shape === 'cube' ? 'a = ' + A + ' sm' : 'a = ' + A + ' sm', m1[0] - 26, m1[1] + 16, numc);\n  if (S1.shape === 'box') {\n    label(ctx, 'b = ' + B + ' sm', m2[0] + 26, m2[1] + 16, numc);\n    label(ctx, 'c = ' + C + ' sm', m3[0] - 34, m3[1], numc);\n  }\n}\nfunction s1DrawCyl(ctx, top, left, right, edge, numc) {\n  const r = S1.r, h = S1.h;\n  const s = Math.min(34, S1W * .6 / (2 * r), (S1H - 50) / (h + .8 * r));\n  const cx = S1W / 2 - 14, rx = r * s, ry = rx * .4;\n  const yb = (S1H + h * s) / 2 - ry + 4;           // pastki ellips markazi\n  const layers = S1.fillN === null ? h : S1.fillN;\n  const gr = ctx.createLinearGradient(cx - rx, 0, cx + rx, 0); gr.addColorStop(0, left); gr.addColorStop(1, right);\n  const ell = (y, f, st, lw) => { ctx.beginPath(); ctx.ellipse(cx, y, rx, ry, 0, 0, Math.PI * 2); if (f) { ctx.fillStyle = f; ctx.fill(); } if (st) { ctx.strokeStyle = st; ctx.lineWidth = lw; ctx.stroke(); } };\n  if (S1.fillN !== null) {                         // kontur\n    ctx.setLineDash([4, 4]); ctx.globalAlpha = .45; ctx.strokeStyle = edge; ctx.lineWidth = 1;\n    ell(yb, null, edge, 1); ell(yb - h * s, null, edge, 1);\n    ctx.beginPath(); ctx.moveTo(cx - rx, yb); ctx.lineTo(cx - rx, yb - h * s); ctx.moveTo(cx + rx, yb); ctx.lineTo(cx + rx, yb - h * s); ctx.stroke();\n    ctx.setLineDash([]); ctx.globalAlpha = 1;\n  }\n  const lw = S1.fillN === null ? 1.6 : .8;\n  for (let j = 0; j \u003c Math.max(1, layers); j++) {\n    if (layers === 0) break;\n    const y1 = yb - j * s, y2 = y1 - s;\n    if (S1.fillN === null && j > 0) continue;\n    const yTop = S1.fillN === null ? yb - h * s : y2;\n    ctx.beginPath(); ctx.moveTo(cx - rx, yTop); ctx.lineTo(cx - rx, y1); ctx.ellipse(cx, y1, rx, ry, 0, Math.PI, 0, true); ctx.lineTo(cx + rx, yTop); ctx.closePath();\n    ctx.fillStyle = gr; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = lw; ctx.stroke();\n    ell(yTop, top, edge, lw);\n  }\n  // r va h\n  ctx.strokeStyle = numc; ctx.lineWidth = 2; const yt = yb - (S1.fillN === null ? h : Math.max(layers, 0)) * s;\n  if (layers > 0 || S1.fillN === null) { ctx.beginPath(); ctx.moveTo(cx, yt); ctx.lineTo(cx + rx, yt); ctx.stroke(); }\n  label(ctx, 'r = ' + r + ' sm', cx + rx / 2, (layers > 0 ? yt : yb) - 14, numc);\n  ctx.beginPath(); ctx.moveTo(cx + rx + 12, yb); ctx.lineTo(cx + rx + 12, yb - h * s); ctx.stroke();\n  label(ctx, 'h = ' + h + ' sm', cx + rx + 12, yb - h * s / 2, numc);\n}\n\n/* ---------- Sliderlar ---------- */\nfunction s1BuildSliders() {\n  const box = $('#s1-sliders'); box.innerHTML = '';\n  S1_KEYS[S1.shape].forEach(k => {\n    const lab = document.createElement('label'), id = 's1-sl-' + k;\n    lab.innerHTML = `\u003cspan>${S1_NAME[k]}\u003c/span>\u003cinput type=\"range\" id=\"${id}\" min=\"${S1_LIM[k][0]}\" max=\"${S1_LIM[k][1]}\" step=\"1\" value=\"${S1[k]}\">\u003cb id=\"${id}-v\">${S1[k]} sm\u003c/b>`;\n    box.appendChild(lab);\n    $('input', lab).oninput = e => {\n      S1[k] = +e.target.value; $('#' + id + '-v').textContent = S1[k] + ' sm';\n      S1.run++; S1.fillN = null; s1Refresh();\n    };\n  });\n  $('#s1-note').textContent = S1.shape === 'cyl'\n    ? 'Silindr yumaloq, shuning uchun uni 1 sm qalinlikdagi doira qatlamlari bilan to\\'ldiramiz. Har bir qatlamning hajmi π·r² ga teng. π ≈ 3,14.'\n    : 'Qirrasi 1 sm bo\\'lgan kubcha — 1 sm³. Jism ichiga nechta kubcha sig\\'sa, hajm shuncha sm³ bo\\'ladi.';\n}\n\n/* ---------- Hisoblash animatsiyasi ---------- */\nfunction s1Lines() {\n  const i = x => `\u003ci>${x}\u003c/i>`, V = s1Volume(), L = [];\n  if (S1.shape === 'cube') {\n    const a = S1.a;\n    L.push(['V = a³', 'formula']);\n    L.push([`V = ${i(a)}³ = ${i(a)} · ${i(a)} · ${i(a)}`, 'sonlarni qo\\'yamiz']);\n    L.push([`V = ${a * a} · ${a}`, 'ko\\'paytiramiz']);\n  } else if (S1.shape === 'box') {\n    const { a, b, c } = S1;\n    L.push(['V = a · b · c', 'formula']);\n    L.push([`V = ${i(a)} · ${i(b)} · ${i(c)}`, 'sonlarni qo\\'yamiz']);\n    L.push([`V = ${a * b} · ${c}`, 'ko\\'paytiramiz']);\n  } else {\n    const { r, h } = S1, base = PI * r * r;\n    L.push(['V = π · r² · h', 'formula']);\n    L.push([`V = 3,14 · ${i(r)}² · ${i(h)}`, 'sonlarni qo\\'yamiz']);\n    L.push([`V = 3,14 · ${r * r} · ${h}`, 'darajaga ko\\'taramiz']);\n    L.push([`V = ${fmt(base)} · ${h}`, 'ko\\'paytiramiz']);\n  }\n  L.push([`V = ${fmt(V)} sm³`, 'javob', true]);\n  return L;\n}\nlet s1CalcRun = 0;\nasync function s1RenderCalc(animated) {\n  const my = ++s1CalcRun, box = $('#s1-calc'); box.innerHTML = '';\n  const rows = s1Lines().map(([t, cap, res]) => {\n    const d = document.createElement('div'); d.className = 'ln' + (res ? ' res' : '');\n    d.innerHTML = `\u003cspan class=\"cap\">${cap}\u003c/span>${t}`; box.appendChild(d); return d;\n  });\n  for (const d of rows) {\n    if (animated) { await wait(750); if (my !== s1CalcRun) return; }\n    d.classList.add('show');\n  }\n  if (!animated) rows.forEach(d => d.classList.add('show'));\n}\nfunction s1UpdateConv() {\n  const V = s1Volume();\n  $('#s1-conv').innerHTML = `\u003cspan class=\"num\">${fmt(V)} sm³\u003c/span> = \u003cspan class=\"num\">${fmt(V)} ml\u003c/span> = \u003cspan class=\"num\">${fmtG(V / 1000)} l\u003c/span> = \u003cspan class=\"num\">${fmtG(V / 1e6)} m³\u003c/span>`;\n}\nfunction s1UpdateCounter() {\n  const N = s1Total(), n = S1.fillN === null ? N : S1.fillN, V = s1Volume();\n  if (S1.shape === 'cyl') {\n    $('#s1-capt').textContent = 'Doira qatlamlari (har biri 1 sm qalin)';\n    $('#s1-cnt').textContent = n; $('#s1-cnt2').textContent = `/ ${N} qatlam · ${fmt(PI * S1.r * S1.r)} sm³ × ${N}`;\n  } else {\n    $('#s1-capt').textContent = 'Birlik kubchalar (har biri 1 sm³)';\n    $('#s1-cnt').textContent = n; $('#s1-cnt2').textContent = `/ ${N} ta = ${N} sm³`;\n  }\n}\nfunction s1Refresh() { s1Draw(); s1UpdateCounter(); s1UpdateConv(); s1RenderCalc(false); }\n\n/* ---------- Birlik kublar bilan to'ldirish animatsiyasi ---------- */\nasync function s1Fill() {\n  const my = ++S1.run, N = s1Total();\n  S1.fillN = 0; s1Draw(); s1UpdateCounter();\n  await tween(clamp(N * 28, 1600, 5000), t => {\n    if (my !== S1.run) return;\n    S1.fillN = Math.floor(t * N); s1Draw(); s1UpdateCounter();\n  }, t => t);\n  if (my !== S1.run) return;\n  S1.fillN = N; s1Draw(); s1UpdateCounter();\n}\n$('#s1-fill').onclick = s1Fill;\n$('#s1-calcbtn').onclick = () => s1RenderCalc(true);\n$('#s1-reset').onclick = () => {\n  S1.run++; Object.assign(S1, S1_DEF, { fillN: null });\n  setSeg($('#s1-shape'), $('#s1-shape [data-shape=\"cube\"]'));\n  s1BuildSliders(); s1Refresh();\n};\nseg($('#s1-shape'), b => { S1.run++; S1.shape = b.dataset.shape; S1.fillN = null; s1BuildSliders(); s1Refresh(); });\nresizeHooks.push(() => { if ($('#p1').classList.contains('on')) s1Draw(); });\nonTheme(() => s1Draw());\n\n/* ---------- Birliklar o'zgartirgich ---------- */\nconst UNIT_F = { cm3: 1, ml: 1, dm3: 1000, l: 1000, m3: 1e6 };\nconst UNIT_N = { cm3: 'sm³', ml: 'ml', dm3: 'dm³', l: 'l', m3: 'm³' };\nfunction ucUpdate() {\n  const v = parseNum($('#uc-val').value), u = $('#uc-unit').value, out = $('#uc-out');\n  if (!isFinite(v)) { out.textContent = 'Son kiriting.'; return; }\n  const base = v * UNIT_F[u];\n  out.inne
