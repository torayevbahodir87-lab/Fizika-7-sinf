g? Ko'zingni shkalaga to'g'ri tekislikda tut. O'lchashni bir necha marta takrorla, natijalarni jadvalga yoz va grafik chiz.\",\n life:\"Do'konda meva tarozida tortiladi, hamshira esa tana haroratini termometr bilan o'lchaydi. Ikkalasi ham asbobni to'g'ri o'qishga bog'liq.\",\n simTitle:\"Virtual asboblar\",\n rem:[\"Avval bo'linma qiymatini aniqla.\",\"Ko'zing shkala bilan bir tekislikda bo'lsin.\",\"Bir necha marta o'lchab, natijalarni jadvalga yoz.\"]},\n{cl:'#9A6700',cd:'#F2B84B',tab:'Tajriba',title:\"Tajriba o'tkazish va natijalarni tahlil qilish\",sub:\"Xavfsizlik qoidalari; natijalarni taqqoslash; ilmiy xulosa\",\n explain:\"Tajriba o'tkazishda birinchi navbatda xavfsizlik qoidalariga amal qilinadi. Keyin reja bo'yicha ishlab, natijalar jadvalga yoziladi. Turli sharoitdagi natijalar taqqoslanadi. Ilmiy xulosada nima qilingani, qanday natija olingani va bundan nima kelib chiqishi yoziladi.\",\n life:\"Oshxonada qaynoq suv quyayotganda qo'lingni kuydirmaslik uchun ehtiyot bo'lasan. Tajribada ham xuddi shunday: avval xavfsizlik, keyin natija.\",\n simTitle:\"Xavfsizlik va virtual tajriba\",\n rem:[\"Tajribadan oldin xavfsizlik qoidalarini bil.\",\"Natijalarni jadval va grafikda taqqosla.\",\"Ilmiy xulosa: nima qildim, nima chiqdi, bundan nima kelib chiqadi.\"]}\n];\n\n/* ---------- sahifani qurish ---------- */\nconst tabs=$('#tabs'),main=$('#main');\n$('#progBar').innerHTML='\u003ci>\u003c/i>'.repeat(7);\nLESSONS.forEach((L,k)=>{const i=k+1;\n  main.insertAdjacentHTML('beforeend',`\u003csection class=\"lesson\" id=\"L${i}\" style=\"--cl:${L.cl};--cd:${L.cd}\" hidden>\n   \u003cdiv class=\"lhead\">\u003cspan class=\"num\">${i}\u003c/span>\u003cdiv>\u003ch2>${L.title}\u003c/h2>\u003cp class=\"sub\">${L.sub}\u003c/p>\u003c/div>\u003c/div>\n   \u003carticle class=\"card\">\u003ch3>Tushuntirish\u003c/h3>\u003cp>${L.explain}\u003c/p>\u003c/article>\n   \u003carticle class=\"card life\">\u003ch3>Hayotiy misol\u003c/h3>\u003cp>${L.life}\u003c/p>\u003c/article>\n   \u003carticle class=\"card\">\u003ch3>Simulyatsiya: ${L.simTitle}\u003c/h3>\u003cdiv id=\"sim${i}\">\u003c/div>\u003c/article>\n   \u003carticle class=\"card\">\u003ch3>Nazorat savollari\u003c/h3>\u003cdiv id=\"quiz${i}\">\u003c/div>\u003c/article>\n   \u003caside class=\"remember\">\u003ch3>Eslab qol\u003c/h3>\u003cul>${L.rem.map(x=>`\u003cli>${x}\u003c/li>`).join('')}\u003c/ul>\u003c/aside>\n   \u003cdiv class=\"pager\">${i>1?`\u003cbutton class=\"btn ghost\" data-go=\"${i-1}\">Oldingi band\u003c/button>`:'\u003cspan>\u003c/span>'}\u003cbutton class=\"btn alt\" data-go=\"${i+1}\">${i\u003c7?'Keyingi band':'Umumiy testga o\\'tish'}\u003c/button>\u003c/div>\n  \u003c/section>`);\n  tabs.insertAdjacentHTML('beforeend',`\u003cbutton class=\"tab\" style=\"--cl:${L.cl};--cd:${L.cd}\" data-i=\"${i}\">\u003cspan class=\"tn\">${i}\u003c/span>${L.tab}\u003c/button>`)});\nmain.insertAdjacentHTML('beforeend',`\u003csection class=\"lesson\" id=\"L8\" style=\"--cl:#14213D;--cd:#FFC93C\" hidden>\n  \u003cdiv class=\"lhead\">\u003cspan class=\"num\">★\u003c/span>\u003cdiv>\u003ch2>Umumiy test\u003c/h2>\u003cp class=\"sub\">10 ta savol. Hammasiga javob bergach, natijani ko'r.\u003c/p>\u003c/div>\u003c/div>\n  \u003carticle class=\"card\">\u003cdiv id=\"testMount\">\u003c/div>\u003c/article>\n  \u003cdiv class=\"pager\">\u003cbutton class=\"btn ghost\" data-go=\"7\">Oldingi band\u003c/button>\u003cspan>\u003c/span>\u003c/div>\u003c/section>`);\ntabs.insertAdjacentHTML('beforeend',`\u003cbutton class=\"tab\" style=\"--cl:#14213D;--cd:#FFC93C\" data-i=\"8\">\u003cspan class=\"tn\">★\u003c/span>Test\u003c/button>`);\n\nfunction go(i,noScroll){pausers.forEach(f=>f());$$('.lesson').forEach(s=>s.hidden=s.id!=='L'+i);\n  $$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.i==i?'true':'false'));\n  const t=$(`.tab[data-i=\"${i}\"]`);if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest',inline:'center'});\n  if(!noScroll){const s=$('#L'+i);if(s)s.scrollIntoView({block:'start'})}}\ntabs.onclick=e=>{const b=e.target.closest('.tab');if(b)go(+b.dataset.i)};\nmain.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});\n\n/* =====================================================\n   1. KUZATISH\n   ===================================================== */\nfunction initS1(){\n  const R=$('#sim1');\n  R.innerHTML=`\n  \u003cdiv class=\"stage\">\u003csvg viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"Chapda tebranayotgan mayatnik, o'ngda stakandagi erayotgan muz\">\n    \u003cline x1=\"60\" y1=\"24\" x2=\"240\" y2=\"24\" stroke=\"var(--edge)\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n    \u003cline id=\"o-rod\" x1=\"150\" y1=\"24\" x2=\"150\" y2=\"194\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n    \u003ccircle id=\"o-bob\" cx=\"150\" cy=\"194\" r=\"18\" style=\"fill:var(--c);stroke:var(--edge)\" stroke-width=\"3\"/>\n    \u003ccircle cx=\"150\" cy=\"24\" r=\"5\" style=\"fill:var(--edge)\"/>\n    \u003crect id=\"o-water\" x=\"402\" y=\"190\" width=\"136\" height=\"80\" fill=\"#7CC6FE\" opacity=\".75\"/>\n    \u003crect id=\"o-ice\" x=\"438\" y=\"184\" width=\"64\" height=\"64\" rx=\"8\" fill=\"#E4F8FF\" stroke=\"#4FA3D9\" stroke-width=\"3\" opacity=\".92\"/>\n    \u003cpath d=\"M400 130 L406 270 Q407 274 412 274 L528 274 Q533 274 534 270 L540 130\" fill=\"none\" style=\"stroke:var(--edge)\" stroke-width=\"4\" stroke-linejoin=\"round\"/>\n    \u003ctext x=\"150\" y=\"292\" text-anchor=\"middle\" class=\"svgt\">Mayatnik\u003c/text>\n    \u003ctext x=\"470\" y=\"294\" text-anchor=\"middle\" class=\"svgt\">Stakandagi muz\u003c/text>\n  \u003c/svg>\u003c/div>\n  \u003cp>Muz erishi vaqti: \u003cspan class=\"read\" id=\"o-ti\">0.0\u003c/span> daqiqa \u003cspan class=\"sub\">(tezlashtirilgan)\u003c/span>\u003c/p>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"o-go\">▶ Boshlash\u003c/button>\u003cbutton class=\"btn\" id=\"o-pause\">⏸ To'xtatish\u003c/button>\u003cbutton class=\"btn ghost\" id=\"o-reset\">↺ Qayta boshlash\u003c/button>\u003c/div>\n  \u003cp class=\"lbl\">Qanday kuzatamiz? Birini bos:\u003c/p>\n  \u003cdiv class=\"btns\" id=\"o-senses\">\n    \u003cbutton class=\"chip\" data-s=\"eye\">👁 Ko'rish\u003c/button>\u003cbutton class=\"chip\" data-s=\"ear\" aria-pressed=\"false\">👂 Eshitish\u003c/button>\n    \u003cbutton class=\"chip\" data-s=\"touch\">✋ Teginish\u003c/button>\u003cbutton class=\"chip\" data-s=\"lens\" aria-pressed=\"false\">🔍 Lupa\u003c/button>\u003cbutton class=\"chip\" data-s=\"therm\">🌡 Termometr\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"say\" id=\"o-say\" aria-live=\"polite\">Sezgi yoki asbobni tanla va nimani bilib olishingni o'qi.\u003c/div>\n  \u003cdiv class=\"stage\" id=\"o-lens\" hidden>\u003csvg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Lupa ostida muz\">\n    \u003crect x=\"70\" y=\"15\" width=\"260\" height=\"160\" rx=\"18\" fill=\"#E4F8FF\" stroke=\"#4FA3D9\" stroke-width=\"4\"/>\n    \u003ccircle cx=\"120\" cy=\"60\" r=\"7\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\u003ccircle cx=\"210\" cy=\"110\" r=\"10\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\n    \u003ccircle cx=\"270\" cy=\"55\" r=\"5\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\u003ccircle cx=\"160\" cy=\"140\" r=\"6\" fill=\"#fff\" stroke=\"#8CC9EA\" stroke-width=\"2\"/>\n    \u003cpath d=\"M90 40 L150 90 L140 150 M150 90 L250 70 L300 120\" fill=\"none\" stroke=\"#8CC9EA\" stroke-width=\"2.5\"/>\n    \u003ctext x=\"200\" y=\"186\" text-anchor=\"middle\" class=\"svgt\" style=\"font-size:12px\">Lupa ostida: havo pufakchalari va mayda yoriqlar\u003c/text>\u003c/svg>\u003c/div>\n  \u003ch4>Mening kuzatuv jadvalim\u003c/h4>\n  \u003cdiv class=\"row\">\u003cselect id=\"o-sel\" aria-label=\"Sezgi yoki asbob\">\u003coption>Ko'z bilan\u003c/option>\u003coption>Quloq bilan\u003c/option>\u003coption>Teginish bilan\u003c/option>\u003coption>Lupa bilan\u003c/option>\u003coption>Termometr bilan\u003c/option>\u003c/select>\n  \u003cinput type=\"text\" id=\"o-txt\" placeholder=\"Masalan: muz yarmiga kichraydi\" aria-label=\"Kuzatuv\">\u003cbutton class=\"btn alt\" id=\"o-add\">Yozib qo'yish\u003c/button>\u003c/div>\n  \u003cp class=\"msg\" id=\"o-msg\" hidden>\u003c/p>\n  \u003cdiv class=\"scroll\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Vaqt (daq)\u003c/th>\u003cth>Sezgi / asbob\u003c/th>\u003cth>Kuzatuv\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"o-rows\">\u003ctr>\u003ctd colspan=\"4\">Hali yozuv yo'q. Sahnani ishga tushirib, kuzatganingni yoz.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>`;\n  const rod=$('#o-rod',R),bob=$('#o-bob',R),ice=$('#o-ice',R),water=$('#o-water',R),tiEl=$('#o-ti',R);\n  let t=0,ti=0,sound=false,actx=null,prev=1,lens=false;\n  function tick(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.06)}catch(e){}}\n  function draw(snd){\n    const th=25*Math.PI/180*Math.cos(Math.PI*t),x=150+170*Math.sin(th),y=24+170*Math.cos(th);\n    rod.setAttribute('x2',x);rod.setAttribute('y2',y);bob.setAttribute('cx',x);bob.setAttribute('cy',y);\n    const s=th>=0?1:-1;if(snd&&sound&&s!==prev)tick();prev=s;\n    const f=Math.min(1,ti/10),sz=64*Math.cbrt(1-f),wt=190-10*f;\n    water.setAttribute('y',wt);water.setAttribute('height',270-wt);\n    ice.setAttribute('x',470-sz/2);ice.setAttribute('y',wt-.1*sz);ice.setAttribute('width',sz);ice.setAttribute('height',sz);\n    tiEl.textContent=ti.toFixed(1)}\n  const lp=loop(dt=>{t+=dt;if(ti\u003c10)ti=Math.min(10,ti+dt*.25);draw(true)});pausers.push(lp.stop);\n  draw(false);\n  $('#o-go',R).onclick=()=>lp.start();\n  $('#o-pause',R).onclick=()=>lp.stop();\n  $('#o-reset',R).onclick=()=>{lp.stop();t=0;ti=0;draw(false)};\n  const say=$('#o-say',R);\n  $('#o-senses',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const s=b.dataset.s;\n    if(s==='eye')say.textContent=\"Ko'zing rang, shakl, o'lcham va harakatni ko'radi: mayatnik chapga-o'ngga tebranadi, muz kichrayadi, stakanda suv ko'payadi. Lekin ko'z juda mayda narsalarni ko'rmaydi.\";\n    if(s==='ear'){sound=!sound;b.setAttribute('aria-pressed',sound);if(sound)tick();say.textContent=sound?\"Ovoz yoqildi: mayatnik eng past nuqtadan o'tganda «tik» eshitiladi. Quloq tebranish ritmini sezishga yordam beradi. Sahnani ishga tushir!\":\"Ovoz o'chirildi.\"}\n    if(s==='touch')say.textContent=\"Barmoq bilan muz sovuq va silliq tuyuladi. Lekin «sovuq» — taxminiy his, uni songa aylantirib bo'lmaydi. Aniq harorat uchun termometr kerak. Haqiqiy tajribada issiq yoki o'tkir jismlarni ushlab ko'rma!\";\n    if(s==='lens'){lens=!lens;b.setAttribute('aria-pressed',lens);$('#o-lens',R).hidden=!lens;say.textContent=lens?\"Lupa kichik narsalarni kattalashtiradi. Endi muzdagi havo pufakchalari va mayda yoriqlar ko'rinadi. Ko'z bilan ularni yaxshi ko'rmasdik.\":\"Lupa olib qo'yildi.\"}\n    if(s==='therm')say.textContent=ti\u003c10?\"Termometr aniq son beradi: stakandagi muz va suv aralashmasi taxminan 0 °C.\":\"Muz to'liq erib bo'ldi. Termometr suv 0 °C dan yuqoriga isiy boshlaganini ko'rsatadi.\"};\n  const obs=[];\n  function render(){const tb=$('#o-rows',R);if(!obs.length){tb.innerHTML='\u003ctr>\u003ctd colspan=\"4\">Hali yozuv yo\\'q. Sahnani ishga tushirib, kuzatganingni yoz.\u003c/td>\u003c/tr>';return}\n    tb.innerHTML=obs.map((o,i)=>`\u003ctr>\u003ctd>${o.t}\u003c/td>\u003ctd>${esc(o.s)}\u003c/td>\u003ctd>${esc(o.v)}\u003c/td>\u003ctd>\u003cbutton class=\"chip\" data-d=\"${i}\" aria-label=\"O'chirish\">✕\u003c/button>\u003c/td>\u003c/tr>`).join('')}\n  $('#o-add',R).onclick=()=>{const inp=$('#o-txt',R),m=$('#o-msg',R),v=inp.value.trim();\n    if(v.length\u003c6){m.hidden=false;m.className='msg bad';m.textContent=\"Kuzatuvni aniqroq yoz: nima o'zgardi? Masalan: «Muz kichrayib, atrofida suv paydo bo'ldi».\";return}\n    const sel=$('#o-sel',R);obs.push({t:ti.toFixed(1),s:sel.options[sel.selectedIndex].text,v});inp.value='';\n    m.hidden=false;m.className='msg good';m.textContent=\"Yaxshi! Kuzatuvni vaqti bilan yozding.\";render()};\n  $('#o-rows',R).onclick=e=>{const b=e.target.closest('[data-d]');if(b){obs.splice(+b.dataset.d,1);render()}};\n}\n\n/* =====================================================\n   2. MULOQOT\n   ===================================================== */\nfunction initS2(){\n  const R=$('#sim2'),MIN=[0,1,2,3,4,5],TMP=[20,32,44,55,65,74];\n  R.innerHTML=`\n  \u003cp>Choynakdagi suv isitildi. Har daqiqada harorat o'lchandi. Bir xil ma'lumotni to'rt xil ko'rinishda ko'r:\u003c/p>\n  \u003cdiv class=\"btns\" id=\"v-btns\">\u003cbutton class=\"chip on\" data-v=\"jadval\">Jadval\u003c/button>\u003cbutton class=\"chip\" data-v=\"grafik\">Grafik\u003c/button>\u003cbutton class=\"chip\" data-v=\"gist\">Gistogramma\u003c/button>\u003cbutton class=\"chip\" data-v=\"rasm\">Rasm\u003c/button>\u003c/div>\n  \u003cdiv class=\"stage\" style=\"padding:10px\" id=\"v-view\">\u003c/div>\n  \u003cp class=\"say\" id=\"v-info\">\u003c/p>\n  \u003ch4>Vaziyatni yech: qaysi ko'rinish mos?\u003c/h4>\n  \u003cp id=\"v-sc\" class=\"lbl\">\u003c/p>\u003cdiv class=\"btns\" id=\"v-ans\">\u003cbutton class=\"chip\" data-a=\"jadval\">Jadval\u003c/button>\u003cbutton class=\"chip\" data-a=\"grafik\">Grafik\u003c/button>\u003cbutton class=\"chip\" data-a=\"gist\">Gistogramma\u003c/button>\u003cbutton class=\"chip\" data-a=\"rasm\">Rasm\u003c/button>\u003c/div>\n  \u003cp class=\"msg\" id=\"v-fb\" hidden>\u003c/p>\u003cbutton class=\"btn ghost\" id=\"v-next\">Keyingi vaziyat\u003c/button>\n  \u003ch4>Ma'lumotni so'z bilan tushuntir\u003c/h4>\n  \u003cdiv class=\"row\">\u003clabel>Boshlanish: \u003cselect id=\"s-a\">\u003c/select>\u003c/label>\u003clabel>Tugash: \u003cselect id=\"s-b\">\u003c/select>\u003c/label>\u003c/div>\n  \u003cdiv class=\"say\" id=\"s-out\" aria-live=\"polite\">\u003c/div>`;\n  const INFO={jadval:\"Jadval aniq sonlarni beradi, lekin o'zgarishni sezish uchun sonlarni o'qib chiqish kerak.\",grafik:\"Grafik o'zgarish yo'nalishini ko'rsatadi: chiziq yuqoriga ko'tarilsa, harorat oshmoqda.\",gist:\"Gistogramma ustunlar balandligini solishtirishga qulay: eng baland ustun — eng issiq payt.\",rasm:\"Rasm (termometrlar) tez tasavvur beradi: simob qancha baland bo'lsa, suv shuncha issiq.\"};\n  function view(v){$$('#v-btns .chip',R).forEach(c=>c.classList.toggle('on',c.dataset.v===v));let s='';\n    if(v==='jadval')s=`\u003cdiv class=\"scroll\">\u003ctable class=\"dt\">\u003ctr>\u003cth>Vaqt (daq)\u003c/th>${MIN.map(m=>`\u003ctd>${m}\u003c/td>`).join('')}\u003c/tr>\u003ctr>\u003cth>Harorat (°C)\u003c/th>${TMP.map(x=>`\u003ctd>${x}\u003c/td>`).join('')}\u003c/tr>\u003c/table>\u003c/div>`;\n    if(v==='grafik')s=lineChart({series:[{pts:MIN.map((m,i)=>[m,TMP[i]]),color:'var(--c)'}],xmax:5,ymax:80,ystep:20,xl:'Vaqt (daq)',yl:'Harorat (°C)',labels:true});\n    if(v==='gist'){const W=360,H=250,ml=48,mt=18,pw=296,ph=186;const Y=x=>mt+ph*(1-x/80);\n      s=`\u003csvg viewBox=\"0 0 ${W} ${H}\" class=\"chart\" role=\"img\" aria-label=\"Gistogramma\">`;\n      for(let x=0;x\u003c=80;x+=20)s+=`\u003cline x1=\"${ml}\" x2=\"${W-16}\" y1=\"${Y(x)}\" y2=\"${Y(x)}\" class=\"gl\"/>\u003ctext x=\"${ml-6}\" y=\"${Y(x)+4}\" text-anchor=\"end\" class=\"ct\">${x}\u003c/text>`;\n      TMP.forEach((x,i)=>{const bx=ml+pw*(i+.5)/6-20;s+=`\u003crect x=\"${bx}\" y=\"${Y(x)}\" width=\"40\" height=\"${mt+ph-Y(x)}\" style=\"fill:var(--c);stroke:var(--edge)\" stroke-width=\"2\"/>\u003ctext x=\"${bx+20}\" y=\"${Y(x)-5}\" text-anchor=\"middle\" class=\"ct b\">${x}\u003c/text>\u003ctext x=\"${bx+20}\" y=\"${mt+ph+16}\" text-anchor=\"middle\" class=\"ct\">${MIN[i]}\u003c/text>`});\n      s+=`\u003cline x1=\"${ml}\" x2=\"${ml}\" y1=\"${mt}\" y2=\"${mt+ph}\" class=\"ax\"/>\u003cline x1=\"${ml}\" x2=\"${W-16}\" y1=\"${mt+ph}\" y2=\"${mt+ph}\" class=\"ax\"/>\u003ctext x=\"${ml+pw/2}\" y=\"${H-6}\" text-anchor=\"middle\" class=\"ct b\">Vaqt (daq)\u003c/text>\u003ctext transform=\"translate(12 ${mt+ph/2}) rotate(-90)\" text-anchor=\"middle\" class=\"ct b\">Harorat (°C)\u003c/text>\u003c/svg>`}\n    if(v==='rasm'){s=`\u003csvg viewBox=\"0 0 360 230\" class=\"chart\" role=\"img\" aria-label=\"Termometrlar rasmi\">`;\n      TMP.forEach((x,i)=>{const cx=30+i*60,top=20,bh=140,fh=bh*x/80;\n        s+=`\u003crect x=\"${cx-9}\" y=\"${top}\" width=\"18\" height=\"${bh}\" rx=\"9\" style=\"fill:var(--card);stroke:var(--edge)\" stroke-width=\"2.5\"/>\u003crect x=\"${cx-5}\" y=\"${top+bh-fh}\" width=\"10\" height=\"${fh}\" fill=\"#FF6B4A\"/>\u003ccircle cx=\"${cx}\" cy=\"${top+bh+10}\" r=\"13\" fill=\"#FF6B4A\" style=\"stroke:var(--edge)\" stroke-width=\"2.5\"/>\u003ctext x=\"${cx}\" y=\"${top+bh+40}\" text-anchor=\"middle\" class=\"ct b\">${x}°\u003c/text>\u003ctext x=\"${cx}\" y=\"${top+bh+56}\" text-anchor=\"middle\" class=\"ct\">${MIN[i]} daq\u003c/text>`});\n      s+='\u003c/svg>'}\n    $('#v-view',R).innerHTML=s;$('#v-info',R).textContent=INFO[v]}\n  $('#v-btns',R).onclick=e=>{const b=e.target.closest('.chip');if(b)view(b.dataset.v)};view('jadval');\n  const SC=[[\"3-daqiqadagi aniq haroratni bilmoqchisan. Qaysi ko'rinish qulay?\",'jadval',\"Jadval aniq sonlarni beradi.\"],\n   [\"Harorat vaqt o'tishi bilan qanday o'zgarayotganini ko'rmoqchisan.\",'grafik',\"Grafik chizig'i o'zgarish yo'nalishini ko'rsatadi.\"],\n   [\"Turli daqiqalardagi haroratlarni tez solishtirmoqchisan.\",'gist',\"Ustun balandliklarini yonma-yon solishtirish oson.\"],\n   [\"Hodisani kichkina ukangga tushuntirmoqchisan.\",'rasm',\"Rasm eng oddiy va ko'rgazmali.\"]];\n  let sc=0;const fb=$('#v-fb',R);\n  function showSc(){$('#v-sc',R).textContent=SC[sc][0];fb.hidden=true}\n  showSc();\n  $('#v-ans',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const ok=b.dataset.a===SC[sc][1];view(SC[sc][1]);\n    fb.hidden=false;fb.className='msg '+(ok?'good':'bad');fb.textContent=(ok?\"✔ To'g'ri! \":\"✘ Yana o'yla. Eng mosi ko'rsatildi. \")+SC[sc][2]};\n  $('#v-next',R).onclick=()=>{sc=(sc+1)%SC.length;showSc()};\n  const A=$('#s-a',R),B=$('#s-b',R);A.innerHTML=MIN.map(m=>`\u003coption value=\"${m}\">${m}-daqiqa\u003c/option>`).join('');B.innerHTML=A.innerHTML;A.value=1;B.value=5;\n  function sent(){const a=+A.value,b=+B.value,o=$('#s-out',R);\n    if(a>=b){o.textContent=\"Boshlanish daqiqasi tugash daqiqasidan kichik bo'lsin.\";return}\n    const d=TMP[b]-TMP[a];\n    o.innerHTML=`\u003cb>Yozma (hisobot):\u003c/b> Suv harorati ${a}-daqiqada ${TMP[a]} °C edi, ${b}-daqiqada esa ${TMP[b]} °C ga yetdi. Demak, ${b-a} daqiqada harorat ${d} °C ga oshdi.\u003cbr>\u003cbr>\u003cb>Og'zaki (grafikka ishora qilib):\u003c/b> «Do'stlar, grafikka qarang. Suv ${a}-daqiqada ${TMP[a]} gradus edi. Chiziq yuqoriga ko'tarilib, ${b}-daqiqada ${TMP[b]} gradusga yetdi. Demak, suv isidi.»`}\n  A.onchange=B.onchange=sent;sent();\n}\n\n/* =====================================================\n   3. XULOSA\n   ===================================================== */\nfunction initS3(){\n  const R=$('#sim3');\n  const OBJ={\n   taxta:{name:\"Yog'och taxta\",ico:\"🪵\",kind:'float',r:18,obs:\"Taxta suv yuzasida suzdi.\",st:[\n    [\"Bu taxta suvda suzadi.\",1,\"Bu kuzatuvdan to'g'ridan-to'g'ri kelib chiqadi.\"],\n    [\"Taxta suzdi, demak u shu hajmdagi suvdan yengil bo'lishi mumkin.\",1,\"Bu kuzatuvga mos, ehtiyotkor taxmin.\"],\n    [\"Barcha jismlar suvda suzadi.\",0,\"Bitta kuzatuvdan hamma jismlar haqida xulosa chiqarib bo'lmaydi. Tosh cho'kadi-ku!\"],\n    [\"Taxta quruq bo'lgani uchun suzdi.\",0,\"Quruqlik haqida hech narsa kuzatilmadi. Bu sabab uydirma.\"]]},\n   tosh:{name:\"Tosh\",ico:\"🪨\",kind:'sink',r:22,a:300,obs:\"Tosh suvda cho'kdi.\",st:[\n    [\"Bu tosh suvda cho'kadi.\",1,\"Bu kuzatuvning o'zi.\"],\n    [\"Tosh cho'kdi, demak u shu hajmdagi suvdan og'irroq bo'lishi mumkin.\",1,\"Kuzatuvga mos, ehtiyotkor taxmin.\"],\n    [\"Barcha toshlar cho'kadi.\",0,\"Bitta toshga qarab hamma toshlar haqida gapirish shoshma-shosharlik.\"],\n    [\"Suv hamma narsani cho'ktiradi.\",0,\"Taxta suzgani kabi boshqa jismlar suzishi mumkin. Bu xulosa asossiz.\"]]},\n   mix:{name:\"Temir mix\",ico:\"📌\",kind:'sink',r:8,a:240,obs:\"Kichkina temir mix suvda cho'kdi.\",st:[\n    [\"Temir mix suvda cho'kdi.\",1,\"Bu kuzatuvning o'zi.\"],\n    [\"Mix kichkina bo'lsa ham cho'kdi, demak kichikligi suzish uchun yetarli emas.\",1,\"Kuzatuvdan mantiqan kelib chiqadi.\"],\n    [\"Kichik jismlar doim suzadi.\",0,\"Mix kichkina, lekin cho'kdi. Xulosa kuzatuvga zid.\"],\n    [\"Mix uchi o'tkir bo'lgani uchun cho'kdi.\",0,\"O'tkirlik haqida tajriba qilinmadi. Sabab tekshirilmagan.\"]]},\n   olma:{name:\"Olma\",ico:\"🍎\",kind:'float',r:26,obs:\"Olma suvda suzdi, yarmidan ko'pi suv ostida qoldi.\",st:[\n    [\"Olma suvda suzadi.\",1,\"Bu kuzatuvning o'zi.\"],\n    [\"Olma suvdan biroz yengil bo'lishi mumkin.\",1,\"Suzgani uchun bu mantiqli taxmin.\"],\n    [\"Barcha mevalar suzadi.\",0,\"Faqat olmani sinadik. Boshqa mevalar haqida gapirib bo'lmaydi.\"],\n    [\"Olma qizil bo'lgani uchun suzdi.\",0,\"Rang haqida hech narsa kuzatilmadi.\"]]}};\n  R.innerHTML=`\n  \u003cp>Jismni tanla va suvga tashla. Nima bo'lganini kuzat, keyin gaplar mantiqli yoki mantiqsizligini ayt.\u003c/p>\n  \u003cdiv class=\"btns\" id=\"f-obj\">${Object.keys(OBJ).map((k,i)=>`\u003cbutton class=\"chip${i?'':' on'}\" data-k=\"${k}\">${OBJ[k].ico} ${OBJ[k].name}\u003c/button>`).join('')}\u003c/div>\n  \u003cdiv class=\"stage\">\u003ccanvas id=\"f-cv\" aria-label=\"Stakan suv va tashlanayotgan jism\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"f-go\">▶ Boshlash\u003c/button>\u003cbutton class=\"btn\" id=\"f-pause\">⏸ To'xtatish\u003c/button>\u003cbutton class=\"btn ghost\" id=\"f-reset\">↺ Qayta boshlash\u003c/button>\u003c/div>\n  \u003cdiv id=\"f-st\">\u003cp class=\"msg\">Avval jismni suvga tashla, natijani kuzat.\u003c/p>\u003c/div>\n  \u003cp class=\"say\">\u003cb>Bilib qo'y:\u003c/b> bir hodisadan bir nechta to'g'ri xulosa chiqishi mumkin. Masalan, toshning cho'kishidan «tosh og'ir» va «tosh suvdan zichroq» deyish mumkin. Qaysi biri to'g'riligini yangi tajriba hal qiladi.\u003c/p>`;\n  const cv=$('#f-cv',R),ctx=canvasSetup(cv,720,340);\n  const SURF=160,FLOOR=326,X0=250,X1=470;\n  let key='taxta',st,rip=[];\n  function reset(){st={y:34,vy:0,ent:false,rest:0,fin:false};rip=[];$('#f-st',R).innerHTML='\u003cp class=\"msg\">Avval jismni suvga tashla, natijani kuzat.\u003c/p>';draw()}\n  function drawObj(o,x,y){const c=ctx;c.lineWidth=3;c.strokeStyle='#3A2A1A';\n    if(key==='taxta'){c.fillStyle='#C68B4E';c.fillRect(x-32,y-18,64,36);c.strokeRect(x-32,y-18,64,36);c.beginPath();c.moveTo(x-26,y-6);c.lineTo(x+26,y-6);c.moveTo(x-26,y+6);c.lineTo(x+26,y+6);c.lineWidth=1.5;c.stroke()}\n    if(key==='tosh'){c.fillStyle='#8A8F98';c.beginPath();[[-26,8],[-14,-20],[8,-22],[28,-4],[20,20],[-12,22]].forEach((p,i)=>i?c.lineTo(x+p[0],y+p[1]):c.moveTo(x+p[0],y+p[1]));c.closePath();c.fill();c.stroke()}\n    if(key==='mix'){c.fillStyle='#6B7280';c.fillRect(x-32,y-4,64,8);c.strokeRect(x-32,y-4,64,8);c.beginPath();c.arc(x-34,y,9,0,7);c.fill();c.stroke()}\n    if(key==='olma'){c.fillStyle='#E63946';c.beginPath();c.arc(x,y,26,0,7);c.fill();c.stroke();c.fillStyle='#2A9D5C';c.beginPath();c.ellipse(x+8,y-30,10,5,-.6,0,7);c.fill();c.beginPath();c.moveTo(x,y-26);c.lineTo(x+2,y-34);c.stroke()}}\n  function draw(){const c=ctx,ink=cssv('--ink'),edge=cssv('--edge'),o=OBJ[key];c.clearRect(0,0,720,340);\n    drawObj(o,360,st.y);\n    c.fillStyle='rgba(70,160,240,.45)';c.fillRect(X0+2,SURF,X1-X0-4,FLOOR+14-SURF);\n    c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=2;c.beginPath();c.moveTo(X0+2,SURF);c.lineTo(X1-2,SURF);c.stroke();\n    rip.forEach(r=>{c.strokeStyle=`rgba(255,255,255,${Math.max(0,r.a)})`;c.lineWidth=2;c.beginPath();c.ellipse(360,SURF,r.r,r.r*.25,0,0,7);c.stroke()});\n    c.strokeStyle=edge;c.lineWidth=5;c.lineJoin='round';c.beginPath();c.moveTo(X0,100);c.lineTo(X0,FLOOR+14);c.lineTo(X1,FLOOR+14);c.lineTo(X1,100);c.stroke();\n    c.fillStyle=ink;c.font=\"700 15px Nunito,sans-serif\";c.textAlign='center';c.fillText('Suv',360+80,FLOOR+8);c.textAlign='left'}\n  function step(dt){const o=OBJ[key];rip.forEach(r=>{r.r+=70*dt;r.a-=dt*1.1});rip=rip.filter(r=>r.a>0);\n    if(!st.ent){st.vy+=700*dt;st.y+=st.vy*dt;if(st.y+o.r>=SURF){st.ent=true;rip.push({r:6,a:1});rip.push({r:0,a:.7});st.vy*=.55}}\n    else if(o.kind==='float'){const eq=SURF-o.r*.25;st.vy+=(-80*(st.y-eq)-3.2*st.vy)*dt;st.y+=st.vy*dt;\n      if(Math.abs(st.vy)\u003c4&&Math.abs(st.y-eq)\u003c1)st.rest+=dt;else st.rest=0;if(st.rest>.7)st.fin=true}\n    else{st.vy+=(o.a-4.5*st.vy)*dt;st.y+=st.vy*dt;if(st.y+o.r>=FLOOR){st.y=FLOOR-o.r;st.vy=0;st.fin=true}}}\n  const lp=loop(dt=>{step(dt);draw();if(st.fin){lp.stop();onFin()}});pausers.push(lp.stop);\n  function onFin(){const o=OBJ[key];$('#f-st',R).innerHTML=`\u003cp class=\"say\">\u003cb>Kuzatuv:\u003c/b> ${o.obs}\u003c/p>\u003cp class=\"lbl\">Qaysi gaplar shu kuzatishdan mantiqli kelib chiqadi?\u003c/p>`+\n    o.st.map((s,i)=>`\u003cdiv class=\"stm\" data-i=\"${i}\">\u003cp>${s[0]}\u003c/p>\u003cdiv class=\"btns\">\u003cbutton class=\"chip\" data-a=\"1\">✔ Mantiqli\u003c/button>\u003cbutton class=\"chip\" data-a=\"0\">✘ Mantiqsiz\u003c/button>\u003c/div>\u003cp class=\"why\" hidden>\u003c/p>\u003c/div>`).join('')}\n  $('#f-st',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const box=b.closest('.stm'),s=OBJ[key].st[+box.dataset.i],ok=(b.dataset.a==='1')===!!s[1];\n    $$('.chip',box).forEach(x=>{x.disabled=true});b.classList.add(ok?'ok':'no');const w=$('.why',box);w.hidden=false;w.className='why '+(ok?'good':'bad');\n    w.textContent=(ok?\"✔ To'g'ri! \":\"✘ Aksincha. \")+s[2]};\n  $('#f-obj',R).onclick=e=>{const b=e.target.closest('.chip');if(!b)return;key=b.dataset.k;$$('#f-obj .chip',R).forEach(x=>x.classList.toggle('on',x===b));lp.stop();reset()};\n  $('#f-go',R).onclick=()=>{if(st.fin)reset();lp.start()};\n  $('#f-pause',R).onclick=()=>lp.stop();\n  $('#f-reset',R).onclick=()=>{lp.stop();reset()};\n  reset();\n}\n\n/* =====================================================\n   4. GIPOTEZA\n   ===================================================== */\nfunction initS4(){\n  const R=$('#sim4');\n  const HYP={L1:\"Mayatnik uzunligi ortsa, davr ham ortadi (sekinroq tebranadi).\",L2:\"Mayatnik uzunligi ortsa, davr kamayadi (tezroq tebranadi).\",L3:\"Uzunlik davrga ta'sir qilmaydi.\",\n    M1:\"Sharcha massasi ortsa, davr ortadi.\",M2:\"Sharcha massasi ortsa, davr kamayadi.\",M3:\"Massa davrga ta'sir qilmaydi.\"};\n  const radios=ks=>ks.map(k=>`\u003clabel class=\"opt\">\u003cinput type=\"radio\" name=\"hyp\" value=\"${k}\">${HYP[k]}\u003c/label>`).join('');\n  R.innerHTML=`\n  \u003cp class=\"lbl\">1-qadam. Savol: mayatnik uzunligi uning davriga ta'sir qiladimi?\u003c/p>\n  \u003cp class=\"sub\">Davr — bitta to'liq tebranish vaqti (chapga, o'ngga va orqaga qaytish).\u003c/p>\n  \u003cdiv id=\"h-l\">${radios(['L1','L2','L3'])}\u003c/div>\n  \u003cdiv id=\"h-m\" hidden>\u003cp class=\"lbl\">Yangi gipoteza taklif qil (massa haqida):\u003c/p>${radios(['M1','M2','M3'])}\u003c/div>\n  \u003cp class=\"lbl\">2-qadam. Gipotezani tajribada tekshir\u003c/p>\n  \u003cdiv class=\"stage\">\u003ccanvas id=\"p-cv\" aria-label=\"Mayatnik\">\u003c/canvas>\u003c/div>\n  \u003cdiv class=\"row\">\u003clabel for=\"p-L\">Uzunlik: \u003cb id=\"p-Lv\">60\u003c/b> sm\u003c/label>\u003c/div>\n  \u003cinput type=\"range\" id=\"p-L\" min=\"20\" max=\"100\" step=\"10\" value=\"60\" aria-label=\"Mayatnik uzunligi\">\n  \u003cdiv class=\"row\">\u003cspan>Massa:\u003c/span>\u003cspan id=\"p-m\">\u003cbutton class=\"chip\" data-m=\"50\">50 g\u003c/button> \u003cbutton class=\"chip on\" data-m=\"100\">100 g\u003c/button> \u003cbutton class=\"chip\" data-m=\"200\">200 g\u003c/button>\u003c/span>\n  \u003cspan>Tezlik:\u003c/span>\u003cspan id=\"p-sp\">\u003cbutton class=\"chip\" data-s=\"1\">×1\u003c/button> \u003cbutton class=\"chip on\" data-s=\"3\">×3\u003c/button> \u003cbutton class=\"chip\" data-s=\"6\">×6\u003c/button>\u003c/span>\u003c/div>\n  \u003cp>Sekundomer: \u003cspan class=\"read\" id=\"p-t\">0.0\u003c/span> s &nbsp; Tebranishlar: \u003cspan class=\"read\" id=\"p-n\">0\u003c/span> / 10\u003c/p>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"p-go\">▶ Boshlash\u003c/button>\u003cbutton class=\"btn\" id=\"p-pause\">⏸ To'xtatish\u003c/button>\u003cbutton class=\"btn ghost\" id=\"p-reset\">↺ Qayta boshlash\u003c/button>\u003c/div>\n  \u003cp class=\"sub\">10 ta tebranish tugagach, natija jadvalga o'zi yoziladi. Uzunlikni (va massani) o'zgartirib, kamida 3 marta o'lcha.\u003c/p>\n  \u003cdiv class=\"scroll\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Uzunlik (sm)\u003c/th>\u003cth>Massa (g)\u003c/th>\u003cth>10 tebranish (s)\u003c/th>\u003cth>Davr T (s)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"p-rows\">\u003ctr>\u003ctd colspan=\"4\">Hali o'lchov yo'q.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"btns\">\u003cbutton class=\"btn ghost\" id=\"p-clear\">Jadvalni tozalash\u003c/button>\u003c/div>\n  \u003cp class=\"lbl\">3-qadam. Natijani tahlil qil\u003c/p>\n  \u003cbutton class=\"btn alt\" id=\"h-check\">Gipotezani tekshirish\u003c/button>\n  \u003cdiv class=\"msg\" id=\"h-res\" hidden aria-live=\"polite\">\u003c/div>`;\n  const cv=$('#p-cv',R),ctx=canvasSetup(cv,720,380);\n  let L=60,m=100,speed=3,ts=0,cnt=0;const rows=[];const A=12*Math.PI/180;\n  const T0=()=>2*Math.PI*Math.sqrt(L/100/9.81);\n  function draw(){const c=ctx,ink=cssv('--ink'),edge=cssv('--edge'),col=cssv('--c');c.clearRect(0,0,720,380);\n    const px=L*3.2,rb=10+m/200*12,th=A*Math.cos(2*Math.PI*ts/T0()),x=360+px*Math.sin(th),y=30+px*Math.cos(th);\n    c.strokeStyle=edge;c.lineWidth=8;c.lineCap='round';c.beginPath();c.moveTo(260,30);c.lineTo(460,30);c.stroke();\n    c px\">°C\u003c/text>';\n  svg.innerHTML=tk;const merc=$('#th-m',R);\n  let K,t,pend,tries,cur;const val=x=>Math.round(20+K*x);\n  const setM=v=>{merc.setAttribute('y',Y(v));merc.setAttribute('height',396-Y(v))};\n  function thNew(){K=rnd(5,8);t=0;pend=true;tries=0;cur=20;setM(20);$('#th-min',R).textContent=0;$('#th-next',R).disabled=true;$('#th-msg',R).hidden=true;\n    for(let i=rows.length-1;i>=0;i--)if(rows[i].tool==='Termometr')rows.splice(i,1);table()}\n  thNew();\n  $('#th-ok',R).onclick=()=>{const inp=$('#th-in',R),v=parseInt(inp.value,10);if(isNaN(v)){say('#th-msg',\"Harorat sonini kirit.\");return}\n    if(!pend){say('#th-msg',\"Bu daqiqa yozildi. «Keyingi daqiqa» tugmasini bos.\");return}\n    const d=v-val(t);\n    if(d===0){rows.push({tool:'Termometr',what:`${t}-daqiqa, suv harorati`,val:`${v} °C`,ok:1,t,v});pend=false;inp.value='';table();\n      if(t>=6){say('#th-msg',\"✔ To'g'ri! Barcha o'lchashlar tugadi. Grafikka qara: harorat deyarli to'g'ri chiziq bo'yicha oshdi.\",1)}else{say('#th-msg',`✔ To'g'ri! ${tries?`(${tries+1}-urinishda) `:''}Jadvalga yozildi.`,1);$('#th-next',R).disabled=false}tries=0}\n    else{tries++;say('#th-msg',Math.abs(d)===1?\"Deyarli! 1 °C xato. Ko'zingni simob uchi bilan bir tekislikda tut va chiziqlarni sanab chiq.\":\"Xato. Maslahat: shkalada 10 °C oralig'ida 10 ta kichik bo'linma bor, demak 1 bo'linma = 1 °C. Simob uchi qaysi chiziqda?\",0)}};\n  $('#th-next',R).onclick=()=>{if(pend||t>=6)return;const a=val(t);t++;pend=true;$('#th-min',R).textContent=t;$('#th-next',R).disabled=true;$('#th-msg',R).hidden=true;tween(a,val(t),700,setM)};\n  $('#th-new',R).onclick=thNew;\n\n  /* sekundomer */\n  const ball=$('#sw-ball',R);let D=0,tb=0,launched=false,swOn=false,swT0=0;\n  const lp=loop(dt=>{if(launched){tb+=dt;if(tb>=D){tb=D;launched=false}ball.setAttribute('cx',50+540*tb/D)}\n    if(swOn)$('#sw-d',R).textContent=((performance.now()-swT0)/1000).toFixed(2);if(!launched&&!swOn)lp.stop()});pausers.push(lp.stop);\n  $('#sw-launch',R).onclick=()=>{D=Math.round(rnd(3,6)*10)/10;tb=0;launched=true;swOn=false;ball.setAttribute('cx',50);$('#sw-d',R).textContent='0.00';$('#sw-start',R).disabled=false;$('#sw-stop',R).disabled=true;$('#sw-msg',R).hidden=true;lp.start()};\n  $('#sw-start',R).onclick=()=>{if(swOn)return;swOn=true;swT0=performance.now();$('#sw-start',R).disabled=true;$('#sw-stop',R).disabled=false;lp.start()};\n  $('#sw-stop',R).onclick=()=>{if(!swOn)return;swOn=false;const me=(performance.now()-swT0)/1000,err=me-D;$('#sw-d',R).textContent=me.toFixed(2);$('#sw-stop',R).disabled=true;\n    const good=Math.abs(err)\u003c=.35;rows.push({tool:'Sekundomer',what:`To'p yo'li (haqiqiy ${D.toFixed(1)} s)`,val:`${me.toFixed(2)} s`,ok:good});table();\n    say('#sw-msg',good?`✔ Yaxshi! Sening natijang ${me.toFixed(2)} s, haqiqiy vaqt ${D.toFixed(1)} s. Farq ${err>=0?'+':''}${err.toFixed(2)} s.`:`Farq katta: ${err>=0?'+':''}${err.toFixed(2)} s (haqiqiy vaqt ${D.toFixed(1)} s). Sabab: odam reaksiyasi kechikadi. Maslahat: 3 marta o'lchab, o'rtacha qiymatni ol.`,good?1:0)};\n\n  /* tarozi */\n  const OBJS=[[\"🔑\",\"Kalit\"],[\"✏️\",\"Qalam\"],[\"🍎\",\"Olma\"],[\"🪙\",\"Tanga\"],[\"🧦\",\"Paypoq\"],[\"📱\",\"Telefon\"]];\n  const bs=$('#bl-svg',R);let mass,obj,pan=[],ang=0,tgt=0;\n  const sum=()=>pan.reduce((a,b)=>a+b,0);\n  function bNew(){mass=Math.floor(rnd(7,97));obj=OBJS[Math.floor(Math.random()*OBJS.length)];pan=[];tgt=0;$('#bl-msg',R).hidden=true;$('#bl-in',R).value='';upd()}\n  function drawB(){const a=ang*Math.PI/180,cx=210,cy=80,Rr=140,xr=cx+Rr*Math.cos(a),yr=cy+Rr*Math.sin(a),xl=cx-Rr*Math.cos(a),yl=cy-Rr*Math.sin(a);\n    let s=`\u003cpolygon points=\"${cx-10},${cy} ${cx+10},${cy} ${cx+26},250 ${cx-26},250\" style=\"fill:var(--sun);stroke:var(--edge)\" stroke-width=\"3\"/>\u003crect x=\"${cx-70}\" y=\"250\" width=\"140\" height=\"10\" rx=\"4\" style=\"fill:var(--edge)\"/>`;\n    s+=`\u003cline x1=\"${xl}\" y1=\"${yl}\" x2=\"${xr}\" y2=\"${yr}\" style=\"stroke:var(--edge)\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003ccircle cx=\"${cx}\" cy=\"${cy}\" r=\"8\" style=\"fill:var(--c);stroke:var(--edge)\" stroke-width=\"3\"/>`;\n    [[xl,yl],[xr,yr]].forEach(([x,y],k)=>{s+=`\u003cline x1=\"${x}\" y1=\"${y}\" x2=\"${x-46}\" y2=\"${y+70}\" style=\"stroke:var(--edge)\" stroke-width=\"2\"/>\u003cline x1=\"${x}\" y1=\"${y}\" x2=\"${x+46}\" y2=\"${y+70}\" style=\"stroke:var(--edge)\" stroke-width=\"2\"/>\u003crect x=\"${x-52}\" y=\"${y+70}\" width=\"104\" height=\"9\" rx=\"4\" style=\"fill:var(--edge)\"/>`;\n      if(k===0)s+=`\u003ctext x=\"${x}\" y=\"${y+62}\" text-anchor=\"middle\" font-size=\"38\">${obj[0]}\u003c/text>\u003ctext x=\"${x}\" y=\"${y+98}\" text-anchor=\"middle\" class=\"svgt\">${obj[1]}\u003c/text>`;\n      else pan.slice(0,12).forEach((w,i)=>{const px=x-45+(i%4)*24,py=y+70-16-Math.floor(i/4)*18;s+=`\u003crect x=\"${px}\" y=\"${py}\" width=\"22\" height=\"16\" rx=\"3\" fill=\"#9AA5B1\" style=\"stroke:var(--edge)\" stroke-width=\"1.5\"/>\u003ctext x=\"${px+11}\" y=\"${py+12}\" text-anchor=\"middle\" style=\"font:800 10px Nunito,sans-serif;fill:#14213D\">${w}\u003c/text>`})});\n    bs.innerHTML=s}\n  const bl=loop(dt=>{ang+=(tgt-ang)*Math.min(1,dt*8);if(Math.abs(tgt-ang)\u003c.02){ang=tgt;bl.stop()}drawB()});pausers.push(bl.stop);\n  function upd(){const d=sum()-mass;tgt=Math.max(-14,Math.min(14,d*1.2));const st=$('#bl-state',R);\n    st.className='msg '+(d===0?'good':'');st.textContent=d===0?\"Tarozi muvozanatda! Endi qo'yilgan toshlar massasini qo'shib, jism massasini yoz.\":d>0?\"O'ng pallada juda ko'p: pastga tushdi. Bir nechta toshni ol.\":\"Chap pallada jism og'irroq: pastga tushdi. Toshlar qo'y.\";\n    if(pan.length>12)st.textContent+=\" (Ekranda 12 tagacha tosh ko'rinadi.)\";bl.start()}\n  $('#bl-w',R).onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;const w=+b.dataset.w;if(w>0){if(pan.length\u003c20)pan.push(w)}else if(w\u003c0)pan.pop();else pan=[];upd()};\n  $('#bl-ok',R).onclick=()=>{const v=parseInt($('#bl-in',R).value,10);if(isNaN(v)){say('#bl-msg',\"Massani kirit.\");return}\n    if(sum()!==mass){say('#bl-msg',\"Avval tarozini muvozanatga keltir: shundagina toshlar massasi jism massasiga teng bo'ladi.\",0);return}\n    if(v===mass){rows.push({tool:'Tarozi',what:`${obj[1]} massasi`,val:`${v} g`,ok:1});table();say('#bl-msg',`✔ To'g'ri! ${obj[1]} massasi ${v} g.`,1)}\n    else say('#bl-msg',`Xato. Pallada ${pan.join(' + ')} g bor. Ularni qayta qo'shib chiq.`,0)};\n  $('#bl-new',R).onclick=bNew;bNew();\n}\n\n/* =====================================================\n   7. TAJRIBA\n   ===================================================== */\nfunction initS7(){\n  const R=$('#sim7');\n  const SAFE=[[\"Tajribani o'qituvchi ruxsat bergandan keyin boshlayman.\",1,\"To'g'ri: ruxsatsiz va rejasiz tajriba xavfli.\"],\n   [\"Noma'lum suyuqlikning ta'mini ko'raman.\",0,\"Xato: laboratoriyada hech narsani tatib ko'rmaymiz.\"],\n   [\"Qaynoq suvli idishni yugurib ko'chiraman.\",0,\"Xato: yugurganda suv sachrab, kuydirishi mumkin. Idish sekin va ehtiyot bilan ko'chiriladi.\"],\n   [\"Shisha idish sinsa, o'zim yig'masdan o'qituvchiga aytaman.\",1,\"To'g'ri: siniq shisha kesib olishi mumkin.\"],\n   [\"Termometrni aralashtirgich sifatida ishlataman.\",0,\"Xato: termometr sinishi mumkin. Aralashtirish uchun maxsus tayoqcha bor.\"],\n   [\"Tajribadan keyin joyni tartibga keltirib, qo'limni yuvaman.\",1,\"To'g'ri: bu xavfsizlik va tartib qoidasi.\"]];\n  R.innerHTML=`\n  \u003cp class=\"lbl\">1-qadam. Xavfsizlik qoidalari: har bir gap qoidaga mosmi?\u003c/p>\n  \u003cdiv id=\"sf\">${SAFE.map((s,i)=>`\u003cdiv class=\"stm\" data-i=\"${i}\">\u003cp>${s[0]}\u003c/p>\u003cdiv class=\"btns\">\u003cbutton class=\"chip\" data-a=\"1\">✔ Qoidaga mos\u003c/button>\u003cbutton class=\"chip\" data-a=\"0\">✘ Qoidaga zid\u003c/button>\u003c/div>\u003cp class=\"why\" hidden>\u003c/p>\u003c/div>`).join('')}\u003c/div>\n  \u003cp class=\"msg\" id=\"sf-msg\">Hamma gapga to'g'ri javob ber, shunda tajriba ochiladi.\u003c/p>\n  \u003cdiv id=\"ex\" class=\"locked\">\n   \u003cp class=\"lbl\">2-qadam. Virtual tajriba: 100 ml va 200 ml suv bir xil isitgichda isitiladi.\u003c/p>\n   \u003cdiv class=\"stage\">\u003ccanvas id=\"e-cv\" aria-label=\"Ikki stakan suv isitilmoqda\">\u003c/canvas>\u003c/div>\n   \u003cp>Vaqt: \u003cspan class=\"read\" id=\"e-t\">0 daq 00 s\u003c/span> \u003cspan class=\"sub\">(tezlashtirilgan)\u003c/span>\u003c/p>\n   \u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"e-go\">▶ Boshlash\u003c/button>\u003cbutton class=\"btn\" id=\"e-pause\">⏸ To'xtatish\u003c/button>\u003cbutton class=\"btn ghost\" id=\"e-reset\">↺ Qayta boshlash\u003c/button>\u003c/div>\n   \u003cdiv class=\"scroll\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Vaqt (daq)\u003c/th>\u003cth>100 ml (°C)\u003c/th>\u003cth>200 ml (°C)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"e-rows\">\u003c/tbody>\u003c/table>\u003c/div>\n   \u003cdiv id=\"e-chart\">\u003c/div>\n   \u003cdiv id=\"e-after\" hidden>\n     \u003cp class=\"lbl\">3-qadam. Natijalarni taqqosla\u003c/p>\u003cdiv id=\"e-q\">\u003c/div>\n     \u003cp class=\"lbl\">4-qadam. Ilmiy xulosa yoz\u003c/p>\n     \u003cp class=\"sub\">Xulosada bo'lsin: nima qildim, qanday natija chiqdi (sonlar bilan), bundan nima kelib chiqadi.\u003c/p>\n     \u003ctextarea id=\"e-txt\" placeholder=\"Masalan: Men 100 ml va 200 ml suvni bir xil isitgichda isitdim. 8 daqiqadan keyin ... Demak, ...\">\u003c/textarea>\n     \u003cdiv class=\"btns\">\u003cbutton class=\"btn alt\" id=\"e-chk\">Xulosani tekshirish\u003c/button>\u003cbutton class=\"btn ghost\" id=\"e-ex\">Namuna ko'rish\u003c/button>\u003c/div>\n     \u003cdiv id=\"e-fb\">\u003c/div>\u003c/div>\n  \u003c/div>`;\n  let good=0;const sf=$('#sf',R);\n  sf.onclick=e=>{const b=e.target.closest('.chip');if(!b||b.disabled)return;const box=b.closest('.stm'),s=SAFE[+box.dataset.i],ok=(b.dataset.a==='1')===!!s[1],w=$('.why',box);\n    w.hidden=false;w.className='why '+(ok?'good':'bad');w.textC \n\ninitS1();initS2();initS3();initS4();initS5();initS6();initS7();\nquiz($('#quiz1'),1,[\n {q:\"Qaysi biri kuzatish natijasi (ko'z yoki asbob bilan olingan aniq ma'lumot)?\",ok:\"Muz 3 daqiqada kichrayib, atrofida suv paydo bo'ldi\",no:[\"Muz suvni yaxshi ko'radi\",\"Ertaga ham xuddi shunday bo'ladi\",\"Muz eng chiroyli jism\"],why:\"Kuzatish — ko'rilgan yoki o'lchangan fakt.\"},\n {q:\"Muzning haroratini aniq bilish uchun nima kerak?\",ok:\"Termometr\",no:[\"Barmoq bilan ushlab ko'rish\",\"Ko'z bilan qarash\",\"Quloq solish\"],why:\"His taxminiy, termometr esa aniq son beradi.\"},\n {q:\"Lupa nima uchun kerak?\",ok:\"Kichik narsalarni kattalashtirib ko'rish uchun\",no:[\"Haroratni o'lchash uchun\",\"Vaqtni o'lchash uchun\",\"Massani o'lchash uchun\"],why:\"Lupa mayda tafsilotlarni ko'rsatadi.\"}]);\nquiz($('#quiz2'),2,[\n {q:\"Vaqt o'tishi bilan qiymat qanday o'zgarishini ko'rsatishga qaysi ko'rinish qulay?\",ok:\"Grafik\",no:[\"Faqat jadval yoki grafik farq qilmaydi\",\"Rasm faqat\",\"Hech qaysi\"],why:\"Grafik chizig'i oshish yoki kamayishni bir qarashda ko'rsatadi.\"},\n {q:\"Natijani tushuntirganda birinchi nimani aytish kerak?\",ok:\"Nima o'lchanganini va qaysi birlikda\",no:[\"Faqat xulosani\",\"Faqat eng katta sonni\",\"Boshqa tajribalarni\"],why:\"Avval nima o'lchanganini aytamiz, keyin o'zgarishni, oxirida xulosani.\"},\n {q:\"Gistogramma nima uchun qulay?\",ok:\"Qiymatlarni ustun balandligi bo'yicha yonma-yon solishtirish uchun\",no:[\"Faqat chiroyli bo'lgani uchun\",\"Aniq vaqtni ko'rsatgani uchun\",\"Massani o'lchagani uchun\"],why:\"Ustunlar balandligini solishtirish oson.\"}]);\nquiz($('#quiz3'),3,[\n {q:\"Bitta kuzatuvdan «hamma jismlar shunday» deb xulosa chiqarish qanday?\",ok:\"Noto'g'ri: boshqa jismlarni ham sinash kerak\",no:[\"Har doim to'g'ri\",\"Faqat tosh uchun to'g'ri\",\"Muhim emas\"],why:\"Ishonchli xulosa uchun ko'proq kuzatuv kerak.\"},\n {q:\"Yaxshi xulosa nimaga tayanadi?\",ok:\"Kuzatilgan va o'lchangan faktlarga\",no:[\"Kimning ovozi balandligiga\",\"Chiroyli tuyulishiga\",\"Taxminga\"],why:\"Xulosa faktlardan kelib chiqadi.\"},\n {q:\"Bir hodisadan bir nechta xulosa chiqishi mumkinmi?\",ok:\"Ha, ularni tekshirish uchun yangi tajriba kerak\",no:[\"Yo'q, faqat bitta\",\"Faqat o'qituvchi ayta oladi\",\"Hech qachon\"],why:\"Turli taxminlarni tajriba bilan tekshiramiz.\"}]);\nquiz($('#quiz4'),4,[\n {q:\"Quyidagilardan qaysi biri gipoteza?\",ok:\"Agar mayatnik uzunligi oshsa, uning davri ham oshadi\",no:[\"Mayatnik tebranmoqda\",\"Mayatnik chiroyli\",\"Mayatnik ipga osilgan\"],why:\"Gipoteza «agar ... bo'lsa, ... bo'ladi» ko'rinishidagi tekshiriladigan taxmin.\"},\n {q:\"Gipoteza tasdiqlanmadi. To'g'ri harakat qaysi?\",ok:\"Gipotezani rad etib, yangisini ilgari suraman\",no:[\"Natijani gipotezaga moslab yozaman\",\"Tajribani yashiraman\",\"Hech narsa yozmayman\"],why:\"Halol natija muhim: rad etilgan gipoteza ham bilim beradi.\"},\n {q:\"Gipotezani nima tekshiradi?\",ok:\"Tajriba va o'lchash natijalari\",no:[\"Kimning ovozi baland ekani\",\"Gipotezaning chiroyli aytilishi\",\"Do'stlar fikri\"],why:\"Faqat tajriba gipotezani tekshiradi.\"}]);\nquiz($('#quiz5'),5,[\n {q:\"Reja tuzishda birinchi navbatda nima aniqlanadi?\",ok:\"Muammo va maqsad\",no:[\"Natija\",\"Xulosa\",\"Grafik rangi\"],why:\"Nimani aniqlashni bilmasdan tajriba qilib bo'lmaydi.\"},\n {q:\"Idish materiali o'zgaradigan kattalik bo'lsa, quyidagilardan qaysi biri o'zgarmas tutiladi?\",ok:\"Suv miqdori\",no:[\"Idish materiali\",\"O'lchangan harorat\",\"Vaqt\"],why:\"Adolatli tajribada faqat bitta kattalik o'zgaradi.\"},\n {q:\"Tajriba bosqichlari nima uchun rejalashtiriladi?\",ok:\"Natija to'g'ri bo'lishi va tajriba takrorlanishi uchun\",no:[\"Tajriba chiroyli ko'rinishi uchun\",\"Vaqtni cho'zish uchun\",\"Asboblarni ko'paytirish uchun\"],why:\"Tartibli reja ishonchli natija beradi.\"}]);\nquiz($('#quiz6'),6,[\n {q:\"Termometrda ikki katta chiziq orasi 10 °C, oralig'ida 5 ta kichik bo'linma bor. 1 bo'linma nechaga teng?\",ok:\"2 °C\",no:[\"1 °C\",\"5 °C\",\"10 °C\"],why:\"10 °C ni 5 ga bo'lamiz: 2 °C.\"},\n {q:\"Sekundomer bilan o'lchash xatoligini kamaytirish uchun nima qilish kerak?\",ok:\"Bir necha marta o'lchab, o'rtacha qiymatni olish\",no:[\"Bir marta o'lchash\",\"Ko'zni yumib bosish\",\"Asbobni silkitish\"],why:\"Bir necha o'lchash tasodifiy xatoni kamaytiradi.\"},\n {q:\"Tarozi qaysi kattalikni o'lchaydi?\",ok:\"Massani\",no:[\"Haroratni\",\"Vaqtni\",\"Uzunlikni\"],why:\"Tarozi massani grammlarda o'lchaydi.\"}]);\nquiz($('#quiz7'),7,[\n {q:\"Qaynoq suv bilan ishlashda eng to'g'ri qoida qaysi?\",ok:\"O'qituvchi ruxsati bilan, ehtiyotkor va sekin ishlash\",no:[\"Yugurib ko'chirish\",\"Qo'l bilan sinab ko'rish\",\"Idishni bir qo'lda ushlab silkitish\"],why:\"Kuyishning oldini olish uchun ehtiyotkorlik kerak.\"},\n {q:\"Ilmiy xulosa nimalardan iborat?\",ok:\"Nima qilindi, qanday natija chiqdi, bundan nima kelib chiqadi\",no:[\"Faqat sonlar\",\"Faqat chiroyli rasm\",\"Faqat taxmin\"],why:\"Xulosa tajriba, natija va tahlilni o'z ichiga oladi.\"},\n {q:\"Ikki tajriba natijasini taqqoslash uchun qaysi biri qulay?\",ok:\"Bitta grafikda ikkita chiziq chizish\",no:[\"Natijalarni yozmaslik\",\"Faqat eslab qolish\",\"Bittasini tashlab yuborish\"],why:\"Bitta grafikda farq bir qarashda ko'rinadi.\"}]);\ninitTest();\ngo(1,true);\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Laboratoriya jihozlari va qurilmalar", "icon": "🧪", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>7-sinf fizika — Laboratoriya jihozlari va qurilmalar\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}\nheader{background:#1d4ed8;color:white;padding:22px;text-align:center}\nh1{margin:0;font-size:28px} h2{margin-top:0}\n.container{max-width:1100px;margin:auto;padding:18px}\n.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}\nbutton{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}\nbutton:hover{background:#e0ecff}\nbutton.active{background:#2563eb;color:white}\n.section{display:none;background:white;border:1px solid #dbe3ee;border-radius:16px;padding:20px;box-shadow:0 4px 14px #0000000d}\n.section.active{display:block}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}\n.card{border:1px solid #dbe3ee;border-radius:14px;padding:15px;background:#fff}\n.icon{font-size:52px;text-align:center;margin:8px}\n.small{color:#64748b;font-size:14px}\n.sim{background:#f8fafc;border-radius:14px;padding:18px;margin-top:15px}\n.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}\ninput[type=range]{width:280px}\n.menzurka{height:280px;width:120px;border:4px solid #475569;border-top:0;border-radius:0 0 20px 20px;margin:15px auto;position:relative;background:#fff}\n.water{position:absolute;bottom:0;left:0;right:0;background:#60a5fa88;border-radius:0 0 15px 15px}\n.menisk{position:absolute;left:7px;right:7px;height:9px;border-radius:50%;background:#3b82f6aa}\n.scale{position:absolute;right:-50px;top:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}\n.thermo{width:55px;height:240px;border:4px solid #475569;border-radius:30px;margin:15px auto;position:relative}\n.bulb{position:absolute;width:30px;height:30px;border-radius:50%;bottom:7px;left:9px;background:#ef4444}\n.mercury{position:absolute;width:12px;bottom:29px;left:18px;background:#ef4444;border-radius:10px}\n.ruler{height:75px;border:2px solid #475569;margin:25px 0;position:relative;background:repeating-linear-gradient(90deg,#fff 0 9px,#475569 9px 10px)}\n.ruler-label{text-align:center;margin-top:40px;font-size:13px}\n.balance{height:8px;width:240px;background:#475569;margin:70px auto 30px;position:relative}\n.pan{position:absolute;top:12px;width:85px;height:25px;border:2px solid #475569;border-radius:0 0 50px 50px}\n.left{left:0}.right{right:0}\n.stand{width:8px;height:110px;background:#475569;position:absolute;left:50%;top:-45px}\n.big{font-size:28px;font-weight:bold;text-align:center}\n.result{margin-top:12px;padding:12px;background:#e0f2fe;border-radius:10px}\ntable{border-collapse:collapse;width:100%;margin-top:12px}\nth,td{border:1px solid #cbd5e1;padding:9px;text-align:left}\nth{background:#e0ecff}\nol li{margin:8px 0}\nfooter{text-align:center;padding:25px;color:#64748b}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cheader>\n\u003ch1>🔬 Laboratoriya jihozlari va qurilmalar\u003c/h1>\n\u003cp>7-sinf fizika — interaktiv animatsiya va simulyatsiya\u003c/p>\n\u003c/header>\n\n\u003cdiv class=\"container\">\n\u003cdiv class=\"tabs\">\n\u003cbutton class=\"active\" data-target=\"jihozlar\">🔬 Jihozlar\u003c/button>\n\u003cbutton data-target=\"menzurka\">🥛 Menzurka\u003c/button>\n\u003cbutton data-target=\"aniqlik\">📏 O‘lchash aniqligi\u003c/button>\n\u003cbutton data-target=\"termometr\">🌡️ Termometr\u003c/button>\n\u003cbutton data-target=\"tarozi\">⚖️ Tarozi\u003c/button>\n\u003cbutton data-target=\"sekundomer\">⏱️ Sekundomer\u003c/button>\n\u003cbutton data-target=\"test\">🧠 Tezkor test\u003c/button>\n\u003c/div>\n\n\u003csection id=\"jihozlar\" class=\"section active\">\n\u003ch2>1. Laboratoriya jihozlari\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🧪\u003c/div>\u003ch3>Probirka\u003c/h3>\u003cp>Kichik miqdordagi moddalar bilan tajriba qilish uchun ishlatiladi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">⚗️\u003c/div>\u003ch3>Kolba\u003c/h3>\u003cp>Suyuqliklarni saqlash, aralashtirish va tajribalar uchun.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🥛\u003c/div>\u003ch3>Menzurka\u003c/h3>\u003cp>Suyuqlik hajmini o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🌡️\u003c/div>\u003ch3>Termometr\u003c/h3>\u003cp>Haroratni o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">⚖️\u003c/div>\u003ch3>Tarozi\u003c/h3>\u003cp>Massani o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">↕️\u003c/div>\u003ch3>Dinamometr\u003c/h3>\u003cp>Kuchni nyutonda (N) o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">⏱️\u003c/div>\u003ch3>Sekundomer\u003c/h3>\u003cp>Vaqt oralig‘ini sekundlarda o‘lchaydi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🔩\u003c/div>\u003ch3>Shtativ\u003c/h3>\u003cp>Jihozlarni mahkamlab ushlab turadi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">🔻\u003c/div>\u003ch3>Voronka\u003c/h3>\u003cp>Suyuqlikni bir idishdan boshqasiga quyishni osonlashtiradi.\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"icon\">💧\u003c/div>\u003ch3>Pipetka\u003c/h3>\u003cp>Kichik miqdordagi suyuqlikni olish yoki ko‘chirish uchun.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"result\">\u003cb>Eslab qoling:\u003c/b> avval qanday fizik kattalikni o‘lchashingizni aniqlang, keyin mos asbobni tanlang.\u003c/div>\n\u003c/section>\n\n\u003csection id=\"menzurka\" class=\"section\">\n\u003ch2>2. Suyuqlik hajmini o‘lchash simulyatsiyasi\u003c/h2>\n\u003cp>Suyuqlik hajmini menzurka yordamida o‘lchaymiz. Suv kabi suyuqliklarda meniskning pastki qismi o‘qiladi.\u003c/p>\n\u003cdiv class=\"sim\">\n\u003cdiv class=\"menzurka\">\n\u003cdiv id=\"water\" class=\"water\" style=\"height:50%\">\u003c/div>\n\u003cdiv id=\"menisk\" class=\"menisk\" style=\"bottom:50%\">\u003c/div>\n\u003cdiv class=\"scale\">\u003cspan>100 ml\u003c/span>\u003cspan>80\u003c/span>\u003cspan>60\u003c/span>\u003cspan>40\u003c/span>\u003cspan>20\u003c/span>\u003cspan>0\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"big\">\u003cspan id=\"volume\">50\u003c/span> ml\u003c/div>\n\u003cdiv class=\"controls\">\n\u003clabel>Hajm:\u003c/label>\n\u003cinput id=\"volumeRange\" type=\"range\" min=\"0\" max=\"100\" value=\"50\">\n\u003cbutton id=\"readVolume\">📖 O‘lchovni o‘qish\u003c/button>\n\u003c/div>\n\u003cdiv id=\"volumeResult\" class=\"result\">Menzurkani tekis qo‘ying va ko‘zingizni menisk bilan bir balandlikda tuting.\u003c/div>\n\u003c/div>\n\u003ch3>Amaliy qoida\u003c/h3>\n\u003col>\n\u003cli>Menzurkani tekis yuzaga qo‘ying.\u003c/li>\n\u003cli>Suyuqlikni quying.\u003c/li>\n\u003cli>Ko‘zni menisk bilan bir balandlikka keltiring.\u003c/li>\n\u003cli>Meniskning pastki qismidan qiymatni o‘qing.\u003c/li>\n\u003cli>Natijani birlik bilan yozing.\u003c/li>\n\u003c/ol>\n\u003c/section>\n\n\u003csection id=\"aniqlik\" class=\"section\">\n\u003ch2>3. O‘lchash aniqligi va bo‘linma qiymati\u003c/h2>\n\u003cp>\u003cb>Bo‘linma qiymati\u003c/b> — shkaladagi qo‘shni belgilar orasidagi qiymat.\u003c/p>\n\u003cdiv class=\"card\">\n\u003ch3>📏 Chizg‘ich animatsiyasi\u003c/h3>\n\u003cdiv class=\"ruler\">\u003c/div>\n\u003cp>\u003cb>Misol:\u003c/b> 0 cm dan 1 cm gacha 10 ta bo‘linma bo‘lsa:\u003c/p>\n\u003cdiv class=\"result\">C = (1 − 0) / 10 = 0,1 cm = \u003cb>1 mm\u003c/b>\u003c/div>\n\u003c/div>\n\u003ctable>\n\u003ctr>\u003cth>Asbob\u003c/th>\u003cth>O‘lchaydigan kattalik\u003c/th>\u003cth>Birlik\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Chizg‘ich\u003c/td>\u003ctd>Uzunlik\u003c/td>\u003ctd>m, cm, mm\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Tarozi\u003c/td>\u003ctd>Massa\u003c/td>\u003ctd>kg, g\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Termometr\u003c/td>\u003ctd>Harorat\u003c/td>\u003ctd>°C, K\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Menzurka\u003c/td>\u003ctd>Hajm\u003c/td>\u003ctd>ml, cm³, l, m³\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Dinamometr\u003c/td>\u003ctd>Kuch\u003c/td>\u003ctd>N\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Sekundomer\u003c/td>\u003ctd>Vaqt\u003c/td>\u003ctd>s\u003c/td>\u003c/tr>\n\u003c/table>\n\u003c/section>\n\n\u003csection id=\"termometr\" class=\"section\">\n\u003ch2>4. Termometr simulyatsiyasi\u003c/h2>\n\u003cdiv class=\"sim\">\n\u003cdiv class=\"thermo\">\n\u003cdiv id=\"mercury\" class=\"mercury\" style=\"height:105px\">\u003c/div>\n\u003cdiv class=\"bulb\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"big\">\u003cspan id=\"temp\">25\u003c/span> °C\u003c/div>\n\u003cdiv class=\"controls\">\n\u003clabel>Harorat:\u003c/label>\n\u003cinput id=\"tempRange\" type=\"range\" min=\"0\" max=\"50\" value=\"25\">\n\u003c/div>\n\u003cdiv class=\"result\">Termometr haroratni o‘lchaydi. O‘lchash natijasi birlik bilan yoziladi, masalan: \u003cb>25 °C\u003c/b>.\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"tarozi\" class=\"section\">\n\u003ch2>5. Massa o‘lchash simulyatsiyasi\u003c/h2>\n\u003cdiv class=\"sim\">\n\u003cdiv style=\"position:relative;height:220px\">\n\u003cdiv class=\"stand\">\u003c/div>\n\u003cdiv class=\"balance\">\n\u003cdiv class=\"pan left\">\u003c/div>\n\u003cdiv class=\"pan right\">\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003cdiv class=\"big\">\u003cspan id=\"mass\">500\u003c/span> g = \u003cspan id=\"kg\">0.50\u003c/span> kg\u003c/div>\n\u003cinput id=\"massRange\" type=\"range\" min=\"0\" max=\"1000\" value=\"500\" step=\"10\">\n\u003cp class=\"result\">Tarozi yordamida jism massasi aniqlanadi. SI birligi — kilogramm (kg).\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"sekundomer\" class=\"section\">\n\u003ch2>6. Sekundomer animatsiyasi\u003c/h2>\n\u003cdiv class=\"sim\">\n\u003cdiv class=\"big\" id=\"clock\">0.0 s\u003c/div>\n\u003cdiv class=\"controls\" style=\"justify-content:center\">\n\u003cbutton id=\"start\">▶ Boshlash\u003c/button>\n\u003cbutton id=\"stop\">⏸ To‘xtatish\u003c/button>\n\u003cbutton id=\"reset\">↺ Nolga qaytarish\u003c/button>\n\u003c/div>\n\u003cdiv class=\"result\">Sekundomer vaqt oralig‘ini o‘lchaydi. Vaqtning SI birligi — sekund (s).\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection id=\"test\" class=\"section\">\n\u003ch2>7. Tezkor interaktiv test\u003c/h2>\n\u003cdiv id=\"quiz\">\u003c/div>\n\u003cbutton id=\"next\">Keyingi savol →\u003c/button>\n\u003cdiv id=\"score\" class=\"result\" style=\"display:none\">\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\u003cfooter>\n\u003cb>7-sinf fizika\u003c/b> • Laboratoriya jihozlari va qurilmalar\u003cbr>\nO‘lchashda: \u003cb>asbobni tanla → to‘g‘ri joylashtir → shkalani o‘qi → birlikni yoz.\u003c/b>\n\u003c/footer>\n\n\u003cscript>\nconst buttons=document.querySelectorAll('.tabs button');\nconst sections=document.querySelectorAll('.section');\nbuttons.forEach(b=>b.addEventListener('click',()=>{\n buttons.forEach(x=>x.classList.remove('active')); b.classList.add('active');\n sections.forEach(s=>s.classList.remove('active'));\n document.getElementById(b.dataset.target).classList.add('active');\n}));\n\nconst vr=document.getElementById('volumeRange');\nvr.addEventListener('input',()=>{\n const v=Number(vr.value);\n document.getElementById('volume').textContent=v;\n document.getElementById('water').style.height=v+'%';\n document.getElementById('menisk').style.bottom=v+'%';\n});\ndocument.getElementById('readVolume').addEventListener('click',()=>{\n const v=vr.value;\n document.getElementById('volumeResult').innerHTML='O‘lchangan hajm: \u003cb>'+v+' ml = '+v+' cm³\u003c/b>. Meniskning pastki qismi bo‘yicha o‘qildi.';\n});\n\nconst tr=document.getElementById('tempRange');\ntr.addEventListener('input',()=>{\n const v=Number(tr.value);\n document.getElementById('temp').textContent=v;\n document.getElementById('mercury').style.height=(25+v*4)+'px';\n});\n\nconst mr=document.getElementById('massRange');\nmr.addEventListener('input',()=>{\n const v=Number(mr.value);\n document.getElementById('mass').textContent=v;\n document.getElementById('kg').textContent=(v/1000).toFixed(2);\n});\n\nlet timer=0,startTime=0,animation=null;\nfunction tick(){\n timer=(performance.now()-startTime)/1000;\n document.getElementById('clock').textContent=timer.toFixed(1)+' s';\n animation=requestAnimationFrame(tick);\n}\ndocument.getElementById('start').onclick=()=>{\n if(!animation){startTime=performance.now()-timer*1000;animation=requestAnimationFrame(tick)}\n};\ndocument.getElementById('stop').onclick=()=>{\n if(animation){cancelAnimationFrame(animation);animation=null}\n};\ndocument.getElementById('reset').onclick=()=>{\n if(animation)cancelAnimationFrame(animation);\n animation=null;timer=0;document.getElementById('clock').textContent='0.0 s';\n};\n\nconst questions=[\n['Suyuqlik hajmini qaysi asbob bilan o‘lchaymiz?',['Menzurka','Dinamometr','Termometr'],'Menzurka'],\n['Kuchning SI birligi nima?',['Nyuton','Kilogramm','Sekund'],'Nyuton'],\n['Massani qaysi asbob o‘lchaydi?',['Tarozi','Termometr','Sekundomer'],'Tarozi'],\n['Vaqtni qaysi asbob o‘lchaydi?',['Sekundomer','Menzurka','Dinamometr'],'Sekundomer'],\n['Haroratni qaysi asbob o‘lchaydi?',['Termometr','Tarozi','Chizg‘ich'],'Termometr']\n];\nlet qi=0,score=0;\nfunction showQuestion(){\n const q=questions[qi];\n document.getElementById('quiz').innerHTML='\u003cdiv class=\"card\">\u003ch3>'+ (qi+1)+'. '+q[0]+'\u003c/h3>'+\n q[1].map((x,i)=>'\u003cbutton class=\"answer\" data-answer=\"'+x+'\">'+x+'\u003c/button>').join(' ')+'\u003c/div>';\n document.querySelectorAll('.answer').forEach(a=>a.onclick=()=>{\n  document.querySelectorAll('.answer').forEach(x=>x.disabled=true);\n  if(a.dataset.answer===q[2]){score++;a.style.background='#bbf7d0'}else{a.style.background='#fecaca'}\n });\n}\nshowQuestion();\ndocument.getElementById('next').onclick=()=>{\n if(qi\u003cquestions.length-1){qi++;showQuestion()}\n else{document.getElementById('score').style.display='block';document.getElementById('score').innerHTML='\u003cb>Natija:\u003c/b> '+score+' / '+questions.length+' ta to‘g‘ri javob.';document.getElementById('next').disabled=true}\n};\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Laboratoriyada texnika xavfsizligi qoidalari", "icon": "🦺", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Laboratoriya xavfsizligi — 7-sinf fizika\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --navy:#152238; --navy2:#1e3358; --yellow:#FFC93C; --red:#E4572E;\n  --teal:#2A9D8F; --cream:#F7F4EC; --ink:#152238; --card:#ffffff;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);\n}\n*{box-sizing:border-box}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5}\nh1,h2,h3{font-family:'Poppins',sans-serif;margin:0 0 .4em}\nimg{max-width:100%}\n.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}\nheader{background:var(--navy);color:#fff;padding:28px 16px 20px;text-align:center;\n  border-bottom:6px solid var(--yellow)}\nheader h1{font-size:1.5rem}\nheader p{opacity:.85;margin:0;font-size:.95rem}\nnav.tabs{position:sticky;top:0;z-index:5;display:flex;background:var(--navy2);\n  overflow-x:auto}\nnav.tabs button{flex:1;min-width:110px;background:none;border:none;color:#cdd7ea;\n  padding:12px 6px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.82rem;\n  cursor:pointer;border-bottom:4px solid transparent}\nnav.tabs button.active{color:#fff;border-color:var(--yellow)}\nsection.part{display:none;padding-top:20px;animation:fade .4s ease}\nsection.part.active{display:block}\n@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.card{background:var(--card);border-radius:14px;padding:18px;margin:14px 0;\n  box-shadow:0 2px 10px rgba(21,34,56,.08)}\n.rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}\n.rule{background:#fff;border-radius:12px;padding:12px;text-align:center;\n  border:2px solid #eee2}\n.rule .emoji{font-size:1.8rem;display:block;margin-bottom:6px}\n.compare{display:flex;gap:10px;margin:14px 0}\n.compare .box{flex:1;border-radius:12px;padding:14px;text-align:center;cursor:pointer;\n  transition:transform .15s;border:3px solid transparent;font-size:.9rem}\n.compare .box:active{transform:scale(.97)}\n.compare .good{background:#e6f6f2;border-color:var(--teal)}\n.compare .bad{background:#fdeae4;border-color:var(--red)}\n.compare .box .big{font-size:2.2rem;display:block}\n.compare .result{display:none;margin-top:8px;font-weight:600}\n.compare .box.picked .result{display:block}\n.quiz{margin-top:10px}\n.q{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #eee}\n.q p.qtext{font-weight:600;margin:0 0 8px}\n.opt{display:block;width:100%;text-align:left;background:var(--cream);border:2px solid transparent;\n  border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-family:inherit;font-size:.92rem}\n.opt.correct{background:#d7f3e8;border-color:var(--teal)}\n.opt.wrong{background:#fbdcd3;border-color:var(--red)}\n.opt:disabled{cursor:default}\n.score{font-family:'Poppins';font-weight:700;color:var(--navy);margin-top:8px}\n.sim-steps{display:flex;flex-direction:column;gap:8px;margin:12px 0}\n.sim-steps button{background:var(--teal);color:#fff;border:none;border-radius:10px;\n  padding:10px;font-family:'Poppins';font-weight:600;cursor:pointer}\n.step-box{background:#fff;border-left:5px solid var(--teal);border-radius:8px;\n  padding:12px;margin-top:8px;display:none}\n.step-box.show{display:block;animation:fade .3s}\n.sign-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}\n.sign{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;\n  border:2px solid #eee;cursor:pointer;font-size:.75rem}\n.sign .icon{font-size:1.9rem;display:block;margin-bottom:4px}\n.sign.selected{border-color:var(--yellow);background:#fff8e1}\n.match-wrap{display:flex;flex-direction:column;gap:14px;margin:10px 0}\n.match-col{display:flex;flex-direction:column;gap:8px}\n.match-item{background:#fff;border:2px solid #ddd;border-radius:10px;padding:10px;\n  cursor:pointer;font-size:.88rem;text-align:center}\n.match-item.sel{border-color:var(--yellow);background:#fff8e1}\n.match-item.done{border-color:var(--teal);background:#e6f6f2;cursor:default}\nfooter{text-align:center;color:#8a93a6;font-size:.8rem;padding:20px}\n.badge{display:inline-block;background:var(--yellow);color:var(--navy);font-weight:700;\n  border-radius:999px;padding:2px 10px;font-size:.75rem;margin-bottom:8px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"badge\">7-SINF · FIZIKA\u003c/div>\n  \u003ch1>Laboratoriya xonasida texnika xavfsizligi\u003c/h1>\n  \u003cp>Bilim — himoya. Har bir qoida — sizning xavfsizligingiz uchun.\u003c/p>\n\u003c/header>\n\n\u003cnav class=\"tabs\">\n  \u003cbutton class=\"active\" onclick=\"showPart(1,this)\">1. Umumiy qoidalar\u003c/button>\n  \u003cbutton onclick=\"showPart(2,this)\">2. Elektr va kimyo\u003c/button>\n  \u003cbutton onclick=\"showPart(3,this)\">3. Ogohlantiruvchi belgilar\u003c/button>\n\u003c/nav>\n\n\u003cdiv class=\"wrap\">\n\n\u003c!-- PART 1 -->\n\u003csection class=\"part active\" id=\"part1\">\n  \u003cdiv class=\"card\">\n    \u003ch2>🔬 Nega qoidalarga rioya qilish shart?\u003c/h2>\n    \u003cp>Laboratoriya — qiziqarli tajribalar xonasi, lekin u o'yin maydonchasi emas. Bu yerda olov, elektr, shisha idishlar va ba'zan kimyoviy moddalar bo'ladi. Bitta e'tiborsizlik — kuyish, kesilish yoki boshqa jarohatga olib kelishi mumkin. Qoidalar seni jazolash uchun emas, balki \u003cb>o'zingni va do'stlaringni asrash\u003c/b> uchun yaratilgan.\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>📋 Umumiy qoidalar\u003c/h3>\n    \u003cdiv class=\"rule-grid\">\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🥼\u003c/span>Maxsus xalat va himoya vositalarida ishlash\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🙋\u003c/span>O'qituvchi ruxsatisiz asbob ishlatmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🧹\u003c/span>Ish o'rnini toza va tartibli saqlash\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🍎\u003c/span>Laboratoriyada ovqatlanmaslik va ichmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🏃\u003c/span>Yugurmaslik, shovqin qilmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">👂\u003c/span>Xavf sodir bo'lsa, darhol o'qituvchiga aytish\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>⚖️ To'g'ri va noto'g'ri xatti-harakat\u003c/h3>\n    \u003cp>Har bir katakchani bosing va natijani ko'ring:\u003c/p>\n    \u003cdiv class=\"compare\">\n      \u003cdiv class=\"box good\" onclick=\"this.classList.add('picked')\">\n        \u003cspan class=\"big\">🙆‍♂️\u003c/span>\n        Qo'llarni yig'ib, o'qituvchi ko'rsatmasini kutish\n        \u003cdiv class=\"result\">✅ To'g'ri! Xavfsiz va tartibli.\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"box bad\" onclick=\"this.classList.add('picked')\">\n        \u003cspan class=\"big\">🙅‍♂️\u003c/span>\n        Ruxsatsiz probirkani qo'lga olib, silkitish\n        \u003cdiv class=\"result\">❌ Noto'g'ri! Sinishi yoki to'kilishi mumkin.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\" id=\"quiz1\">\n    \u003ch3>✅ Bilimingizni tekshiring (1-qism)\u003c/h3>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- PART 2 -->\n\u003csection class=\"part\" id=\"part2\">\n  \u003cdiv class=\"card\">\n    \u003ch2>⚡ Elektr asboblari bilan ishlash\u003c/h2>\n    \u003cdiv class=\"rule-grid\">\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🔌\u003c/span>Nam qo'l bilan rozetkaga tegmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🧵\u003c/span>Simlar yorilgan bo'lsa ishlatmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🔋\u003c/span>Asbobni ishlatishdan oldin tekshirish\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🛑\u003c/span>Ish tugagach, tokdan uzish\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch2>🧪 Kimyoviy moddalar bilan ishlash\u003c/h2>\n    \u003cdiv class=\"rule-grid\">\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🥽\u003c/span>Himoya ko'zoynagi taqish\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">👃\u003c/span>Moddani hidlash uchun qo'l bilan yelpish\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">🚫\u003c/span>Moddani tatib ko'rmaslik\u003c/div>\n      \u003cdiv class=\"rule\">\u003cspan class=\"emoji\">💧\u003c/span>Kislota-suvni to'g'ri tartibda aralashtirish\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>🚑 Baxtsiz hodisa yuz bersa — nima qilish kerak?\u003c/h3>\n    \u003cp>Tugmalarni ketma-ket bosib, to'g'ri harakatni ko'ring:\u003c/p>\n    \u003cdiv class=\"sim-steps\">\n      \u003cbutton onclick=\"showStep('s1')\">1-qadam: Elektr toki urdi\u003c/button>\n      \u003cdiv class=\"step-box\" id=\"s1\">Darhol asbobni rozetkadan uzing (qo'l bilan emas, tugma orqali!) va o'qituvchini chaqiring.\u003c/div>\n      \u003cbutton onclick=\"showStep('s2')\">2-qadam: Kimyoviy modda terga tekkanda\u003c/button>\n      \u003cdiv class=\"step-box\" id=\"s2\">Zararlangan joyni kamida 10-15 daqiqa toza suv bilan yuving va o'qituvchiga darhol xabar bering.\u003c/div>\n      \u003cbutton onclick=\"showStep('s3')\">3-qadam: Har qanday holatda\u003c/button>\n      \u003cdiv class=\"step-box\" id=\"s3\">Vahima qilmang, o'zingiz davolashga urinmang — malakali yordam kelguncha o'qituvchi ko'rsatmasiga amal qiling.\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\" id=\"quiz2\">\n    \u003ch3>✅ Bilimingizni tekshiring (2-qism)\u003c/h3>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- PART 3 -->\n\u003csection class=\"part\" id=\"part3\">\n  \u003cdiv class=\"card\">\n    \u003ch2>⚠️ Xalqaro xavfsizlik belgilari\u003c/h2>\n    \u003cp>Har bir piktogramma sizga moddaning xavfini oldindan aytadi:\u003c/p>\n    \u003cdiv class=\"sign-grid\" id=\"signGrid\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003ch3>🎯 Belgini ma'nosi bilan mosla\u003c/h3>\n    \u003cp>Chapdan belgini, o'ngdan mos ta'rifni tanlang.\u003c/p>\n    \u003cdiv class=\"match-wrap\">\n      \u003cdiv class=\"match-col\" id=\"matchLeft\">\u003c/div>\n      \u003cdiv class=\"match-col\" id=\"matchRight\">\u003c/div>\n    \u003c/div>\n    \u003cp id=\"matchMsg\" style=\"font-weight:600;color:var(--teal)\">\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"card quiz\" id=\"quiz3\">\n    \u003ch3>✅ Bilimingizni tekshiring (3-qism)\u003c/h3>\n  \u003c/div>\n\u003c/section>\n\n\u003c/div>\n\u003cfooter>7-sinf fizika · Laboratoriya xavfsizligi darsi\u003c/footer>\n\n\u003cscript>\nfunction showPart(n,btn){\n  document.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));\n  document.getElementById('part'+n).classList.add('active');\n  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));\n  btn.classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction showStep(id){document.getElementById(id).classList.toggle('show');}\n\nfunction buildQuiz(containerId, questions){\n  const c=document.getElementById(containerId);\n  let score=0, answered=0;\n  questions.forEach((q,qi)=>{\n    const div=document.createElement('div'); div.className='q';\n    const p=document.createElement('p'); p.className='qtext'; p.textContent=(qi+1)+'. '+q.q;\n    div.appendChild(p);\n    q.opts.forEach((opt,oi)=>{\n      const b=document.createElement('button'); b.className='opt'; b.textContent=opt;\n      b.onclick=()=>{\n        if(b.disabled) return;\n        div.querySelectorAll('.opt').forEach(o=>o.disabled=true);\n        if(oi===q.correct){ b.classList.add('correct'); score++; }\n        else{\n          b.classList.add('wrong');\n          div.querySelectorAll('.opt')[q.correct].classList.add('correct');\n        }\n        answered++;\n        updateScore();\n      };\n      div.appendChild(b);\n    });\n    c.appendChild(div);\n  });\n  const scoreEl=document.createElement('p'); scoreEl.className='score'; c.appendChild(scoreEl);\n  function updateScore(){ scoreEl.textContent = 'Natija: '+score+' / '+questions.length+(answered===questions.length? ' 🎉':''); }\n}\n\nbuildQuiz('quiz1',[\n {q:\"Laboratoriyaga kirganda birinchi nima qilish kerak?\",opts:[\"Darhol asboblarni ushlab ko'rish\",\"O'qituvchi ko'rsatmasini tinglash\",\"Do'stlar bilan gaplashish\",\"Telefon bilan band bo'lish\"],correct:1},\n {q:\"Ruxsatsiz asbob ishlatish nimaga olib kelishi mumkin?\",opts:[\"Hech nimaga\",\"Jarohatga\",\"Yaxshi natijaga\",\"Baholarga\"],correct:1},\n {q:\"Laboratoriyada ovqatlanish mumkinmi?\",opts:[\"Ha, doim mumkin\",\"Faqat tanaffusda\",\"Yo'q, mumkin emas\",\"Faqat shirinlik\"],correct:2},\n {q:\"Ish o'rnini qanday saqlash kerak?\",opts:[\"Toza va tartibli\",\"Ahamiyatsiz\",\"Har xil narsalar bilan to'la\",\"Faqat oxirida tozalash\"],correct:0},\n {q:\"Xavfli holat sodir bo'lsa nima qilish kerak?\",opts:[\"Jim turish\",\"Do'stga aytish\",\"Darhol o'qituvchiga xabar berish\",\"O'zi hal qilish\"],correct:2}\n]);\n\nbuildQuiz('quiz2',[\n {q:\"Nam qo'l bilan nimaga tegib bo'lmaydi?\",opts:[\"Daftarga\",\"Rozetkaga\",\"Stulga\",\"Kitobga\"],correct:1},\n {q:\"Simi yorilgan asbobni ishlatish mumkinmi?\",opts:[\"Ha\",\"Yo'q\",\"Faqat ehtiyotkorlik bilan\",\"Faqat tez\"],correct:1},\n {q:\"Ish tugagach, elektr asbobini nima qilish kerak?\",opts:[\"Shunday qoldirish\",\"Rozetkadan uzish\",\"Uyga olib ketish\",\"Sindirish\"],correct:1},\n {q:\"Kimyoviy moddalar bilan ishlaganda nima taqish kerak?\",opts:[\"Qo'lqop va ko'zoynak\",\"Hech narsa\",\"Shlyapa\",\"Qo'lqop shart emas\"],correct:0},\n {q:\"Moddani hidlash uchun to'g'ri usul qaysi?\",opts:[\"Burun bilan yaqin hidlash\",\"Qo'l bilan yelpib hidlash\",\"Tatib ko'rish\",\"Puflash\"],correct:1},\n {q:\"Moddani tatib ko'rish mumkinmi?\",opts:[\"Ha, ozgina\",\"Yo'q, hech qachon\",\"Faqat shirin bo'lsa\",\"Faqat oxirida\"],correct:1},\n {q:\"Elektr toki urganda birinchi harakat nima?\",opts:[\"Odamni ushlab tortish\",\"Asbobni rozetkadan uzish\",\"Suv sepish\",\"Kutib turish\"],correct:1},\n {q:\"Kimyoviy modda teriga tekkanda nima qilish kerak?\",opts:[\"Artib tashlash\",\"Ko'p suv bilan yuvish\",\"Kutish\",\"Ustidan kiyim kiyish\"],correct:1},\n {q:\"Baxtsiz hodisa yuz berganda kim chaqiriladi?\",opts:[\"Do'st\",\"O'qituvchi\",\"Hech kim\",\"Faqat ota-ona\"],correct:1},\n {q:\"O'zingiz davolashga urinish kerakmi?\",opts:[\"Ha, albatta\",\"Yo'q, malakali yordam kutish kerak\",\"Faqat internet orqali\",\"Faqat kitobdan o'qib\"],correct:1}\n]);\n\nbuildQuiz('quiz3',[\n {q:\"Olov belgisi nimani anglatadi?\",opts:[\"Yonuvchan modda\",\"Sovuq modda\",\"Yumshoq modda\",\"Shirin modda\"],correct:0},\n {q:\"Bosh suyagi belgisi nimani bildiradi?\",opts:[\"Foydali modda\",\"Zaharli modda\",\"Yengil modda\",\"Suyuq modda\"],correct:1},\n {q:\"Korroziya belgisini ko'rsangiz, modda qanday?\",opts:[\"Terini/materialni yeyuvchi\",\"Xushbo'y\",\"Yumshoq\",\"Rangsiz\"],correct:0},\n {q:\"Portlash belgisi qachon paydo bo'ladi?\",opts:[\"Modda portlash xavfi bo'lsa\",\"Modda sovuq bo'lsa\",\"Modda shirin bo'lsa\",\"Modda og'ir bo'lsa\"],correct:0},\n {q:\"Ogohlantiruvchi belgini ko'rganda nima qilish kerak?\",opts:[\"E'tibor bermaslik\",\"Ehtiyot bo'lish va qoidaga amal qilish\",\"Modda bilan o'ynash\",\"Uni tashlab yuborish\"],correct:1}\n]);\n\n// Warning signs\nconst signs=[\n {icon:'🔥',label:'Yonuvchan',mean:'Oson alangalanadi, olovdan uzoq tuting'},\n {icon:'☠️',label:'Zaharli',mean:'Yutish yoki nafas olish xavfli'},\n {icon:'🧪',label:'Korroziv',mean:'Terini va materialni yemiradi'},\n {icon:'💥',label:'Portlovchi',label2:'',mean:'Zarba yoki issiqlikdan portlashi mumkin'},\n {icon:'☢️',label:'Radioaktiv',mean:'Nurlanish xavfi bor'},\n {icon:'⚡',label:'Elektr xavfi',mean:'Tok urishi mumkin'}\n];\nconst grid=document.getElementById('signGrid');\nsigns.forEach(s=>{\n  const d=document.createElement('div'); d.className='sign';\n  d.innerHTML='\u003cspan class=\"icon\">'+s.icon+'\u003c/span>'+s.label;\n  grid.appendChild(d);\n});\n\n// Match game\nlet selLeft=null, selRight=null, doneCount=0;\nconst leftCol=document.getElementById('matchLeft');\nconst rightCol=document.getElementById('matchRight');\nconst shuffledRight=[...signs].sort(()=>Math.random()-0.5);\nsigns.forEach((s,i)=>{\n  const l=document.createElement('div'); l.className='match-item'; l.dataset.id=i;\n  l.innerHTML=s.icon+' '+s.label;\n  l.onclick=()=>selectMatch(l,'left',i);\n  leftCol.appendChild(l);\n});\nshuffledRight.forEach(s=>{\n  const idx=signs.indexOf(s);\n  const r=document.createElement('div'); r.className='match-item'; r.dataset.id=idx;\n  r.textContent=s.mean;\n  r.onclick=()=>selectMatch(r,'right',idx);\n  rightCol.appendChild(r);\n});\nfunction selectMatch(el,side,id){\n  if(el.classList.contains('done')) return;\n  if(side==='left'){ if(selLeft) selLeft.classList.remove('sel'); selLeft=el; el.classList.add('sel'); }\n  else{ if(selRight) selRight.classList.remove('sel'); selRight=el; el.classList.add('sel'); }\n  if(selLeft && selRight){\n    if(selLeft.dataset.id===selRight.dataset.id){\n      selLeft.classList.add('done'); selRight.classList.add('done');\n      selLeft.classList.remove('sel'); selRight.classList.remove('sel');\n      doneCount++;\n      selLeft=null; selRight=null;\n      if(doneCount===signs.length){ document.getElementById('matchMsg').textContent='🎉 Barcha belgilar to\\'g\\'ri moslashtirildi!'; }\n    } else {\n      setTimeout(()=>{\n        if(selLeft) selLeft.classList.remove('sel');\n        if(selRight) selRight.classList.remove('sel');\n        selLeft=null; selRight=null;\n      },500);\n    }\n  }\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Fizika va texnologiya", "icon": "💡", "html": "\u003c!doctype html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Fizika va texnologiya\u003c/title>\n\u003cstyle>\n:root{--bg:#eef5ff;--card:#fff;--ink:#12263f;--mut:#566a82;--pri:#1f6feb;--acc:#ffb703;--ok:#1a9f5b;--bad:#d93a3a;--ln:#cfdcf0;--grid:#dbe7f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1726;--card:#16243a;--ink:#e8f0fb;--mut:#9db0c8;--pri:#5b9bff;--ln:#27395a;--grid:#15233a}}\n:root[data-theme=dark]{--bg:#0d1726;--card:#16243a;--ink:#e8f0fb;--mut:#9db0c8;--pri:#5b9bff;--ln:#27395a;--grid:#15233a}\n*{box-sizing:border-box}html,body{margin:0}\nbody{background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px;color:var(--ink);font:16px/1.55 ui-rounded,\"Nunito\",\"Segoe UI\",system-ui,sans-serif}\nheader{padding:20px 16px 8px;max-width:900px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}\nh1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1.15}\nheader p{margin:4px 0 0;color:var(--mut)}\n.chip{background:var(--acc);color:#12263f;font-weight:800;border-radius:99px;padding:6px 14px;white-space:nowrap}\nnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ln);display:flex;gap:6px;overflow-x:auto;padding:8px 12px;max-width:100%}\nnav button{flex:1 0 auto;font:inherit;font-weight:700;borde
