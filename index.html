t td{font-weight:700;border-bottom:0}\n.concl p{margin:6px 0}\n.v2{position:relative;height:150px;border-radius:12px;background:var(--wall);overflow:hidden}\n.ball{position:absolute;top:58px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a76,#d9381e);transform:translateX(-50%)}\n.tick{position:absolute;top:112px;width:1px;height:12px;background:var(--mute)}\n.tl{position:absolute;top:126px;font-size:.72rem;color:var(--mute);transform:translateX(-50%)}\n.dash{height:8px;margin-top:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 40px,transparent 40px 80px);opacity:.5;border-radius:4px}\n.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}\n.gps{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}\nsvg text{fill:var(--ink)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003ch1>Tezlikni o'lchash\u003c/h1>\n  \u003cdiv class=\"row\">\u003cbutton id=\"unitBtn\">m/s\u003c/button>\u003cbutton id=\"themeBtn\">Qorong'i rejim\u003c/button>\u003c/div>\n\u003c/header>\n\u003cdiv class=\"tabs\" role=\"tablist\">\n  \u003cbutton class=\"tab\" role=\"tab\" data-t=\"0\">1. Sekundomer\u003c/button>\n  \u003cbutton class=\"tab\" role=\"tab\" data-t=\"1\">2. Video tahlil\u003c/button>\n  \u003cbutton class=\"tab\" role=\"tab\" data-t=\"2\">3. GPS va spidometr\u003c/button>\n\u003c/div>\n\n\u003c!-- ============ 1-SIMULYATSIYA ============ -->\n\u003cdiv class=\"panel\" id=\"p0\">\n\u003csection class=\"box info\">\n  \u003cdiv>\u003ch2>Maqsad\u003c/h2>\u003cp>Sekundomer bilan o'rtacha tezlikni o'lchash va qo'lda o'lchash xatosini baholash.\u003c/p>\u003c/div>\n  \u003cdiv>\u003ch2>Asboblar\u003c/h2>\u003cul>\u003cli>Sekundomer (t, s)\u003c/li>\u003cli>Masofa s = 10 m\u003c/li>\u003cli>Harakatlanuvchi mashina\u003c/li>\u003c/ul>\u003c/div>\n  \u003cdiv>\u003ch2>Formula\u003c/h2>\u003cp>v = s / t\u003cbr>v(o'rt) = (v₁+v₂+v₃+v₄+v₅) / 5\u003cbr>1 m/s = 3,6 km/soat\u003c/p>\u003c/div>\n\u003c/section>\n\u003csection class=\"box\">\n  \u003cp class=\"cap\" style=\"margin:0 0 8px\">Mashina start chizig'idan o'tganda «Start», finish chizig'idan o'tganda «Stop» bosing.\u003c/p>\n  \u003cdiv class=\"scene\" id=\"s1\">\u003c/div>\n  \u003cdiv class=\"row\" style=\"justify-content:space-between;margin:10px 0\">\n    \u003cdiv>\u003cdiv class=\"cap\">Sekundomer, s\u003c/div>\u003cdiv class=\"big\" id=\"sw\">0,00\u003c/div>\u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton id=\"swStart\" disabled>Start\u003c/button>\u003cbutton id=\"swStop\" disabled>Stop\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton class=\"main\" id=\"go1\">Boshlash\u003c/button>\u003cbutton id=\"pa1\" disabled>To'xtatish\u003c/button>\u003cbutton id=\"rs1\">Qayta boshlash\u003c/button>\u003c/div>\n  \u003cdiv class=\"slider\">\u003clabel for=\"sp1\">Jism tezligi:\u003c/label>\u003cinput type=\"range\" id=\"sp1\" min=\"1\" max=\"5\" step=\"0.1\" value=\"2\">\u003cb id=\"sv1\">\u003c/b>\u003c/div>\n  \u003cp class=\"msg\" id=\"m1\" role=\"status\">\u003c/p>\n\u003c/section>\n\u003csection class=\"box\">\u003ch2>Natijalar (\u003cspan id=\"n1\">0\u003c/span>/5 urinish)\u003c/h2>\n  \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Urinish\u003c/th>\u003cth>t, s\u003c/th>\u003cth>v = s/t, \u003cspan class=\"u\">\u003c/span>\u003c/th>\u003cth>Haqiqiy v, \u003cspan class=\"u\">\u003c/span>\u003c/th>\u003cth>Xato, %\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody id=\"r1\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd>O'rtacha\u003c/td>\u003ctd id=\"a1t\">–\u003c/td>\u003ctd id=\"a1v\">–\u003c/td>\u003ctd id=\"a1r\">–\u003c/td>\u003ctd id=\"a1e\">–\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\n\u003c/section>\n\u003csection class=\"box concl hide\" id=\"c1\">\u003ch2>Xulosa\u003c/h2>\u003cdiv id=\"c1t\">\u003c/div>\u003c/section>\n\u003c/div>\n\n\u003c!-- ============ 2-SIMULYATSIYA ============ -->\n\u003cdiv class=\"panel hide\" id=\"p1\">\n\u003csection class=\"box info\">\n  \u003cdiv>\u003ch2>Maqsad\u003c/h2>\u003cp>Videoni kadrma-kadr ko'rib, tezlikni aniqroq o'lchash va 1-usul bilan solishtirish.\u003c/p>\u003c/div>\n  \u003cdiv>\u003ch2>Asboblar\u003c/h2>\u003cul>\u003cli>Video (60 kadr/s)\u003c/li>\u003cli>Fonda 5 m masofa (1 m va 6 m belgilari)\u003c/li>\u003cli>Kadr hisoblagich\u003c/li>\u003c/ul>\u003c/div>\n  \u003cdiv>\u003ch2>Formula\u003c/h2>\u003cp>t = kadrlar soni / 60\u003cbr>v = s / t, s = 5 m\u003c/p>\u003c/div>\n\u003c/section>\n\u003csection class=\"box\">\n  \u003cp class=\"cap\" style=\"margin:0 0 8px\">Shar 1-belgiga yetgan kadrda «1-belgi»ni, 2-belgidan o'tgan kadrda «2-belgi»ni bosing.\u003c/p>\n  \u003cdiv class=\"v2\" id=\"s2\">\u003c/div>\n  \u003cdiv class=\"row\" style=\"justify-content:space-between;margin:10px 0\">\u003cdiv class=\"big\" id=\"fr\">Kadr: 0\u003c/div>\u003cdiv class=\"cap\" id=\"ft\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton id=\"prev\">Oldingi kadr\u003c/button>\u003cbutton id=\"next\">Keyingi kadr\u003c/button>\u003cbutton class=\"main\" id=\"go2\">Boshlash\u003c/button>\u003cbutton id=\"pa2\" disabled>To'xtatish\u003c/button>\u003cbutton id=\"rs2\">Qayta boshlash\u003c/button>\u003c/div>\n  \u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton id=\"mA\">1-belgi: shu kadr\u003c/button>\u003cbutton id=\"mB\">2-belgi: shu kadr\u003c/button>\u003c/div>\n  \u003cdiv class=\"slider\">\u003clabel for=\"sp2\">Shar tezligi:\u003c/label>\u003cinput type=\"range\" id=\"sp2\" min=\"1\" max=\"6\" step=\"0.1\" value=\"2.5\">\u003cb id=\"sv2\">\u003c/b>\u003c/div>\n\u003c/section>\n\u003csection class=\"box\">\u003ch2>Hisob-kitob\u003c/h2>\u003cdiv id=\"res2\" class=\"concl\">\u003cp class=\"cap\">Ikkala kadrni tanlang.\u003c/p>\u003c/div>\u003c/section>\n\u003c/div>\n\n\u003c!-- ============ 3-SIMULYATSIYA ============ -->\n\u003cdiv class=\"panel hide\" id=\"p2\">\n\u003csection class=\"box info\">\n  \u003cdiv>\u003ch2>Maqsad\u003c/h2>\u003cp>GPS bilan hisoblangan tezlikni spidometr ko'rsatkichi bilan solishtirish.\u003c/p>\u003c/div>\n  \u003cdiv>\u003ch2>Asboblar\u003c/h2>\u003cul>\u003cli>Analog spidometr (v₂)\u003c/li>\u003cli>GPS ilova (masofa s)\u003c/li>\u003cli>Taymer (har 10 s)\u003c/li>\u003c/ul>\u003c/div>\n  \u003cdiv>\u003ch2>Formula\u003c/h2>\u003cp>v₁ = Δs / Δt\u003cbr>Farq = |v₁ − v₂| / v₂ · 100 %\u003c/p>\u003c/div>\n\u003c/section>\n\u003csection class=\"box\">\n  \u003cdiv class=\"scene\" style=\"height:120px\">\u003cdiv class=\"road\" style=\"top:44px\">\u003c/div>\u003cdiv class=\"road\" id=\"lane\" style=\"top:44px;height:56px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 40px,transparent 40px 80px) 0 70px/100% 4px no-repeat,var(--road);background-size:auto,auto\">\u003c/div>\u003csvg class=\"car\" viewBox=\"0 0 60 34\" style=\"left:50%;top:46px\">\u003crect x=\"2\" y=\"12\" width=\"56\" height=\"14\" rx=\"5\" fill=\"#e0452f\"/>\u003cpath d=\"M14 12l7-9h18l8 9z\" fill=\"#c23a27\"/>\u003crect x=\"22\" y=\"5\" width=\"7\" height=\"7\" fill=\"#cfe9ff\"/>\u003crect x=\"31\" y=\"5\" width=\"7\" height=\"7\" fill=\"#cfe9ff\"/>\u003ccircle cx=\"15\" cy=\"27\" r=\"6\" fill=\"#111\"/>\u003ccircle cx=\"45\" cy=\"27\" r=\"6\" fill=\"#111\"/>\u003c/svg>\u003c/div>\n  \u003cdiv class=\"grid3\" style=\"margin-top:12px\">\n    \u003cdiv class=\"gps\" style=\"text-align:center\">\u003csvg id=\"gauge\" viewBox=\"0 0 200 130\" width=\"100%\" style=\"max-width:300px\">\u003c/svg>\u003cdiv class=\"big\" id=\"spd3\">0\u003c/div>\u003cdiv class=\"cap\">Spidometr (v₂)\u003c/div>\u003c/div>\n    \u003cdiv class=\"gps\">\u003ch2>GPS ilova\u003c/h2>\u003cdiv class=\"cap\">Tezlik\u003c/div>\u003cdiv class=\"big\" id=\"gv\">0\u003c/div>\u003cdiv class=\"cap\" style=\"margin-top:6px\">Bosib o'tilgan masofa\u003c/div>\u003cdiv class=\"big\" id=\"gs\">0 m\u003c/div>\u003cdiv class=\"cap\" style=\"margin-top:6px\">Vaqt\u003c/div>\u003cdiv class=\"big\" id=\"gt\">0 s\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"main\" id=\"go3\">Boshlash\u003c/button>\u003cbutton id=\"pa3\" disabled>To'xtatish\u003c/button>\u003cbutton id=\"rs3\">Qayta boshlash\u003c/button>\n    \u003clabel>Vaqt: \u003cselect id=\"ts\">\u003coption value=\"1\">×1\u003c/option>\u003coption value=\"3\">×3\u003c/option>\u003coption value=\"6\">×6\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n  \u003cdiv class=\"slider\">\u003clabel for=\"sp3\">Maqsadli tezlik:\u003c/label>\u003cinput type=\"range\" id=\"sp3\" min=\"20\" max=\"120\" step=\"5\" value=\"60\">\u003cb id=\"sv3\">\u003c/b>\u003c/div>\n  \u003cdiv class=\"slider\">\u003clabel for=\"ge\">GPS xatoligi:\u003c/label>\u003cinput type=\"range\" id=\"ge\" min=\"0\" max=\"10\" step=\"0.5\" value=\"3\">\u003cb id=\"gev\">\u003c/b>\u003c/div>\n\u003c/section>\n\u003csection class=\"box\">\u003ch2>Jadval (har 10 s)\u003c/h2>\n  \u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>t, s\u003c/th>\u003cth>s (GPS), m\u003c/th>\u003cth>v₂ spidometr, \u003cspan class=\"u\">\u003c/span>\u003c/th>\u003cth>v₁ = Δs/Δt, \u003cspan class=\"u\">\u003c/span>\u003c/th>\u003cth>Farq, %\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"r3\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd colspan=\"4\">O'rtacha farq\u003c/td>\u003ctd id=\"a3\">–\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\n\u003c/section>\n\u003csection class=\"box concl hide\" id=\"c3\">\u003ch2>Xulosa\u003c/h2>\u003cdiv id=\"c3t\">\u003c/div>\u003c/section>\n\u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* ===== Umumiy yordamchilar ===== */\nconst $ = id => document.getElementById(id);\nconst f2 = n => n.toFixed(2).replace('.', ',');\nconst f3 = n => n.toFixed(3).replace('.', ',');\nlet kmh = false;                                  // birlik: m/s yoki km/soat\nconst toU = ms => kmh ? ms * 3.6 : ms;\nconst uN = () => kmh ? 'km/soat' : 'm/s';\nconst pct = (m, L) => (m / L * 100) + '%';\nconst renders = [];                               // har bir simulyatsiyaning chizish funksiyasi\nconst rAll = () => { document.querySelectorAll('.u').forEach(e => e.textContent = uN()); $('unitBtn').textContent = uN(); renders.forEach(f => f()); };\nconst CAR = '\u003csvg class=\"car\" id=\"car1\" viewBox=\"0 0 60 34\">\u003crect x=\"2\" y=\"12\" width=\"56\" height=\"14\" rx=\"5\" fill=\"#e0452f\"/>\u003cpath d=\"M14 12l7-9h18l8 9z\" fill=\"#c23a27\"/>\u003crect x=\"22\" y=\"5\" width=\"7\" height=\"7\" fill=\"#cfe9ff\"/>\u003crect x=\"31\" y=\"5\" width=\"7\" height=\"7\" fill=\"#cfe9ff\"/>\u003ccircle cx=\"15\" cy=\"27\" r=\"6\" fill=\"#111\"/>\u003ccircle cx=\"45\" cy=\"27\" r=\"6\" fill=\"#111\"/>\u003c/svg>';\nlet S1 = { n: 0, avV: 0, avR: 0 };                // 1-simulyatsiya natijasi (2-simulyatsiya uchun)\n\n/* ===== Yorliqlar, mavzu, birlik ===== */\ndocument.querySelectorAll('.tab').forEach(b => b.onclick = () => {\n  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t === b));\n  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('hide', i != b.dataset.t));\n  rAll();\n});\ndocument.querySelector('.tab').click();\nfunction setTheme(d) { document.documentElement.dataset.theme = d ? 'dark' : 'light'; $('themeBtn').textContent = d ? \"Yorug' rejim\" : \"Qorong'i rejim\"; }\nsetTheme(matchMedia('(prefers-color-scheme: dark)').matches);\n$('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme !== 'dark');\n$('unitBtn').onclick = () => { kmh = !kmh; rAll(); };\n\n/* ================= 1-SIMULYATSIYA ================= */\n(() => {\n  const S = 10, RUN = 2, TOT = 14, N = 5;\n  let v = 2, simT = 0, x = 0, last = 0, raf = 0, running = false, paused = false, sw = 'idle', t0 = 0, r1 = 0, att = [];\n  $('s1').innerHTML = '\u003cdiv class=\"road\">\u003c/div>' +\n    '\u003cdiv class=\"line\" style=\"top:36px;height:80px;left:' + pct(RUN, TOT) + '\">\u003c/div>\u003cdiv class=\"lbl\" style=\"top:8px;left:' + pct(RUN, TOT) + '\">START\u003c/div>' +\n    '\u003cdiv class=\"line\" style=\"top:36px;height:80px;left:' + pct(RUN + S, TOT) + '\">\u003c/div>\u003cdiv class=\"lbl\" style=\"top:8px;left:' + pct(RUN + S, TOT) + '\">FINISH\u003c/div>' +\n    '\u003cdiv class=\"lbl\" style=\"top:122px;left:' + pct(RUN + S / 2, TOT) + '\">s = 10 m\u003c/div>' + CAR;\n  const say = t => $('m1').textContent = t;\n  function btns() {\n    $('go1').disabled = running || att.length >= N; $('pa1').disabled = !running;\n    $('swStart').disabled = !(running && sw === 'idle'); $('swStop').disabled = !(running && sw === 'run'); $('sp1').disabled = running;\n  }\n  function render() {\n    $('sv1').textContent = f2(toU(v)) + ' ' + uN(); $('n1').textContent = att.length;\n    let h = '';\n    for (let i = 0; i \u003c N; i++) {\n      const a = att[i];\n      h += a ? '\u003ctr>\u003ctd>' + (i + 1) + '\u003c/td>\u003ctd>' + f2(a.t) + '\u003c/td>\u003ctd>' + f2(toU(S / a.t)) + '\u003c/td>\u003ctd>' + f2(toU(a.v)) + '\u003c/td>\u003ctd>' + f2(Math.abs(S / a.t - a.v) / a.v * 100) + '\u003c/td>\u003c/tr>'\n               : '\u003ctr>\u003ctd>' + (i + 1) + '\u003c/td>\u003ctd>–\u003c/td>\u003ctd>–\u003c/td>\u003ctd>–\u003c/td>\u003ctd>–\u003c/td>\u003c/tr>';\n    }\n    $('r1').innerHTML = h;\n    const n = att.length;\n    if (n) {\n      const avV = att.reduce((p, a) => p + S / a.t, 0) / n, avR = att.reduce((p, a) => p + a.v, 0) / n;  // v(o'rt) = (v1+...+vn)/n\n      $('a1t').textContent = f2(att.reduce((p, a) => p + a.t, 0) / n); $('a1v').textContent = f2(toU(avV));\n      $('a1r').textContent = f2(toU(avR)); $('a1e').textContent = f2(Math.abs(avV - avR) / avR * 100);\n      S1 = { n: n, avV: avV, avR: avR };\n    } else { ['a1t', 'a1v', 'a1r', 'a1e'].forEach(k => $(k).textContent = '–'); S1.n = 0; }\n    $('c1').classList.toggle('hide', n \u003c N);\n    if (n >= N) {\n      const e = Math.abs(S1.avV - S1.avR) / S1.avR * 100, dt = att.reduce((p, a) => p + Math.abs(a.t - S / a.v), 0) / N;\n      $('c1t').innerHTML = '\u003cp>O\\'rtacha tezlik: \u003cb>' + f2(toU(S1.avV)) + ' ' + uN() + '\u003c/b>, haqiqiy: \u003cb>' + f2(toU(S1.avR)) + ' ' + uN() + '\u003c/b>. Farq: \u003cb>' + f2(e) + ' %\u003c/b>. Vaqtdagi o\\'rtacha xato: \u003cb>' + f2(dt) + ' s\u003c/b>.\u003c/p>' +\n        '\u003cp>Xatolik sababi: sekundomerni odam qo\\'lda bosadi. Reaksiya vaqti (≈0,1–0,3 s) Start va Stop bosishda har xil bo\\'lgani uchun o\\'lchangan t o\\'zgaradi.\u003c/p>' +\n        '\u003cp>Tezlik katta bo\\'lsa t kichik bo\\'ladi va shu xato foizda ko\\'proq ta\\'sir qiladi. Tajribani takrorlab o\\'rtachasini olish aniqlikni oshiradi.\u003c/p>';\n    }\n    btns();\n  }\n  function loop(ts) {                                  // requestAnimationFrame sikli\n    if (!running) return;\n    const dt = Math.min((ts - last) / 1000, .05); last = ts;\n    if (!paused) { simT += dt; x = Math.min(v * simT, TOT); }\n    $('car1').style.left = pct(x, TOT);\n    if (sw === 'run') $('sw').textContent = f2(simT - t0);\n    if (x >= TOT) { running = false; paused = false; $('pa1').textContent = \"To'xtatish\";\n      say(sw === 'done' ? (att.length >= N ? \"5 ta urinish tugadi. Xulosani o'qing.\" : \"Urinish yozildi. Keyingisini boshlang.\") : \"Start/Stop bosilmadi. Urinish hisobga olinmadi.\"); return render(); }\n    raf = requestAnimationFrame(loop);\n  }\n  $('go1').onclick = () => { simT = 0; x = 0; sw = 'idle'; running = true; paused = false; $('sw').textContent = f2(0); say(\"Mashina start chizig'iga yetganda «Start»ni bosing.\"); last = performance.now(); btns(); raf = requestAnimationFrame(loop); };\n  $('swStart').onclick = () => { sw = 'run'; t0 = simT; r1 = .1 + Math.random() * .2; say(\"Finish chizig'idan o'tganda «Stop»ni bosing.\"); btns(); };\n  $('swStop').onclick = () => {\n    const r2 = .1 + Math.random() * .2;                // tasodifiy reaksiya vaqti xatosi\n    const t = Math.max(.05, simT - t0 + r2 - r1); sw = 'done'; att.push({ t: t, v: v });\n    $('sw').textContent = f2(t); say(\"Vaqt: \" + f2(t) + \" s\"); render();\n  };\n  $('pa1').onclick = () => { paused = !paused; $('pa1').textContent = paused ? \"Davom ettirish\" : \"To'xtatish\"; };\n  $('rs1').onclick = () => { cancelAnimationFrame(raf); running = false; paused = false; sw = 'idle'; att = []; x = 0; $('car1').style.left = pct(0, TOT); $('sw').textContent = f2(0); $('pa1').textContent = \"To'xtatish\"; say(\"Tajriba qayta boshlandi.\"); render(); };\n  $('sp1').oninput = e => { v = +e.target.value; render(); };\n  $('car1').style.left = '0%'; renders.push(render);\n})();\n\n/* ================= 2-SIMULYATSIYA ================= */\n(() => {\n  const FPS = 60, L = 7, M1 = 1, M2 = 6, D = 5, X0 = .2;\n  let v = 2.5, fr = 0, A = null, B = null, play = false, acc = 0, last = 0, raf = 0;\n  const nF = () => Math.ceil((L - .2 - X0) / v * FPS);   // oxirgi kadr\n  let h = '\u003cdiv class=\"line\" style=\"top:20px;height:90px;left:' + pct(M1, L) + '\">\u003c/div>\u003cdiv class=\"lbl\" style=\"top:2px;left:' + pct(M1, L) + '\">1-belgi (1 m)\u003c/div>' +\n          '\u003cdiv class=\"line\" style=\"top:20px;height:90px;left:' + pct(M2, L) + '\">\u003c/div>\u003cdiv class=\"lbl\" style=\"top:2px;left:' + pct(M2, L) + '\">2-belgi (6 m)\u003c/div>';\n  for (let i = 0; i \u003c= L; i++) h += '\u003cdiv class=\"tick\" style=\"left:' + pct(i, L) + '\">\u003c/div>\u003cdiv class=\"tl\" style=\"left:' + pct(i, L) + '\">' + i + ' m\u003c/div>';\n  $('s2').innerHTML = h + '\u003cdiv class=\"ball\" id=\"ball\">\u003c/div>';\n  function show() {\n    $('ball').style.left = pct(X0 + v * fr / FPS, L);\n    $('fr').textContent = 'Kadr: ' + fr + ' / ' + nF(); $('ft').textContent = 't = ' + f3(fr / FPS) + ' s (kadr / 60)';\n    $('sv2').textContent = f2(toU(v)) + ' ' + uN(); $('pa2').disabled = !play; $('go2').disabled = play;\n    $('prev').disabled = play || fr \u003c= 0; $('next').disabled = play || fr >= nF();\n  }\n  function result() {\n    const o = $('res2');\n    if (A === null || B === null) { o.innerHTML = '\u003cp class=\"cap\">1-belgi kadri: ' + (A ?? '–') + ', 2-belgi kadri: ' + (B ?? '–') + '. Ikkala kadrni tanlang.\u003c/p>'; return; }\n    if (B \u003c= A) { o.innerHTML = '\u003cp>2-belgi kadri 1-belgidan keyin bo\\'lishi kerak. Qayta tanlang.\u003c/p>'; return; }\n    const n = B - A, t = n / FPS, vm = D / t, e = Math.abs(vm - v) / v * 100;     // t = kadrlar/60, v = s/t\n    let c = '\u003cp>Kadrlar soni: \u003cb>' + n + '\u003c/b> (' + A + ' dan ' + B + ' gacha)\u003c/p>\u003cp>t = ' + n + ' / 60 = \u003cb>' + f3(t) + ' s\u003c/b>\u003c/p>' +\n            '\u003cp>v = 5 / ' + f3(t) + ' = \u003cb>' + f2(toU(vm)) + ' ' + uN() + '\u003c/b> (haqiqiy: ' + f2(toU(v)) + ' ' + uN() + ', xato: \u003cb>' + f2(e) + ' %\u003c/b>)\u003c/p>';\n    if (S1.n) {\n      const e1 = Math.abs(S1.avV - S1.avR) / S1.avR * 100;\n      c += '\u003cp>1-usul (sekundomer): o\\'rtacha ' + f2(toU(S1.avV)) + ' ' + uN() + ', xato ' + f2(e1) + ' %.\u003c/p>\u003cp>\u003cb>' + (e \u003c e1 ? 'Video tahlil aniqroq chiqdi.' : 'Bu safar sekundomer natijasi yaqinroq chiqdi, lekin bu tasodif bo\\'lishi mumkin.') + '\u003c/b>\u003c/p>';\n    } else c += '\u003cp class=\"cap\">Solishtirish uchun 1-simulyatsiyada kamida bitta urinish bajaring.\u003c/p>';\n    c += '\u003cp>Izoh: videoda vaqt xatosi ±1 kadr, ya\\'ni taxminan ±0,017 s. Sekundomerda reaksiya vaqti 0,1–0,3 s. Shuning uchun kadrma-kadr usul odatda ancha aniq.\u003c/p>';\n    o.innerHTML = c;\n  }\n  const clearM = () => { A = B = null; result(); };\n  function loop(ts) {\n    if (!play) return;\n    acc += Math.min((ts - last) / 1000, .1); last = ts;\n    while (acc >= 1 / FPS && fr \u003c nF()) { fr++; acc -= 1 / FPS; }\n    show(); if (fr >= nF()) { play = false; return show(); }\n    raf = requestAnimationFrame(loop);\n  }\n  $('go2').onclick = () => { if (fr >= nF()) fr = 0; play = true; acc = 0; last = performance.now(); raf = requestAnimationFrame(loop); show(); };\n  $('pa2').onclick = () => { play = false; show(); };\n  $('rs2').onclick = () => { play = false; cancelAnimationFrame(raf); fr = 0; clearM(); show(); };\n  $('next').onclick = () => { fr = Math.min(fr + 1, nF()); show(); };\n  $('prev').onclick = () => { fr = Math.max(fr - 1, 0); show(); };\n  $('mA').onclick = () => { A = fr; result(); };\n  $('mB').onclick = () => { B = fr; result(); };\n  $('sp2').oninput = e => { v = +e.target.value; fr = 0; play = false; clearM(); show(); };\n  renders.push(() => { show(); result(); });\n})();\n\n/* ================= 3-SIMULYATSIYA ================= */\n(() => {\n  const MAXT = 60, STEP = 10, ACC = 3;               // jami vaqt, yozish oralig'i (s), tezlanish (m/s²)\n  let tgt = 60 / 3.6, va = 0, t = 0, dist = 0, lastD = 0, gpsS = 0, next = STEP, run = false, pau = false, last = 0, raf = 0, rows = [], gErr = 3, ts = 1, gl = 0, glT = 0;\n  const NS = 'http://www.w3.org/2000/svg';\n  function gauge() {                                  // analog spidometr shkalasi (tanlangan birlikda)\n    const max = kmh ? 140 : 40, step = kmh ? 20 : 5; let s = '';\n    for (let v = 0; v \u003c= max; v += step) {\n      const a = (-120 + 240 * v / max) * Math.PI / 180, c = Math.cos(a), sn = Math.sin(a);\n      s += '\u003cline x1=\"' + (100 + 78 * sn) + '\" y1=\"' + (100 - 78 * c) + '\" x2=\"' + (100 + 68 * sn) + '\" y2=\"' + (100 - 68 * c) + '\" stroke=\"currentColor\" stroke-width=\"2\"/>' +\n           '\u003ctext x=\"' + (100 + 56 * sn) + '\" y=\"' + (104 - 56 * c) + '\" font-size=\"10\" text-anchor=\"middle\">' + v + '\u003c/text>';\n    }\n    $('gauge').innerHTML = '\u003ccircle cx=\"100\" cy=\"100\" r=\"85\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"3\"/>' + s +\n      '\u003ctext x=\"100\" y=\"125\" font-size=\"10\" text-anchor=\"middle\">' + uN() + '\u003c/text>' +\n      '\u003cg id=\"needle\">\u003cline x1=\"100\" y1=\"100\" x2=\"100\" y2=\"34\" stroke=\"#e0452f\" stroke-width=\"3\" stroke-linecap=\"round\"/>\u003c/g>\u003ccircle cx=\"100\" cy=\"100\" r=\"6\" fill=\"var(--ink)\"/>';\n    needle();\n  }\n  function needle() { const max = kmh ? 140 : 40, u = Math.min(toU(va) / max, 1); $('needle').setAttribute('transform', 'rotate(' + (-120 + 240 * u) + ' 100 100)'); }\n  function live() {\n    needle(); $('spd3').textContent = f2(toU(va)) + ' ' + uN(); $('gv').textContent = f2(toU(Math.max(va * (1 + gl), 0))) + ' ' + uN();\n    $('gs').textContent = f2(gpsS + dist - lastD) + ' m'; $('gt').textContent = f2(t) + ' s';\n    $('lane').style.backgroundPositionX = (-dist * 25) + 'px';\n    $('go3').disabled = run; $('pa3').disabled = !run;\n  }\n  function table() {\n    $('sv3').textContent = f2(toU(tgt)) + ' ' + uN(); $('gev').textContent = f2(gErr) + ' %';\n    $('r3').innerHTML = rows.map(r => '\u003ctr>\u003ctd>' + r.t + '\u003c/td>\u003ctd>' + f2(r.s) + '\u003c/td>\u003ctd>' + f2(toU(r.v2)) + '\u003c/td>\u003ctd>' + f2(toU(r.v1)) + '\u003c/td>\u003ctd>' + f2(r.d) + '\u003c/td>\u003c/tr>').join('');\n    const m = rows.length ? rows.reduce((p, r) => p + r.d, 0) / rows.length : null;\n    $('a3').textContent = m === null ? '–' : f2(m);\n    $('c3').classList.toggle('hide', rows.length \u003c MAXT / STEP);\n    if (rows.length >= MAXT / STEP) $('c3t').innerHTML = '\u003cp>O\\'rtacha farq: \u003cb>' + f2(m) + ' %\u003c/b> (GPS xatoligi sozlamasi: ' + f2(gErr) + ' %).\u003c/p>' +\n      '\u003cp>v₁ GPS masofasidan hisoblanadi (v = Δs / Δt), v₂ esa spidometr ko\\'rsatkichi. GPS signali xalaqitga uchrasa, Δs noaniq bo\\'ladi va farq oshadi. Tezlik o\\'zgarganda ham o\\'rtacha tezlik v₁ lahzadagi v₂ dan farq qiladi.\u003c/p>' +\n      '\u003cp>GPS xatoligini 0 % ga tushirib, tezlikni o\\'zgartirmasdan tajribani takrorlang: farq deyarli yo\\'qoladi.\u003c/p>';\n  }\n  function record() {                                 // har 10 soniyada yozish\n    const reading = va * (1 + (Math.random() - .5) * .01);             // spidometr ko'rsatkichi\n    const ds = dist - lastD; lastD = dist;\n    const g = ds * (1 + (Math.random() * 2 - 1) * gErr / 100);         // GPS o'lchagan masofa\n    gpsS += g; const v1 = g / STEP;                                    // v1 = Δs / Δt\n    rows.push({ t: next, s: gpsS, v2: reading, v1: v1, d: Math.abs(v1 - reading) / reading * 100 });  // farq = |v1-v2|/v2 *100\n    next += STEP; table();\n  }\n  function loop(now) {\n    if (!run) return;\n    let dt = Math.min((now - last) / 1000, .05) * ts; last = now;\n    if (!pau) while (dt > 0 && t \u003c MAXT) {\n      const h = Math.min(dt, .05); dt -= h;\n      va += Math.max(-ACC * h, Math.min(ACC * h, tgt - va)); dist += va * h; t += h;   // tezlik tgt ga silliq yaqinlashadi\n      if (t - glT >= 1) { glT = t; gl = (Math.random() * 2 - 1) * gErr / 100; }\n      if (t >= next - 1e-9) record();\n    }\n    live();\n    if (t >= MAXT) { run = false; return live(); }\n    raf = requestAnimationFrame(loop);\n  }\n  $('go3').onclick = () => { if (t >= MAXT) reset(); run = true; pau = false; last = performance.now(); raf = requestAnimationFrame(loop); live(); };\n  $('pa3').onclick = () => { pau = !pau; $('pa3').textContent = pau ? \"Davom ettirish\" : \"To'xtatish\"; };\n  function reset() { cancelAnimationFrame(raf); run = false; pau = false; va = 0; t = 0; dist = 0; lastD = 0; gpsS = 0; next = STEP; rows = []; $('pa3').textContent = \"To'xtatish\"; table(); live(); }\n  $('rs3').onclick = reset;\n  $('sp3').oninput = e => { tgt = e.target.value / 3.6; table(); };       // tezlikni harakat paytida ham o'zgartirish mumkin\n  $('ge').oninput = e => { gErr = +e.target.value; table(); };\n  $('ts').onchange = e => ts = +e.target.value;\n  renders.push(() => { gauge(); table(); live(); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"title": "Mexanik harakat: test va simulyatsiya", "icon": "🚴", "html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"uz\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Mexanik harakat — Test va simulyatsiya\u003c/title>\n\u003cstyle>\n/* Rang tokenlari: ochiq / qorong'i rejim */\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n--bg:#eef2ff;--card:#fff;--tx:#1b2240;--mut:#64708f;--pri:#4f46e5;--ln:#dfe5f5;--ok:#16a34a;--bad:#dc2626;--okb:#dcfce7;--badb:#fee2e2;--c1:#2563eb;--c2:#f97316;--cv:#eef2ff}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1226;--card:#1a1e3a;--tx:#eef1ff;--mut:#9aa5cc;--pri:#8b83ff;--ln:#2c3260;--okb:#12341f;--badb:#401a1f;--c1:#60a5fa;--c2:#fb923c;--cv:#242a52;--ok:#4ade80;--bad:#f87171}}\n:root[data-theme=dark]{--bg:#0f1226;--card:#1a1e3a;--tx:#eef1ff;--mut:#9aa5cc;--pri:#8b83ff;--ln:#2c3260;--okb:#12341f;--badb:#401a1f;--c1:#60a5fa;--c2:#fb923c;--cv:#242a52;--ok:#4ade80;--bad:#f87171}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\n.wrap{max-width:720px;margin:0 auto;padding:12px}\nheader{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}\n.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}\n.bar{height:10px;background:var(--ln);border-radius:9px;margin-top:8px;overflow:hidden}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#ec4899);transition:width .5s}\n.card{background:var(--card);border-radius:20px;padding:18px;margin-top:10px;box-shadow:0 6px 24px rgba(60,60,140,.12);animation:in .4s}\n@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n.tag{display:inline-block;background:var(--cv);color:var(--pri);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}\nh2{font-size:19px;margin:10px 0 14px}\nbutton{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:10px 16px;font-weight:700;transition:transform .15s,background .2s}\nbutton:active{transform:scale(.96)}\n.opt{display:block;width:100%;text-align:left;background:var(--cv);color:var(--tx);border:2px solid transparent;margin-bottom:10px}\n.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}\n.main{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;width:100%;margin-top:12px}\n.ic{background:var(--cv);color:var(--tx);min-height:40px;padding:4px 12px}\n.fb{margin-top:10px;padding:12px;border-radius:14px;animation:in .3s}\n.fb.ok{background:var(--okb)}.fb.bad{background:var(--badb)}\n.sim{background:var(--cv);border-radius:16px;padding:8px;margin:6px 0 14px}\ncanvas{width:100%;height:auto;display:block}\n.info{font-weight:700;font-size:14px;text-align:center;padding:6px 0;min-height:40px}\n.ctl{display:flex;gap:6px;flex-wrap:wrap}.ctl button{flex:1;min-width:90px;background:var(--pri);color:#fff;min-height:44px;padding:6px}\n.ctl .b2{background:var(--c2)}.ctl .b3{background:var(--mut)}\n.sl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;font-weight:600}.sl input{flex:1}\ninput[type=text],textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--tx)}\n.row{display:flex;gap:8px;align-items:center}\n.sol{margin-top:10px;background:var(--cv);border-radius:14px;padding:6px 12px}\n.sol div{padding:6px 0;border-bottom:1px dashed var(--ln)}.sol div:last-child{border:0;color:var(--ok);font-weight:700}\n.big{font-size:56px;font-weight:800;text-align:center;color:var(--pri)}\n.an{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"wrap\">\n\u003cheader>\u003cdiv class=\"top\">\u003cspan id=\"lab\">Mexanik harakat\u003c/span>\u003cspan>\u003cspan id=\"sc\">0\u003c/span> ball \u003cbutton class=\"ic\" id=\"th\" title=\"Rejim\">🌓\u003c/button>\u003c/span>\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"pb\">\u003c/i>\u003c/div>\u003c/header>\n\u003cmain id=\"app\">\u003c/main>\u003c/div>\n\u003cscript>\n/* ---------- Yordamchi funksiyalar ---------- */\nconst $=s=>document.querySelector(s),C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst f=(x,d=0)=>x.toFixed(d).replace('.',',');\nconst T=(c,s,x,y,col,sz=15,al='center')=>{c.fillStyle=col;c.font=`bold ${sz}px system-ui,sans-serif`;c.textAlign=al;c.fillText(s,x,y)};\nconst L=(c,x1,y1,x2,y2,col,w=2,d=[])=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.setLineDash(d);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.setLineDash([])};\nconst CI=(c,x,y,r,col,fill)=>{c.beginPath();c.arc(x,y,r,0,7);if(fill){c.fillStyle=col;c.fill()}else{c.strokeStyle=col;c.lineWidth=3;c.stroke()}};\nconst R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,10);c.fill()};\nconst mmss=s=>Math.floor(s/60)+\" daq \"+Math.round(s%60)+\" s\";\n\n/* ---------- Transport belgilari (canvas) ---------- */\nconst icons={\n bike:(c,x,y,k)=>{CI(c,x-16,y-10,10,k);CI(c,x+16,y-10,10,k);L(c,x-16,y-10,x,y-26,k,3);L(c,x,y-26,x+16,y-10,k,3);L(c,x,y-26,x-4,y-38,k,3);CI(c,x-4,y-45,6,k,1)},\n car:(c,x,y,k)=>{R(c,x-30,y-24,60,16,k);R(c,x-16,y-38,32,16,k);CI(c,x-16,y-8,8,C('--c2'),1);CI(c,x+16,y-8,8,C('--c2'),1)},\n man:(c,x,y,k,p)=>{const s=Math.sin(p*120)*9;CI(c,x,y-48,6,k,1);L(c,x,y-42,x,y-22,k,4);L(c,x,y-22,x-s,y-2,k,4);L(c,x,y-22,x+s,y-2,k,4);L(c,x,y-38,x+s,y-26,k,3);L(c,x,y-38,x-s,y-26,k,3)},\n train:(c,x,y,k)=>{R(c,x-36,y-30,72,26,k);for(let i=-24;i\u003c20;i+=16)R(c,x+i,y-25,10,8,C('--cv'));[-22,0,22].forEach(a=>CI(c,x+a,y-2,5,C('--c2'),1))}\n};\n/* Yo'l chizig'i: velosipedchi/avtomobil/piyoda uchun umumiy chizma */\nconst track=(ic,n,E,u)=>(c,p)=>{const y=120,x=40+520*p;\n L(c,40,y,560,y,C('--ln'),8);L(c,40,y,x,y,C('--pri'),8);\n for(let k=0;k\u003c=n;k++){const X=40+520*k/n;L(c,X,y+8,X,y+18,C('--mut'),2);T(c,Math.round(E*k/n)+(k==n?\" \"+u:\"\"),Math.min(X,565),y+36,C('--mut'),12)}\n T(c,\"🏁\",560,y-26,C('--tx'),24);icons[ic](c,x,y-6,C('--tx'),p)};\nconst dist=t=>t\u003c=2?54*t:108+72*(t-2); /* poyezd: 7-masala */\n\n/* ---------- Simulyatsiyalar: D — davomiylik (s), d — chizish, i — jonli yozuv ---------- */\nconst S={\n2:{D:5,H:150,d:(c,p)=>{const dv=1+2.6*p,v=72/dv;\n R(c,20,35,160,75,C('--cv'));T(c,\"72\",100,76,C('--tx'),32);T(c,\"km/soat\",100,100,C('--mut'),14);\n R(c,420,35,160,75,C('--cv'));T(c,f(v,p\u003c1?1:0),500,76,p\u003c1?C('--tx'):C('--ok'),32);T(c,\"m/s\",500,100,C('--mut'),14);\n L(c,190,72,410,72,C('--pri'),4);L(c,398,64,410,72,C('--pri'),4);L(c,398,80,410,72,C('--pri'),4);\n CI(c,190+220*p,72,9,C('--c2'),1);T(c,\"÷ \"+f(dv,2),300,52,C('--pri'),20);\n T(c,\"1 km/soat = 1000 m / 3600 s = 1/3,6 m/s\",300,138,C('--mut'),13)},\n i:p=>`72 ÷ ${f(1+2.6*p,2)} = ${f(72/(1+2.6*p),1)} m/s`},\n3:{D:10,H:170,d:track('bike',6,3000,'m'),i:p=>`⏱ t = ${Math.round(600*p)} s (${mmss(600*p)})  |  📏 s = ${Math.round(3000*p)} m  |  v = 5 m/s`},\n4:{D:10,H:170,d:track('car',5,150,'km'),i:p=>`⏱ t = ${f(3*p,1)} soat  |  📏 s = ${Math.round(150*p)} km  |  v = s/t = ${p>0?f(150*p/(3*p),0):0} km/soat`},\n5:{D:8,H:175,d:(c,p)=>{[55,125].forEach((y,j)=>{const col=C(j?'--c2':'--c1');\n  T(c,j?\"Notekis harakat\":\"Tekis harakat\",40,y-28,col,14,'left');L(c,40,y,560,y,C('--ln'),6);\n  for(let k=1;k\u003c=8;k++){const q=k/8;if(q\u003c=p+1e-9){const X=40+520*(j?q*q:q);L(c,X,y-12,X,y+12,col,3)}}\n  CI(c,40+520*(j?p*p:p),y,10,col,1)});\n  T(c,\"Belgilar har 1 soniyada (teng vaqtda) qo'yiladi\",300,166,C('--mut'),12)},\n i:p=>\"Tekis: oraliqlar bir xil. Notekis: oraliqlar tobora kattalashadi.\"},\n6:{D:10,H:170,d:track('man',6,1200,'m'),i:p=>`⏱ t = ${Math.round(800*p)} s (${mmss(800*p)})  |  📏 s = ${Math.round(1200*p)} m  |  v = 1,5 m/s`},\n7:{D:12,H:235,d:(c,p)=>{const t=3*p,s=dist(t),y=62,xe=40+520*s/180;\n L(c,40,y,560,y,C('--ln'),8);L(c,40,y,Math.min(xe,40+520*.6),y,C('--c1'),8);if(s>108)L(c,40+520*.6,y,xe,y,C('--c2'),8);\n icons.train(c,xe,y-8,C('--tx'));T(c,\"0\",40,y+26,C('--mut'),12);T(c,\"180 km\",545,y+26,C('--mut'),12);\n const gx=60,gy=205,gw=490,gh=95,X=a=>gx+gw*a/3,Y=a=>gy-gh*a/180;\n L(c,gx,gy,gx+gw,gy,C('--mut'),2);L(c,gx,gy,gx,gy-gh,C('--mut'),2);\n [1,2,3].forEach(a=>T(c,a,X(a),gy+16,C('--mut'),12));T(c,\"t (soat)\",gx+gw,gy+30,C('--mut'),12,'right');T(c,\"s\",gx-12,gy-gh,C('--mut'),12);\n L(c,gx,gy,X(3),Y(180),C('--ok'),2,[6,5]);T(c,\"o'rtacha 60 km/soat\",gx+8,gy-gh+8,C('--ok'),12,'left');\n const m=Math.min(t,2);L(c,X(0),Y(0),X(m),Y(dist(m)),C('--c1'),4);if(t>2)L(c,X(2),Y(108),X(t),Y(s),C('--c2'),4);\n CI(c,X(t),Y(s),6,C('--tx'),1)},\n i:p=>{const t=3*p,s=dist(t);return `t = ${f(t,1)} soat | s = ${Math.round(s)} km | hozir ${t\u003c2?\"1-bosqich: 54\":\"2-bosqich: 72\"} km/soat | o'rt. = ${t>0?f(s/t,0):0} km/soat`}}\n};\n\n/* ---------- Simulyatsiya dvigateli: Boshlash / To'xtatish / Qayta + tezlik slayderi ---------- */\nlet raf,redraw=()=>{};\nfunction mountSim(host,id){\n cancelAnimationFrame(raf);const s=S[id];let p=0,run=false,sp=1,last=0;\n host.innerHTML=`\u003ccanvas width=\"1200\" height=\"${s.H*2}\">\u003c/canvas>\u003cdiv class=\"info\">\u003c/div>\u003cdiv class=\"ctl\">\u003cbutton class=\"b1\">▶ Boshlash\u003c/button>\u003cbutton class=\"b2\">⏸ To'xtatish\u003c/button>\u003cbutton class=\"b3\">↻ Qayta boshlash\u003c/button>\u003c/div>\u003clabel class=\"sl\">Tezlik \u003cinput type=\"range\" min=\".5\" max=\"4\" step=\".5\" value=\"1\">\u003cb>1×\u003c/b>\u003c/label>`;\n const cv=host.querySelector('canvas'),c=cv.getContext('2d'),inf=host.querySelector('.info'),rg=host.querySelector('input'),lb=host.querySelector('b');\n const draw=redraw=()=>{c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,600,s.H);s.d(c,p);inf.textContent=s.i(p)};\n host.querySelector('.b1').onclick=()=>{if(p>=1)p=0;run=true;last=performance.now()};\n host.querySelector('.b2').onclick=()=>run=false;\n host.querySelector('.b3').onclick=()=>{p=0;run=true;last=performance.now();draw()};\n rg.oninput=()=>{sp=+rg.value;lb.textContent=sp+\"×\"};\n const tick=t=>{if(run){p=Math.min(1,p+(t-last)/1000*sp/s.D);if(p>=1)run=false;draw()}last=t;raf=requestAnimationFrame(tick)};\n draw();raf=requestAnimationFrame(tick);\n}\n\n/* ---------- Test ma'lumotlari ---------- */\nconst M=[\n {q:\"Jismning boshqa jismlarga nisbatan vaziyati vaqt o'tishi bilan o'zgarishi nima deyiladi?\",o:[\"Massa\",\"Mexanik harakat\",\"Zichlik\",\"Kuch\"],a:1,e:\"Vaziyatning vaqt o'tishi bilan o'zgarishi — mexanik harakat.\",n:\"Mexanik harakat tushunchasi\"},\n {q:\"SI tizimida tezlik birligi qaysi?\",o:[\"km/soat\",\"s\",\"m/s\",\"m\"],a:2,e:\"SI da uzunlik — metr, vaqt — sekund, shuning uchun tezlik birligi m/s.\",n:\"Tezlik birligi (SI)\"},\n {q:\"Tezlik formulasi qaysi?\",o:[\"v = s·t\",\"v = t/s\",\"v = s + t\",\"v = s/t\"],a:3,e:\"Tezlik = yo'l / vaqt, ya'ni v = s/t.\",n:\"Tezlik formulasi\"},\n {q:\"Jismning harakat davomida chizgan chizig'i nima deyiladi?\",o:[\"Yo'l\",\"Traektoriya\",\"Tezlik\",\"Vaqt\"],a:1,e:\"Harakat davomida chizilgan chiziq — traektoriya.\",n:\"Traektoriya tushunchasi\"}];\nconst P=[\n {id:2,pts:2,q:\"72 km/soat ni m/s ga aylantiring.\",ans:20,u:\"m/s\",n:\"Birliklarni aylantirish\",\n  sol:[\"v = 72 km/soat\",\"1 km/soat = 1000 m / 3600 s = 1/3,6 m/s, demak v(m/s) = v(km/soat) : 3,6\",\"72 : 3,6 = 20\",\"20 m/s\"]},\n {id:3,pts:3,q:\"Velosipedchi 5 m/s tezlik bilan 10 daqiqa harakatlandi. U qancha yo'l bosib o'tgan?\",ans:3000,u:\"m\",n:\"Yo'l = tezlik · vaqt\",\n  sol:[\"v = 5 m/s; t = 10 daq = 600 s; s = ?\",\"s = v · t\",\"s = 5 · 600 = 3000 m\",\"3000 m (3 km)\"]},\n {id:4,pts:2,q:\"Avtomobil 150 km yo'lni 3 soatda bosib o'tdi. Uning o'rtacha tezligini toping.\",ans:50,u:\"km/soat\",n:\"O'rtacha tezlik\",\n  sol:[\"s = 150 km; t = 3 soat; v = ?\",\"v = s / t\",\"v = 150 : 3 = 50\",\"50 km/soat\"]},\n {id:5,pts:3,type:'t',q:\"Tekis va notekis harakat farqini tushuntiring, har biriga misol keltiring.\",n:\"Tekis va notekis harakat\",\n  ansT:\"Tekis — teng vaqtda teng yo'l (masalan, eskalator); notekis — teng vaqtda har xil yo'l (masalan, avtobus).\",\n  sol:[\"Ikki turdagi harakat\",\"Tekis harakatda tezlik o'zgarmaydi, notekisda o'zgaradi\",\"Tekis: har 1 s da bir xil masofa; notekis: oraliqlar har xil\",\"Tekis — eskalator; notekis — avtobus, velosiped\"]},\n {id:6,pts:3,q:\"Piyoda 1,5 m/s tezlik bilan 1,2 km yo'lni qancha vaqtda bosib o'tadi? (sekundda)\",ans:800,u:\"s\",n:\"Vaqt = yo'l / tezlik\",\n  sol:[\"v = 1,5 m/s; s = 1,2 km = 1200 m; t = ?\",\"t = s / v\",\"t = 1200 : 1,5 = 800 s\",\"800 s = 13 daq 20 s\"]},\n {id:7,pts:3,q:\"Poyezd 2 soat 54 km/soat tezlik bilan, keyingi 1 soat 72 km/soat tezlik bilan yurdi. Butun yo'l bo'yicha o'rtacha tezlikni toping.\",ans:60,u:\"km/soat\",n:\"Butun yo'l bo'yicha o'rtacha tezlik\",\n  sol:[\"t₁ = 2 s, v₁ = 54; t₂ = 1 s, v₂ = 72 (km/soat)\",\"v o'rt = (s₁ + s₂) / (t₁ + t₂). Tezliklar o'rtachasi (54+72)/2 = 63 xato!\",\"s₁ = 54·2 = 108 km; s₂ = 72·1 = 72 km; v = 180 : 3 = 60\",\"60 km/soat\"]}];\nconst steps=[...M.map(m=>({...m,type:'m',pts:1})),...P];\nconst LBL=[\"Berilgan\",\"Formula\",\"Hisoblash\",\"Javob\"];\nconst KW=[[\"«teng» (teng vaqtda teng yo'l)\",/teng/],[\"«notekis» harakat\",/notekis/],[\"yo'l / masofa\",/yo'l|masofa|oraliq|yol/],[\"farq (har xil, o'zgaradi)\",/har xil|turlicha|o'zgar|farq|bir xil/],[\"tekis harakat misoli\",/eskalator|konveyer|lenta|soat mil/],[\"notekis harakat misoli\",/avtobus|mashina|avtomobil|velosiped|futbol|to'p|piyoda|poyezd|samolyot/]];\n\n/* ---------- Holat va chizish ---------- */\nlet i=0,res=[];const app=$('#app');\nfunction head(){$('#pb').style.width=(i/steps.length*100)+\"%\";$('#lab').textContent=i\u003csteps.length?`Savol ${i+1}/${steps.length}`:\"Natija\";\n $('#sc').textContent=(+res.reduce((a,r)=>a+(r?r.got:0),0).toFixed(1)).toString().replace('.',',')}\nfunction next(){i++;render()}\nfunction render(){head();cancelAnimationFrame(raf);window.scrollTo({top:0,behavior:'smooth'});\n if(i>=steps.length)return result();\n const s=steps[i];\n if(s.type==='m'){\n  app.innerHTML=`\u003cdiv class=\"card\">\u003cspan class=\"tag\">1-qism · Tanlov · 1 ball\u003c/span>\u003ch2>${s.q}\u003c/h2>\u003cdiv id=\"o\">\u003c/div>\u003cdiv id=\"fb\">\u003c/div>\u003c/div>`;\n  s.o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=\"ABCD\"[k]+\") \"+t;\n   b.onclick=()=>{[...$('#o').children].forEach((x,j)=>{x.disabled=true;if(j==s.a)x.classList.add('ok')});\n    const ok=k==s.a;if(!ok)b.classList.add('bad');\n    res[i]={got:ok?1:0,max:1,ok,ans:\"ABCD\"[s.a]+\") \"+s.o[s.a],n:s.n};head();\n    $('#fb').innerHTML=`\u003cdiv class=\"fb ${ok?'ok':'bad'}\">${ok?'✅ To\\'g\\'ri!':'❌ Noto\\'g\\'ri.'} ${s.e}\u003c/div>\u003cbutton class=\"main\" onclick=\"next()\">Keyingi →\u003c/button>`};\n   $('#o').appendChild(b)});\n }else{\n  const t=s.type==='t';\n  app.innerHTML=`\u003cdiv class=\"card\">\u003cspan class=\"tag\">2-qism · ${s.id}-masala · ${s.pts} ball\u003c/span>\u003ch2>${s.q}\u003c/h2>\u003cdiv class=\"sim\" id=\"sim\">\u003c/div>\n  ${t?'\u003ctextarea id=\"in\" rows=\"4\" placeholder=\"Javobingizni yozing...\">\u003c/textarea>':`\u003cdiv class=\"row\">\u003cinput type=\"text\" id=\"in\" inputmode=\"decimal\" placeholder=\"Javob\">\u003cb>${s.u}\u003c/b>\u003c/div>`}\n  \u003cbutton class=\"main\" id=\"ck\">Tekshirish\u003c/button>\u003cdiv id=\"fb\">\u003c/div>\u003c/div>`;\n  mountSim($('#sim'),s.id);\n  $('#ck').onclick=()=>{const v=$('#in').value.trim();if(!v){$('#in').focus();return}\n   let got,ok,extra=\"\";\n   if(t){const x=v.toLowerCase().replace(/[ʻʼ’‘`´]/g,\"'\");let h=0;\n    extra=\"\u003cbr>\"+KW.map(([n,r])=>{const y=r.test(x);if(y)h++;return (y?\"✔ \":\"✖ \")+n}).join(\"\u003cbr>\");\n    got=Math.min(3,h*.5);ok=got>=3}\n   else{const n=parseFloat(v.replace(',','.'));ok=Math.abs(n-s.ans)\u003c1e-6*Math.max(1,s.ans)+.01;got=ok?s.pts:0}\n   $('#in').disabled=true;$('#ck').remove();\n   res[i]={got,max:s.pts,ok,user:v,ans:t?s.ansT:s.ans+\" \"+s.u,n:s.n};head();\n   $('#fb').innerHTML=`\u003cdiv class=\"fb ${ok?'ok':'bad'}\">${ok?'✅ To\\'g\\'ri!':got>0?'🟡 Qisman to\\'g\\'ri.':'❌ Noto\\'g\\'ri.'} Ball: ${f(got,1).replace(',0','')}/${s.pts}${extra}\u003c/div>\n   \u003cdiv class=\"sol\">\u003cb>Yechim:\u003c/b>${s.sol.map((x,k)=>`\u003cdiv>\u003cb>${LBL[k]}:\u003c/b> ${x}\u003c/div>`).join('')}\u003c/div>\n   \u003cbutton class=\"main\" onclick=\"next()\">${i==steps.length-1?'Natijani ko\\'rish':'Keyingi →'}\u003c/button>`};\n  $('#in').onkeydown=e=>{if(e.key==='Enter'&&!t)$('#ck')&&$('#ck').click()};\n }}\nfunction result(){const tot=res.reduce((a,r)=>a+r.got,0),pct=tot/20*100,g=pct>=86?5:pct>=71?4:pct>=56?3:2;\n app.innerHTML=`\u003cdiv class=\"card\">\u003cdiv class=\"big\">${(+tot.toFixed(1)).toString().replace('.',',')}/20\u003c/div>\n \u003cp style=\"text-align:center;margin:0\">\u003cb>${Math.round(pct)}%\u003c/b> · Baho: \u003cb>${g}\u003c/b> ${[\"\",\"\",\"😕\",\"🙂\",\"😊\",\"🏆\"][g]}\u003c/p>\n \u003ch2>Xatolar tahlili\u003c/h2>${res.map((r,k)=>`\u003cdiv class=\"an\">\u003cspan>${r.ok?'✅':r.got>0?'🟡':'❌'}\u003c/span>\u003cspan>\u003cb>${k+1}. ${r.n}\u003c/b> — ${f(r.got,1).replace(',0','')}/${r.max}${r.ok?'':`\u003cbr>\u003csmall>To'g'ri javob: ${r.ans}\u003c/small>`}\u003c/span>\u003c/div>`).join('')}\n \u003cp style=\"color:var(--mut);font-size:14px\">${res.every(r=>r.ok)?'Barakalla! Hammasi to\\'g\\'ri.':'❌ yoki 🟡 belgilangan mavzularni qayta takrorlang va simulyatsiyalarni yana kuzating.'}\u003c/p>\n \u003cbutton class=\"main\" onclick=\"i=0;res=[];render()\">↻ Qayta topshirish\u003c/button>\u003c/div>`}\n\n/* Mavzu tugmasi: ochiq / qorong'i */\n$('#th').onclick=()=>{const d=document.documentElement,dark=C('--bg')==='#0f1226';d.dataset.theme=dark?'light':'dark';setTimeout(()=>redraw(),20)};\nrender();\n\u003c/script>\u003c/body>\u003c/html>\n"}]</script>
<script>
(function(){
  var T=JSON.parse(document.getElementById('d').textContent);
  var stage=document.getElementById('stage'),home=document.getElementById('home');
  var list=document.getElementById('list'),cards=document.getElementById('cards');
  var side=document.getElementById('side'),shade=document.getElementById('shade'),burger=document.getElementById('burger');
  var frames={},btns=[];
  function item(icon,text,i){
    var b=document.createElement('button');
    var n=document.createElement('span');n.className='n';n.textContent=icon;
    var s=document.createElement('span');s.textContent=text;
    b.appendChild(n);b.appendChild(s);
    b.onclick=function(){go(i);toggle(false)};
    list.appendChild(b);btns[i]=b;
  }
  item('🏠','Bosh sahifa',0);
  T.forEach(function(t,k){
    item(t.icon,(k+1)+'. '+t.title,k+1);
    var c=document.createElement('button');c.className='card';
    c.innerHTML='<span class="e"></span><b></b><span></span>';
    c.children[0].textContent=t.icon;c.children[1].textContent=t.title;c.children[2].textContent=(k+1)+'-mavzu';
    c.onclick=function(){go(k+1)};cards.appendChild(c);
  });
  function toggle(open){
    side.classList.toggle('open',open);shade.classList.toggle('open',open);
    burger.setAttribute('aria-expanded',open);
  }
  burger.onclick=function(){toggle(true)};
  document.getElementById('close').onclick=function(){toggle(false)};
  shade.onclick=function(){toggle(false)};
  document.getElementById('brand').onclick=function(){go(0)};
  addEventListener('keydown',function(e){if(e.key==='Escape')toggle(false)});
  function go(i,noHash){
    if(i<0||i>T.length)i=0;
    if(i>0&&!frames[i]){
      var f=document.createElement('iframe');
      f.title=T[i-1].title;f.srcdoc=T[i-1].html;
      stage.appendChild(f);frames[i]=f;
    }
    home.classList.toggle('on',i===0);
    for(var k in frames)frames[k].classList.toggle('on',+k===i);
    btns.forEach(function(b,k){b.classList.toggle('on',k===i)});
    document.title=(i?T[i-1].title+' — ':'')+'7-sinf Fizika';
    btns[i].scrollIntoView({block:'nearest'});
    if(!noHash)history.replaceState(null,'','#'+(i||'home'));
  }
  function fromHash(){var n=parseInt(location.hash.slice(1),10);return isNaN(n)?0:n}
  go(fromHash(),true);
  addEventListener('hashchange',function(){go(fromHash(),true)});
})();
</script>
